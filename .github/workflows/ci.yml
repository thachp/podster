name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit on a pull request replaces the older run. Each push to main gets its own group, so none is replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Source branches named docs/* are reserved for documentation-only pull requests.
# Job conditions avoid allocating runners; GitHub still records a skipped workflow run.
# Do not use pull_request.branches-ignore here: it filters the target branch, not the source.
jobs:
  rust:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude podster-api

  migrations:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node .github/scripts/check-migrations.mjs --self-test
      # On a pull request this checks out the merge with the base, so its first parent is what was merged when it was made,
      # and re-running after another migration merges still compares like with like.
      - run: node .github/scripts/check-migrations.mjs "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}

  contracts:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages/contracts
      - run: npm test
        working-directory: packages/contracts

  api:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - run: cargo install worker-build --version 0.8.7 --locked
      # worker-build fetches wasm-bindgen and wasm-opt from GitHub releases unless they're already in its cache, and those
      # downloads fail often enough to block merges. The key follows Cargo.lock, which pins the wasm-bindgen version.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: worker-build-0.8.7-${{ runner.os }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api

  web:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      # UI-10 and UI-11, against the real Workers in a real browser.
      - run: rustup show
      - run: cargo install worker-build --version 0.8.7 --locked
      # worker-build fetches wasm-bindgen and wasm-opt from GitHub releases unless they're already in its cache, and those
      # downloads fail often enough to block merges. The key follows Cargo.lock, which pins the wasm-bindgen version.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: worker-build-0.8.7-${{ runner.os }}-
      - run: npm ci
        working-directory: apps/gateway
      - run: npm ci
        working-directory: e2e
      # The browser from Playwright's own host, then its system packages from apt with bounded retries. If the runner's
      # package mirror is down, the job goes on only when the browser starts and has a font for each script the
      # accessibility run times, using the Thai font pinned in e2e/package-lock.json, which the image lacks. The log
      # then has a line starting "WARNING browser-system-packages-not-installed".
      # Why, in e2e/install-browser.mjs and docs/m0-gate.md.
      - run: node install-browser.mjs
        working-directory: e2e
      - run: node run-a11y.mjs --skip-web-build
        working-directory: e2e
      # The browser's path for a file's bytes, with the API that run built.
      - run: node run-upload-browser.mjs --skip-build
        working-directory: e2e
      # A download's own headers through the built web Worker, in front of a stub gateway, and a page's CSP.
      - run: node run-download-headers.mjs --skip-web-build
        working-directory: e2e

  # The real image needs current signatures from the mirror, so test/local and container/tests/integration.py run by hand.
  scanner:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/scanner
      - run: npm run typecheck
        working-directory: apps/scanner
      - run: npm test
        working-directory: apps/scanner
      - run: npm run test:container
        working-directory: apps/scanner

  gateway:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - run: cargo install worker-build --version 0.8.7 --locked
      # worker-build fetches wasm-bindgen and wasm-opt from GitHub releases unless they're already in its cache, and those
      # downloads fail often enough to block merges. The key follows Cargo.lock, which pins the wasm-bindgen version.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: worker-build-0.8.7-${{ runner.os }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/gateway
      - run: npm run typecheck
        working-directory: apps/gateway
      - run: npm test
        working-directory: apps/gateway

  # The real gateway and the API's release build under wrangler dev, driven by the real signer and MCP SDK.
  e2e:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - run: cargo install worker-build --version 0.8.7 --locked
      # worker-build fetches wasm-bindgen and wasm-opt from GitHub releases unless they're already in its cache, and those
      # downloads fail often enough to block merges. The key follows Cargo.lock, which pins the wasm-bindgen version.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: worker-build-0.8.7-${{ runner.os }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # This uses the gateway's pinned wrangler.
      - run: npm ci
        working-directory: apps/gateway
      - run: npm ci
        working-directory: e2e
      # Every script here, read without running it: an assignment to a constant, a name nothing declares, and a
      # declaration that hides an assigned outer one. The staging scripts run nowhere else before they run on staging.
      - run: node static-check.mjs --self-test
        working-directory: e2e
      - run: node static-check.mjs
        working-directory: e2e
      # The staging run's tail reader, fed wrangler's real multi-line JSON shape.
      - run: node tail-stream-selftest.mjs
        working-directory: e2e
      # The staging run's publishing and clean-up: a stop at any point of a publish leaves no room public.
      - run: node room-publisher-selftest.mjs
        working-directory: e2e
      # Third-party test tools (the A2A kit, fasta2a, LangGraph) get an allow-listed environment, never a secret of ours.
      - run: node child-env-selftest.mjs
        working-directory: e2e
      # The web job's browser install: when it retries, when it goes on without apt's packages, and when it stops.
      - run: node install-browser-selftest.mjs
        working-directory: e2e
      # The accessibility run writes into the Workers' files once they've stopped, so "stopped" has to mean every process.
      - run: node stack-stop-selftest.mjs
        working-directory: e2e
      # The accessibility run's bounds: a wait that never finishes is stopped and named, instead of running out the job's time.
      - run: node bounded-selftest.mjs
        working-directory: e2e
      # The rehearsal's HTTPS certificate: a server certificate for localhost, trusted by name, never an authority.
      - run: node local-cert-selftest.mjs
        working-directory: e2e
      # M4's staging run, without a network: the two forms of Cloudflare's edge refusal and nothing else, and the tails' installs.
      - run: node m4-staging-selftest.mjs
        working-directory: e2e
      # M5's staging run, without a network: the one host it accepts, its results and exit code, what its git child sees.
      - run: node m5-staging-selftest.mjs
        working-directory: e2e
      # The scripts agents merge, deploy and probe with: every refusal, with stand-ins for gh, wrangler and curl.
      - run: scripts/test/merge-gate-selftest
      - run: scripts/test/deploy-staging-selftest
      - run: scripts/test/staging-probes-selftest
      - run: node run-local.mjs
        working-directory: e2e
      # Staging's setup and the test sign-up, with nothing remote.
      - run: node run-local.mjs --skip-build --rehearse-test-people
        working-directory: e2e
