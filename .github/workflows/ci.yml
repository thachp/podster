name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit on a pull request replaces the older run. Each push to main gets its own group, so none is replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Source branches named docs/* are reserved for documentation-only pull requests.
# Job conditions avoid allocating runners; GitHub still records a skipped workflow run.
# Do not use pull_request.branches-ignore here: it filters the target branch, not the source.
jobs:
  rust:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude podster-api

  migrations:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node .github/scripts/check-migrations.mjs --self-test
      # On a pull request this checks out the merge with the base, so its first parent is what was merged when it was made,
      # and re-running after another migration merges still compares like with like.
      - run: node .github/scripts/check-migrations.mjs "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}

  contracts:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages/contracts
      - run: npm test
        working-directory: packages/contracts

  api:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      # The worker-build binary itself, which takes about two minutes to compile. The key names its version, the runner's
      # image and the pinned toolchain, so a change to any of them builds it again.
      - id: worker-build-bin
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/worker-codegen
          key: worker-build-bin-0.8.7-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('rust-toolchain.toml') }}
      - if: steps.worker-build-bin.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked
      # worker-build fetches wasm-bindgen and wasm-opt from GitHub releases unless they're already in its cache, and those
      # downloads fail often enough to block merges. The key follows Cargo.lock, which pins the wasm-bindgen version.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: worker-build-0.8.7-${{ runner.os }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/api
      # npm can skip workerd's platform package without failing; this fails here, naming it, after one more npm ci.
      - run: scripts/ci-workerd-installed apps/api
      # vitest's JSON report is read by the step after this one. The two other reporters are what CI printed before.
      - run: npm test -- --reporter=default --reporter=github-actions --reporter=json --outputFile.json="$RUNNER_TEMP/api-durations.json"
        working-directory: apps/api
      # Each test's time against its own bound: over a third is a warning, naming its entry in e2e/test-durations-allow.json
      # (the owed list) or saying it has none; over two thirds fails, listed or not. The ten slowest are printed either
      # way, and after a failed run too, so a slow runner shows before a test times out.
      - run: node test-durations.mjs --suite api --package apps/api --report "$RUNNER_TEMP/api-durations.json"
        if: ${{ !cancelled() }}
        working-directory: e2e

  web:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/web
      # npm can skip workerd's platform package without failing; this fails here, naming it, after one more npm ci.
      - run: scripts/ci-workerd-installed apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      # UI-10 and UI-11, against the real Workers in a real browser.
      - run: rustup show
      # The worker-build binary itself, which takes about two minutes to compile. The key names its version, the runner's
      # image and the pinned toolchain, so a change to any of them builds it again.
      - id: worker-build-bin
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/worker-codegen
          key: worker-build-bin-0.8.7-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('rust-toolchain.toml') }}
      - if: steps.worker-build-bin.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked
      # worker-build fetches wasm-bindgen and wasm-opt from GitHub releases unless they're already in its cache, and those
      # downloads fail often enough to block merges. The key follows Cargo.lock, which pins the wasm-bindgen version.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: worker-build-0.8.7-${{ runner.os }}-
      - run: npm ci
        working-directory: apps/gateway
      # npm can skip workerd's platform package without failing; this fails here, naming it, after one more npm ci.
      - run: scripts/ci-workerd-installed apps/gateway
      - run: npm ci
        working-directory: e2e
      # The browser from Playwright's own host, then its system packages from apt with bounded retries. If the runner's
      # package mirror is down, the job goes on only when the browser starts and has a font for each script the
      # accessibility run times, using the Thai font pinned in e2e/package-lock.json, which the image lacks. The log
      # then has a line starting "WARNING browser-system-packages-not-installed".
      # Why, in e2e/install-browser.mjs and docs/m0-gate.md.
      - run: node install-browser.mjs
        working-directory: e2e
      - run: node run-a11y.mjs --skip-web-build
        working-directory: e2e
      # The browser's path for a file's bytes, with the API that run built.
      - run: node run-upload-browser.mjs --skip-build
        working-directory: e2e
      # A download's own headers through the built web Worker, in front of a stub gateway, and a page's CSP.
      - run: node run-download-headers.mjs --skip-web-build
        working-directory: e2e

  # The real image needs current signatures from the mirror, so test/local and container/tests/integration.py run by hand.
  scanner:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/scanner
      - run: npm run typecheck
        working-directory: apps/scanner
      - run: npm test
        working-directory: apps/scanner
      - run: npm run test:container
        working-directory: apps/scanner

  # The outbound Worker (M6 stage 1), which refuses every request an app makes: typecheck and tests only. It is never
  # deployed from here, and its tests fail if this job ever gains a deploy step.
  outbound:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # No package's install script runs: the tests only read the pinned wrangler's source, and never start it.
      - run: npm ci --ignore-scripts
        working-directory: apps/outbound
      - run: npm run typecheck
        working-directory: apps/outbound
      - run: npm test
        working-directory: apps/outbound

  # The content Worker (M6 step 4(b)): typecheck and tests only. It is never deployed from here, and its tests fail
  # if this job ever gains a deploy step.
  content:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # No package's install script runs: the tests only read the pinned wrangler's source, and never start it.
      - run: npm ci --ignore-scripts
        working-directory: apps/content
      - run: npm run typecheck
        working-directory: apps/content
      - run: npm test
        working-directory: apps/content

  gateway:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      # The worker-build binary itself, which takes about two minutes to compile. The key names its version, the runner's
      # image and the pinned toolchain, so a change to any of them builds it again.
      - id: worker-build-bin
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/worker-codegen
          key: worker-build-bin-0.8.7-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('rust-toolchain.toml') }}
      - if: steps.worker-build-bin.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked
      # worker-build fetches wasm-bindgen and wasm-opt from GitHub releases unless they're already in its cache, and those
      # downloads fail often enough to block merges. The key follows Cargo.lock, which pins the wasm-bindgen version.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: worker-build-0.8.7-${{ runner.os }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/gateway
      # npm can skip workerd's platform package without failing; this fails here, naming it, after one more npm ci.
      - run: scripts/ci-workerd-installed apps/gateway
      - run: npm run typecheck
        working-directory: apps/gateway
      # vitest's JSON report is read by the step after this one. The two other reporters are what CI printed before.
      - run: npm test -- --reporter=default --reporter=github-actions --reporter=json --outputFile.json="$RUNNER_TEMP/gateway-durations.json"
        working-directory: apps/gateway
      # Each test's time against its own bound: over a third is a warning, naming its entry in e2e/test-durations-allow.json
      # (the owed list) or saying it has none; over two thirds fails, listed or not. The ten slowest are printed either
      # way, and after a failed run too, so a slow runner shows before a test times out.
      - run: node test-durations.mjs --suite gateway --package apps/gateway --report "$RUNNER_TEMP/gateway-durations.json"
        if: ${{ !cancelled() }}
        working-directory: e2e

  # Podster Runner (M7 step 6), the app for the agent owner's own machine, not a Worker: typecheck, tests and its build.
  # Nothing here publishes or installs it (decision 26). Its pairing against the real gateway and API runs in the gateway
  # job, as apps/gateway/test/runner-core.spec.ts.
  runner:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # No package's install script runs: Runner's dependencies are the pinned Agent Auth client, the pinned Claude Agent SDK with its peers and its per-platform Claude Code binaries, and build tools. CI never runs the SDK against a provider.
      - run: npm ci --ignore-scripts
        working-directory: apps/runner
      - run: npm run typecheck
        working-directory: apps/runner
      - run: npm test
        working-directory: apps/runner
      - run: npm run build
        working-directory: apps/runner
      # The package as users get it: packed by scripts/pack.mjs (production tree bundled, no shrinkwrap), then installed the
      # way `npx podster@test` does, from a registry on 127.0.0.1 that passes other packages through to npm's, scripts off.
      # It fails if any platform's Claude Code binary but this host's lands, or any dev tool, or the install passes 500 MB.
      - run: node scripts/pack.mjs --out "$RUNNER_TEMP/pack"
        working-directory: apps/runner
      - run: node scripts/install-check.mjs "$RUNNER_TEMP/pack/podster-$(node -p "require('./package.json').version").tgz"
        working-directory: apps/runner
      # S-47: Runner's Linux path (also Windows through WSL2) on this runner's real Docker Engine. It builds Runner's two
      # images, starts the task container, Claude Code's container and the Unix-socket relay, and proves the provider key
      # is in none of them, the relay refuses a request without the per-run token, and teardown leaves no container or
      # network. No provider is called: the key is a fake and the upstream a stand-in on the host. The same step runs the
      # egress proxy's proof (test/egress-docker.test.ts): from inside a task container, registry.npmjs.org is reachable
      # through the proxy with TLS verified, and nothing else is, with no direct route and no outside DNS; and `npm install` works in Runner's real task image.
      # And the toolchain images' proof (test/toolchains-docker.test.ts): Runner builds the Rust, Python, .NET and Java
      # images FROM its task image, and cargo, uv, dotnet, javac and mvn build and run offline in them under Runner's own run flags.
      - run: docker version --format '{{.Server.Version}}'
      - run: npx vitest run --config vitest.linux.config.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/linux-docker.json"
        working-directory: apps/runner
        env:
          RUNNER_LINUX_DOCKER: "1"
      # A run whose tests were all skipped would exit 0: this passes only when all fourteen ran and passed.
      - run: |
          node -e 'const r = require(process.argv[1]); const ok = r.numPassedTests === 14 && r.numFailedTests === 0 && r.numPendingTests === 0 && r.numTodoTests === 0; console.log(`linux docker proof - ${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests} skipped`); process.exit(ok ? 0 : 1);' "$RUNNER_TEMP/linux-docker.json"

  # The real gateway and the API's release build under wrangler dev, driven by the real signer and MCP SDK.
  e2e:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    # Its runs on main took 16 to 20 minutes on 2026-11-20, so a 20-minute cap cancelled passing runs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      # The worker-build binary itself, which takes about two minutes to compile. The key names its version, the runner's
      # image and the pinned toolchain, so a change to any of them builds it again.
      - id: worker-build-bin
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/worker-codegen
          key: worker-build-bin-0.8.7-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('rust-toolchain.toml') }}
      - if: steps.worker-build-bin.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked
      # worker-build fetches wasm-bindgen and wasm-opt from GitHub releases unless they're already in its cache, and those
      # downloads fail often enough to block merges. The key follows Cargo.lock, which pins the wasm-bindgen version.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: worker-build-0.8.7-${{ runner.os }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # This uses the gateway's pinned wrangler.
      - run: npm ci
        working-directory: apps/gateway
      # npm can skip workerd's platform package without failing; this fails here, naming it, after one more npm ci.
      - run: scripts/ci-workerd-installed apps/gateway
      - run: npm ci
        working-directory: e2e
      # Every script here, read without running it: an assignment to a constant, a name nothing declares, and a
      # declaration that hides an assigned outer one. The staging scripts run nowhere else before they run on staging.
      - run: node static-check.mjs --self-test
        working-directory: e2e
      - run: node static-check.mjs
        working-directory: e2e
      # Every executable under scripts/ and every *staging*.mjs and run-*.mjs here, run with --help: each must exit 0 and
      # print its usage, with child-env.mjs's environment and no child process, fetch or socket. Libraries are listed.
      - run: node help-check.mjs --self-test
        working-directory: e2e
      - run: node help-check.mjs
        working-directory: e2e
      # The API's and the gateway's specs and the web app's tests, read without running them: a sleep, a wall-clock margin in an expectation, or
      # a spec that makes rooms and quiets none. What stays is in test-timing-allow.json, each with its reason.
      - run: node test-timing-check.mjs --self-test
        working-directory: e2e
      - run: node test-durations.mjs --self-test
        working-directory: e2e
      - run: node test-timing-check.mjs
        working-directory: e2e
      # The API's specs share one GitHub stand-in, and one provider, keyed by ID: each file takes its IDs from its own
      # block in apps/api/test/fake-ids.ts, so no two can reset, seed or fault the same one.
      - run: node fake-ids-check.mjs --self-test
        working-directory: e2e
      - run: node fake-ids-check.mjs
        working-directory: e2e
      # The staging run's tail reader, fed wrangler's real multi-line JSON shape.
      - run: node tail-stream-selftest.mjs
        working-directory: e2e
      # The staging run's publishing and clean-up: a stop at any point of a publish leaves no room public.
      - run: node room-publisher-selftest.mjs
        working-directory: e2e
      # Third-party test tools (the A2A kit, fasta2a, LangGraph) get an allow-listed environment, never a secret of ours.
      - run: node child-env-selftest.mjs
        working-directory: e2e
      # The web job's browser install: when it retries, when it goes on without apt's packages, and when it stops.
      - run: node install-browser-selftest.mjs
        working-directory: e2e
      # The accessibility run writes into the Workers' files once they've stopped, so "stopped" has to mean every process.
      - run: node stack-stop-selftest.mjs
        working-directory: e2e
      # The accessibility run's bounds: a wait that never finishes is stopped and named, instead of running out the job's time.
      - run: node bounded-selftest.mjs
        working-directory: e2e
      # The rehearsal's HTTPS certificate: a server certificate for localhost, trusted by name, never an authority.
      - run: node local-cert-selftest.mjs
        working-directory: e2e
      # M4's staging run, without a network: the two forms of Cloudflare's edge refusal and nothing else, and the tails' installs.
      - run: node m4-staging-selftest.mjs
        working-directory: e2e
      # M5's staging run, without a network: the one host it accepts, its results and exit code, what its git child sees.
      - run: node m5-staging-selftest.mjs
        working-directory: e2e
      # M6's staging run, without a network: the one host, the M6 operations it reads from the contract, how it compares answers.
      - run: node m6-staging-selftest.mjs
        working-directory: e2e
      # The scripts agents merge, deploy and probe with: every refusal, with stand-ins for gh, wrangler and curl. The content
      # Worker's deploy (M6 step 4(b)): every refusal makes no changing call, the token is in no argument or output, and
      # --deploy needs a terminal. It deploys nothing. These three are the slowest, so they run side by side; each has its
      # own scratch folder (scripts/test/lib.sh). Each one's whole output is printed in turn, and any failure fails the step.
      - name: Run the merge-gate, deploy-staging and deploy-content self-tests side by side
        shell: bash
        run: |
          # Job control on: without it, bash starts a background job with SIGINT ignored, and the self-tests' SIGINT cases
          # would hang instead of being caught.
          set -m
          logs=$(mktemp -d)
          tests=(merge-gate-selftest deploy-staging-selftest deploy-content-selftest)
          pids=()
          for t in "${tests[@]}"; do
            scripts/test/$t > "$logs/$t" 2>&1 < /dev/null &
            pids+=("$!")
          done
          failed=0
          for i in "${!tests[@]}"; do
            t=${tests[$i]} code=0
            wait "${pids[$i]}" || code=$?
            echo "== scripts/test/$t (exit $code)"
            cat "$logs/$t"
            if [ "$code" -ne 0 ]; then echo "::error::scripts/test/$t failed with exit $code"; failed=1; fi
          done
          exit "$failed"
      - run: scripts/test/with-pinned-rust-selftest
      # Each suite's API build and its stamp: a build with other features, or changed since, fails the suite by name.
      - run: node scripts/build-api-worker.mjs --self-test
      - run: scripts/test/staging-probes-selftest
      - run: node run-local.mjs
        working-directory: e2e
      # Staging's setup and the test sign-up, with nothing remote.
      - run: node run-local.mjs --skip-build --rehearse-test-people
        working-directory: e2e
