name: M6 custom domain staging

# M6's staging acceptance test for custom domains, e2e/m6-custom-domain-staging.mjs (M6-X14, M6-X15, M6-X26), from
# GitHub's network: the owner's machine sits behind a web filter that blocks the content domain, podster.site, as for
# m6-code-app-staging.yml. Run by hand only: `gh workflow run m6-custom-domain-staging.yml`, then `gh run watch`.
#
# The input `cname_mode` (2026-11-26) says how the custom name's CNAME to the fallback origin is published. `dns-only`,
# the default, isn't proxied, as a customer whose DNS isn't on Cloudflare publishes it: the content zone's custom
# hostname serves its own certificate, issued by HTTP validation through the `*/*` route, and X14-4 judges it.
# `proxied` (`-f cname_mode=proxied`) is spike D's way: opster.dev is a Cloudflare zone on another account, so
# Cloudflare uses orange-to-orange and serves opster.dev's own certificate, and X14-4 is only recorded. The input
# reaches the script through `env` alone, checked against the two values, never written into the command.
#
# It runs against staging, the one host the script accepts; podster.site, the content domain; and Cloudflare's DNS API
# for opster.dev, the test customer's domain, through one guard that writes only TXT challenges and CNAMEs (proxied
# as the mode says) under the run's own random label and deletes only what the run made.
#
# One job, in the environment `staging-dns`, deployable from main only, which holds the three secrets it needs:
# OPSTER_DNS_TOKEN (Zone, DNS, Edit on opster.dev alone, with an expiry; the run uses it only for TXT and CNAME records
# under its own label, in either mode), OPSTER_ZONE_ID, and its own copy of
# PODSTER_E2E_SIGNUP_SECRET. The owner sets them with scripts/wizards/opster-dns-token.sh. A job can use one environment,
# and the run interleaves API and DNS writes for minutes, so splitting it into two jobs would mean handing a session or
# the token from one job to the other; a copy of the sign-up secret in this environment is the narrower choice, and
# keeps the DNS token out of `staging-e2e`, which m6-code-app-staging.yml uses. The secrets reach the test step alone,
# as environment variables, never written into a command; the script reads the DNS pair once and drops them from its
# environment. The job's GITHUB_TOKEN can read this repository and nothing else, and checkout doesn't keep it. The test
# pushes to the repository it has Podster make in podsterdev with the coding agent's own short-lived token, and leaves
# the three repositories for the owner to delete.
on:
  workflow_dispatch:
    inputs:
      cname_mode:
        description: "The custom name's CNAME: dns-only judges the custom hostname's own certificate (X14-4); proxied is orange-to-orange and only records it"
        type: choice
        options:
          - dns-only
          - proxied
        default: dns-only

permissions:
  contents: read

# The code app run's group: both take the test sign-up's limits and serve on the same content domain, so one at a time.
concurrency:
  group: m6-code-app-staging
  cancel-in-progress: false

jobs:
  custom-domain:
    runs-on: ubuntu-latest
    environment: staging-dns
    # The run's own waits, at their worst, come to about 65.5 minutes: three repositories 5 each, the merge and the release
    # 5 each, the pending hold 2.5, the race 5, the claim 5, Cloudflare active 15, the route 10 and the removal 3. Clean-up
    # after that, on every way out, can take about 6 more: each request read and removed, every DNS record deleted and
    # listed again, release off in three rooms, the publish wait of 60 s, grants, the agent and sign-outs, each request
    # bounded at 30 s. With the install and the self-test, 90 leaves about 15 minutes of margin. Should it still hit
    # the limit, the SIGTERM that follows removes the DNS records and hostname requests first.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # No package's install script runs: the test needs the packages' code only, and no browser.
      - run: npm ci --ignore-scripts
        working-directory: e2e
      # Checks itself before it sends anything: its plan, its DNS guard and its refusals, against stand-ins.
      - run: node m6-custom-domain-staging-selftest.mjs
        working-directory: e2e
      # The mode comes through env and is checked against its two values before it is passed as one quoted argument.
      - run: |
          case "$CNAME_MODE" in
            dns-only | proxied) ;;
            *) echo "cname_mode must be dns-only or proxied" >&2; exit 2 ;;
          esac
          exec node m6-custom-domain-staging.mjs --base-url https://gateway-staging.podster.dev --cname-mode "$CNAME_MODE"
        working-directory: e2e
        env:
          CNAME_MODE: ${{ inputs.cname_mode || 'dns-only' }}
          PODSTER_E2E_SIGNUP_SECRET: ${{ secrets.PODSTER_E2E_SIGNUP_SECRET }}
          OPSTER_DNS_TOKEN: ${{ secrets.OPSTER_DNS_TOKEN }}
          OPSTER_ZONE_ID: ${{ secrets.OPSTER_ZONE_ID }}
