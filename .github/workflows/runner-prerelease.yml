name: Runner pre-release

# Runner's npm test pre-release (the owner's decision of 2026-11-19, narrowing decision 26): the package `podster`, versioned
# 0.0.x-test.N, published only under npm's `test` tag (npm may also point `latest` at the first version), pointing at
# staging. It is built and published only here, by hand, from main, with npm provenance through npm's trusted publishing
# (OIDC), so there is no npm token secret. Each version is published directly (the owner's ruling of 2026-11-20: no staged
# approval on npmjs.com); the architect runs this workflow and approves the `npm-test-prerelease` environment. The gated
# release after M7's step 17 replaces it. The owner's one-time steps on npmjs.com and GitHub are in docs/runner-prerelease.md.
#
# Two jobs (security review L1 on #470). `build` holds no OIDC token and no environment: it installs with scripts off, checks,
# packs, and uploads the .tgz with its SHA-256. `publish` holds the `npm-test-prerelease` environment and `id-token: write`,
# runs no dependency code, and publishes that same .tgz after checking its SHA-256.
#
# `workflow_dispatch` runs this file as it is on the dispatched branch, so the checks here can be edited by whoever can push
# a branch. The server-side check is the environment's own rule: deployment branches limited to main, with the owner as
# required reviewer (docs/runner-prerelease.md, a required step before the trusted publisher is added).
#
# `dry_run`, on by default, builds and checks the package and uploads the packed .tgz as this run's artifact without
# publishing. That's how the first version reaches npm if npm needs the package to exist before a trusted publisher can be
# added: the owner publishes this CI-built file once, at their own terminal.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version in apps/runner/package.json, such as 0.0.1-test.3"
        required: true
        type: string
      dry_run:
        description: "Build, check and upload the .tgz without publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# One at a time, and a second waits rather than replacing a publish that's under way.
concurrency:
  group: runner-prerelease
  cancel-in-progress: false

jobs:
  # A run from any other ref fails here, and the jobs after it are skipped.
  main-only:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any ref but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Runner's pre-release is published only from main, not $REF."
            exit 1
          fi

  build:
    needs: main-only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    defaults:
      run:
        working-directory: apps/runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Refuse a version that isn't the package's, or isn't a test pre-release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          actual=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$actual" ]; then
            echo "The version input ($VERSION) isn't the version in apps/runner/package.json ($actual)."
            exit 1
          fi
          case "$actual" in
            *-test.*) ;;
            *) echo "Only a test pre-release (0.0.x-test.N) is published here, not $actual."; exit 1 ;;
          esac
          if ! printf '%s' "$actual" | grep -Eq '^0\.0\.[0-9]+-test\.[0-9]+$'; then
            echo "Test pre-releases are versioned 0.0.x-test.N, not $actual."
            exit 1
          fi
      # No package's install script runs, as in CI's runner job.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # scripts/pack.mjs packs from a fresh copy whose production tree, installed from package-lock.json with
      # `npm ci --omit=dev --omit=optional`, is bundled: no dev tool, no Claude Code binary and no npm-shrinkwrap.json.
      - name: Pack the .tgz and print its SHA-256
        id: pack
        run: |
          node scripts/pack.mjs --out "$RUNNER_TEMP/pack"
          cd "$RUNNER_TEMP/pack"
          file=$(ls ./*.tgz)
          test "$(ls ./*.tgz | wc -l)" -eq 1
          file=${file#./}
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          echo "$sha  $file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      # That file, installed as `npx podster@test` installs it, holds no Claude Code binary and no dev tool, fits the size
      # budget, and its SDK starts only the container's binary. Scripts off; nothing is published.
      - run: node scripts/install-check.mjs "$RUNNER_TEMP/pack/$FILE"
        env:
          FILE: ${{ steps.pack.outputs.file }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: podster-${{ inputs.version }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Room for the registry check's wait (up to about 15 minutes) after publishing.
    timeout-minutes: 25
    # The owner requires approval on this environment and limits it to main; npm's trusted publisher names it.
    environment: npm-test-prerelease
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10. Pinned, and no install script runs.
      - run: npm install --global --ignore-scripts npm@11.21.2
      - run: npm --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: podster-${{ inputs.version }}
          path: ${{ runner.temp }}/pack
      # The same file build packed, by its SHA-256. Publishing a .tgz runs none of its scripts.
      # Published directly (2026-11-20): the trusted publisher has "Allow npm publish" on, so npm publish works with OIDC and
      # no staged approval is needed. See docs/runner-prerelease.md.
      - name: Publish the checked .tgz under npm's test tag
        working-directory: ${{ runner.temp }}/pack
        env:
          FILE: ${{ needs.build.outputs.file }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          printf '%s' "$FILE" | grep -Eq '^podster-0\.0\.[0-9]+-test\.[0-9]+\.tgz$'
          printf '%s' "$SHA256" | grep -Eq '^[0-9a-f]{64}$'
          echo "$SHA256  $FILE" | sha256sum --check --strict
          npm publish "./$FILE" --provenance --tag test --access public
      # What the registry now holds must be the file build packed. npm can take minutes to show a new version, so this
      # polls for up to about 15 minutes, with --prefer-online so a cached packument can't hide it.
      - name: Check the registry's copy against the packed file
        working-directory: ${{ runner.temp }}/pack
        env:
          FILE: ${{ needs.build.outputs.file }}
          VERSION: ${{ inputs.version }}
        run: |
          local_sha=$(sha1sum "$FILE" | cut -d' ' -f1)
          remote_sha=""
          for attempt in $(seq 1 90); do
            remote_sha=$(npm view --prefer-online "podster@$VERSION" dist.shasum 2>/dev/null || true)
            if [ -n "$remote_sha" ]; then break; fi
            echo "Not visible on the registry yet (attempt $attempt of 90); waiting."
            sleep 10
          done
          echo "packed file shasum: $local_sha"
          if [ -z "$remote_sha" ]; then
            echo "podster@$VERSION was published, but the registry still doesn't show it after about 15 minutes."
            echo "Check it later with: npm view --prefer-online podster@$VERSION dist.shasum (expect $local_sha)"
            exit 1
          fi
          integrity=$(npm view --prefer-online "podster@$VERSION" dist.integrity 2>/dev/null || true)
          echo "registry shasum:    $remote_sha"
          echo "registry integrity: $integrity"
          if [ "$remote_sha" != "$local_sha" ]; then
            echo "The registry's shasum for podster@$VERSION doesn't match the packed file's."
            exit 1
          fi
