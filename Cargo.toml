[workspace]
resolver = "2"
members = ["crates/core", "crates/policy", "crates/assertion", "crates/egress", "apps/api"]
# apps/api only builds for Wasm, so native commands skip it by default.
default-members = ["crates/core", "crates/policy", "crates/assertion", "crates/egress"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

# A panic inside a Durable Object hangs its request, so kernel code returns errors instead.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
lto = true
