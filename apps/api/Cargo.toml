[package]
name = "podster-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Test builds only: lets a test force a failure after a command's writes.
failpoints = []

[dependencies]
podster-assertion = { path = "../../crates/assertion" }
podster-core = { path = "../../crates/core" }
podster-egress = { path = "../../crates/egress" }
podster-policy = { path = "../../crates/policy" }
futures-util = "0.3"
worker = { version = "=0.8.7", features = ["d1", "queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
uuid = { version = "1", features = ["v4", "js"] }
sha2 = "0.10"

[lints]
workspace = true
