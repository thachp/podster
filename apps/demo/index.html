<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Podster Workroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a quiet monochrome shell (sidebar + one working column). Color appears only where a person is needed. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --sunk: #eef0f3;
  --line: #e3e6eb;
  --text: #14161b;
  --muted: #5c6270;
  --faint: #8b909b;
  --ink: #14161b;
  --ink-text: #ffffff;
  --need: #d9480f;
  --need-soft: #fff0e6;
  --need-line: #ffd2b8;
  --build: #2f6bd8;
  --done: #1d8a4e;
  --planned: #9aa0ab;
  --shadow: 0 1px 2px rgba(20,22,27,.06), 0 8px 24px rgba(20,22,27,.06);
  --font: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1014; --surface: #16191f; --sunk: #1c2028; --line: #262b34; --text: #e9ebef; --muted: #a3a9b5; --faint: #6f7580;
  --ink: #e9ebef; --ink-text: #0e1014; --need: #ff7b3d; --need-soft: #2a1a11; --need-line: #5a2f17; --build: #6b9cff; --done: #3fbf78; --planned: #6f7580;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1014; --surface: #16191f; --sunk: #1c2028; --line: #262b34; --text: #e9ebef; --muted: #a3a9b5; --faint: #6f7580;
  --ink: #e9ebef; --ink-text: #0e1014; --need: #ff7b3d; --need-soft: #2a1a11; --need-line: #5a2f17; --build: #6b9cff; --done: #3fbf78; --planned: #6f7580;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--build); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
h2 { font-size: 15px; font-weight: 600; }
p { margin: 0; }

.app { display: flex; min-height: 100%; }
.side { flex: none; width: 236px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: 18px 12px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 18px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); display: grid; place-items: center; }
.brand i::after { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--need); }
.room { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; }
.room b { width: 26px; height: 26px; border-radius: 7px; background: var(--sunk); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.room span { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.room small { color: var(--faint); font-size: 12px; }
.room { color: var(--text); font: inherit; }
.room:hover, .room[aria-expanded="true"] { background: var(--sunk); }
.room .ud { flex: none; color: var(--faint); }
.rmenu { position: fixed; z-index: 35; left: 244px; top: 52px; width: 280px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.rmenu.narrow { left: 72px; }
.rmenu.enter { animation: slideout .16s ease-out; }
.rmenu .lbl { padding: 6px 10px 4px; font-size: 12px; color: var(--faint); }
.rmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px -4px; }
.rmenu .it { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; color: var(--text); text-decoration: none; }
.rmenu .it:hover, .rmenu .it:focus-visible { background: var(--sunk); }
.rmenu .it b { flex: none; width: 24px; height: 24px; border-radius: 6px; background: var(--sunk); display: grid; place-items: center; font-size: 10.5px; font-weight: 700; }
.rmenu .it .t { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.rmenu .it small { color: var(--faint); font-size: 12px; }
.rmenu .it .pill { margin-left: auto; }
.nav { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav:hover { background: var(--sunk); color: var(--text); }
.nav[aria-current="page"] { background: var(--sunk); color: var(--text); font-weight: 600; }
.nav svg { flex: none; }
.nav .n { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--need); color: #fff; font-size: 11.5px; font-weight: 600; display: grid; place-items: center; }
.side .spacer { flex: 1; }
.who { display: flex; align-items: center; gap: 10px; padding: 8px; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; }
.av { flex: none; width: 28px; height: 28px; border-radius: 99px; background: var(--sunk); color: var(--muted); font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.av.agent { border-radius: 8px; font-family: var(--mono); font-size: 10.5px; }
.switch { margin: 6px 8px 0; padding: 7px 10px; border: 1px dashed var(--line); border-radius: 8px; background: transparent; color: var(--muted); font-size: 12px; text-align: left; cursor: pointer; }
.switch:hover { color: var(--text); border-color: var(--faint); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; height: 52px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.crumb { color: var(--faint); font-size: 13px; display: flex; gap: 6px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; }
.crumb b { color: var(--text); font-weight: 500; }
.search { margin-left: auto; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--faint); cursor: pointer; min-width: 220px; }
.search kbd { margin-left: auto; font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.content { padding-block: 32px 64px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); width: 100%; display: flex; flex-direction: column; gap: 28px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.head p { margin-top: 6px; color: var(--muted); }
.rvbtn { display: inline-flex; align-items: center; gap: 8px; }
.rvbtn .caret { opacity: .8; font-size: 11px; }
.rvbtn .cnt { font-weight: 400; opacity: .85; font-size: 12.5px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--ink); color: var(--ink-text); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.need { background: var(--need); color: #fff; border-color: var(--need); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--sunk); }
.btn.danger { color: var(--need); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.lg { height: 42px; padding: 0 18px; font-size: 14.5px; }

.label { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
.dot { flex: none; width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
.stage { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }

/* Track: the 4-step lifecycle every task moves through */
.track { display: flex; gap: 3px; }
.track i { width: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.track i.on { background: var(--muted); }
.track.review i.on:last-of-type, .track.review i.cur { background: var(--need); }
.track.done i { background: var(--done); }
.track.building i.cur { background: var(--build); }

/* Today */
.decisions { display: flex; flex-direction: column; gap: 12px; }
.decision { display: grid; grid-template-columns: 220px minmax(0, 1fr) auto; align-items: center; gap: 22px; padding: 16px; border: 1px solid var(--need-line); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
.decision.small { grid-template-columns: minmax(0, 1fr) auto; padding: 16px 20px; }
.decision .what { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.decision .kind { color: var(--need); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.decision h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.decision .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.thumb { height: 128px; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); background: var(--sunk); position: relative; }
.thumb .ot { transform: scale(.42); transform-origin: top left; width: 238%; pointer-events: none; }
.quiet { display: flex; flex-direction: column; }
.qrow { display: flex; align-items: center; gap: 14px; padding: 12px 2px; border-bottom: 1px solid var(--line); color: var(--muted); }
.qrow b { color: var(--text); font-weight: 500; }
.qrow .r { margin-left: auto; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.allclear { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }

/* Board */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.colhead { display: flex; align-items: center; gap: 8px; padding: 0 4px 4px; font-weight: 600; font-size: 13px; }
.colhead .c { color: var(--faint); font-weight: 500; }
.col.you .colhead { color: var(--need); }
.card { display: flex; flex-direction: column; gap: 10px; padding: 12px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; width: 100%; }
.card:hover { border-color: var(--faint); }
.col.you .card { border-color: var(--need-line); background: var(--need-soft); }
.card .t { font-weight: 500; line-height: 1.35; }
.card .f { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 12.5px; }
.card .f .av { width: 20px; height: 20px; font-size: 9px; border-radius: 6px; }
.addcard { padding: 10px; border: 1px dashed var(--line); border-radius: 11px; background: transparent; color: var(--faint); cursor: pointer; text-align: left; }
.addcard:hover { color: var(--text); border-color: var(--faint); }

/* Review */
.review { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); gap: 24px; align-items: start; }
.frame { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.framebar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--sunk); }
.framebar .url { flex: 1; min-width: 0; height: 26px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; padding: 0 10px; color: var(--faint); overflow: hidden; white-space: nowrap; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.seg button { height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--sunk); color: var(--text); font-weight: 600; }
.stagewrap { padding: 18px; background: var(--sunk); display: flex; justify-content: center; min-height: 420px; }
.phone { width: 320px; border: 8px solid var(--text); border-radius: 30px; overflow: hidden; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.check input { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--ink); }
.side-panel { display: flex; flex-direction: column; gap: 18px; padding: 20px; position: sticky; top: 76px; }
.note { padding: 12px 14px; border-radius: 10px; background: var(--sunk); color: var(--text); }
.note .by { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
details.dev summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.dev .kv { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 6px 12px; padding-top: 10px; color: var(--muted); }
details.dev .kv span:nth-child(even) { color: var(--text); overflow-wrap: anywhere; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunk); }
textarea.in, input.in, select.in { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); resize: vertical; }
input.in, select.in { height: 38px; padding: 0 12px; }

/* The order tracker being built (shown inside previews) */
.ot { background: #ffffff; color: #1f2430; font-family: var(--font); font-size: 13px; padding: 16px; min-height: 380px; display: flex; flex-direction: column; gap: 12px; }
.ot .oh { display: flex; align-items: center; justify-content: space-between; }
.ot .oh b { font-size: 16px; }
.ot .oh small { color: #7a8090; }
.ot .add { display: flex; gap: 6px; }
.ot .add input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid #dde1e8; border-radius: 6px; background: #fff; color: #1f2430; }
.ot .add button { height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: #2b6e4f; color: #fff; font-weight: 600; cursor: pointer; }
.ot .lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ot .lane { background: #f4f5f7; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 160px; }
.ot .lane h4 { margin: 0 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #7a8090; }
.ot .o { background: #fff; border: 1px solid #e4e7ec; border-radius: 6px; padding: 7px 8px; display: flex; flex-direction: column; gap: 2px; }
.ot .o small { color: #7a8090; }
.ot .o button { align-self: flex-end; margin-top: 4px; height: 24px; padding: 0 8px; border: 1px solid #dde1e8; border-radius: 5px; background: #fff; color: #1f2430; font-size: 11.5px; cursor: pointer; }
.phone .ot { padding: 12px; }
.phone .ot .lanes { grid-template-columns: 1fr; }
.phone .ot .o button { height: 18px; padding: 0 5px; font-size: 9px; }
.ot.big .o button { height: 34px; padding: 0 12px; font-size: 12.5px; }
.phone .ot.big .o button { height: 26px; padding: 0 8px; font-size: 10.5px; }
.round { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunk); }
.round .ask { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.round .ask .ok { flex: none; width: 18px; height: 18px; border-radius: 99px; background: var(--done); color: #fff; display: grid; place-items: center; margin-top: 1px; }
.round .ask .ok svg { width: 11px; height: 11px; }
.hostbox { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; }
.hostbox .mono { font-size: 15px; }
.allowlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.allowlist li { display: flex; gap: 10px; align-items: flex-start; }
.allowlist li .dot { margin-top: 7px; }
.emptyboard { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.emptyboard .c { border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px; min-height: 120px; display: flex; flex-direction: column; gap: 8px; }
.emptyboard .c .h { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.emptyboard .card { cursor: default; }

/* Ship */
.live { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; padding: 20px 22px; }
.live .pulse { width: 10px; height: 10px; border-radius: 99px; background: var(--done); box-shadow: 0 0 0 0 color-mix(in srgb, var(--done) 50%, transparent); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 99px; background: var(--sunk); color: var(--muted); font-size: 12.5px; }
.step.ok { color: var(--done); }
.step.run { color: var(--build); }
.row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }

/* Run console */
.console { background: #0f1218; color: #d6dbe4; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.console .bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #222833; color: #9aa3b2; font-size: 13px; }
.console .log { font-family: var(--mono); font-size: 12.5px; line-height: 1.75; padding: 14px 16px; height: 330px; overflow-y: auto; }
.console .log .t { color: #5d6675; margin-right: 12px; }
.console .log .ok { color: #5fd08f; }
.console .log .warn { color: #ff9a5c; }
.console .log .dim { color: #7d8697; }
.meter { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--build); border-radius: 99px; transition: width .4s; }

/* Overlays */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(10,12,16,.38); }
.drawer { position: fixed; z-index: 31; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; padding-block: max(20px, env(safe-area-inset-top, 0px)) 20px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); gap: 18px; overflow-y: auto; }
.drawer.enter { animation: slide .18s ease-out; }
.scrim.enter { animation: fadein .18s ease-out; }
@keyframes fadein { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.modal { position: fixed; z-index: 31; left: 50%; top: 50%; transform: translate(-50%, -50%); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); overflow-y: auto; overscroll-behavior: contain; width: min(560px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.palette { padding: 0; gap: 0; overflow: hidden; }
.palette input { border: 0; border-bottom: 1px solid var(--line); height: 50px; padding: 0 18px; background: transparent; outline: none; font-size: 15px; width: 100%; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 340px; overflow-y: auto; }
.palette li button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
.palette li button:hover, .palette li button.sel { background: var(--sunk); }
.inl { position: relative; margin: -6px -10px; padding: 6px 10px; border-radius: 8px; cursor: text; outline-offset: 0; }
.inl:hover, .inl:focus-visible { background: var(--sunk); }
.inl .inl-pen { position: absolute; top: 8px; right: 8px; color: var(--faint); opacity: 0; }
.inl:hover .inl-pen, .inl:focus-visible .inl-pen { opacity: 1; }
.inl.locked { cursor: default; }
.inl.locked:hover { background: transparent; }
.inl-ed { display: flex; flex-direction: column; gap: 8px; padding: 10px; margin: -10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
.inl-ed .mdta { font-family: var(--mono); font-size: 13px; line-height: 1.6; min-height: 120px; }

.split-art::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 40px 40px; mask-image: linear-gradient(180deg, #000 0%, transparent 85%); pointer-events: none; }

.paths { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 26px; }
.paths .hello { display: flex; flex-direction: column; gap: 8px; }

.path .mini { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 13px; }

.path[aria-checked="true"] .radio { border: 6px solid var(--ink); }
.path { position: relative; }
.path:hover { border-color: var(--muted); }
.path[aria-checked="true"] { border-color: var(--ink); box-shadow: var(--shadow); }
.path:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.paths .go { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.paths .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.path { display: flex; flex-direction: column; gap: 10px; padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-align: left; cursor: pointer; }
.path[aria-pressed="true"] { border-color: var(--ink); box-shadow: var(--shadow); }
.path h3 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.pub { width: 100%; max-width: 1080px; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 28px; align-items: start; }

/* Plan review */
.prow { display: grid; grid-template-columns: 28px 22px minmax(0, 1fr) 96px 170px 64px; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }

.size { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.updown { display: flex; gap: 2px; }

.updown button:hover { color: var(--text); }
.updown button[disabled] { opacity: .35; cursor: default; }
.planner-note { display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--sunk); }

/* Question from an agent */
.qa { display: flex; flex-direction: column; gap: 12px; }
.bubble { padding: 12px 14px; border-radius: 12px; background: var(--sunk); max-width: 560px; }
.bubble.me { background: var(--ink); color: var(--ink-text); align-self: flex-end; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.rchip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 13.5px; cursor: pointer; }
.rchip:hover { border-color: var(--muted); }
.rchip .plus { color: var(--faint); font-size: 15px; line-height: 1; }
.flag { display: inline-flex; align-items: center; gap: 6px; color: var(--need); font-size: 12.5px; font-weight: 500; }

/* Pairing */
.pair { max-width: 680px; display: flex; flex-direction: column; }
.pstep { display: flex; gap: 16px; padding: 20px; border-bottom: 1px solid var(--line); }
.pstep:last-child { border-bottom: 0; }
.pstep.later { opacity: .45; }
.pstep .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.cmd { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #0f1218; color: #d6dbe4; font-family: var(--mono); font-size: 13px; }
.cmd span { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; }
.cmd button { flex: none; height: 26px; padding: 0 10px; border: 1px solid #333a46; border-radius: 6px; background: transparent; color: #d6dbe4; cursor: pointer; font-size: 12px; }
.code-in { font-family: var(--mono); font-size: 18px; letter-spacing: .12em; text-transform: uppercase; width: 200px; height: 46px; text-align: center; }
.fp { font-family: var(--mono); font-size: 15px; letter-spacing: .04em; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); overflow-wrap: anywhere; }

@media (max-width: 900px) {
  .prow { grid-template-columns: 22px 22px minmax(0, 1fr); }
  .prow .size, .prow select, .prow .updown { grid-column: 3; }
  .pub, .paths .two { grid-template-columns: minmax(0, 1fr); }
  .grid2, .review { grid-template-columns: minmax(0, 1fr); }
  .decision { grid-template-columns: minmax(0, 1fr); }
  .decision .acts { justify-content: flex-start; }
  .side-panel { position: static; }
}
/* Task page */
.task { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
.task-main { display: flex; flex-direction: column; gap: 28px; max-width: 820px; min-width: 0; }
.task-main section { display: flex; flex-direction: column; gap: 10px; }
.sec { font-size: 13px; font-weight: 600; color: var(--muted); }
.checklist { display: flex; flex-direction: column; gap: 2px; }

/* ---------- GitHub-flavored Markdown (safe subset). Input is escaped first; links only http(s)/mailto. inert = agent content: links shown as text. ---------- */
function mdInline(s, inert) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => {
    if (!/^(https?:|mailto:)/i.test(u)) return t;
    return inert ? t + ' <span class="faint">(' + u + ')</span>' : '<a href="' + u + '" target="_blank" rel="noopener noreferrer nofollow">' + t + '</a>';
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>').replace(/(^|[^\w])_([^_\s][^_]*)_(?=[^\w]|$)/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[Number(i)] + '</code>');
}
function md(src, inert) {
  const L = esc(src || '').split('\n'); let out = ''; let i = 0;
  const isUl = (x) => /^\s*[-*+]\s+/.test(x); const isOl = (x) => /^\s*\d+[.)]\s+/.test(x);
  const isTable = (k) => /^\|.*\|\s*$/.test(L[k] || '') && /^\|?\s*:?-{3,}/.test(L[k + 1] || '');
  const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
  while (i < L.length) {
    const l = L[i]; let m;
    if (/^```/.test(l)) { const b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out += '<pre><code>' + b.join('\n') + '</code></pre>'; continue; }
    if (!l.trim()) { i++; continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { out += '<p class="mdh mdh' + m[1].length + '">' + mdInline(m[2], inert) + '</p>'; i++; continue; }

    (fs.length ? '' : '<div class="row faint" style="padding:12px">No files yet</div>') +

    if (n === 'plan') { const on = S.plan.items.filter((x) => x.on).length; return '<div class="decision small"><div class="what"><span class="kind"><span class="dot" style="background:var(--need)"></span>Planner proposes a plan</span><h3>The next ' + S.plan.items.length + ' tasks</h3><p class="muted">' + S.plan.items.slice(0, 3).map((x) => x.title).join(', ') + ', and one it can\'t staff yet. Nothing starts until you approve.</p></div><div class="acts"><button class="btn primary" data-act="plan-open">Review plan</button></div></div>'; }
    if (n === 'perm') return '<div class="decision small"><div class="what"><span class="kind"><span class="dot" style="background:var(--need)"></span>Coding Agent asks for permission \u00b7 \u201cShow order totals per day\u201d</span><h3>Reach registry.npmjs.org to add a package</h3><p class="muted">It wants one package to group orders by day. This site isn\'t on your workroom\'s list yet.</p></div><div class="acts"><button class="btn primary" data-act="perm-open">Review request</button></div></div>';
    if (n === 'release') { const r = S.tasks.filter((t) => t.ship === 'ready'); return '<div class="decision small"><div class="what"><span class="kind"><span class="dot" style="background:var(--need)"></span>Approved, not live yet</span><h3>' + r.map((t) => t.title).join(' and ') + '</h3><p class="muted">Customers still see release ' + S.ship.live + ' from ' + S.ship.liveDay + '.</p></div><div class="acts"><a class="btn primary" href="#ship">Release\u2026</a></div></div>'; }
  }).join('');
  const moving = S.tasks.filter((t) => t.stage === 'building');

  const fp = S.fresh.plan;
  const bpCard = !S.fresh.lead
    ? '<div class="decision small"><div class="what"><span class="kind"><span class="dot" style="background:var(--need)"></span>Bakery preorders \u00b7 just started</span><h3>Add the first agent</h3><p class="muted">Nothing can start until an agent plans the work.</p></div><div class="acts"><a class="btn primary" href="#fresh">Get started</a></div></div>'
    : fp === 'ready' ? '<div class="decision small"><div class="what"><span class="kind"><span class="dot" style="background:var(--need)"></span>Bakery preorders \u00b7 Planner\'s first plan</span><h3>' + FRESH_PLAN.length + ' tasks to get preorders working</h3><p class="muted">Planner read your brief and suggests where to start.</p></div><div class="acts"><a class="btn primary" href="#fresh">Open</a></div></div>'

/* ---------- Creator: Board, List, Timeline ---------- */
const EST = { 14: [0, 1], 15: [1, 1], 16: [2, 2], 18: [4, 3], 19: [6, 2], 21: [7, 1], 20: [7, 1], 22: [8, 2], 23: [8, 1], 24: [9, 1] };
const DAYS = ['Mon 16', 'Tue 17', 'Wed 18', 'Thu 19', 'Fri 20', 'Mon 23', 'Tue 24', 'Wed 25', 'Thu 26', 'Fri 27'];
const TODAY = 6.6;
function viewSwitch() {
  return '<div class="seg" role="group" aria-label="View">' + [['board', 'Board'], ['list', 'List'], ['timeline', 'Timeline']].map((v) => '<button data-act="view" data-v="' + v[0] + '" aria-pressed="' + (S.view === v[0]) + '">' + v[1] + '</button>').join('') + '</div>';
}
function listView() {
  const order = { review: 0, building: 1, planned: 2, done: 3 };
  const F = [['all', 'All'], ['you', 'Needs you'], ['moving', 'Being built'], ['planned', 'Planned'], ['done', 'Done']];
  let ts = S.tasks.filter((t) => S.listF === 'all' || (S.listF === 'you' ? (t.stage === 'review' || (t.id === 19 && S.q.state === 'open') || t.blocked) : S.listF === 'moving' ? t.stage === 'building' : t.stage === S.listF));
  ts = ts.slice().sort((a, b) => S.sort === 'id' ? b.id - a.id : S.sort === 'who' ? a.who.localeCompare(b.who) : order[a.stage] - order[b.stage] || b.id - a.id);
  const th = (k, l) => '<th scope="col"><button data-act="sort" data-k="' + k + '" style="border:0;background:transparent;font:inherit;font-weight:600;color:' + (S.sort === k ? 'var(--text)' : 'var(--faint)') + ';cursor:pointer;padding:0">' + l + (S.sort === k ? ' \u2193' : '') + '</button></th>';
  return '<div class="chips">' + F.map((f) => '<button class="btn' + (S.listF === f[0] ? ' primary' : ' ghost') + '" style="height:30px" data-act="listf" data-f="' + f[0] + '">' + f[1] + '</button>').join('') + '</div>' +
    '<div class="panel" style="overflow-x:auto"><table class="tbl"><thead><tr>' + th('id', '#') + '<th scope="col" style="color:var(--faint)">Task</th>' + th('stage', 'Stage') + th('who', 'Who') + '<th scope="col" style="color:var(--faint)">Estimate</th><th scope="col" style="color:var(--faint)">Latest</th></tr></thead><tbody>' +
    ts.map((t) => { const need = t.stage === 'review' || (t.id === 19 && S.q.state === 'open') || t.blocked; const e = EST[t.id]; return '<tr data-act="open" data-id="' + t.id + '"><td class="mono faint">#' + t.id + '</td><td><b style="font-weight:500">' + t.title + '</b>' + ((S.files[t.id] || []).length ? ' <span class="faint" style="font-size:12px">\u00b7 ' + S.files[t.id].length + ' file' + (S.files[t.id].length > 1 ? 's' : '') + '</span>' : '') + ((S.threads[t.id] || []).length ? ' <span class="faint" style="font-size:12px">\u00b7 ' + S.threads[t.id].length + ' message' + (S.threads[t.id].length > 1 ? 's' : '') + '</span>' : '') + '</td><td>' + (need ? '<span class="stage" style="color:var(--need)"><span class="dot" style="background:var(--need)"></span>' + (t.stage === 'review' ? 'Your review' : t.blocked ? 'Paused' : 'Question for you') + '</span>' : stageLabel(t.stage)) + '</td><td class="muted">' + t.who + '</td><td class="mono faint">' + (e ? (e[1] === 1 ? '1 day' : e[1] + ' days') : '\u2014') + '</td><td class="faint">' + t.when + '</td></tr>'; }).join('') +
    '</tbody></table>' + (ts.length ? '' : '<div class="allclear" style="border:0">Nothing here.</div>') + '</div>';
}
function timelineView() {
  const order = { done: 0, review: 1, building: 2, planned: 3 };
  const ts = S.tasks.filter((t) => EST[t.id]).sort((a, b) => EST[a.id][0] - EST[b.id][0] || order[a.stage] - order[b.stage]);
  const col = (d) => 'calc(' + (d / DAYS.length * 100) + '%)';
  const color = (t) => t.stage === 'done' ? 'var(--done)' : t.stage === 'review' ? 'var(--need)' : t.stage === 'building' ? 'var(--build)' : 'transparent';
  return '<div class="panel" style="overflow-x:auto"><div class="gantt">' +
    '<div class="g-row g-head"><span></span><div class="g-track">' + DAYS.map((d, i) => '<span class="g-day" style="left:' + col(i) + ';width:' + col(1) + '">' + d + '</span>').join('') + '</div></div>' +
    ts.map((t) => { const e = EST[t.id]; const planned = t.stage === 'planned'; return '<div class="g-row" data-act="open" data-id="' + t.id + '"><span class="g-label"><span class="mono faint">#' + t.id + '</span> ' + t.title + '</span><div class="g-track"><span class="g-today" style="left:' + col(TODAY) + '"></span><span class="g-bar" style="left:' + col(e[0]) + ';width:calc(' + (e[1] / DAYS.length * 100) + '% - 4px);background:' + color(t) + ';' + (planned ? 'border:1.5px dashed var(--faint);' : '') + '">' + (planned ? '<span class="faint" style="font-size:11.5px;padding:0 6px">estimate</span>' : '') + '</span></div></div>'; }).join('') +
    '</div></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:16px;font-size:13px" class="muted"><span class="stage"><span class="dot" style="background:var(--done)"></span>Done</span><span class="stage"><span class="dot" style="background:var(--need)"></span>Your review</span><span class="stage"><span class="dot" style="background:var(--build)"></span>Being built</span><span class="stage"><span class="dot" style="border:1.5px dashed var(--faint);background:transparent"></span>Planned estimate</span><span class="stage"><span style="width:2px;height:12px;background:var(--need)"></span>Today</span></div>' +
    '<p class="faint" style="font-size:13px;max-width:720px">Planner\'s estimates, not promises. \u201cAdd a status filter\u201d starts after you approve \u201cTrack customer orders\u201d, so if review waits, everything after it moves.</p>';
}
function board() {
  return (S.archived ? '<div class="confirm"><b>Archived.</b><span class="muted">The board is read-only. <a href="#team">Unarchive from Team</a> to start work again.</span></div>' : '') +
    '<div class="head"><div><h1>Board</h1><p>' + (S.view === 'board' ? 'Every task moves left to right. Only the orange column waits on you. Drag Planned cards to set the order.' : S.view === 'list' ? 'Every task in one table. Click a column to sort.' : 'When things happened, and when Planner expects the rest.') + '</p></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' + viewSwitch() + '<button class="btn primary" data-act="newtask"' + (S.archived ? ' disabled' : '') + '>New task</button></div></div>' +
    (S.view === 'list' ? listView() : S.view === 'timeline' ? timelineView() :
    '<div class="board">' + STAGES.map((s) => {
      const ts = S.tasks.filter((t) => t.stage === s.id);
      return '<section class="col' + (s.id === 'review' ? ' you' : '') + '" data-col="' + s.id + '"><div class="colhead"><span class="dot" style="background:' + s.color + '"></span>' + s.name + '<span class="c">' + ts.length + '</span></div>' +
