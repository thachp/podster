# clamd for one file at a time, with no network and no updates. These limits are what a zip bomb runs into. Going over one can
# still answer OK for some archives, so scanner/archive.py walks every zip as well.
Foreground yes
LocalSocket /tmp/clamd.sock
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav
MaxThreads 2
# Room above the 100 MB upload limit.
StreamMaxLength 105M
MaxScanSize 400M
MaxFileSize 150M
MaxRecursion 10
MaxFiles 10000
MaxScanTime 120000
AlertExceedsMax yes
# What it can't open, it can't vouch for.
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
HeuristicAlerts yes
ExitOnOOM yes
# Signatures only change with a new image.
SelfCheck 0
