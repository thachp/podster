[package]
name = "podster-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# All three are already in the lockfile through crates/egress's `url`: IDNA for custom hostnames, NFC and NFKC for
# release paths, and general categories for refusing invisible characters in them.
[dependencies]
idna = "1.1"
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.4", default-features = false, features = ["compiled_data"] }
# The preview build ID (M8 step 4, `preview_build`): a SHA-256 over the build's canonical text. Pure arithmetic, already
# in the lockfile through crates/policy and this crate's own tests.
sha2 = "0.10"

