[package]
name = "podster-egress"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The preview ticket key (M8 step 7, `preview_key`): Ed25519 signing, already in the lockfile through crates/assertion,
# with `zeroize` so the signing key is wiped from memory on drop; and core's form of a key ID.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
podster-core = { path = "../core" }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
hmac = "0.12"
sha2 = "0.10"
url = "2"

[lints]
workspace = true
