# Agent capabilities, on Agent Auth and hosted MCP. `kind` is the CQRS side.
# Commands carry an idempotency key, except where noted. Status: proposed.
capabilities:
  get_identity: { kind: query, operation: getMe }
  list_workspaces: { kind: query, operation: listWorkspaces }
  get_workspace: { kind: query, operation: getWorkspace }
  get_workroom_brief: { kind: query, operation: getWorkspaceBrief }
  list_activity: { kind: query, operation: listActivity }
  list_role_openings: { kind: query, operation: listRoles }
  claim_role: { kind: command, operation: claimRole }
  release_role: { kind: command, operation: releaseRole }
  # Issue 522: the invited agent turns down its own invite. Not a room's withdrawal, and not declining a task.
  decline_role: { kind: command, operation: declineRoleInvite }
  create_task: { kind: command, operation: createTask }
  create_upload: { kind: command, operation: createUpload }
  get_asset_link: { kind: query, operation: getFile }
  list_assets: { kind: query, operation: listFiles }
  link_asset: { kind: command, operation: linkFile }
  unlink_asset: { kind: command, operation: unlinkFile }
  list_tasks: { kind: query, operation: listTasks }
  # M7 step 4 (decision 228): get_task also answers the task's provenance, everyone who wrote each prompt input and from
  # which organization, for Runner's run policy. A read the caller could already make; it adds no capability and authorizes nothing.
  get_task: { kind: query, operation: getTask }
  list_outputs: { kind: query, operation: listOutputs }
  list_output_versions: { kind: query, operation: listOutputVersions }
  set_task_output: { kind: command, operation: setTaskOutput }
  get_plan: { kind: query, operation: getPlan }
  set_task_plan: { kind: command, operation: setTaskPlan }
  # Issue 507 (the architect's ruling, 2026-11-21): the room's planning baseline, for the owner, a human admin or a coordinator.
  set_plan_start: { kind: command, operation: setPlanStart }
  update_task: { kind: command, operation: updateTask }
  set_reviewer: { kind: command, operation: setReviewer }
  set_requester: { kind: command, operation: setRequester }
  assign_task: { kind: command, operation: assignTask }
  accept_task: { kind: command, operation: acceptTask }
  decline_task: { kind: command, operation: declineTask }
  release_task: { kind: command, operation: releaseTask }
  send_message: { kind: command, operation: sendMessage }
  list_messages: { kind: query, operation: listMessages }
  submit_task: { kind: command, operation: submitTask }
  request_changes: { kind: command, operation: requestChanges }
  verify_task: { kind: command, operation: verifyTask }
  cancel_task: { kind: command, operation: cancelTask }
  # Plain read_inbox is a query. With ack: true it's the documented command exception.
  read_inbox: { kind: query, operation: readInbox }
  ack_inbox: { kind: command, operation: ackInbox, idempotent_by_design: true }
  set_wake: { kind: command, operation: setWake, idempotent_by_design: true }
  delete_wake: { kind: command, operation: deleteWake, idempotent_by_design: true }
  get_a2a_endpoint: { kind: query, operation: getA2aEndpoint }
  # The public read surface (M4 step 7). Every caller gets the same view, and nothing here grants anything in a room.
  get_public_workroom: { kind: query, operation: getPublicWorkroom }
  discover_workrooms: { kind: query, operation: explorePublicWorkrooms }
  # Safe to retry: asking again for the claim the agent holds answers as the first time and counts nothing.
  claim_public_opening: { kind: command, operation: claimPublicOpening, idempotent_by_design: true }
  set_a2a_endpoint: { kind: command, operation: setA2aEndpoint, idempotent_by_design: true }
  delete_a2a_endpoint: { kind: command, operation: deleteA2aEndpoint, idempotent_by_design: true }
  # M7 step 13 (Proposed): a nudge endpoint proves control by answering one signed challenge. Safe to retry: a verified
  # endpoint answers as verified and sends nothing, and each challenge counts against a cap for its signing secret.
  verify_a2a_endpoint: { kind: command, operation: verifyA2aEndpoint, idempotent_by_design: true }
  # Managed repositories (M5 step 6). Safe to retry: one live token per agent and task, and a repeat gets the held one.
  # It keeps no idempotency record, because a stored answer would be a second copy of the token. The gateway lists it only
  # while its MANAGED_REPOSITORIES is on, and the API answers not_found while its own is off.
  get_repo_access: { kind: command, operation: getRepoAccess, idempotent_by_design: true }
  # M5 step 7b. Listed by the gateway only while managed repositories are switched on.
  merge_task: { kind: command, operation: mergeTask }
  # M5 step 8. Listed by the gateway only while managed repositories are switched on. M6 step 7 added the release beside
  # checks and merge, in its answer only: still a query, and nothing it reads deploys or reaches a host.
  get_task_release_status: { kind: query, operation: getTaskReleaseStatus }
  # M6 step 6, 6g (ADR 0010's `deploy_release`): an agent asks for a release of a task's merged commit, through the person's
  # route. Listed by the gateway, as an MCP tool and the A2A skill DeployRelease, only while the API answers the release
  # routes, which the gateway reads from the API, never from a variable of its own. The room decides every call: a live
  # `deploy` grant, never through a public claim (decision 159), and the person who controls the agent recorded with the
  # release and rechecked on every pass. While the release path isn't complete it answers `release_not_available`.
  deploy_release: { kind: command, operation: requestRelease }

# Operations that aren't agent capabilities: dashboard actions for people, plus getAgent, listAgentRooms, readAgentInbox,
# getAgentParticipationPolicy, getAgentA2aEndpoint, setAgentA2aEndpoint and deleteAgentA2aEndpoint, which are also open to the
# agent itself. The agent's own A2A endpoint capabilities use /v1/inbox/a2a-endpoint instead. setAgentParticipationPolicy is
# not: only a person who administers the agent's organization sets it. These are safe to retry without a key: acceptInvitation,
# withdrawAgent, consentToAgentReturn, registerAgent, disconnectAgent, reconnectAgent and setAgentParticipationPolicy, which
# is idempotent by design: it sets a whole value, and is audited on the agent's Principal with no event or outbox, as
# setAgentA2aEndpoint is, because it's the agent's own configuration and not room state.
person_only:
  # M5 step 2. get_repo_access, merge_task and get_task_release_status aren't listed anywhere yet: each arrives with the
  # step that builds it, so no agent sees a merge tool before the merge path exists (AC-17).
  - getRepository
  # M5 step 4: a person who is the room's owner or a room admin asks for the repository and retries its setup. Every
  # organization holds the provisioning delegation unless a Podster operator took it back (the owner's decision of
  # 2026-11-11). No agent asks for, retries or delegates anything.
  - requestRepository
  - retryRepositorySetup
  - getProvisioningDelegation
  - setProvisioningDelegation
  # M5 step 5b. Grants on the room's repository are given and taken back by people. An agent learns of its grant only
  # through a token, from step 6.
  # M6 step 2 (ADR 0010): the contract and the state only. Every one answers as a missing route while release is switched
  # off, which is everywhere. deploy_release, which reaches requestRelease alone, arrived with 6g; no capability reaches
  # anything else of release (AC-17). get_task_release_status gained the release's fields with step 7, and nothing that
  # deploys.
  - getReleaseConfig
  - setReleaseConfig
  # M6 step 10(b): the room's releases awaiting approval, for a person's Needs attention. Person-only, as approving is.
  - listReleaseApprovals
  # M6 step 6: requestRelease is a person's and, since 6g, the `deploy_release` capability's, so it is listed there.
  - approveRelease
  - declineRelease
  # M6 step 6, 6h: a person asks to roll back to an earlier release, its own record, approved as any release is.
  - rollbackRelease
  - getAppHostname
  - requestAppHostname
  - removeAppHostname
  # S4 of the store plan: deleting an app's data, the room's owner's as a person, and an operator's.
  - deleteAppData
  - createAppReport
  - suspendApp
  - liftAppSuspension
  - deleteAppDataAsOperator
  # M6 step 6, 6f's open item 3: an operator retires a room's label another room's lookup row holds.
  - retireAppLabel
  - suspendAppHost
  - liftAppHostSuspension
  - stopContentDomain
  - resumeContentDomain
  - listTakedownFindings
  - getReleaseDelegation
  - setReleaseDelegation
  - listRepositoryGrants
  - grantRepositoryAction
  - revokeRepositoryGrant
  - getPublicClaims
  - setPublicClaimsPaused
  - endPublicClaims
  - createReport
  - listReports
  # M5 step 7b: an operator rechecks a degraded repository link.
  - recheckRepository
  - suspendRoomPublicSurface
  - suspendRoomByReport
  - liftRoomByReport
  - liftRoomSuspension
  - suspendAgentPublicClaims
  - liftAgentPublicClaimsSuspension
  - blockOrgFromPublicClaims
  - unblockOrgFromPublicClaims
  - getAgentParticipationPolicy
  - setAgentParticipationPolicy
  - getAgentA2aEndpoint
  - setAgentA2aEndpoint
  - deleteAgentA2aEndpoint
  # M7 step 13 (Proposed): the admin's challenge of the agent's nudge endpoint, also open to the agent itself, and the
  # owner's opt-in and its audit, which only a person who administers the agent's organization reads or sets.
  - verifyAgentA2aEndpoint
  - getAgentA2aNudge
  - setAgentA2aNudge
  - removeFile
  - listWorkspaceCards
  - getWorkspaceCard
  - getCollaboration
  - listHandoffs
  - addPlannedRelationship
  - removePlannedRelationship
  - defineOutput
  - updateOutput
  - removeOutput
  - setReviewPolicy
  - getRoomVisibility
  - setRoomVisibility
  - setRoomTopic
  - createRole
  - updateRole
  - closeRole
  - inviteToRole
  - withdrawRoleInvite
  - endRoleClaim
  - setWorkspaceBrief
  - setMemberAccess
  - transferOwner
  - recoverOwner
  - listOwnerlessRooms
  - readAgentInbox
  - createWorkspace
  - addMember
  - revokeMember
  - revokeOrganization
  - renameWorkspace
  - archiveWorkspace
  - unarchiveWorkspace
  - listInvitations
  - previewInvitation
  - listAgentRooms
  - listOversightRooms
  - listOverseenTasks
  - getOverseenTask
  - listOverseenMessages
  - changeMemberRole
  - listEvents
  - listDenials
  - listAudit
  - clearRemoval
  - recordOrgDeparture
  - acceptInvitation
  - createInvitation
  - withdrawInvitation
  # Decision 239: leaving a room is a person's own act; an agent leaves through its owner's withdrawal.
  - leaveWorkspace
  - withdrawAgent
  - consentToAgentReturn
  - getAgent
  - registerAgent
  - disconnectAgent
  - reconnectAgent
  - getOverseenFile
  # M7 step 5(a): a person starts, reads, confirms and cancels a Runner pairing session. Never an agent's: pairing is a
  # person's consent, and agent text can't stand in for it.
  - startPairing
  - getPairing
  - activatePairing
  - cancelPairing
# Not a call an agent makes through a tool: raw bytes. An upload goes to the path `create_upload` returned, with its token. A download goes to
# the path `get_asset_link` returned, with the caller's own credential or session.
transfer_only:
  - putUploadBytes
  - downloadFile
# Not a call a person or an agent makes at all: the gateway sends it for a provider, after verifying the provider's signature on a webhook
# delivery, with an assertion that names no one. It is never a capability or a tool.
provider_only:
  - receiveGithubDelivery
# Not a call a person or an agent makes: the gateway sends it for Runner's pairing redemption (M7 step 5), after verifying
# a proof signed by the submitted key, with an assertion that names no one. It is never a capability or a tool.
pairing_only:
  - redeemPairing
# Not a call a person or an agent makes: the gateway's cron, a service, sends it for the pairing expiry sweep (M7 step 5(c),
# ruling L1 on #453), with an assertion naming only the person whose own list of sessions it reads or settles. Never a
# capability or a tool, and a person's assertion never reaches it.
service_only:
  - sweepPairings
  - settlePairingSweep
# What an `/a2a` token reaches (docs/spec/A2A-PROFILE.md), and nothing else: each A2A method or lifecycle-extension method,
# and the one capability it calls, as the agent the token names. The gateway's A2A_CAPABILITIES is exactly these
# capabilities, and a gateway test holds the two together, so the token's reach changes only with this list. Policy and the
# state machine decide every call, as for MCP. ClaimRole, GetRepoAccess and SubmitTask's commit and pull request were added
# for the engineer's steps on 2026-11-14. GetRepoAccess, like get_repo_access, exists only while managed repositories are on.
# DeployRelease (M6 step 6, 6g), like deploy_release, exists only while the API answers the release routes.
a2a:
  GetTask: get_task
  ListTasks: [list_workspaces, list_tasks, get_task]
  SendMessage: send_message
  podster.lifecycle.v1.AcceptTask: accept_task
  podster.lifecycle.v1.DeclineTask: decline_task
  podster.lifecycle.v1.ReleaseTask: release_task
  podster.lifecycle.v1.SubmitTask: submit_task
  podster.lifecycle.v1.ClaimRole: claim_role
  podster.lifecycle.v1.GetRepoAccess: get_repo_access
  podster.lifecycle.v1.DeployRelease: deploy_release
