# Agent capabilities, on Agent Auth and hosted MCP. `kind` is the CQRS side.
# Commands carry an idempotency key, except where noted. Status: proposed.
capabilities:
  get_identity: { kind: query, operation: getMe }
  list_workspaces: { kind: query, operation: listWorkspaces }
  get_workspace: { kind: query, operation: getWorkspace }
  get_workroom_brief: { kind: query, operation: getWorkspaceBrief }
  list_activity: { kind: query, operation: listActivity }
  list_role_openings: { kind: query, operation: listRoles }
  claim_role: { kind: command, operation: claimRole }
  release_role: { kind: command, operation: releaseRole }
  create_task: { kind: command, operation: createTask }
  create_upload: { kind: command, operation: createUpload }
  get_asset_link: { kind: query, operation: getFile }
  list_assets: { kind: query, operation: listFiles }
  link_asset: { kind: command, operation: linkFile }
  unlink_asset: { kind: command, operation: unlinkFile }
  list_tasks: { kind: query, operation: listTasks }
  get_task: { kind: query, operation: getTask }
  list_outputs: { kind: query, operation: listOutputs }
  list_output_versions: { kind: query, operation: listOutputVersions }
  set_task_output: { kind: command, operation: setTaskOutput }
  get_plan: { kind: query, operation: getPlan }
  set_task_plan: { kind: command, operation: setTaskPlan }
  update_task: { kind: command, operation: updateTask }
  set_reviewer: { kind: command, operation: setReviewer }
  set_requester: { kind: command, operation: setRequester }
  assign_task: { kind: command, operation: assignTask }
  accept_task: { kind: command, operation: acceptTask }
  decline_task: { kind: command, operation: declineTask }
  release_task: { kind: command, operation: releaseTask }
  send_message: { kind: command, operation: sendMessage }
  list_messages: { kind: query, operation: listMessages }
  submit_task: { kind: command, operation: submitTask }
  request_changes: { kind: command, operation: requestChanges }
  verify_task: { kind: command, operation: verifyTask }
  cancel_task: { kind: command, operation: cancelTask }
  # Plain read_inbox is a query. With ack: true it's the documented command exception.
  read_inbox: { kind: query, operation: readInbox }
  ack_inbox: { kind: command, operation: ackInbox, idempotent_by_design: true }
  set_wake: { kind: command, operation: setWake, idempotent_by_design: true }
  delete_wake: { kind: command, operation: deleteWake, idempotent_by_design: true }
  get_a2a_endpoint: { kind: query, operation: getA2aEndpoint }
  # The public read surface (M4 step 7). Every caller gets the same view, and nothing here grants anything in a room.
  get_public_workroom: { kind: query, operation: getPublicWorkroom }
  discover_workrooms: { kind: query, operation: explorePublicWorkrooms }
  # Safe to retry: asking again for the claim the agent holds answers as the first time and counts nothing.
  claim_public_opening: { kind: command, operation: claimPublicOpening, idempotent_by_design: true }
  set_a2a_endpoint: { kind: command, operation: setA2aEndpoint, idempotent_by_design: true }
  delete_a2a_endpoint: { kind: command, operation: deleteA2aEndpoint, idempotent_by_design: true }
  # Managed repositories (M5 step 6). Safe to retry: one live token per agent and task, and a repeat gets the held one.
  # It keeps no idempotency record, because a stored answer would be a second copy of the token. The gateway lists it only
  # while its MANAGED_REPOSITORIES is on, and the API answers not_found while its own is off.
  get_repo_access: { kind: command, operation: getRepoAccess, idempotent_by_design: true }
  # M5 step 7b. Listed by the gateway only while managed repositories are switched on.
  merge_task: { kind: command, operation: mergeTask }
  # M5 step 8. Listed by the gateway only while managed repositories are switched on.
  get_task_release_status: { kind: query, operation: getTaskReleaseStatus }

# Operations that aren't agent capabilities: dashboard actions for people, plus getAgent, listAgentRooms, readAgentInbox,
# getAgentParticipationPolicy, getAgentA2aEndpoint, setAgentA2aEndpoint and deleteAgentA2aEndpoint, which are also open to the
# agent itself. The agent's own A2A endpoint capabilities use /v1/inbox/a2a-endpoint instead. setAgentParticipationPolicy is
# not: only a person who administers the agent's organization sets it. These are safe to retry without a key: acceptInvitation,
# withdrawAgent, consentToAgentReturn, registerAgent, disconnectAgent, reconnectAgent and setAgentParticipationPolicy, which
# is idempotent by design: it sets a whole value, and is audited on the agent's Principal with no event or outbox, as
# setAgentA2aEndpoint is, because it's the agent's own configuration and not room state.
person_only:
  # M5 step 2. get_repo_access, merge_task and get_task_release_status aren't listed anywhere yet: each arrives with the
  # step that builds it, so no agent sees a merge tool before the merge path exists (AC-17).
  - getRepository
  # M5 step 4: a person who is the room's owner or a room admin asks for the repository and retries its setup. Every
  # organization holds the provisioning delegation unless a Podster operator took it back (the owner's decision of
  # 2026-11-11). No agent asks for, retries or delegates anything.
  - requestRepository
  - retryRepositorySetup
  - getProvisioningDelegation
  - setProvisioningDelegation
  # M5 step 5b. Grants on the room's repository are given and taken back by people. An agent learns of its grant only
  # through a token, from step 6.
  # M6 step 2 (ADR 0010): the contract and the state only. Every one answers as a missing route while release is switched
  # off, which is everywhere. deploy_release isn't listed anywhere yet, and get_task_release_status gains nothing: each
  # arrives with the step that builds it, so no agent sees a deploy tool before the release path exists (AC-17).
  - getReleaseConfig
  - setReleaseConfig
  - approveRelease
  - getAppHostname
  - requestAppHostname
  - removeAppHostname
  - createAppReport
  - suspendApp
  - liftAppSuspension
  - suspendAppHost
  - liftAppHostSuspension
  - stopContentDomain
  - resumeContentDomain
  - listRepositoryGrants
  - grantRepositoryAction
  - revokeRepositoryGrant
  - getPublicClaims
  - setPublicClaimsPaused
  - endPublicClaims
  - createReport
  - listReports
  # M5 step 7b: an operator rechecks a degraded repository link.
  - recheckRepository
  - suspendRoomPublicSurface
  - suspendRoomByReport
  - liftRoomByReport
  - liftRoomSuspension
  - suspendAgentPublicClaims
  - liftAgentPublicClaimsSuspension
  - blockOrgFromPublicClaims
  - unblockOrgFromPublicClaims
  - getAgentParticipationPolicy
  - setAgentParticipationPolicy
  - getAgentA2aEndpoint
  - setAgentA2aEndpoint
  - deleteAgentA2aEndpoint
  - removeFile
  - listWorkspaceCards
  - getWorkspaceCard
  - getCollaboration
  - listHandoffs
  - addPlannedRelationship
  - removePlannedRelationship
  - defineOutput
  - updateOutput
  - removeOutput
  - setReviewPolicy
  - getRoomVisibility
  - setRoomVisibility
  - setRoomTopic
  - createRole
  - updateRole
  - closeRole
  - inviteToRole
  - withdrawRoleInvite
  - endRoleClaim
  - setWorkspaceBrief
  - setPlanStart
  - setMemberAccess
  - transferOwner
  - recoverOwner
  - listOwnerlessRooms
  - readAgentInbox
  - createWorkspace
  - addMember
  - revokeMember
  - revokeOrganization
  - renameWorkspace
  - archiveWorkspace
  - unarchiveWorkspace
  - listInvitations
  - previewInvitation
  - listAgentRooms
  - listOversightRooms
  - listOverseenTasks
  - getOverseenTask
  - listOverseenMessages
  - changeMemberRole
  - listEvents
  - listDenials
  - listAudit
  - clearRemoval
  - recordOrgDeparture
  - acceptInvitation
  - createInvitation
  - withdrawInvitation
  - withdrawAgent
  - consentToAgentReturn
  - getAgent
  - registerAgent
  - disconnectAgent
  - reconnectAgent
  - getOverseenFile
# Not a call an agent makes through a tool: raw bytes. An upload goes to the path `create_upload` returned, with its token. A download goes to
# the path `get_asset_link` returned, with the caller's own credential or session.
transfer_only:
  - putUploadBytes
  - downloadFile
# Not a call a person or an agent makes at all: the gateway sends it for a provider, after verifying the provider's signature on a webhook
# delivery, with an assertion that names no one. It is never a capability or a tool.
provider_only:
  - receiveGithubDelivery
