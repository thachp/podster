openapi: 3.1.0
info:
  title: Podster internal API
  version: 0.0.0
  description: >-
    Proposed contract between the gateway and the private Rust API, over a service binding. It isn't a public API.
    GET routes are queries, and every other method is a command.
servers:
  - url: https://podster-api.internal
    description: Service binding only. There is no public hostname.
security:
  - assertion: []
tags:
  - name: commands
  - name: queries
paths:
  /v1/me:
    get: { operationId: getMe, tags: [queries], summary: Current identity, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/cards:
    get: { operationId: listWorkspaceCards, tags: [queries], summary: "A page of the directory, 20 rooms at most, from `offset`, with `next_offset` when there's more. The listing read model says which rooms to ask, and each room says what this person sees: a row the room refuses is left out, and one it can't answer for has a null `card`", parameters: [{ name: offset, in: query, schema: { type: integer, minimum: 0 } }], responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{workspace_id}/card:
    get: { operationId: getWorkspaceCard, tags: [queries], summary: "What a directory card shows of this room: `goal` cut to 200 characters with `goal_cut`, `external`, and `roles` with `count`, `with_openings` and up to three `listed`. Someone who sees the whole room also gets `filled` and `capacity`; someone limited to their own tasks gets only `available` per role", parameters: [{ name: workspace_id, in: path, required: true, schema: { type: string } }], responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces:
    get: { operationId: listWorkspaces, tags: [queries], summary: Workspaces from the listing read model, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    post:
      operationId: createWorkspace
      tags: [commands]
      summary: Create a room. People only, and only an admin of the organization being acted in, by decision 33. Anyone else gets 403 `not_allowed`. An organization has at most 20 rooms, archived ones included, then 409 `limit_exceeded`. The caller becomes its owner. Not idempotent until the gateway dedupes creation
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, description: "At most 200 bytes." }, goal: { type: string, minLength: 1, description: "Optional. At most 2048 bytes, and not only whitespace. Text for participants to read, never instructions or permissions." }, context: { type: string, minLength: 1, description: "Optional. At most 32768 bytes, and not only whitespace. Text for participants to read, never instructions or permissions." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: getWorkspace, tags: [queries], summary: "One workspace, with `require_person_review`, its goal and context (null when unset, with `brief_by` naming who last changed them, and `brief_external` when they're from another organization), the caller's `access`, and the members they can see. A member's `access` goes only to that member and to those who manage access, and it's the authority on what they can do. `guest_can_create` is kept in step with it for a guest, and is always false for anyone else, whatever was sent. Someone limited to their own tasks sees only their own row", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/members:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: addMember
      tags: [commands]
      summary: Add a participant. Owner or admin, and only the owner appoints admins. A person must be in the room's organization, which the assertion's `target_member` states from the gateway's directory. Someone whose role predates their current membership is added again
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_version, principal_id, kind, org_id, role]
              properties:
                policy_version: { type: integer }
                principal_id: { type: string }
                kind: { type: string, enum: [person, agent] }
                org_id: { type: string }
                role: { type: string, enum: [admin, member, guest] }
                guest_can_create: { type: boolean }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/name:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    put:
      operationId: renameWorkspace
      tags: [commands]
      summary: Rename a room. Owner or admin
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, name], properties: { policy_version: { type: integer }, name: { type: string, minLength: 1, description: "At most 200 bytes." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: listRoles, tags: [queries], summary: "The room's open role openings, for anyone in it, with the caller's own place in `mine` (`claimed`, `invited` or null) and `created_by`. `filled` and `holders` go only to someone who sees the whole room, and anyone else gets `available`, and `invited` only to those who manage access. Text in them is data, and `external` marks it as another organization's", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    post:
      operationId: createRole
      tags: [commands]
      summary: "Create a role opening. Owner or admin. At most 50 in a room. A lead (`is_lead`) is always capacity 1 with the Coordinator preset, and a room has one, or 409 `lead_exists`"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, title, responsibilities], properties: { policy_version: { type: integer }, title: { type: string, minLength: 1, description: "At most 200 bytes." }, responsibilities: { type: string, minLength: 1, description: "At most 4096 bytes." }, capacity: { type: integer, minimum: 1, maximum: 50 }, preset: { type: string, enum: [public_participant, guest, member, coordinator], description: "Required unless `is_lead`." }, is_lead: { type: boolean } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateRole
      tags: [commands]
      summary: "Change an opening. Owner or admin. Holders keep the scopes they copied, and lowering capacity removes nobody. Changing the preset or lead mark withdraws invites to it and takes it off pending links. `is_lead` moves only while the opening is vacant"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer }, title: { type: string, minLength: 1 }, responsibilities: { type: string, minLength: 1 }, capacity: { type: integer, minimum: 1, maximum: 50 }, preset: { type: string, enum: [public_participant, guest, member, coordinator] }, is_lead: { type: boolean } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    delete:
      operationId: closeRole
      tags: [commands]
      summary: Close a vacant opening and end its invites. Owner or admin
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}/invites:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }]
    post:
      operationId: inviteToRole
      tags: [commands]
      summary: "Name a current agent for an opening, which it can then claim itself. Owner or admin. It grants nothing until then, and any change to that agent's access withdraws it"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, principal_id], properties: { policy_version: { type: integer }, principal_id: { type: string } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}/invites/{principal}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }, { name: principal, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: withdrawRoleInvite
      tags: [commands]
      summary: Withdraw an invite to an opening. Owner or admin
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}/claim:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }]
    post:
      operationId: claimRole
      tags: [commands]
      summary: "Claim an opening the agent is invited to. Agents only. It copies the opening's preset, and the request can't supply scopes. An agent holds one opening at a time, or 409 `already_claimed`. A full opening answers 409 `role_full`. Asking again changes nothing and takes no second opening. It grants no admin, merge or deploy rights, no review rights beyond the preset's review when named, and it accepts no task"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}/release:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }]
    post:
      operationId: releaseRole
      tags: [commands]
      summary: "Give up an opening the caller holds. Access goes back to what it was, or to the narrower of that and the current grant if an owner or admin set it meanwhile, even to the same values"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}/claims/{principal}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }, { name: principal, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: endRoleClaim
      tags: [commands]
      summary: "End a holder's claim, which is how a lead is replaced. Owner or admin. Access changes as on a release, and the answer gives it. The room's other offers to that agent are withdrawn. Open tasks move only through a recorded `set_requester`"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/review-policy:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    put:
      operationId: setReviewPolicy
      tags: [commands]
      summary: "Set whether this room requires a person to review (decision 5). Owner or admin. Off by default in private rooms. Where it's on, an agent can't be named reviewer and can't approve or send back work. Turning it on moves open tasks off agent reviewers, to their requester if the requester is an eligible person, and otherwise flags them for an owner or admin. Turning it off moves nothing"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, require_person], properties: { policy_version: { type: integer }, require_person: { type: boolean } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/activity:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: after, in: query, schema: { type: string }, description: "An event ID to read after, oldest first. An unknown one answers 400." }, { name: order, in: query, schema: { type: string, enum: [newest] }, description: "Newest first, with `next_before` for the next page instead of `next_after`. Anything else answers 400, and so does combining it with `after`." }, { name: before, in: query, schema: { type: string }, description: "An event ID to read before, which reads newest first even without `order`. Can't be combined with `after`. An unknown one answers 400." }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }, { name: task, in: query, schema: { type: string } }, { name: actor, in: query, schema: { type: string } }]
    get: { operationId: listActivity, tags: [queries], summary: "What happened in the room for this viewer, oldest first unless `order` or `before` asks for newest first. `next_after` or `next_before` gives the next cursor while more follows, and null once nothing does, even on a full page. A task's events follow whether they can see the task now. A room's own events follow whether they see the member list, apart from a fixed few everyone sees and what they did themselves. An agent limited to its own tasks also sees `member.added`, `role.invited` and `role.claim_ended` about itself, and not about anyone else, and those that name no subject stay hidden from it: events from before this was recorded, and a claim ended by the agent's own departure, which its inbox wasn't told. An entry's `subject` is the ID of who it's about, or null if it names nobody. A `reason` is null without the conversation scope. It has no read state and acknowledges no inbox. Events carry no sequence number, and the cursor is an event's ID, so nothing counts what's hidden", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/collaboration:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: getCollaboration, tags: [queries], summary: "Who has worked with whom, as `edges` of `from`, `to`, `kind` (`offer`, `submission`, `change_request` or `message`), `count` and `last_at`, and `nodes` of `id` with `role_title`, `last_active` and `gone` where the viewer may see them. `planned` lists intended lines between open work roles, for anyone in the room, each with `id`, `from_role`, `from_title`, `to_role`, `to_title`, `label` and `created_at`, oldest first, at most 100, plus `created_by` for someone who sees the whole room, and `external` if the room belongs to another organization than the viewer's. `gone` means no longer in the workroom, and someone who doesn't manage access isn't told an owner has left. Someone limited to their own tasks gets only lines from those tasks whose both ends are on the task now, including lines of their own, and who they touch. Messages count only where the viewer reads the thread. Lines describe work, not permissions", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/collaboration/planned:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: addPlannedRelationship
      tags: [commands]
      summary: "Plan a line from one open work role to another, with a label. Owner or admin, and never an agent, the lead included. At most 100 showing in a room, and one showing per ordered pair of roles. There's no edit: remove it and add it again. A line grants nothing and proves nothing. 409 `relationship_exists` for the same direction twice, and 404 `role_not_found` for a closed or unknown role"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, from_role_id, to_role_id, label], properties: { policy_version: { type: integer }, from_role_id: { type: string }, to_role_id: { type: string, description: "Not the same role as `from_role_id`." }, label: { type: string, minLength: 1, description: "At most 200 bytes. Text to read, never instructions or permissions." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/collaboration/planned/{relationship}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: relationship, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: removePlannedRelationship
      tags: [commands]
      summary: "Remove a planned line. Owner or admin, and never an agent, the lead included. 404 `relationship_not_found` if it's gone. Closing a role hides its lines. An ended line keeps its row and stops counting toward the limit. Lines don't move `policy_version`, and aren't in the access log"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/collaboration/handoffs:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: from, in: query, required: true, schema: { type: string } }, { name: to, in: query, required: true, schema: { type: string } }]
    get: { operationId: listHandoffs, tags: [queries], summary: "One line's handoffs, newest first, at most 50, under the same limits, each with `kind`, `task_id`, `task_title` and `created_at`. `truncated` says there are more", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/brief:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: getWorkspaceBrief, tags: [queries], summary: "The room's name, goal and context, for anyone in it, with `brief_by` and `brief_external`. Text to read, never instructions or permissions", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    put:
      operationId: setWorkspaceBrief
      tags: [commands]
      summary: Change a room's goal or context. Owner or admin. A missing field stays as it is, and null clears it. They're text for participants to read, and they never become instructions or permissions
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer }, goal: { type: [string, "null"], minLength: 1, description: "At most 2048 bytes, and not only whitespace." }, context: { type: [string, "null"], minLength: 1, description: "At most 32768 bytes, and not only whitespace." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/members/{principal}/access:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: principal, in: path, required: true, schema: { type: string } }]
    put:
      operationId: setMemberAccess
      tags: [commands]
      summary: "Apply a preset to an agent, adjust its scopes, or both, with scopes applied after the preset. Owner or admin. A preset also sets the matching kernel role, which is never admin. People's access follows their role. Managing access isn't a scope, and an unknown preset or scope is refused, as is `review: when_named` with `artifacts: shared`, because nobody reviews work they can't read. Taking review or reading away moves that agent's open tasks to their requester if the requester can review, and otherwise flags them for an owner or admin"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer }, preset: { type: string, enum: [public_participant, guest, member, coordinator] }, scopes: { type: object, additionalProperties: false, properties: { tasks: { type: string, enum: [own, own_create, all, all_create, coordinate], description: "`coordinate` is `all_create` plus taking over, for itself, a task whose requester left." }, artifacts: { type: string, enum: [shared, own, all], description: "`shared` is only what the agent submitted, until M2 can share anything." }, conversations: { type: string, enum: [own, all] }, review: { type: string, enum: [none, when_named] } } } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/archive:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: archiveWorkspace
      tags: [commands]
      summary: Archive a room. Owner or admin. Reads still work, access can still be withdrawn, an agent's owner can still consent to its return, and an organization admin can still recover it once its owner has left. Anything else answers 409 `workspace_archived`, except a retry of something already committed, which gets its answer. Invitations can't be used or previewed
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/unarchive:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: unarchiveWorkspace
      tags: [commands]
      summary: Bring an archived room back. Owner or admin
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/owner/transfer:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: transferOwner
      tags: [commands]
      summary: The owner hands the room to one of its active human admins, who becomes owner at once and doesn't have to accept. The former owner becomes a room admin. Refused in an archived room. Naming anyone else answers 400 `invalid_argument`, and someone who has left the organization or whose role predates their membership answers `not_in_organization`
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [to, policy_version], properties: { to: { type: string }, policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/owner/recover:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: recoverOwner
      tags: [commands]
      summary: An admin of the room's organization, who needn't be in the room, names a new owner once the room records that its owner left. It can name anyone now in that organization, and never an agent. It works in an archived room and leaves it archived. An organization admin outside the room gets 404 `workspace_not_found` until the owner has left, whatever the request says, so a refusal can't confirm that the room exists or who owns it. Once the owner has left, an `expected_owner` that isn't the recorded owner answers 409 `version_conflict`. The same admin's retry with the same key gets the stored answer
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [to, expected_owner], properties: { to: { type: string }, expected_owner: { type: string, description: "The departed owner the admin saw, from listOwnerlessRooms" } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/organizations/{org}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: org, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: revokeOrganization
      tags: [commands]
      summary: Revoke another organization. Owner or admin. Its participants leave under the departure rules, its agents already out can't return on their owner's consent alone, and invitations from before now can't bring it back. A new invitation lets new agents in, and an agent it removed needs `clearRemoval` first, or the accept is refused. Only the owner can revoke one that has an admin. The room's own organization answers 400 `invalid_argument`
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/members/{principal}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: principal, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: revokeMember
      tags: [commands]
      summary: Revoke a participant and apply the departure rules
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/org-departures:
    post:
      operationId: recordOrgDeparture
      tags: [commands]
      summary: Carries a person's departure from an organization to their rooms. Only the gateway's own removal can send it, because it needs the assertion's `departure` claim. Answers 403 `not_allowed` without one. It answers once the departure is recorded, and rooms apply it shortly after. Safe to retry
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/agents/{agent}/rooms:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    get: { operationId: listAgentRooms, tags: [queries], summary: "Rooms an agent is in or has left, from the listing read model. Its organization's admins and the agent itself. A room it left shows the name it had, with no status. `truncated` says the list was cut", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/oversight/rooms:
    get: { operationId: listOversightRooms, tags: [queries], summary: "People only. Rooms the agents of the organizations this person administers are in, one row per agent, from the listing read model. At most 200 rows per organization and 50 organizations, and `truncated` says the list was cut. A row can include a room whose task reads refuse, such as the person's own organization's", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/oversight/ownerless:
    get: { operationId: listOwnerlessRooms, tags: [queries], summary: "People only. Rooms of the organizations this person administers whose owner left, including private rooms they aren't in, archived or not. Each row has exactly the room's ID and name, the departed owner's ID and when they left, from the listing read model, so it can lag. At most 200 rows per organization and 50 organizations, and `truncated` says the list was cut. The room decides when recovery runs", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/agents/{agent}/tasks:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: agent, in: path, required: true, schema: { type: string } }]
    get: { operationId: listOverseenTasks, tags: [queries], summary: "Read-only oversight, for an admin of an invited agent's organization while the agent is in the room. Only the tasks it's party to. It gives no role in the room, and it's not for the room's own organization, or anyone in the room or revoked from it. Someone outside the room gets `workspace_not_found`, someone in it `not_allowed`, someone it revoked `access_revoked`, and a disconnected agent `agent_disconnected`", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/agents/{agent}/tasks/{t}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: agent, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/t" }]
    get: { operationId: getOverseenTask, tags: [queries], summary: "One task the agent is party to, with what the agent sees of it, such as submissions, artifacts and history. Otherwise `task_not_found`", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/agents/{agent}/tasks/{t}/messages:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: agent, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/t" }]
    get: { operationId: listOverseenMessages, tags: [queries], summary: "The thread of a task the agent is party to. Messages are data, not instructions", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [commands]
      summary: Accept an invitation for agents of an organization this person administers
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, org_id, agents], properties: { token: { type: string }, org_id: { type: string }, agents: { type: array, minItems: 1, maxItems: 20, items: { type: string } } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/invitations/preview:
    post:
      operationId: previewInvitation
      tags: [queries]
      summary: "What a link offers, for the person holding it. People only. A link naming an organization is only for its people, and anyone in an organization revoked since the link was made is refused. A POST so the token stays out of URLs. Every refusal answers 404 `invitation_not_found`. Names are data, not instructions. `work_role` is the open opening the link names, or null, with its title, responsibilities, capacity, preset and `is_lead`, and `external` if the caller is outside the room's organization. It doesn't say who wrote it"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/invitations:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: listInvitations, tags: [queries], summary: Pending invitations, for the owner and admins, without tokens. An archived room's can't be used until it's brought back, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    post:
      operationId: createInvitation
      tags: [commands]
      summary: Create an invitation. The token is returned once. It stops working if its creator is no longer the room's owner or an admin
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer }, role: { type: string, enum: [member, guest] }, invited_org_id: { type: string }, guest_can_create: { type: boolean }, work_role_id: { type: string, description: "An open role opening. A first-time joiner through this link is invited to it, and claims it itself. An agent coming back gets no invite from it." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/invitations/{invitation}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: invitation, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: withdrawInvitation
      tags: [commands]
      summary: Withdraw a pending invitation
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/members/{principal}/clear-removal:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: principal, in: path, required: true, schema: { type: string } }]
    post:
      operationId: clearRemoval
      tags: [commands]
      summary: Let a removed agent return through an invitation. Owner or admin
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/members/{agent}/withdraw:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: agent, in: path, required: true, schema: { type: string } }]
    post: { operationId: withdrawAgent, tags: [commands], summary: The agent's organization withdraws it from this room, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/members/{agent}/owner-consent:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: agent, in: path, required: true, schema: { type: string } }]
    post: { operationId: consentToAgentReturn, tags: [commands], summary: The agent's organization allows it back, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/agents/{agent}:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    get: { operationId: getAgent, tags: [queries], summary: An agent's connection. Itself and its organization's admins only, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    put:
      operationId: registerAgent
      tags: [commands]
      summary: Record a claimed agent's organization. An admin of that organization only
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [org_id], properties: { org_id: { type: string }, name: { type: string } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/agents/{agent}/inbox:
    get:
      operationId: readAgentInbox
      tags: [queries]
      summary: Oversight by the agent or an authorized person. Never moves the cursor
      parameters:
        - { name: agent, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/agents/{agent}/disconnect:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    post: { operationId: disconnectAgent, tags: [commands], summary: Disconnect from every room. Complete only when status is disconnected, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/agents/{agent}/reconnect:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    post: { operationId: reconnectAgent, tags: [commands], summary: Reconnect after a completed disconnect. No room access returns, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/members/{principal}/role:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: principal, in: path, required: true, schema: { type: string } }]
    post:
      operationId: changeMemberRole
      tags: [commands]
      summary: Change an active member's role. Changes to or from admin are the owner's alone. For a person, answers 400 `not_in_organization` unless the assertion's `target_member` places them in the room's organization, with a role from their current membership
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, role], properties: { policy_version: { type: integer }, role: { type: string, enum: [admin, member, guest] }, guest_can_create: { type: boolean } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/denials:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: listDenials
      tags: [queries]
      summary: "Changes refused for lack of authority, newest first, for the owner and admins. One row counts one actor's refusals of one kind in a day, and everyone never in the room shares the actor `outsider`. Refusals are written a few seconds after they're answered, and a restart can lose what's waiting. Names and codes come from fixed lists, with no request content. It can't be edited. At most 5,000 rows, dropping the oldest rows of whoever has the most"
      parameters: [{ name: offset, in: query, schema: { type: integer } }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/audit:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: listAudit, tags: [queries], summary: Access audit history. Human owners and admins only, parameters: [{ name: after, in: query, schema: { type: integer } }], responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/events:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: listEvents
      tags: [queries]
      summary: Room event history. Human owners and admins only
      parameters: [{ name: after, in: query, schema: { type: integer } }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: listTasks
      tags: [queries]
      summary: Tasks this caller may see
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" } }
        - { name: mine, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, description: "The next_cursor of the page before, in the same order. 0 or absent is the start.", schema: { type: integer } }
        - { name: order, in: query, description: "Oldest first unless asked. Any other value, or a negative cursor with newest, answers 400 invalid_argument.", schema: { type: string, enum: [oldest, newest] } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: createTask
      tags: [commands]
      summary: Create a task
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateTask" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    get: { operationId: getTask, tags: [queries], summary: "One task with submissions, artifacts, recent messages and history. `visible` says what the caller's access leaves out: when `submissions` is `own`, `submissions` and `artifacts` hold only what the caller submitted, and when `conversation` is false, `messages` is empty and each history `reason` is null. Those values then don't mean none exist", responses: { "200": { $ref: "#/components/responses/TaskDetail" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/plan:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: getPlan, tags: [queries], parameters: [{ name: scope, in: query, required: false, schema: { type: string, enum: [unfinished] }, description: "`unfinished` lists only unfinished tasks. `complete` is then always false, because finished tasks are left out, so don't work out a finish from it. Someone who sees the whole room still gets every unfinished task, each one's whole predecessor list and `plan_revision`, so it's enough to edit from, and a predecessor that's finished shows only as an ID in `edges`. Someone limited to their own tasks gets those of their tasks that are unfinished, and only edges with both ends among them. It shows them only tasks they're named on, and it has no per-column cut, so someone named on over 3,001 tasks can see an older one of their own here that the default read leaves out. Any other value gets `invalid_argument`" }], summary: "One read with `forecast`, a `PlanForecast` that every viewer gets, and `start`, `{ date, timezone }` or null, only for someone who can have a forecast. One read of the room's plan: `tasks` with `id`, `title`, `status`, `assignee`, `reviewer` and `duration_days`, where null means not estimated, plus `edges` of `predecessor` and `successor`, and `complete`. Someone who sees the whole room also gets `plan_revision` and `plan_changed_at`. Someone limited to their own tasks gets only those and the edges between them, with `complete` false and no revision or time. `complete` is also false over 3,000 tasks, or with more than 5,000 finished tasks' edges. A read holds unfinished tasks first, then the newest finished ones, so someone who sees the whole room always gets every task whose plan can change, and each one's whole predecessor list, even if a predecessor is too old to be listed. Don't work out a finish from an incomplete plan", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/uploads:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: createUpload
      tags: [commands]
      summary: "Start an upload, reserving its space: at most 100 MB a file and 5 GB a room, counting every file kept and every upload that hasn't expired. Only someone who may upload an input asset can. The answer has `id`, the cleaned `name`, `size`, `state` of `uploading`, `expires_at` an hour on, `upload_path` and `token`. `token` is returned once, and a retry with the same idempotency key answers without it, so that caller starts a new upload. Refusals: `file_too_large` (413), `room_quota_exceeded` and `workspace_archived` (409), `invalid_file_name` (422), `executable_refused` (415)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateUpload" } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/files:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: listFiles
      tags: [queries]
      summary: "The room's input assets the caller can see, oldest first, 50 a page, with `next_cursor` for the next page or null. Each has what `getFile` returns. Whoever sees the whole room sees every one, and someone limited to their own tasks only those linked to one of their tasks. A file still uploading isn't listed. Whoever sees the whole room also gets `quota`, with `used`, the bytes of every file kept and every open reservation, and `limit`, the room's 5 GB. It's left out for anyone limited to their own tasks, because the total counts files they can't see. `task_id` narrows it to that task's assets, and a task the caller can't see answers `task_not_found` (404). An outsider gets `workspace_not_found` (404)"
      parameters: [{ name: task_id, in: query, schema: { type: string } }, { name: cursor, in: query, schema: { type: integer } }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/files/{file}/links:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: file, in: path, required: true, schema: { type: string } }]
    post:
      operationId: linkFile
      tags: [commands]
      summary: "Link an input asset to a task (decision 53), so the task's parties can read it even if they see only their own tasks. For an owner, admin, member or Coordinator, as for uploading an input asset, on a task they can see. The answer is `file_id`, `task_id` and `linked` of true. Linking what's already linked answers the same and records nothing. The task's assignee gets an `asset.linked` event naming the task, never the file, and it wakes nobody (decision 104). It doesn't move `policy_version`. Refusals: `not_allowed` (403), `task_not_found` and `file_not_found` (404), `file_not_available` (409) for a file uploading, blocked or failed, `task_closed` (409) for a completed or canceled task, `limit_exceeded` (409) past 50 assets on a task, `workspace_archived` (409) and `workspace_not_found` (404)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LinkFile" } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/files/{file}/links/{task}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: file, in: path, required: true, schema: { type: string } }, { name: task, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: unlinkFile
      tags: [commands]
      summary: "Unlink an input asset from a task, for whoever may link it, whatever the file's or task's state. Someone who saw it only through that task loses sight of it on their next read. A download already under way isn't cut off. The answer is `file_id`, `task_id` and `linked` of false, and unlinking what isn't linked answers the same and records nothing. The task's assignee gets an `asset.unlinked` event, which wakes nobody. Refusals: as `linkFile`, apart from the file's state and the task's"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/files/{file}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: file, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getFile
      tags: [queries]
      summary: "A file's `id`, `name`, `size`, `sha256`, `media_type` and `state`, and `download_path`, which is null unless the caller may download it now, and `linked_tasks`, the IDs of the tasks it's linked to that the caller can see. The path carries no authority. Whoever sees the whole room sees every file, and someone limited to their own tasks sees only files linked to those tasks, by `linkFile`. A file the caller can't see answers `file_not_found` (404), as an unknown one does. Other refusals: `access_revoked` (403) for someone removed from the room and `workspace_not_found` (404) for an outsider"
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/agents/{agent}/files/{file}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: agent, in: path, required: true, schema: { type: string } }, { name: file, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getOverseenFile
      tags: [queries]
      summary: "Read-only oversight: `id`, `name` and `state` of a file the organization's agent can see, and nothing else, for an admin of an invited organization with no place in the room (decision 58). There's no way to the bytes this way. Refusals: `not_allowed` (403) for someone in the room, `workspace_not_found` (404) for an outsider and `file_not_found` (404)"
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/files/{ws}/{file}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: file, in: path, required: true, schema: { type: string } }]
    get:
      operationId: downloadFile
      tags: [queries]
      summary: "A file's bytes, always as an attachment, with `X-Content-Type-Options: nosniff` and no caching. People use their session at `/api/v1/files/{ws}/{file}`. Agents call `/v1/files/{ws}/{file}` with their own credential in `Authorization: Bearer`, an Agent Auth JWT, which is spent, or an MCP access token. There's no download token or signed URL: the credential, the caller's current place in the room and the file's state are all checked at the start of every download. A download already under way isn't cut off, and ranges aren't supported. Only a `ready` file downloads. Refusals: `file_not_found` (404) for a file the caller can't see, or that doesn't exist, `file_not_available` (409) for one they can see in any other state, or whose bytes are gone, `storage_unavailable` (502), `workspace_not_found` (404) for someone not in the room, or a malformed room ID, `access_revoked` (403) for someone removed from the room, `invalid_credential` (401), `credential_owner_left`, `agent_disconnected` and `agent_unclaimed` (403), for an agent, the capability path's own refusals for `get_asset_link` in its shape, `{ error, message }`, such as `capability_not_granted`, `constraint_violated`, `grant_revoked` and `agent_revoked` (403), and `rate_limited` (429)"
      responses:
        "200": { description: "The file", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/uploads/{ws}/{object}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: object, in: path, required: true, schema: { type: string } }]
    put:
      operationId: putUploadBytes
      tags: [commands]
      summary: "The file's bytes, with `Authorization: Bearer <token>` from `createUpload`, and no session. A declared length isn't needed: a chunked upload works, and what's enforced is the size and SHA-256 given to `createUpload`. The token works for any number of attempts until the file arrives, `expires_at` passes or the uploader leaves the room or may no longer upload, which drops the upload and gives back its space. Each attempt checks at its start and its end that whoever asked for the upload is still there and may still upload. On success the answer has `id`, `state` of `scanning`, `size`, `sha256` and `media_type`, which comes from the file's content. A file in `scanning` can't be downloaded. Refusals: `upload_not_found` (404) for an unknown or expired upload or a wrong token, `upload_mismatch` (422) when what arrived isn't what was announced, `file_too_large` (413) as an early answer to a declared length, 415 for a type that isn't allowed, `invalid_transition` (409) if it already arrived, or if a newer attempt replaced this one, `room_unavailable` (504) before any bytes are read, `upload_outcome_unknown` (504) if the room didn't answer at the end, when the file may or may not have landed, so a retry gets `upload_not_found` if it did, `upload_timed_out` (408) if the sender goes quiet for a minute or an attempt passes 30 minutes, `storage_unavailable` (502), which can be tried again, `room_quota_exceeded` (409) if a reservation lapsed during the upload and the room filled up, `access_revoked` (403) if the uploader was removed, left the organization or may no longer upload, `agent_disconnected` (403), `workspace_archived` (409), `workspace_not_found` (404) and `rate_limited` (429)"
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/plan/start:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    put:
      operationId: setPlanStart
      tags: [commands]
      summary: "Set the room's one planning start date and timezone. Only the owner or a human admin can (decision 70). It moves `plan_revision` and `plan_changed_at` like any plan edit, unless it saves what's already there, and it wakes nobody. A date on a weekend is accepted and kept as entered, and the plan begins that Monday, which the forecast gives as `begins_on`. It can be changed but not cleared"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetPlanStart" } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/plan:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    put:
      operationId: setTaskPlan
      tags: [commands]
      summary: "Replace a task's duration and predecessors, for its requester or a human admin who sees the whole room. A `duration_days` that's left out or null erases the estimate. Refused if the room is archived, and if the task is finished unless it only removes canceled predecessors. A loop gets `dependency_cycle`, and a `plan_revision` that isn't current gets `plan_conflict`. It leaves `task.version` alone, wakes nobody and is recorded as `task.plan_changed`, which only someone who sees the whole room can read. Over 50 predecessors gets `invalid_argument`. Over 5,000 edges across unfinished tasks, or predecessors with over 25,000 ancestor edges when any is being added, gets `limit_exceeded`"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetTaskPlan" } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/update:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: updateTask
      tags: [commands]
      summary: The updateTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateTask" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/set-reviewer:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: setReviewer
      tags: [commands]
      summary: The setReviewer command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetReviewer" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/set-requester:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: setRequester
      tags: [commands]
      summary: "Change a task's requester, on the record. An owner or admin can for any task. Someone with the `coordinate` scope can only take over, for itself, a task flagged because its requester left"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetRequester" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/assign:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: assignTask
      tags: [commands]
      summary: The assignTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssignTask" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/accept:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: acceptTask
      tags: [commands]
      summary: The acceptTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VersionedReason" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/decline:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: declineTask
      tags: [commands]
      summary: The declineTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequiredReason" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/release:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: releaseTask
      tags: [commands]
      summary: The releaseTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequiredReason" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/submit:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: submitTask
      tags: [commands]
      summary: The submitTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SubmitTask" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/request-changes:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: requestChanges
      tags: [commands]
      summary: The requestChanges command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequestChanges" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/verify:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: verifyTask
      tags: [commands]
      summary: The verifyTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VerifyTask" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/cancel:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: cancelTask
      tags: [commands]
      summary: The cancelTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequiredReason" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/messages:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    get:
      operationId: listMessages
      tags: [queries]
      summary: Messages on a task thread
      parameters: [{ name: after, in: query, schema: { type: integer } }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: sendMessage
      tags: [commands]
      summary: Post to a task thread
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, description: "At most 16 KiB of UTF-8." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/inbox:
    get:
      operationId: readInbox
      tags: [queries]
      summary: Read this principal's inbox. Events carry IDs only
      parameters:
        - { name: after, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: ack, in: query, description: "Documented exception: also advances the cursor.", schema: { type: boolean } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/inbox/ack:
    post:
      operationId: ackInbox
      tags: [commands]
      summary: Advance the inbox cursor
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [up_to], properties: { up_to: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/inbox/wake:
    put:
      operationId: setWake
      tags: [commands]
      summary: Set the wake URL. The response has the secret, shown only here. Each wake is a JSON POST of agent_id, unread and at, with X-Podster-Signature t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<body>">, expected to answer 2xx within 10 seconds without redirecting
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri }, debounce: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    delete: { operationId: deleteWake, tags: [commands], summary: Remove the wake URL, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
components:
  securitySchemes:
    assertion: { type: apiKey, in: header, name: X-Podster-Assertion, description: "Ed25519-signed gateway assertion, valid for 60 seconds. For people, `org_since` says when they joined each organization, and a room role older than that has ended. When a person adds another person or changes their role, `target_member` holds that person's organizations and join times from the gateway's directory. Neither grants anything by itself. `departure` says someone left an organization, and only the gateway's own removal sends it. Agents carry their connection generation. People carry orgs and admin_orgs." }
  parameters:
    ws: { name: ws, in: path, required: true, schema: { type: string } }
    t: { name: t, in: path, required: true, schema: { type: string } }
    idempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
  responses:
    Json: { description: Success, content: { application/json: { schema: { type: object } } } }
    TaskDetail:
      description: A task and what the caller may read about it
      content:
        application/json:
          schema:
            type: object
            required: [task, submissions, artifacts, messages, history, visible]
            properties:
              task: { $ref: "#/components/schemas/Task" }
              submissions: { type: array, items: { type: object } }
              artifacts: { type: array, items: { type: object } }
              messages: { type: array, items: { type: object } }
              history: { type: array, items: { type: object } }
              visible: { type: object, required: [submissions, conversation], properties: { submissions: { type: string, enum: [all, own] }, conversation: { type: boolean } } }
    Task: { description: The task after the command, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
    Error: { description: A stable error code, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    TaskStatus: { type: string, enum: [open, offered, accepted, submitted, completed, canceled] }
    Task:
      type: object
      required: [id, title, instructions, requester, reviewer, status, version]
      properties:
        id: { type: string }
        title: { type: string }
        instructions: { type: string }
        acceptance_criteria: { type: [string, "null"] }
        requester: { type: string }
        assignee: { type: [string, "null"] }
        reviewer: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        version: { type: integer }
        due_at: { type: [integer, "null"] }
        follow_up_of: { type: [string, "null"] }
        submission_no: { type: integer }
        approved_submission_no: { type: [integer, "null"], description: "The submission a reviewer approved, or null if none has been. It's set in the same transaction as the approval and can't change after it. A task completed before this was recorded has its latest submission here, which is the only one that could have been approved." }
        needs_attention: { type: boolean }
    CreateTask:
      type: object
      required: [title, instructions]
      properties:
        title: { type: string, minLength: 1, description: "At most 500 bytes." }
        instructions: { type: string, minLength: 1, description: "At most 64 KiB." }
        acceptance_criteria: { type: string, description: "At most 16 KiB." }
        assignee: { type: string }
        reviewer: { type: string }
        due_at: { type: integer }
        follow_up_of: { type: string }
    LinkFile:
      type: object
      required: [task_id]
      additionalProperties: false
      properties:
        task_id: { type: string, description: "The task to link the input asset to." }
    CreateUpload:
      type: object
      required: [name, size, sha256]
      additionalProperties: false
      properties:
        name: { type: string, description: "The file's name, which is cleaned. It's agent content, and never reaches a log or an event." }
        size: { type: integer, minimum: 1, maximum: 100000000, description: "The exact size in bytes." }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "The file's SHA-256, in lower-case hex." }
    SetPlanStart:
      type: object
      required: [start_date, timezone, plan_revision]
      additionalProperties: false
      properties:
        start_date: { type: string, format: date, description: "A local calendar date, `YYYY-MM-DD`, from 2000-01-01 to 2100-12-31. It isn't shifted by the timezone." }
        timezone: { type: string, maxLength: 64, description: "An IANA name such as `America/New_York`. An offset such as `+01:00` is refused. It labels the dates and doesn't change them." }
        plan_revision: { type: integer, description: "The revision last read. Anything else gets `plan_conflict`." }
    PlanForecast:
      type: object
      description: "A read-only baseline, never a delivery commitment. `available` true has every field below except `reasons` and `explanation`. `available` false has only `label`, `reasons` and `explanation`. Someone who can't have a forecast, because they don't see the whole plan or are a guest, always gets `reasons` of exactly `not_available` and the same `explanation`, whatever the room holds. Someone who sees the whole plan gets any of `no_start`, `no_tasks`, `missing_estimates`, `canceled_predecessor`, `cycle` and `incomplete`, which name no task."
      required: [label, available]
      properties:
        label: { type: string, enum: ["Baseline plan"] }
        available: { type: boolean }
        reasons: { type: array, items: { type: string, enum: [not_available, no_start, no_tasks, missing_estimates, canceled_predecessor, cycle, incomplete] } }
        explanation: { type: string }
        plan_revision: { type: integer, description: "Moves when estimates, dependencies or the start change. It isn't a version of this forecast and can't key a cache: the forecast also reflects current task status and which tasks exist when read, so canceling, completing or creating a task can change it while this stays the same. Nothing here moves with today's date." }
        plan_changed_at: { type: [integer, "null"], description: "When estimates, dependencies or the start last changed, in milliseconds. A task's lifecycle doesn't move it, so the forecast can have changed since." }
        start_date: { type: string, format: date, description: "The date as entered, which can fall on a weekend." }
        begins_on: { type: string, format: date, description: "The first working day on or after `start_date`, where the plan really begins. Show this if it differs." }
        timezone: { type: string }
        calendar: { type: string, enum: [mon_fri], description: "Fixed. Holidays aren't taken into account, so one counts as a working day." }
        assumptions: { type: array, items: { type: string }, description: "Fixed text to show with the forecast." }
        duration_days: { type: integer, description: "The longest dependency path in working days, never the sum of every estimate." }
        finish_date: { type: string, format: date, description: "The last working day of the plan, inclusive." }
        tasks:
          type: array
          description: "Sorted by ID. Every unfinished task and every completed task with an estimate. Canceled tasks aren't here."
          items:
            type: object
            required: [id, duration_days, earliest_start, earliest_finish, latest_start, latest_finish, slack_days, critical]
            properties:
              id: { type: string }
              duration_days: { type: integer }
              earliest_start: { type: string, format: date }
              earliest_finish: { type: string, format: date, description: "Inclusive: the span's last working day." }
              latest_start: { type: string, format: date }
              latest_finish: { type: string, format: date }
              slack_days: { type: integer, description: "Working days it can slip without moving the finish. It isn't evidence anyone is free." }
              critical: { type: boolean, description: "Exact, even when `critical_paths_cut` is true." }
        critical_paths: { type: array, items: { type: array, items: { type: string } }, description: "Each tied path, first task to last, sorted, up to 20 paths and 10,000 IDs." }
        critical_paths_cut: { type: boolean, description: "Whether more tied paths exist than are listed." }
        left_out: { type: array, items: { type: string }, description: "Completed tasks with no estimate, which aren't in the scenario and count toward nothing here. A screen must say which they are, so a finish date doesn't look complete." }
    SetTaskPlan:
      type: object
      additionalProperties: false
      required: [plan_revision, predecessors]
      properties:
        plan_revision: { type: integer }
        duration_days: { type: [integer, "null"], minimum: 1, maximum: 260 }
        predecessors: { type: array, maxItems: 50, uniqueItems: true, items: { type: string } }
    UpdateTask:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer }
        title: { type: string, minLength: 1 }
        instructions: { type: string, minLength: 1 }
        acceptance_criteria: { type: string }
        due_at: { type: integer }
    SetReviewer: { type: object, required: [version, reviewer], properties: { version: { type: integer }, reviewer: { type: string } } }
    SetRequester: { type: object, required: [version, requester], properties: { version: { type: integer }, requester: { type: string } } }
    AssignTask: { type: object, required: [version, assignee], properties: { version: { type: integer }, assignee: { type: string } } }
    VersionedReason: { type: object, required: [version], properties: { version: { type: integer }, reason: { type: string } } }
    RequiredReason: { type: object, required: [version, reason], properties: { version: { type: integer }, reason: { type: string, minLength: 1 } } }
    Artifact: { type: object, required: [uri, label], properties: { uri: { type: string, description: "HTTPS only, at most 2 KiB." }, label: { type: string, minLength: 1, description: "At most 256 bytes." } } }
    SubmitTask:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        artifacts: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Artifact" } }
        note: { type: string }
        commit_sha: { type: string, description: Required when the task has a linked repository. }
    RequestChanges: { type: object, required: [submission_no, reason], properties: { submission_no: { type: integer }, reason: { type: string, minLength: 1 } } }
    VerifyTask: { type: object, required: [submission_no], properties: { submission_no: { type: integer }, commit_sha: { type: string, description: Required when the task has a linked repository. } } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [plan_conflict, dependency_cycle, relationship_exists, relationship_not_found, role_not_found, role_full, already_claimed, lead_exists, invalid_wake_url, jwt_replay, agent_not_found, invitation_not_found, invitation_required, not_in_organization, credential_owner_left, already_member, limit_exceeded, invalid_assertion, idempotency_key_required, not_found, internal_error, workspace_not_found, access_revoked, agent_disconnected, not_a_participant, not_allowed, task_not_found, invalid_transition, workspace_archived, version_conflict, commit_changed, submission_mismatch, self_sign_off, invalid_argument, idempotency_mismatch, ack_beyond_inbox]
            message: { type: string }
