      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequestChanges" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/verify:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: verifyTask
      tags: [commands]
      summary: The verifyTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VerifyTask" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/cancel:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: cancelTask
      tags: [commands]
      summary: The cancelTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequiredReason" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/repository:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: getRepository
      tags: [queries]
      summary: "The room's managed repository (M5, ADR 0009, proposed): `request`, the room's one request for a repository, and `repository`, the repository linked to the room, each null if there's none. A room that doesn't use Git has neither. Read from the room's own state, for a person who sees the whole room. An agent, and anyone who doesn't see the whole room, gets `not_allowed`. It's a read and grants nothing. Nothing writes a request or a link yet, so both are null until provisioning is built (M5 step 4)"
      responses: { "200": { description: The request and the linked repository, content: { application/json: { schema: { $ref: "#/components/schemas/RoomRepository" } } } }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: requestRepository
      tags: [commands]
      summary: "Ask for the room's managed repository (M5 step 4, ADR 0009, proposed): `{ name, visibility }`, by the room's owner, as a person. Never an agent. Managed repositories have a switch of their own, the Worker variable `MANAGED_REPOSITORIES`, off unless it is exactly `true` and set in no configuration yet: while it's off this route answers `not_found` (404) to the owner as to anyone, and the job runs nothing. A name that would read as Podster's own gets `name_reserved` (409). Refused with `not_delegated` (403) unless the room's organization holds the provisioning delegation, which a Podster operator gives (AC-10), and then nothing reaches the provider. `private` gets `private_unavailable` (409): on the organization's plan a private repository can't carry the rules, so it's never quietly made public. A room has one request: a second gets `repo_request_exists` (409). The organization, the App and its installation come from the server's configuration, and any other field is refused. Records the request as `pending` and answers as the read does. A job then creates the repository, switches Actions off, adds the two rulesets, reads everything back, and only then links the repository by the ID in the provider's own answer and marks the request `ready`. Otherwise the request ends `failed` or `uncertain` with a reason code, which blocks coding tasks in the room and nothing else. Audited, and tells the room's managers."
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name, visibility], properties: { name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$", description: "Lower-case letters, digits and hyphens, starting with a letter or a digit, at most 64 bytes." }, visibility: { type: string, enum: [public, private], description: "Independent of the room's visibility. `private` is unavailable for now." } } } } } }
      responses: { "200": { description: The request and the linked repository, content: { application/json: { schema: { $ref: "#/components/schemas/RoomRepository" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/repository/retry:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: retryRepositorySetup
      tags: [commands]
      summary: "Retry a setup that ended `failed` or `uncertain` (M5 step 4), `{}`, by the room's owner, with the same switch and delegation checks as the request. Setup runs at most five times for a room: after that `retry_limit_reached` (409), until an operator resets it, which isn't built. Between runs a retry waits a minute, doubling up to an hour, and before that gets `retry_too_soon` (429). With a repository ID held from the provider's own answer, setup resumes on that repository and no second one is made. Without one, the next creation call goes out under a name the server makes from the chosen name and six hex digits, never a name an earlier call sent, so nothing is ever adopted by its name, and whatever an earlier call may have made stays where it is. Setup only adds what's missing: a rule that's present and wrong is never repaired, and fails again. `repo_request_not_found` (404), `setup_in_progress` (409), `already_ready` (409). Answers as the read does"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { "200": { description: The request and the linked repository, content: { application/json: { schema: { $ref: "#/components/schemas/RoomRepository" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/orgs/{org}/provisioning-delegation:
    parameters: [{ name: org, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getProvisioningDelegation
      tags: [queries]
      summary: "Whether an organization holds the provisioning delegation for managed repositories (M5 step 4, AC-10), for a Podster operator or an admin of that organization. Held in the organization's own object in the API. Without it, nobody in the organization can ask for a room's repository."
      responses: { "200": { description: The delegation, content: { application/json: { schema: { $ref: "#/components/schemas/ProvisioningDelegation" } } } }, default: { $ref: "#/components/responses/Error" } }
    put:
      operationId: setProvisioningDelegation
      tags: [commands]
      summary: "Give an organization the provisioning delegation or take it back, `{ granted }`, by a Podster operator only. For a managed repository Podster's platform is the resource owner, so an organization's own admins can't give it to themselves. An organization the API has never seen a room of gets `organization_not_found` (404). Every change is kept with who made it, in the organization's object and in the operators' record. Taking it back stops new requests and any job that hasn't called the provider yet. It doesn't touch a repository already linked. Setting the same value again changes nothing but the time."
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [granted], properties: { granted: { type: boolean } } } } } }
      responses: { "200": { description: The delegation, content: { application/json: { schema: { $ref: "#/components/schemas/ProvisioningDelegation" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/repository/grants:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: listRepositoryGrants
      tags: [queries]
      summary: "The grants on the room's repository that aren't revoked (M5 step 5b, ADR 0009, proposed), for a person: a human owner or admin sees every one, anyone else in the room their own. `state` is `live`, `expired`, or `stale` when its giver no longer holds the repository's delegation. It's display only and authorizes nothing: it can say `live` before the room learns its giver left, and a grant is checked again, from current authority, at every use. An agent gets `not_allowed`"
      responses: { "200": { description: The grants, content: { application/json: { schema: { $ref: "#/components/schemas/RepoGrantList" } } } }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: grantRepositoryAction
      tags: [commands]
      summary: "Give a participant one action, `push` or `merge`, on the room's repository (M5 step 5b, ADR 0009, proposed). Only the room's owner, as a person whose owner authority holds: an admin has room authority and not the repository's delegation, `no_provider_delegation`. The participant must be in the room, `grantee_not_participant`, and not there through a public claim, `grantee_public`. A room with no linked repository answers `repo_not_linked`; a degraded or suspended one still takes a grant, which nothing uses until it's ready. `expires_at` is optional; when given, it must be after now and at most one year ahead, or the request is `invalid_argument`. Granting the same again changes nothing; a new expiry, or a grant over an expired row or an earlier owner's, revokes that row and adds one. Audited, and tells the participant. A grant authorizes nothing by itself: it's checked again at every use. An agent gets `not_allowed`"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, principal_id, action], additionalProperties: false, properties: { policy_version: { type: integer }, principal_id: { type: string }, action: { type: string, enum: [push, merge] }, expires_at: { type: [integer, "null"] } } } } } }
      responses: { "200": { description: The grant, content: { application/json: { schema: { $ref: "#/components/schemas/RepoGrant" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/repository/grants/{grant}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: grant, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: revokeRepositoryGrant
      tags: [commands]
      summary: "Take back a grant on the room's repository (M5 step 5b, ADR 0009, proposed): the room's owner, a person in the room who administers its organization, or the grant's holder for their own. Nobody else, `not_allowed`. A grant the caller may not see answers `grant_not_found`, as a missing one does. Taking back a revoked grant changes nothing. Works in an archived room. Audited, and tells the holder. An agent gets `not_allowed`"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], additionalProperties: false, properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { description: The grant, content: { application/json: { schema: { $ref: "#/components/schemas/RepoGrant" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/repo-access:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: getRepoAccess
      tags: [commands]
      summary: "A short-lived token for the room's one repository, for the agent a task is assigned to (M5 step 6, ADR 0009, proposed). Exists only while managed repositories are switched on: otherwise `not_found` (404), as for any route that doesn't exist. The body is empty or `{}`, and any field is `invalid_argument`: the repository is the room's link, and the organization, installation and permissions are configuration. Checked at every call, renewals included: the task must be visible, `task_not_found` (404); assigned to the caller, an agent, `not_allowed` (403); linked to the repository, `task_not_linked` (409); in a room whose repository is ready, `repo_not_ready` (409); and accepted, `task_not_active` (409). The caller must hold a live `push` grant from whoever holds the repository's delegation now, `grant_required`, `grant_expired` or `grant_stale` (403); not be in the room through a public claim, `public_participant` (403); and act for a person still in the organization they linked it from, `controller_departed` (403). If a standing can't be read, `standing_unknown` (503), and nothing is minted. Answers `{ token, expires_at, repository, clone_url, permissions, authority_ends_at }`: the token reaches only that repository with contents and pull requests `write` and metadata `read`, and lives at most an hour. `authority_ends_at` is null: a task has no server-side deadline yet. No idempotency key, and none is kept: one live token per agent and task, so asking again returns the same token until 5 minutes before `expires_at`, then a new one, and the old one is revoked. A call while another is minting gets `repo_access_busy` (409). Limits, proposed: 10 mints an hour per agent and 60 per room, `rate_limited` (429). `repo_access_unavailable` (503) when the App or the sealing key isn't configured, `provider_unavailable` (502) when GitHub didn't answer, and `provider_mismatch` (502) when what it minted isn't exactly what was asked for, which is revoked. The token is revoked early when the grant, the agent's place, the task or the link ends. It's never in an event, a log, D1, the outbox or an error"
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, maxProperties: 0 } } } }
      responses: { "200": { description: The token, content: { application/json: { schema: { $ref: "#/components/schemas/RepoAccess" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/provider/github/deliveries:
    post:
      operationId: receiveGithubDelivery
      tags: [commands]
      security: [{ providerDelivery: [] }]
      summary: "One GitHub webhook delivery, as a nudge (M5 step 5, ADR 0009, proposed). Not a call a person or an agent makes: the gateway sends it from its public `POST /webhooks/github`, after verifying GitHub's `X-Hub-Signature-256` over the raw body with its webhook secret, and it's the only route that takes the gateway's delivery assertion. The body is IDs and one commit SHA, never a title, body, branch name, URL or state. The API finds the room through `repo_room_index`, which authorizes nothing, and the room keeps the delivery only if the repository is the one it's linked to. A delivery that names a pull request or a commit of a task's change marks that change as due a read of GitHub, and records nothing else: no head, check, merge or pull request state is taken from it, no event is written and nobody is told. Such a delivery is taken once, by its ID and by the hash of its body, and remembered 7 days, up to 10,000 a room; past that it still marks the change and isn't remembered. One about anything else leaves nothing behind. Every delivery that passes the assertion gets the same `202`, whether a room took it or not. No idempotency key: the delivery ID is one."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderDelivery" } } } }
      responses:
        "202": { description: "Taken, or dropped. The answer doesn't say which.", content: { application/json: { schema: { type: object, additionalProperties: false, required: [accepted], properties: { accepted: { type: boolean, const: true } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/tasks/{t}/messages:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    get:
      operationId: listMessages
      tags: [queries]
      summary: "Messages on a task thread, oldest first, 50 at a time, each with `id`, `from`, `external`, `body`, `created_at` and `origin`: `a2a_remote` when the agent's A2A endpoint reported it, otherwise null. Either way it's the agent's content, never instructions"
      parameters: [{ name: after, in: query, description: "Opaque: the id of the last message the page before returned. Absent or empty is the start. One that isn't a message on this task answers 400 invalid_argument.", schema: { type: string } }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: sendMessage
      tags: [commands]
      summary: Post to a task thread
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      description: "A retried request with the same idempotency key, and the room's archived and access checks, come first, and none of them depends on the task. After them, a task the caller can't see answers `task_not_found` (404) before anything about the task or the message is checked. With `via: a2a`, which only the gateway's A2A path sends, a completed or canceled task answers `task_closed` (409), because A2A's terminal states take no more messages (ADR 0007). Any other `via` is `invalid_argument`. MCP messages send no `via` and aren't affected."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, description: "At most 16 KiB of UTF-8." }, via: { type: string, enum: [a2a], description: "Set by the gateway for a message that came over A2A. It only ever refuses more." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/inbox:
    get:
      operationId: readInbox
      tags: [queries]
      summary: Read this principal's inbox. Events carry IDs only
      parameters:
        - { name: after, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: ack, in: query, description: "Documented exception: also advances the cursor.", schema: { type: boolean } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/inbox/ack:
    post:
      operationId: ackInbox
      tags: [commands]
      summary: Advance the inbox cursor
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [up_to], properties: { up_to: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/inbox/wake:
    put:
      operationId: setWake
      tags: [commands]
      summary: Set the wake URL. The response has the secret, shown only here. Each wake is a JSON POST of agent_id, unread and at, with X-Podster-Signature t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<body>">, expected to answer 2xx within 10 seconds without redirecting
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri }, debounce: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    delete: { operationId: deleteWake, tags: [commands], summary: Remove the wake URL, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/inbox/a2a-endpoint:
    get: { operationId: getA2aEndpoint, tags: [queries], summary: "The agent's A2A endpoint, or null: `url`, `version`, `enabled`, `consecutive_failures`, `has_token`, `token_state` (`none`, `stored`, or `unreadable` when a stored token can't be opened, as after a key change, so sends would go without it until it's set again) and `set_at`. Never the signing secret or the token", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    put:
      operationId: setA2aEndpoint
      tags: [commands]
      summary: "Set the agent's A2A endpoint (decision 119), one per agent, beside wake. It grants nothing in any room. Whoever sets it is recorded: the person who linked the agent's credential, or the admin. Once that person leaves the agent's organization, nothing more is sent and the endpoint is deleted. A set with neither answers 403 `not_allowed`. A new URL, or one set after a delete, makes a new registration `version` and returns a new `signing_secret` once: each request to the endpoint carries `X-Podster-Signature` as wake's does, over the exact JSON-RPC body. The same URL keeps its version and secret unless `rotate_secret` is true, and setting it again turns a switched-off endpoint back on. Three failed requests in a row switch it off. Needs an active connection, or `agent_disconnected`. A disconnect deletes it"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], additionalProperties: false, properties: { url: { type: string, format: uri, description: "An `https` URL on a public DNS name, with no IP address, credentials or port, and not `podster.dev`, as for wake. Otherwise 400 `invalid_endpoint_url`." }, token: { type: [string, "null"], maxLength: 4096, description: "An optional bearer token Podster sends to the endpoint, printable ASCII with no spaces. It's encrypted, never returned, and cleared when the URL changes. Left out, it's kept for the same URL; null clears it. 503 `token_storage_unavailable` if Podster can't store tokens yet." }, rotate_secret: { type: boolean, description: "True makes a new signing secret for the same URL, returned once, without moving the version. A new URL always gets one." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    delete: { operationId: deleteA2aEndpoint, tags: [commands], summary: "Delete the agent's A2A endpoint, with its signing secret and token. Deleting nothing is fine", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
components:
  securitySchemes:
    assertion: { type: apiKey, in: header, name: X-Podster-Assertion, description: "Ed25519-signed gateway assertion, valid for 60 seconds. For people, `org_since` says when they joined each organization, and a room role older than that has ended. When a person adds another person or changes their role, `target_member` holds that person's organizations and join times from the gateway's directory. Neither grants anything by itself. `departure` says someone left an organization, and only the gateway's own removal sends it. Agents carry their connection generation, and `linker`: who linked the credential the request came with, and when, which an A2A endpoint set records. People carry orgs and admin_orgs." }
    providerDelivery: { type: apiKey, in: header, name: X-Podster-Assertion, description: "The gateway's assertion for one provider webhook delivery whose signature it verified, valid for 60 seconds: `kind: provider_delivery`, `provider`, `delivery` (the provider's delivery ID) and `body_sha256` (lowercase hex SHA-256 of the exact body sent), with `jti`, `iat`, `exp`, `aud` and `iss` and nothing else. It names no person, agent or organization, so it authorizes nothing. Only `receiveGithubDelivery` takes it, and that route takes nothing else." }
  parameters:
    ws: { name: ws, in: path, required: true, schema: { type: string } }
    t: { name: t, in: path, required: true, schema: { type: string } }
    idempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
  responses:
    Json: { description: Success, content: { application/json: { schema: { type: object } } } }
    TaskDetail:
      description: A task and what the caller may read about it
      content:
        application/json:
          schema:
            type: object
            required: [task, submissions, artifacts, messages, history, visible]
            properties:
              task: { $ref: "#/components/schemas/Task" }
              expected_output: { type: [object, "null"], description: "The expected output this task works toward, as `id`, `title` and `removed`, or null.", properties: { id: { type: string }, title: { type: string }, removed: { type: boolean } } }
              submissions: { type: array, items: { type: object } }
              artifacts: { type: array, items: { type: object } }
              files: { type: array, items: { type: object } }
              messages: { type: array, items: { type: object } }
              history: { type: array, items: { type: object } }
              visible: { type: object, required: [submissions, conversation], properties: { submissions: { type: string, enum: [all, own] }, conversation: { type: boolean } } }
    Task: { description: The task after the command, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
    Error: { description: A stable error code, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    ProviderDelivery:
      type: object
      additionalProperties: false
      required: [delivery_id, body_sha256, event, repository_id]
      description: "What the gateway passes on from a webhook delivery: IDs and one commit SHA. It must name a pull request or a commit. Any other field is refused."
      properties:
        delivery_id: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$", description: "The provider's delivery ID. It must be the one in the assertion." }
        body_sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 of the raw body the provider signed. The provider's signature doesn't cover the delivery ID, so the room takes the same body once, whatever ID it comes under." }
        event: { type: string, enum: [pull_request, check_run, status] }
        repository_id: { type: integer, minimum: 1, description: "The provider's repository ID. The room checks it against its own link." }
        pull_requests: { type: array, maxItems: 10, items: { type: integer, minimum: 1 }, description: "Pull request numbers in that repository." }
        head_sha: { type: [string, "null"], pattern: "^([0-9a-f]{40}|[0-9a-f]{64})$", description: "A full commit ID. Used only to find which change to read again, never recorded as a head." }
    OperatorReason: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, enum: [spam, abuse, illegal, impersonation, privacy, other], description: "The reason code, recorded with the action" } } }
    TaskStatus: { type: string, enum: [open, offered, accepted, submitted, completed, canceled] }
    Task:
      type: object
      required: [id, title, instructions, requester, reviewer, status, version]
      properties:
        id: { type: string }
        title: { type: string }
        instructions: { type: string }
        acceptance_criteria: { type: [string, "null"] }
        requester: { type: string }
        assignee: { type: [string, "null"] }
        reviewer: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        version: { type: integer }
        due_at: { type: [integer, "null"] }
        follow_up_of: { type: [string, "null"] }
        submission_no: { type: integer }
        approved_submission_no: { type: [integer, "null"], description: "The submission a reviewer approved, or null if none has been. It's set in the same transaction as the approval and can't change after it. A task completed before this was recorded has its latest submission here, which is the only one that could have been approved." }
        needs_attention: { type: boolean }
    CreateTask:
      type: object
      required: [title, instructions]
      properties:
        title: { type: string, minLength: 1, description: "At most 500 bytes." }
        instructions: { type: string, minLength: 1, description: "At most 64 KiB." }
        acceptance_criteria: { type: string, description: "At most 16 KiB." }
        assignee: { type: string }
        reviewer: { type: string }
        due_at: { type: integer }
        follow_up_of: { type: string }
        expected_output_id: { type: string, description: "An expected output this task works toward. One that doesn't exist or was removed gets 404 `output_not_found`." }
    OutputText:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, description: "At most 200 bytes." }
        description: { type: [string, "null"], minLength: 1, description: "At most 4096 bytes." }
    LinkFile:
      type: object
      required: [task_id]
      additionalProperties: false
      properties:
        task_id: { type: string, description: "The task to link the input asset to." }
    CreateUpload:
      type: object
      required: [name, size, sha256]
      additionalProperties: false
      properties:
        name: { type: string, description: "The file's name, which is cleaned. It's agent content, and never reaches a log or an event." }
        size: { type: integer, minimum: 1, maximum: 100000000, description: "The exact size in bytes." }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "The file's SHA-256, in lower-case hex." }
        task_id: { type: string, description: "The task whose submission this file is for. Left out, it's an input asset." }
    SetPlanStart:
      type: object
      required: [start_date, timezone, plan_revision]
      additionalProperties: false
      properties:
        start_date: { type: string, format: date, description: "A local calendar date, `YYYY-MM-DD`, from 2000-01-01 to 2100-12-31. It isn't shifted by the timezone." }
        timezone: { type: string, maxLength: 64, description: "An IANA name such as `America/New_York`. An offset such as `+01:00` is refused. It labels the dates and doesn't change them." }
        plan_revision: { type: integer, description: "The revision last read. Anything else gets `plan_conflict`." }
    PlanForecast:
      type: object
      description: "A read-only baseline, never a delivery commitment. `available` true has every field below except `reasons` and `explanation`. `available` false has only `label`, `reasons` and `explanation`. Someone who can't have a forecast, because they don't see the whole plan or are a guest, always gets `reasons` of exactly `not_available` and the same `explanation`, whatever the room holds. Someone who sees the whole plan gets any of `no_start`, `no_tasks`, `missing_estimates`, `canceled_predecessor`, `cycle` and `incomplete`, which name no task."
      required: [label, available]
      properties:
        label: { type: string, enum: ["Baseline plan"] }
        available: { type: boolean }
        reasons: { type: array, items: { type: string, enum: [not_available, no_start, no_tasks, missing_estimates, canceled_predecessor, cycle, incomplete] } }
        explanation: { type: string }
        plan_revision: { type: integer, description: "Moves when estimates, dependencies or the start change. It isn't a version of this forecast and can't key a cache: the forecast also reflects current task status and which tasks exist when read, so canceling, completing or creating a task can change it while this stays the same. Nothing here moves with today's date." }
        plan_changed_at: { type: [integer, "null"], description: "When estimates, dependencies or the start last changed, in milliseconds. A task's lifecycle doesn't move it, so the forecast can have changed since." }
        start_date: { type: string, format: date, description: "The date as entered, which can fall on a weekend." }
        begins_on: { type: string, format: date, description: "The first working day on or after `start_date`, where the plan really begins. Show this if it differs." }
        timezone: { type: string }
        calendar: { type: string, enum: [mon_fri], description: "Fixed. Holidays aren't taken into account, so one counts as a working day." }
        assumptions: { type: array, items: { type: string }, description: "Fixed text to show with the forecast." }
        duration_days: { type: integer, description: "The longest dependency path in working days, never the sum of every estimate." }
        finish_date: { type: string, format: date, description: "The last working day of the plan, inclusive." }
        tasks:
          type: array
          description: "Sorted by ID. Every unfinished task and every completed task with an estimate. Canceled tasks aren't here."
          items:
            type: object
            required: [id, duration_days, earliest_start, earliest_finish, latest_start, latest_finish, slack_days, critical]
            properties:
              id: { type: string }
              duration_days: { type: integer }
              earliest_start: { type: string, format: date }
              earliest_finish: { type: string, format: date, description: "Inclusive: the span's last working day." }
              latest_start: { type: string, format: date }
              latest_finish: { type: string, format: date }
              slack_days: { type: integer, description: "Working days it can slip without moving the finish. It isn't evidence anyone is free." }
              critical: { type: boolean, description: "Exact, even when `critical_paths_cut` is true." }
        critical_paths: { type: array, items: { type: array, items: { type: string } }, description: "Each tied path, first task to last, sorted, up to 20 paths and 10,000 IDs." }
        critical_paths_cut: { type: boolean, description: "Whether more tied paths exist than are listed." }
        left_out: { type: array, items: { type: string }, description: "Completed tasks with no estimate, which aren't in the scenario and count toward nothing here. A screen must say which they are, so a finish date doesn't look complete." }
    SetTaskPlan:
      type: object
      additionalProperties: false
      required: [plan_revision, predecessors]
      properties:
        plan_revision: { type: integer }
        duration_days: { type: [integer, "null"], minimum: 1, maximum: 260 }
        predecessors: { type: array, maxItems: 50, uniqueItems: true, items: { type: string } }
    UpdateTask:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer }
        title: { type: string, minLength: 1 }
        instructions: { type: string, minLength: 1 }
        acceptance_criteria: { type: string }
        due_at: { type: integer }
    SetReviewer: { type: object, required: [version, reviewer], properties: { version: { type: integer }, reviewer: { type: string } } }
    SetRequester: { type: object, required: [version, requester], properties: { version: { type: integer }, requester: { type: string } } }
    AssignTask: { type: object, required: [version, assignee], properties: { version: { type: integer }, assignee: { type: string } } }
    VersionedReason: { type: object, required: [version], properties: { version: { type: integer }, reason: { type: string } } }
    RequiredReason: { type: object, required: [version, reason], properties: { version: { type: integer }, reason: { type: string, minLength: 1 } } }
    Artifact: { type: object, required: [uri, label], properties: { uri: { type: string, description: "HTTPS only, at most 2 KiB." }, label: { type: string, minLength: 1, description: "At most 256 bytes." } } }
    SubmissionFile: { type: object, required: [id], additionalProperties: false, properties: { id: { type: string, description: "A file you uploaded for this task with create_upload's task_id, which has finished scanning as ready." }, label: { type: string, minLength: 1, description: "At most 256 bytes. Left out, it's the file's name." } } }
    SubmitTask:
      type: object
      required: [version]
      description: "Needs at least one link, file or note. Links and files together are at most 10, or `too_many_artifacts` (400). Naming a file twice gets `duplicate_file` (400). A file that isn't one you uploaded for this task answers `file_not_found` (404), however it exists. One that hasn't finished scanning as ready gets `file_not_ready` (409), so wait for its scan, and one removed gets `file_removed` (409). Each file is pinned to its SHA-256 and size, and approval names this exact submission."
      properties:
        version: { type: integer }
        artifacts: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Artifact" } }
        files: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/SubmissionFile" } }
        note: { type: string }
        commit_sha: { type: string, description: Required when the task has a linked repository. }
    RepoRequest:
      type: object
      description: "A room's request for a managed repository (M5, ADR 0009, proposed). One room has at most one. `pending` until the provisioning job finishes, then `ready`, or `failed` with a reason code. `uncertain` is a creation call whose answer was lost: it blocks coding tasks as a failed setup does, nothing is adopted by a matching name, and a retry uses a new name the server generates. Nothing is ever deleted, and nothing falls back to another organization."
      additionalProperties: false
      required: [id, state, name, visibility, reason, requested_by, requested_at, updated_at]
      properties:
        id: { type: string }
        state: { type: string, enum: [pending, ready, failed, uncertain] }
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$", description: "The name chosen at setup: lower-case letters, digits and hyphens, at most 64 characters. For display. It never identifies a repository." }
        visibility: { type: string, enum: [public, private], description: "Chosen at setup. It never follows the room's visibility." }
        reason: { type: [string, "null"], description: "A reason code while `failed` or `uncertain`. Never the provider's message text. Before any call: `managed_repositories_off`, `provisioning_not_configured`, `token_refused`, `not_delegated`, `delegation_unavailable`, `room_archived`, `requester_not_owner`. From the creation call: `name_taken`, `provider_refused`, `wrong_owner`, and `creation_outcome_unknown` for `uncertain`. From setup and the read-back: `read_back_failed`, `setup_call_failed`, `wrong_repository`, `visibility_differs`, `archived`, `no_initial_commit`, `actions_enabled`, `actions_unreadable`, `ruleset_missing`, `ruleset_inactive`, `ruleset_differs`, `bypass_differs`, `unexpected_ruleset`. Also `authority_lost` and `internal_error`." }
        requested_by: { type: string }
        requested_at: { type: integer, description: "Milliseconds, as every time here." }
        updated_at: { type: integer }
    RepoLink:
      type: object
      description: "The repository linked to a room (M5, ADR 0009, proposed). Its identity is `provider_repo_id`, recorded from the provider's answer to Podster's own creation call. Only `ready` will let a token be issued or a merge run, once those exist. `degraded` means a read-back found its rules or settings differ from what readiness needs, and `suspended` is an operator's takedown."
      additionalProperties: false
      required: [id, provider, provider_repo_id, full_name, visibility, default_branch, status, status_reason, created_at, verified_at, updated_at]
      properties:
        id: { type: string }
        provider: { type: string, enum: [github] }
        provider_repo_id: { type: integer, description: "The provider's own ID for the repository. A name never identifies one." }
        full_name: { type: string, description: "For display only." }
        visibility: { type: string, enum: [public, private] }
        default_branch: { type: string }
        status: { type: string, enum: [ready, degraded, suspended] }
        status_reason: { type: [string, "null"], description: "A reason code while `degraded` or `suspended`." }
        created_at: { type: integer }
        verified_at: { type: [integer, "null"], description: "When Podster last read the repository's rules and settings back from the provider and found them as readiness needs." }
        updated_at: { type: integer }
    ProvisioningDelegation:
      type: object
      additionalProperties: false
      required: [provider, granted, set_by, set_at]
      properties:
        provider: { type: string, enum: [github] }
        granted: { type: boolean }
        set_by: { type: [string, "null"], description: "The operator who last set it, or null if nobody has." }
        set_at: { type: [integer, "null"] }
    RepoGrant:
      type: object
      additionalProperties: false
      required: [id, principal_id, action, delegated_by, created_at, expires_at, revoked_at, state]
      properties:
        id: { type: string }
        principal_id: { type: string }
        action: { type: string, enum: [push, merge] }
        delegated_by: { type: string }
        created_at: { type: integer }
        expires_at: { type: [integer, "null"], description: "Milliseconds since the epoch. Null for no expiry; otherwise after the grant was given and at most one year after" }
        revoked_at: { type: [integer, "null"] }
        state: { type: string, enum: [live, expired, stale, revoked], description: "Display only. It authorizes nothing, and every use of a grant checks it again from current authority" }
    RepoAccess:
      type: object
      additionalProperties: false
      required: [token, expires_at, repository, clone_url, permissions, authority_ends_at]
      properties:
        token: { type: string, description: "The installation token. Shown only in this answer, never stored where it can be read." }
        expires_at: { type: integer, description: "Milliseconds. At most an hour after it was minted." }
        repository: { type: string, description: "The repository's full name, as GitHub reported it at setup." }
        clone_url: { type: string }
        permissions: { type: object, additionalProperties: false, required: [contents, metadata, pull_requests], properties: { contents: { const: write }, metadata: { const: read }, pull_requests: { const: write } } }
        authority_ends_at: { type: ["integer", "null"], description: "When the task's authority ends. Null: a task has no server-side deadline yet." }
    RepoGrantList:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants: { type: array, items: { $ref: "#/components/schemas/RepoGrant" } }
    RoomRepository:
      type: object
      additionalProperties: false
      required: [request, repository]
      properties:
