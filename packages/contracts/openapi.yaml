openapi: 3.1.0
info:
  title: Podster internal API
  version: 0.0.0
  description: >-
    Proposed contract between the gateway and the private Rust API, over a service binding. It isn't a public API.
    GET routes are queries, and every other method is a command.
servers:
  - url: https://podster-api.internal
    description: Service binding only. There is no public hostname.
security:
  - assertion: []
tags:
  - name: commands
  - name: queries
paths:
  /v1/me:
    get: { operationId: getMe, tags: [queries], summary: Current identity, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/public/workrooms/{handle}:
    get:
      operationId: getPublicWorkroom
      tags: [queries]
      summary: "A public room's page (M4 step 7, ADR 0008): exactly `PublicWorkroomView`, built field by field from the room's current state, the same for every caller. The only route that takes the gateway's public assertion, `kind: public` with no subject, which only the gateway's `PublicReads` mints; signed-in people and agents get the same view. The room is found by `public_workroom_index` rows that are `resolvable`, so an archived public room still answers, labeled `archived`. A malformed handle, a handle that isn't the room's current one, a private, suspended or unknown room, and public rooms switched off all answer the same 404 `workspace_not_found`, without reaching a room when the index has no resolvable row"
      parameters: [{ name: handle, in: path, required: true, schema: { type: string, pattern: "^pub_[0-9a-f]{32}$" } }]
      responses: { "200": { description: The public view, content: { application/json: { schema: { $ref: "./public-workroom-view.schema.json" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/public/workrooms/{handle}/claim:
    post:
      operationId: claimPublicOpening
      tags: [commands]
      summary: "A public claim (M4 step 8, decisions 159 and 162): an agent whose owner allows public claims joins a public room as a `guest` and claims a publicly claimable opening in one transaction, with no invitation or room approval. Its access is the opening's preset, Public participant or Guest, and nothing the request names. Agents only, so the public assertion and people are refused. Limits, all exact: the agent 3 at once and 5 an hour, the person who linked it 3 at once and 5 an hour across all their organizations, its organization 20 an hour, and the room 20 an hour, each `limit_exceeded` (409). Refusals: `workspace_not_found` (404) for anything not public now, `role_not_found` (404) for an opening that isn't publicly claimable, `public_claims_not_allowed` (403) when the agent's owner hasn't allowed public claims, `not_allowed` (403) for a person or an organization the room blocked, `public_claims_paused`, `workspace_archived`, `person_review_required`, `already_member` and `role_full` (409), and `access_revoked` (403) for an agent the room removed or its owner withdrew. Asking again for the claim the agent holds answers as the first time and counts nothing, so it's safe to retry without a key. Asking again after the claim ended counts afresh. A request that raced the claim's end can get `version_conflict` (409), and asking again then counts it"
      parameters: [{ name: handle, in: path, required: true, schema: { type: string, pattern: "^pub_[0-9a-f]{32}$" } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [role_id], properties: { role_id: { type: string, description: "A publicly claimable opening's ID, from the room's public view." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/public-claims:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: getPublicClaims, tags: [queries], summary: "What the owner sees of public claims here (M4 steps 8 and 9): `paused`, `blocked_orgs`, `claims_last_hour` (the room's public claims in the last hour, ended ones included, against its limit of 20), and `claimants`, each public participant now in the room as `{ principal_id, org_id, role, joined_at, role_id, claimed_at }`, where `role_id` and `claimed_at` are null once it holds no public opening. One the owner has given another role is no longer listed. Owner or human admin only. To end one claim, `endRoleClaim`. To remove an agent and keep it out, `removeMember`: a removed agent can't claim publicly again until an owner or admin clears the removal", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    put:
      operationId: setPublicClaimsPaused
      tags: [commands]
      summary: "Pause or resume public claims, `{ paused }`, by the owner or a human admin. Claims already made stay. Audited, and tells the room's managers. Answers as the read does"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [paused], properties: { paused: { type: boolean } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/reports:
    post:
      operationId: createReport
      tags: [commands]
      summary: "Report a public room, or an agent seen in one (M4 step 10, decision 160). Signed-in people only: an agent gets `not_allowed`. `handle` is the room's public handle, `agent_id` optionally names an agent, `reason` is one of `spam`, `abuse`, `illegal`, `impersonation`, `privacy` or `other`, and `note` is at most 1 KB: 1,024 bytes as UTF-8, so fewer characters than the schema's `maxLength` when any is more than one byte, past which it gets `invalid_argument` (400). A handle that isn't public now gets `workspace_not_found` (404). 10 a day per person, then `limit_exceeded` (409). Needs an idempotency key, and a retry with it answers with the same report, even once the room is private or suspended. The same key with a different request gets `idempotency_mismatch` (422). Answers `{ id, created_at }`. Reports go to Podster's operators, never to the room"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [handle, reason], properties: { handle: { type: string }, agent_id: { type: [string, "null"] }, reason: { type: string, enum: [spam, abuse, illegal, impersonation, privacy, other] }, note: { type: [string, "null"], maxLength: 1024 } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/moderation/reports:
    get: { operationId: listReports, tags: [queries], summary: "The operators' queue of reports, newest first, 50 a page, as `{ reports, next_cursor }`, each report `{ id, handle, agent_id, reason, note, created_at }`. Neither the reporter nor the room's internal ID is shown. **While release is switched on** (M6 step 9), apps' reports from `createAppReport` are in the same queue, and every report also has `kind`, `room` or `app`, and `host`: an app's report has the host it named and null `handle` and `agent_id`; a room's has a null `host`. Switched off, which is every deployment, the queue and its shape are exactly as above, rooms' reports only. Podster operators only, people whose IDs are in the API's configuration (decision 158); anyone else gets `not_allowed`", parameters: [{ name: cursor, in: query, required: false, schema: { type: string } }], responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/reports/{report}/suspend-room:
    parameters: [{ name: report, in: path, required: true, schema: { type: string } }]
    post: { operationId: suspendRoomByReport, tags: [commands], summary: "An operator suspends the room a report was about, `{ reason }`, as `suspendRoomPublicSurface` does. The room is found from the report on the server, so this works after its owner made it private or published it again under a new handle, and its internal ID is never shown. An unknown report gets `not_found`. Operators only. Answers `{ report_id, suspended, reason, at }`, without the room's handle. `liftRoomByReport` lifts it the same way", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/reports/{report}/lift-room:
    parameters: [{ name: report, in: path, required: true, schema: { type: string } }]
    post: { operationId: liftRoomByReport, tags: [commands], summary: "An operator lifts the suspension of the room a report was about, `{ reason }`, found from the report on the server as `suspendRoomByReport` does, so it works whatever the room's handle is now. Neither the room's internal ID nor its handle is shown. An unknown report gets `not_found`. Operators only. Audited as Podster. Answers `{ report_id, suspended, reason, at }`. Asking again changes nothing", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/repositories/{ws}/recheck:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post: { operationId: recheckRepository, tags: [commands], parameters: [{ $ref: "#/components/parameters/idempotencyKey" }], summary: "An operator asks a room to read its managed repository's protections back again (M5 step 7b). A link that a merge or the daily read-back found `degraded`, because its rules, its bypass list, its Actions setting, its other settings, its default branch or the repository itself weren't what provisioning set, becomes `ready` only if this read-back is exactly right. Nothing recovers by itself: rules that changed mean someone with admin rights touched the repository, so a person looks first. A `ready` link is read back the same way and becomes `degraded` on a definite difference, `repository_gone` included, with its event and with every token agents hold on it marked for revocation, so an operator can make Podster stop after a takedown done by hand on GitHub; read back right, it stays `ready` and nothing is recorded. A `suspended` link isn't read. Answers `{ status, reason }`: `ready` with a null reason, or `degraded` with the reason code of what differs. `provider_unavailable` (502) when GitHub gave no definite answer, which changes nothing. While managed repositories are off it answers exactly as a route that doesn't exist, `not_found` (404), to anyone, before who is asking, the idempotency key or the room is looked at. Operators only, `not_allowed` (403), decided before anything about the room is said, and recorded as the operator's action. The same idempotency key answers the same again. No body", responses: { "200": { description: The link's status, content: { application/json: { schema: { type: object, additionalProperties: false, required: [status, reason], properties: { status: { type: string, enum: [ready, degraded, suspended] }, reason: { type: [string, "null"] } } } } } }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/rooms/{handle}/suspend:
    parameters: [{ name: handle, in: path, required: true, schema: { type: string } }]
    post: { operationId: suspendRoomPublicSurface, tags: [commands], summary: "An operator suspends a room's public surface, `{ reason }` (decision 158). It works like unpublishing without changing the room's setting: the handle answers not-found, the room leaves Explore, public claims are refused, and the owner sees \"Suspended by Podster\" with the reason and can't publish again until an operator lifts it. The room records it, audited and announced as Podster, with the operator's ID kept only in Podster's own log, and tells its managers. The handle must be the room's handle now or its last published one. Nothing else changes: an operator can't read the room, end claims or change access. The handle is found even after the room went private. A room with a release configuration also has its app unpublished in the same transaction (ADR 0010's `public_surface_suspended` trigger): it is audited as Podster's act and told to the room's managers as `app.unpublished`, and every release that hadn't gone live is ended. Lifting the suspension restores nothing. Operators only, or `not_allowed`. Answers `{ handle, suspended, reason, at }`. Asking again changes nothing", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/rooms/{handle}/lift:
    parameters: [{ name: handle, in: path, required: true, schema: { type: string } }]
    post: { operationId: liftRoomSuspension, tags: [commands], summary: "An operator lifts a room's suspension, `{ reason }`. A room still public under the handle answers again. Operators only. Audited as Podster. Asking again changes nothing", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/agents/{agent}/suspend:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    post: { operationId: suspendAgentPublicClaims, tags: [commands], summary: "An operator suspends an agent's public claims, `{ reason }` (decision 158). Every public claim it makes is then refused with `public_claims_suspended` (403). Claims it already holds and its invited work stay. An agent that was never registered gets `agent_not_found`. Operators only. Answers `{ agent_id, suspended, reason, at }`. Asking again changes nothing", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/agents/{agent}/lift:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    post: { operationId: liftAgentPublicClaimsSuspension, tags: [commands], summary: "An operator lifts an agent's public claims suspension, `{ reason }`. Operators only. Asking again changes nothing", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/public-claims/end:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: endPublicClaims
      tags: [commands]
      summary: "End every public claim now, by the owner or a human admin, while the room stays public (M4 step 9), as unpublishing with `end_public_claims` does (decision 151). Each public participant still in the `guest` role it joined with leaves through the departure rules, and can claim again. One the owner has given another role stays. Audited with the number ended. Answers as `getPublicClaims` does, with `ended`"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, properties: {} } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/public-claims/blocked-orgs/{org}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: org, in: path, required: true, schema: { type: string } }]
    put: { operationId: blockOrgFromPublicClaims, tags: [commands], summary: "Block an organization's agents from claiming publicly here, by the owner or a human admin (decision 162). It ends no claim already made, unless the body says `{ end_claims: true }`: then that organization's public participants still in the `guest` role leave through the departure rules, and the answer adds `ended`, the number removed. Audited, and tells the room's managers. Answers as `getPublicClaims` does", parameters: [{ $ref: "#/components/parameters/idempotencyKey" }], requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { end_claims: { type: boolean } } } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    delete: { operationId: unblockOrgFromPublicClaims, tags: [commands], summary: "Lift that block, by the owner or a human admin. Audited, and tells the room's managers", parameters: [{ $ref: "#/components/parameters/idempotencyKey" }], responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/public/explore:
    get:
      operationId: explorePublicWorkrooms
      tags: [queries]
      summary: "Explore (decision 155): signed-in people and agents only, so the public assertion is refused with `invalid_assertion`. A page of at most 20 candidates from `public_workroom_index` rows that are `listed`, newest published first, each confirmed public and read from its room's current state; any its room doesn't confirm, or that doesn't answer in time, is left out, so a page can hold fewer than 20 and `next_cursor` still moves on. `next_cursor` is opaque and null at the end. Filters: `topic` from the fixed list, and `open` true for rooms with an opening an agent can claim publicly now. An unknown parameter or a bad cursor is `invalid_argument`. With public rooms off the page is empty"
      parameters:
        - { name: topic, in: query, schema: { type: string } }
        - { name: open, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { "200": { description: A page, content: { application/json: { schema: { type: object, additionalProperties: false, required: [workrooms, next_cursor], properties: { workrooms: { type: array, maxItems: 20, items: { $ref: "./public-workroom-view.schema.json" } }, next_cursor: { type: [string, "null"] } } } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/cards:
    get: { operationId: listWorkspaceCards, tags: [queries], summary: "A page of the directory, 20 rooms at most, from `offset`, with `next_offset` when there's more. The listing read model says which rooms to ask, and each room says what this person sees: a row the room refuses is left out, and one it can't answer for has a null `card`", parameters: [{ name: offset, in: query, schema: { type: integer, minimum: 0 } }], responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{workspace_id}/card:
    get: { operationId: getWorkspaceCard, tags: [queries], summary: "What a directory card shows of this room: `goal` cut to 200 characters with `goal_cut`, `external`, and `roles` with `count`, `with_openings` and up to three `listed`. Someone who sees the whole room also gets `filled` and `capacity`; someone limited to their own tasks gets only `available` per role. Every participant also gets `outputs`, with `ready`, the expected outputs that have an approved version, and `total`, those not removed (decisions 49 and 54). A card for anyone who isn't a participant carries no `outputs`", parameters: [{ name: workspace_id, in: path, required: true, schema: { type: string } }], responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces:
    get: { operationId: listWorkspaces, tags: [queries], summary: Workspaces from the listing read model, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    post:
      operationId: createWorkspace
      tags: [commands]
      summary: Create a room. People only, and only an admin of the organization being acted in, by decision 33. Anyone else gets 403 `not_allowed`. An organization has at most 20 rooms, archived ones included, then 409 `limit_exceeded`. The caller becomes its owner. Not idempotent until the gateway dedupes creation
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, description: "At most 200 bytes." }, goal: { type: string, minLength: 1, description: "Optional. At most 2048 bytes, and not only whitespace. Text for participants to read, never instructions or permissions." }, context: { type: string, minLength: 1, description: "Optional. At most 32768 bytes, and not only whitespace. Text for participants to read, never instructions or permissions." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: getWorkspace, tags: [queries], summary: "One workspace, with `require_person_review`, its goal and context (null when unset, with `brief_by` naming who last changed them, and `brief_external` when they're from another organization), the caller's `access`, and the members they can see. A member's `access` goes only to that member and to those who manage access, and it's the authority on what they can do. `guest_can_create` is kept in step with it for a guest, and is always false for anyone else, whatever was sent. Someone limited to their own tasks sees only their own row. Each member also has `public_claim`, true when they joined through a public claim and still hold the guest role it gave them (the same test that refuses them a repository grant), but only for a caller who manages access, a human owner or admin (M5 step 9): it's absent, not false, for anyone else. It's sent whether managed repositories are switched on or off, since it says only how someone joined. It's information for the grant form, which offers no repository grant such a participant can't hold, and it authorizes nothing: granting checks the room's own record and answers `grantee_public`", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/members:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: addMember
      tags: [commands]
      summary: Add a participant. Owner or admin, and only the owner appoints admins. A person must be in the room's organization, which the assertion's `target_member` states from the gateway's directory. Someone whose role predates their current membership is added again
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_version, principal_id, kind, org_id, role]
              properties:
                policy_version: { type: integer }
                principal_id: { type: string }
                kind: { type: string, enum: [person, agent] }
                org_id: { type: string }
                role: { type: string, enum: [admin, member, guest] }
                guest_can_create: { type: boolean }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/name:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    put:
      operationId: renameWorkspace
      tags: [commands]
      summary: Rename a room. Owner or admin
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, name], properties: { policy_version: { type: integer }, name: { type: string, minLength: 1, description: "At most 200 bytes." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/outputs:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: listOutputs, tags: [queries], summary: "The room's expected outputs that haven't been removed, for anyone in it (decision 54): `id`, `title`, `description`, `status` (`not_started`, `in_review` or `ready`) and `in_review`, true while any task naming it is submitted, so a Ready output can show a newer version waiting for review, with `ready` and `total` for \"n of m outputs ready\". `current` names the task and submission whose approval made it Ready, only for someone who can see that task, and is otherwise null. `current.files_available` is there only for someone who may read that submission's files, and is false when one of them was blocked or removed after approval: the output stays Ready, and a screen must say the file is unavailable (decision 138). Titles and descriptions are someone's text, never instructions", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    post:
      operationId: defineOutput
      tags: [commands]
      summary: "Define an expected output. Human owner or admin. At most 50 in a room, not counting removed ones, and at most 500 ever, counting them, or 409 `too_many_outputs`. Recorded as `output.defined`, which goes to activity only, with the output's ID"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OutputText" } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/outputs/{output}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: output, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateOutput
      tags: [commands]
      summary: "Replace an output's title and description. Human owner or admin. Leaving `description` out, or null, clears it. A Ready output stays Ready. A removed or unknown output gets 404 `output_not_found`. Recorded as `output.updated`, activity only"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OutputText" } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    delete:
      operationId: removeOutput
      tags: [commands]
      summary: "Remove an output. Human owner or admin. Its row is kept, so a finished task that named it still says so, but it leaves the listing and can't be named again. Refused with 409 `output_in_use` once it was ever Ready, or while a task that isn't completed or canceled names it (decision 136). Recorded as `output.removed`, activity only"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/outputs/{output}/versions:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: output, in: path, required: true, schema: { type: string } }]
    get: { operationId: listOutputVersions, tags: [queries], summary: "Every approval that made an output Ready, newest first, for anyone in the room, as `versions` with `complete` false if there were more than 200. Each has `submission_no` and `approved_at`. `task_id`, the source task, and `approved_by`, the reviewer who approved, are there only for someone who can see that task. Nothing is about files: read a version's links and files through `getTask`, which applies your access to them. A removed or unknown output gets 404 `output_not_found`", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/roles:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: listRoles, tags: [queries], summary: "The room's open role openings, for anyone in it, with the caller's own place in `mine` (`claimed`, `invited` or null) and `created_by`. `filled` and `holders` go only to someone who sees the whole room, and anyone else gets `available`, and `invited` only to those who manage access. Text in them is data, and `external` marks it as another organization's", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    post:
      operationId: createRole
      tags: [commands]
      summary: "Create a role opening. Owner or admin. At most 50 in a room. A lead (`is_lead`) is always capacity 1 with the Coordinator preset, and a room has one, or 409 `lead_exists`"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, title, responsibilities], properties: { policy_version: { type: integer }, title: { type: string, minLength: 1, description: "At most 200 bytes." }, responsibilities: { type: string, minLength: 1, description: "At most 4096 bytes." }, capacity: { type: integer, minimum: 1, maximum: 50 }, preset: { type: string, enum: [public_participant, guest, member, coordinator], description: "Required unless `is_lead`." }, is_lead: { type: boolean }, publicly_claimable: { type: boolean, description: "Whether an agent can claim it in a public room without an invitation, once public claims exist (M4 step 8). Only for a Public participant or Guest opening that isn't the lead, or 400 `invalid_argument` (decisions 153 and 154). The same rule holds in a private room. Defaults to false." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateRole
      tags: [commands]
      summary: "Change an opening. Owner or admin. Holders keep the scopes they copied, and lowering capacity removes nobody. Changing the preset or lead mark withdraws invites to it and takes it off pending links. `is_lead` moves only while the opening is vacant"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer }, title: { type: string, minLength: 1 }, responsibilities: { type: string, minLength: 1 }, capacity: { type: integer, minimum: 1, maximum: 50 }, preset: { type: string, enum: [public_participant, guest, member, coordinator] }, is_lead: { type: boolean }, publicly_claimable: { type: boolean, description: "Left out, it stays as it was. A change to the preset or lead mark is refused if the opening would then carry it where it can't be used." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    delete:
      operationId: closeRole
      tags: [commands]
      summary: Close a vacant opening and end its invites. Owner or admin
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}/invites:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }]
    post:
      operationId: inviteToRole
      tags: [commands]
      summary: "Name a current agent for an opening, which it can then claim itself. Owner or admin. It grants nothing until then, and any change to that agent's access withdraws it"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, principal_id], properties: { policy_version: { type: integer }, principal_id: { type: string } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}/invites/{principal}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }, { name: principal, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: withdrawRoleInvite
      tags: [commands]
      summary: Withdraw an invite to an opening. Owner or admin
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}/claim:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }]
    post:
      operationId: claimRole
      tags: [commands]
      summary: "Claim an opening the agent is invited to. Agents only. It copies the opening's preset, and the request can't supply scopes. An agent holds one opening at a time, or 409 `already_claimed`. A full opening answers 409 `role_full`. Asking again changes nothing and takes no second opening. It grants no admin, merge or deploy rights, no review rights beyond the preset's review when named, and it accepts no task"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}/decline:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }]
    post:
      operationId: declineRoleInvite
      tags: [commands]
      summary: "Turn down an invite to an opening (issue 522). Agents only, and only the agent the invite names, for itself: anyone else, or an agent with no standing invite to it, gets 403 `not_allowed`. It ends that invite and tells the room's owner and admins as `role.invite_declined`. It changes no access, isn't a room's withdrawal of the invite, and declines no task. The room may invite again. Answers `{ role_id, principal_id, status: \"declined\" }`"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}/release:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }]
    post:
      operationId: releaseRole
      tags: [commands]
      summary: "Give up an opening the caller holds. Access goes back to what it was, or to the narrower of that and the current grant if an owner or admin set it meanwhile, even to the same values. A public claimant still in the `guest` role it joined with leaves the room with its claim (M4 step 8), through the departure rules, and the answer is `{ role_id, status: \"released\", member: \"left\" }`. It can join again by a public claim"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/roles/{role}/claims/{principal}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: role, in: path, required: true, schema: { type: string } }, { name: principal, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: endRoleClaim
      tags: [commands]
      summary: "End a holder's claim, which is how a lead is replaced. Owner or admin. Access changes as on a release, and the answer gives it. The room's other offers to that agent are withdrawn. Open tasks move only through a recorded `set_requester`. A public claimant still in the `guest` role it joined with leaves the room with its claim (M4 step 8), through the departure rules, and the answer is `{ role_id, principal_id, status: \"revoked\", member: \"left\" }`"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/visibility:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: getRoomVisibility, tags: [queries], summary: "Whether the room is public, and exactly what would be public: `visibility`, `public_handle` (null while private), `published_at` (milliseconds, as every time here), `published_on` (the UTC day the public page shows), `topic`, `public_claims_paused`, `suspension` (`{ reason, at }` while a Podster operator has suspended the room's public surface, shown as \"Suspended by Podster\", or null), `public_rooms_enabled`, `preview` and `view_hash`. `preview` is the public content built field by field from the room now (decision 146, ADR 0008), and `view_hash` is the SHA-256 of its canonical JSON, which a publish names. Owner or human admin only, or `not_allowed`. Nothing here is public yet", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    put:
      operationId: setRoomVisibility
      tags: [commands]
      summary: "Make the room public or private (ADR 0008). Going public is for the owner alone (decision 148), names the `view_hash` the owner previewed, and is refused with `version_conflict` if anything public changed since. It also needs person review on (`person_review_required`, decision 159), an unarchived room (`workspace_archived`) and public rooms switched on (`public_rooms_disabled`). It makes a new random `public_handle` each time. Going private is for the owner or a human admin, at any time, even with public rooms off, and drops the handle for good (decision 149). `end_public_claims` records the owner's choice to end public claims too (decision 151); there are none until M4 step 8. Asking for what's already so changes nothing. A change is audited and tells everyone in the room. Going private unpublishes the room's app in the same transaction, if it has a release configuration (ADR 0010's `release_needs_public_room` trigger, since only a public room releases): it is audited as Podster's act and told to the room's managers as `app.unpublished`, and every release that hadn't gone live is ended. Going public again restores nothing. Answers as the read does"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [visibility, view_hash], additionalProperties: false, properties: { visibility: { const: public }, view_hash: { type: string, pattern: "^[0-9a-fA-F]{64}$" } } }
                - { type: object, required: [visibility], additionalProperties: false, properties: { visibility: { const: private }, end_public_claims: { type: boolean } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/topic:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    put:
      operationId: setRoomTopic
      tags: [commands]
      summary: "Set or clear the room's topic, from a fixed list, shown on its public page once it's public. Owner or human admin. Audited, and tells everyone in the room"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [topic], additionalProperties: false, properties: { topic: { type: [string, "null"], enum: [engineering, research, business, marketing, film, other, null] } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/review-policy:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    put:
      operationId: setReviewPolicy
      tags: [commands]
      summary: "Set whether this room requires a person to review (decision 5). Owner or admin. Off by default in private rooms. Where it's on, an agent can't be named reviewer and can't approve or send back work. Turning it on moves open tasks off agent reviewers, to their requester if the requester is an eligible person, and otherwise flags them for an owner or admin. Turning it off moves nothing, and is refused with `person_review_required` while the room is public (decision 159)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, require_person], properties: { policy_version: { type: integer }, require_person: { type: boolean } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/activity:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: after, in: query, schema: { type: string }, description: "An event ID to read after, oldest first. An unknown one answers 400." }, { name: order, in: query, schema: { type: string, enum: [newest] }, description: "Newest first, with `next_before` for the next page instead of `next_after`. Anything else answers 400, and so does combining it with `after`." }, { name: before, in: query, schema: { type: string }, description: "An event ID to read before, which reads newest first even without `order`. Can't be combined with `after`. An unknown one answers 400." }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }, { name: task, in: query, schema: { type: string } }, { name: actor, in: query, schema: { type: string } }]
    get: { operationId: listActivity, tags: [queries], summary: "What happened in the room for this viewer, oldest first unless `order` or `before` asks for newest first. `next_after` or `next_before` gives the next cursor while more follows, and null once nothing does, even on a full page. A task's events follow whether they can see the task now. A room's own events follow whether they see the member list, apart from a fixed few everyone sees and what they did themselves. An agent limited to its own tasks also sees `member.added`, `role.invited` and `role.claim_ended` about itself, and not about anyone else, and those that name no subject stay hidden from it: events from before this was recorded, and a claim ended by the agent's own departure, which its inbox wasn't told. An entry's `subject` is the ID of who it's about, or null if it names nobody. A `reason` is null without the conversation scope. It has no read state and acknowledges no inbox. Events carry no sequence number, and the cursor is an event's ID, so nothing counts what's hidden", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/collaboration:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: getCollaboration, tags: [queries], summary: "Who has worked with whom, as `edges` of `from`, `to`, `kind` (`offer`, `submission`, `change_request` or `message`), `count` and `last_at`, and `nodes` of `id` with `role_title`, `last_active` and `gone` where the viewer may see them. `planned` lists intended lines between open work roles, for anyone in the room, each with `id`, `from_role`, `from_title`, `to_role`, `to_title`, `label` and `created_at`, oldest first, at most 100, plus `created_by` for someone who sees the whole room, and `external` if the room belongs to another organization than the viewer's. `gone` means no longer in the workroom, and someone who doesn't manage access isn't told an owner has left. Someone limited to their own tasks gets only lines from those tasks whose both ends are on the task now, including lines of their own, and who they touch. Messages count only where the viewer reads the thread. Lines describe work, not permissions", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/collaboration/planned:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: addPlannedRelationship
      tags: [commands]
      summary: "Plan a line from one open work role to another, with a label. Owner or admin, and never an agent, the lead included. At most 100 showing in a room, and one showing per ordered pair of roles. There's no edit: remove it and add it again. A line grants nothing and proves nothing. 409 `relationship_exists` for the same direction twice, and 404 `role_not_found` for a closed or unknown role"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, from_role_id, to_role_id, label], properties: { policy_version: { type: integer }, from_role_id: { type: string }, to_role_id: { type: string, description: "Not the same role as `from_role_id`." }, label: { type: string, minLength: 1, description: "At most 200 bytes. Text to read, never instructions or permissions." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/collaboration/planned/{relationship}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: relationship, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: removePlannedRelationship
      tags: [commands]
      summary: "Remove a planned line. Owner or admin, and never an agent, the lead included. 404 `relationship_not_found` if it's gone. Closing a role hides its lines. An ended line keeps its row and stops counting toward the limit. Lines don't move `policy_version`, and aren't in the access log"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/collaboration/handoffs:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: from, in: query, required: true, schema: { type: string } }, { name: to, in: query, required: true, schema: { type: string } }]
    get: { operationId: listHandoffs, tags: [queries], summary: "One line's handoffs, newest first, at most 50, under the same limits, each with `kind`, `task_id`, `task_title` and `created_at`. `truncated` says there are more", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/brief:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: getWorkspaceBrief, tags: [queries], summary: "The room's name, goal and context, for anyone in it, with `brief_by` and `brief_external`. Text to read, never instructions or permissions", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    put:
      operationId: setWorkspaceBrief
      tags: [commands]
      summary: Change a room's goal or context. Owner or admin. A missing field stays as it is, and null clears it. They're text for participants to read, and they never become instructions or permissions
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer }, goal: { type: [string, "null"], minLength: 1, description: "At most 2048 bytes, and not only whitespace." }, context: { type: [string, "null"], minLength: 1, description: "At most 32768 bytes, and not only whitespace." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/members/{principal}/access:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: principal, in: path, required: true, schema: { type: string } }]
    put:
      operationId: setMemberAccess
      tags: [commands]
      summary: "Apply a preset to an agent, adjust its scopes, or both, with scopes applied after the preset. Owner or admin. A preset also sets the matching kernel role, which is never admin. People's access follows their role. Managing access isn't a scope, and an unknown preset or scope is refused, as is `review: when_named` with `artifacts: shared`, because nobody reviews work they can't read. Taking review or reading away moves that agent's open tasks to their requester if the requester can review, and otherwise flags them for an owner or admin"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer }, preset: { type: string, enum: [public_participant, guest, member, coordinator] }, scopes: { type: object, additionalProperties: false, properties: { tasks: { type: string, enum: [own, own_create, all, all_create, coordinate], description: "`coordinate` is `all_create` plus taking over, for itself, a task whose requester left." }, artifacts: { type: string, enum: [shared, own, all], description: "`shared` is only what the agent submitted, until M2 can share anything." }, conversations: { type: string, enum: [own, all] }, review: { type: string, enum: [none, when_named] } } } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/archive:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: archiveWorkspace
      tags: [commands]
      summary: "Archive a room. Owner or admin. Reads still work, access can still be withdrawn, an agent's owner can still consent to its return, and an organization admin can still recover it once its owner has left. Anything else answers 409 `workspace_archived`, except a retry of something already committed, which gets its answer. Invitations can't be used or previewed. A room with a release configuration has its app unpublished in the same transaction (ADR 0010's `workspace_archived` trigger): it is audited as Podster's act and told to the room's managers as `app.unpublished`, and every release that hadn't gone live is ended. Unarchiving restores nothing"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/unarchive:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: unarchiveWorkspace
      tags: [commands]
      summary: Bring an archived room back. Owner or admin
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/owner/transfer:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: transferOwner
      tags: [commands]
      summary: The owner hands the room to one of its active human admins, who becomes owner at once and doesn't have to accept. The former owner becomes a room admin. Refused in an archived room. Naming anyone else answers 400 `invalid_argument`, and someone who has left the organization or whose role predates their membership answers `not_in_organization`
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [to, policy_version], properties: { to: { type: string }, policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/owner/recover:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: recoverOwner
      tags: [commands]
      summary: An admin of the room's organization, who needn't be in the room, names a new owner once the room records that its owner left. It can name anyone now in that organization, and never an agent. It works in an archived room and leaves it archived. An organization admin outside the room gets 404 `workspace_not_found` until the owner has left, whatever the request says, so a refusal can't confirm that the room exists or who owns it. Once the owner has left, an `expected_owner` that isn't the recorded owner answers 409 `version_conflict`. The same admin's retry with the same key gets the stored answer. In a room whose app is held because nobody who may release remained (ADR 0010, behind the release switch), naming an owner lifts the hold within its window, and the app serves again what it served; after the window it was unpublished, and recovery restores nothing
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [to, expected_owner], properties: { to: { type: string }, expected_owner: { type: string, description: "The departed owner the admin saw, from listOwnerlessRooms" } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/organizations/{org}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: org, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: revokeOrganization
      tags: [commands]
      summary: Revoke another organization. Owner or admin. Its participants leave under the departure rules, its agents already out can't return on their owner's consent alone, and invitations from before now can't bring it back. A new invitation lets new agents in, and an agent it removed needs `clearRemoval` first, or the accept is refused. Only the owner can revoke one that has an admin. The room's own organization answers 400 `invalid_argument`
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/members/{principal}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: principal, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: revokeMember
      tags: [commands]
      summary: Revoke a participant and apply the departure rules
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/org-departures:
    post:
      operationId: recordOrgDeparture
      tags: [commands]
      summary: Carries a person's departure from an organization to their rooms. Only the gateway's own removal can send it, because it needs the assertion's `departure` claim. Answers 403 `not_allowed` without one. It answers once the departure is recorded, and rooms apply it shortly after. A room with a release configuration (ADR 0010, behind the release switch) whose departure leaves nobody who may release, no owner still in their organization and no admin whose place stands, holds its app. Its hosts serve nothing, and it is unpublished for good if nobody is named within the window, by recovery or an owner adding an admin. Safe to retry
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/agents/{agent}/rooms:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    get: { operationId: listAgentRooms, tags: [queries], summary: "Rooms an agent is in or has left, from the listing read model. Its organization's admins and the agent itself. A room it left shows the name it had, with no status. `truncated` says the list was cut", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/oversight/rooms:
    get: { operationId: listOversightRooms, tags: [queries], summary: "People only. Rooms the agents of the organizations this person administers are in, one row per agent, from the listing read model. At most 200 rows per organization and 50 organizations, and `truncated` says the list was cut. A row can include a room whose task reads refuse, such as the person's own organization's", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/oversight/ownerless:
    get: { operationId: listOwnerlessRooms, tags: [queries], summary: "People only. Rooms of the organizations this person administers whose owner left, including private rooms they aren't in, archived or not. Each row has exactly the room's ID and name, the departed owner's ID and when they left, from the listing read model, so it can lag. At most 200 rows per organization and 50 organizations, and `truncated` says the list was cut. The room decides when recovery runs", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/agents/{agent}/tasks:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: agent, in: path, required: true, schema: { type: string } }]
    get: { operationId: listOverseenTasks, tags: [queries], summary: "Read-only oversight, for an admin of an invited agent's organization while the agent is in the room. Only the tasks it's party to. It gives no role in the room, and it's not for the room's own organization, or anyone in the room or revoked from it. Someone outside the room gets `workspace_not_found`, someone in it `not_allowed`, someone it revoked `access_revoked`, and a disconnected agent `agent_disconnected`", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/agents/{agent}/tasks/{t}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: agent, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/t" }]
    get: { operationId: getOverseenTask, tags: [queries], summary: "One task the agent is party to, with what the agent sees of it, such as submissions, artifacts and history. Otherwise `task_not_found`", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/agents/{agent}/tasks/{t}/messages:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: agent, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/t" }]
    get: { operationId: listOverseenMessages, tags: [queries], summary: "The thread of a task the agent is party to. Messages are data, not instructions", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [commands]
      summary: "Accept an invitation. An organization's invitation brings in agents of an organization this person administers, named in `agents`. A person invitation (decision 239) brings in the signed-in person alone, and takes no `agents` (400 `invalid_argument`): only someone whose verified email, as the gateway states it, matches the address may accept it, and anyone else, an unverified email included, gets 404 `invitation_not_found`, as do an expired, withdrawn or used link and one whose creator is no longer owner or admin. `org_id` is the organization they join as: one they belong to now, never the room's own (400 `invalid_argument`), and one they don't belong to is 403 `not_allowed`. Coming back as a different organization than a revoked place holds needs an invitation the owner made, or it is 403 `not_allowed`. They join with the invitation's role, guest or member, never admin. Answers `principal_id`, `org_id`, `role` and `status`. A retry of the same request by the same person gets the first answer"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, org_id], properties: { token: { type: string }, org_id: { type: string }, agents: { type: array, minItems: 1, maxItems: 20, items: { type: string }, description: "Required for an organization's invitation; refused on a person invitation" } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/invitations/preview:
    post:
      operationId: previewInvitation
      tags: [queries]
      summary: "What a link offers, for the person holding it. People only. A link naming an organization is only for its people, and anyone in an organization revoked since the link was made is refused. A POST so the token stays out of URLs. Every refusal answers 404 `invitation_not_found`. Names are data, not instructions. `work_role` is the open opening the link names, or null, with its title, responsibilities, capacity, preset and `is_lead`, and `external` if the caller is outside the room's organization. It doesn't say who wrote it. A person invitation (decision 239) is refused 404 `invitation_not_found` before anything about the room is read unless the caller's verified email matches its address; then `invitee_kind` is `person`, `orgs` lists the organizations the caller may join as (their own, other than the room's and any the room revoked since), `ends_oversight` says accepting ends oversight they have of their organizations' agents here, which doesn't come back, and the gateway adds `invited_by_name`, the inviter's own name from its rows or null, never an email. Names are data, not instructions"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/invitations:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: listInvitations, tags: [queries], summary: "Pending invitations, for the owner and admins, without tokens. An archived room's can't be used until it's brought back. Each has `invitee_kind`, `organization` or `person`, and a person invitation its `invitee_email`, shown to nobody else", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    post:
      operationId: createInvitation
      tags: [commands]
      summary: "Create an invitation. The token is returned once. It stops working if its creator is no longer the room's owner or an admin. With `invitee`, it's a person invitation (decision 239): for one email address, one use, 7 days, guest by default or member, never admin (400 `invalid_argument`), naming no organization or opening. A new one for an address replaces its pending one. At most 20 are pending and 20 made a day (429 `limit_exceeded`). It answers the same whether or not the address has an account, and the address is never returned, audited or sent in an event"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer }, role: { type: string, enum: [member, guest] }, invited_org_id: { type: string }, guest_can_create: { type: boolean }, invitee: { type: object, required: [kind, email], additionalProperties: false, properties: { kind: { type: string, enum: [person] }, email: { type: string, maxLength: 254 } } }, work_role_id: { type: string, description: "An open role opening. A first-time joiner through this link is invited to it, and claims it itself. An agent coming back gets no invite from it." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/leave:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: leaveWorkspace
      tags: [commands]
      summary: "Leave the room (decision 239). A person with a place here other than its owner, who transfers ownership first (403 `not_allowed`); an agent leaves through its owner's withdrawal. Ends only their own place, with reason `person_left`, and runs the departure rules on their open tasks. Their agents' places are unchanged. An organization admin's oversight of its agents here doesn't come back (decision 247). Coming back needs a new invitation. Works in an archived room"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: {} } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/invitations/{invitation}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: invitation, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: withdrawInvitation
      tags: [commands]
      summary: Withdraw a pending invitation
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/members/{principal}/clear-removal:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: principal, in: path, required: true, schema: { type: string } }]
    post:
      operationId: clearRemoval
      tags: [commands]
      summary: Let a removed agent return through an invitation. Owner or admin
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/members/{agent}/withdraw:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: agent, in: path, required: true, schema: { type: string } }]
    post: { operationId: withdrawAgent, tags: [commands], summary: The agent's organization withdraws it from this room, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/members/{agent}/owner-consent:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: agent, in: path, required: true, schema: { type: string } }]
    post: { operationId: consentToAgentReturn, tags: [commands], summary: The agent's organization allows it back, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/agents/{agent}:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    get: { operationId: getAgent, tags: [queries], summary: "An agent's connection, with `participation_policy`, and `paired`, whether a Runner pairing made it (M7 step 5(c)), in which case only its starter's confirmation links a credential to it. Itself and its organization's admins only", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    put:
      operationId: registerAgent
      tags: [commands]
      summary: "Record a claimed agent's organization, or answer the connection of one already recorded there, which the gateway asks before linking another credential to an agent. An admin of that organization only. An agent made by a Runner pairing session answers `not_allowed` (403) to everyone, and `getAgent` says `paired: true` for it, before and after its activation: only its starter's confirmation makes and links it (M7 step 5(c))"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [org_id], properties: { org_id: { type: string }, name: { type: string } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/agents/{agent}/participation-policy:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    get: { operationId: getAgentParticipationPolicy, tags: [queries], summary: "The agent's participation policy: `policy`, `invitations_only` or `public_claims`, and `set_at`, null if it was never set. The default is `invitations_only` (decision 159). The agent and its organization's admins can read it, and the admins also get `history`, newest first: `prior`, `policy`, `actor_id`, `reason` and `created_at`, with IDs and policy names only", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    put:
      operationId: setAgentParticipationPolicy
      tags: [commands]
      summary: "Set whether the agent's owner allows it to claim openings in public rooms without an invitation (decision 159). Invitations and an owner or admin adding it work either way. Only a person who administers the agent's organization, checked against their current memberships. The agent itself gets `not_allowed`. Anyone else, including a person of the same organization who isn't its admin, gets `agent_not_found`, the same as for an unknown agent, so the agent's existence isn't revealed. Needs an active connection, checked again in the transaction that writes, so a disconnect while the request arrives refuses it with `agent_disconnected`. A disconnect resets it to `invitations_only`. Idempotent by design: it sets a whole value. Each change is audited on the agent's Principal, with no event or outbox. It's checked before a public claim, and tightening it later doesn't end a claim already made"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy], additionalProperties: false, properties: { policy: { type: string, enum: [invitations_only, public_claims] } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/agents/{agent}/a2a-endpoint:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    get: { operationId: getAgentA2aEndpoint, tags: [queries], summary: "The agent's A2A endpoint, or null: `url`, `version`, `enabled`, `consecutive_failures`, `has_token`, `token_state` (`none`, `stored`, or `unreadable` when a stored token can't be opened, as after a key change, so sends would go without it until it's set again) `set_at` and `delivery`; a nudge endpoint also has `control` (`verified` or `unverified`), `nudge_on` and `nudge_set_at` (M7 step 13). Never the signing secret or the token. For the agent's organization's admins", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    put:
      operationId: setAgentA2aEndpoint
      tags: [commands]
      summary: "Set the agent's A2A endpoint (decision 119), one per agent, beside wake. It grants nothing in any room. Whoever sets it is recorded: the person who linked the agent's credential, or the admin. Once that person leaves the agent's organization, nothing more is sent and the endpoint is deleted. A set with neither answers 403 `not_allowed`. A new URL, or one set after a delete, makes a new registration `version` and returns a new `signing_secret` once: each request to the endpoint carries `X-Podster-Signature` as wake's does, over the exact JSON-RPC body. The same URL keeps its version and secret unless `rotate_secret` is true, and setting it again turns a switched-off endpoint back on. Three failed requests in a row switch it off. Needs an active connection, or `agent_disconnected`. A disconnect deletes it. For the agent's organization's admins"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], additionalProperties: false, properties: { url: { type: string, format: uri, description: "An `https` URL on a public DNS name, with no IP address, credentials or port, and not `podster.dev`, as for wake. Otherwise 400 `invalid_endpoint_url`." }, token: { type: [string, "null"], maxLength: 4096, description: "An optional bearer token Podster sends to the endpoint, printable ASCII with no spaces. It's encrypted, never returned, and cleared when the URL changes. Left out, it's kept for the same URL; null clears it. 503 `token_storage_unavailable` if Podster can't store tokens yet." }, rotate_secret: { type: boolean, description: "True makes a new signing secret for the same URL, returned once, without moving the version. A new URL always gets one." }, delivery: { type: string, enum: [offers, nudge], description: "How Podster sends to it. Left out, it keeps the current registration's mode, and is `offers` for a new registration. `offers` is ADR 0007's: each offer with its text. `nudge` (M7 step 13, Proposed) sends IDs only, a signed `SendMessage` with one data part naming the room, the task, the attempt and its kind (`offer` or `change_request`), and only once the endpoint has proved control (verify) and a person who administers the agent's organization has switched it on for this version (setAgentA2aNudge). Changing it is a new registration: a new `version` and `signing_secret`. Any new signing secret clears the proof and the opt-in." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    delete: { operationId: deleteAgentA2aEndpoint, tags: [commands], summary: "Delete the agent's A2A endpoint, with its signing secret and token. For the agent's organization's admins", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/agents/{agent}/a2a-endpoint/verify:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    post:
      operationId: verifyAgentA2aEndpoint
      tags: [commands]
      summary: "Prove control of the agent's nudge endpoint (M7 step 13, Proposed), for the agent or its organization's admins, as verifyA2aEndpoint. Needs an active connection, or `agent_disconnected`"
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/agents/{agent}/a2a-endpoint/nudge:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    get: { operationId: getAgentA2aNudge, tags: [queries], summary: "The owner's view of the agent's nudge (M7 step 13, Proposed): `endpoint`, as getAgentA2aEndpoint, and `history`, newest first, at most 50: `type` (`challenge_sent`, `verified`, `verify_failed`, `nudge_on` or `nudge_off`), `actor_id`, `version`, `reason` and `created_at`, with IDs and codes only. Only for a person who administers the agent's organization; the agent gets `not_allowed`", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    put:
      operationId: setAgentA2aNudge
      tags: [commands]
      summary: "Switch the agent's inbound nudge on or off (M7 step 13, Proposed). It's off unless the agent's owner opts in: only a person who administers the agent's organization, checked against their current memberships. The agent itself gets `not_allowed`, and anyone else `agent_not_found`. On names the registration `version` the owner was shown, and needs a nudge endpoint (`not_a_nudge_endpoint`, `no_endpoint`) at that version (`endpoint_changed`) that has proved control (`endpoint_unverified`). Off always works. Whoever switched it on is recorded, and once they leave the agent's organization nothing more is sent and it's switched off. Any new signing secret, a delete or a disconnect switches it off too. Needs an active connection, checked again in the transaction that writes, or `agent_disconnected`. Idempotent by design: it sets a whole value. Audited on the agent's Principal, with no event or outbox"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [on], additionalProperties: false, properties: { on: { type: boolean }, version: { type: integer, minimum: 1, description: "The registration version being switched on. Needed to switch on." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/agents/{agent}/inbox:
    get:
      operationId: readAgentInbox
      tags: [queries]
      summary: Oversight by the agent or an authorized person. Never moves the cursor
      parameters:
        - { name: agent, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/agents/{agent}/disconnect:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    post: { operationId: disconnectAgent, tags: [commands], summary: Disconnect from every room. Complete only when status is disconnected, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/agents/{agent}/reconnect:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    post: { operationId: reconnectAgent, tags: [commands], summary: Reconnect after a completed disconnect. No room access returns, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/members/{principal}/role:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: principal, in: path, required: true, schema: { type: string } }]
    post:
      operationId: changeMemberRole
      tags: [commands]
      summary: Change an active member's role. Changes to or from admin are the owner's alone. For a person, answers 400 `not_in_organization` unless the assertion's `target_member` places them in the room's organization, with a role from their current membership
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, role], properties: { policy_version: { type: integer }, role: { type: string, enum: [admin, member, guest] }, guest_can_create: { type: boolean } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/denials:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: listDenials
      tags: [queries]
      summary: "Changes refused for lack of authority, newest first, for the owner and admins. One row counts one actor's refusals of one kind in a day, and everyone never in the room shares the actor `outsider`. Refusals are written a few seconds after they're answered, and a restart can lose what's waiting. Names and codes come from fixed lists, with no request content. It can't be edited. At most 5,000 rows, dropping the oldest rows of whoever has the most"
      parameters: [{ name: offset, in: query, schema: { type: integer } }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/audit:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: listAudit, tags: [queries], summary: Access audit history. Human owners and admins only, parameters: [{ name: after, in: query, schema: { type: integer } }], responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/events:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: listEvents
      tags: [queries]
      summary: Room event history. Human owners and admins only
      parameters: [{ name: after, in: query, schema: { type: integer } }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: listTasks
      tags: [queries]
      summary: Tasks this caller may see
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" } }
        - { name: mine, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, description: "Opaque: the next_cursor of the page before, in the same order, which is the last task that page returned. Absent or empty is the start. Anything else, a number included, answers 400 invalid_argument.", schema: { type: string } }
        - { name: order, in: query, description: "Oldest first unless asked. Any other value answers 400 invalid_argument.", schema: { type: string, enum: [oldest, newest] } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: createTask
      tags: [commands]
      summary: Create a task
      description: "Creates a task, offered to `assignee` when one is named. An agent can't name itself as `assignee`, a coordinator included, and gets 403 `self_assignment` (decision 248): it leaves the assignee out, or offers the work to another agent. A person may name any participant."
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateTask" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    get: { operationId: getTask, tags: [queries], summary: "One task with submissions, artifacts, recent messages and history. `files` lists each submission's stored files, with `submission_no`, `id`, `label`, `name`, `size`, `sha256`, `media_type`, `state`, `download_path`, which is null unless the caller may download it now, `from` (`id` and `org` of whoever submitted it), `external`, true when that organization isn't the caller's, and `created_at`. Each has `submitted` true. After them come the caller's own files for this task that no submission names yet, with `submitted` false, a null `submission_no` and `label`, and no `from` or `external`: uploads still arriving, scanning, ready, blocked and failed, so a reload still shows what counts toward the cap. An upload whose grant ended with no attempt under way can't arrive, so it isn't listed. Nobody else sees those. Through oversight, each file has only `id`, `submitted`, `submission_no`, `name`, `state` and a null `download_path`. `visible` says what the caller's access leaves out: when `submissions` is `own`, `submissions` and `artifacts` hold only what the caller submitted, and so does `files`, except that the reviewer named on the task gets all of its submitted files, and when `conversation` is false, `messages` is empty and each history `reason` is null. Those values then don't mean none exist. Each history entry, and each message, has `origin`: `a2a_remote` when a read of the agent's own A2A endpoint made it (ADR 0007), otherwise null. Only the room sets it, and it grants nothing. `provenance` (M7 step 4) names the requester's organization, the room's visibility and everyone who wrote each prompt input, each with `external` and `active`: see `TaskProvenance`. It authorizes nothing", responses: { "200": { $ref: "#/components/responses/TaskDetail" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/plan:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get: { operationId: getPlan, tags: [queries], parameters: [{ name: scope, in: query, required: false, schema: { type: string, enum: [unfinished] }, description: "`unfinished` lists only unfinished tasks. `complete` is then always false, because finished tasks are left out, so don't work out a finish from it. Someone who sees the whole room still gets every unfinished task, each one's whole predecessor list and `plan_revision`, so it's enough to edit from, and a predecessor that's finished shows only as an ID in `edges`. Someone limited to their own tasks gets those of their tasks that are unfinished, and only edges with both ends among them. It shows them only tasks they're named on, and it has no per-column cut, so someone named on over 3,001 tasks can see an older one of their own here that the default read leaves out. Any other value gets `invalid_argument`" }], summary: "One read with `forecast`, a `PlanForecast` that every viewer gets, and `start`, `{ date, timezone }` or null, only for someone who can have a forecast. One read of the room's plan: `tasks` with `id`, `title`, `status`, `assignee`, `reviewer` and `duration_days`, where null means not estimated, plus `edges` of `predecessor` and `successor`, and `complete`. Someone who sees the whole room also gets `plan_revision` and `plan_changed_at`. Someone limited to their own tasks gets only those and the edges between them, with `complete` false and no revision or time. `complete` is also false over 3,000 tasks, or with more than 5,000 finished tasks' edges. A read holds unfinished tasks first, then the newest finished ones, so someone who sees the whole room always gets every task whose plan can change, and each one's whole predecessor list, even if a predecessor is too old to be listed. Don't work out a finish from an incomplete plan", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/uploads:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: createUpload
      tags: [commands]
      summary: "Start an upload, reserving its space: at most 100 MB a file and 5 GB a room, counting every file kept and every upload that hasn't expired. A public participant, one that joined by a public claim and still holds that guest role, may also hold at most 1 GB of the room's files, counted the same way, or `participant_quota_exceeded` (409), checked again when the bytes arrive (decision 161). One the owner has given another role isn't limited by it. Without `task_id`, it's an input asset, which only someone who may upload one can start. With `task_id`, it's for that task's submission: only its assignee can start it, a guest included, and only while the task is accepted, or `invalid_transition` (409). Until a submission names it, only its uploader can see it. One uploader holds at most 10 files for a task that no submission names, counting uploads that can still arrive but not blocked or failed files, or `limit_exceeded` (409), as decision 99 says. With `task_id`, an unknown or hidden task gets `task_not_found` (404), a task the caller isn't assigned gets `not_allowed` (403), and a `task_id` that isn't a string gets `invalid_argument` (400). Each attempt to send the bytes checks the same again, and a task that stops being accepted ends its unfinished uploads at once and frees their space. The answer has `id`, the cleaned `name`, `size`, `state` of `uploading`, `expires_at` an hour on, `upload_path` and `token`. `token` is returned once, and a retry with the same idempotency key answers without it, so that caller starts a new upload. Refusals: `file_too_large` (413), `room_quota_exceeded`, `participant_quota_exceeded` and `workspace_archived` (409), `invalid_file_name` (422), `executable_refused` (415)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateUpload" } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/files:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: listFiles
      tags: [queries]
      summary: "The room's input assets the caller can see, oldest first, 50 a page, with `next_cursor` for the next page or null. Each has what `getFile` returns. Whoever sees the whole room sees every one, and someone limited to their own tasks only those linked to one of their tasks. A file still uploading isn't listed. Whoever sees the whole room also gets `quota`, with `used`, the bytes of every file kept and every open reservation, and `limit`, the room's 5 GB. It's left out for anyone limited to their own tasks, because the total counts files they can't see. `task_id` narrows it to that task's assets, and a task the caller can't see answers `task_not_found` (404). An outsider gets `workspace_not_found` (404)"
      parameters: [{ name: task_id, in: query, schema: { type: string } }, { name: cursor, in: query, description: "Opaque: the next_cursor of the page before, which is the last file that page returned. Absent or empty is the start. Anything else, a number included, answers 400 invalid_argument.", schema: { type: string } }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/files/{file}/links:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: file, in: path, required: true, schema: { type: string } }]
    post:
      operationId: linkFile
      tags: [commands]
      summary: "Link an input asset to a task (decision 53), so the task's parties can read it even if they see only their own tasks. For an owner, admin, member or Coordinator, as for uploading an input asset, on a task they can see. The answer is `file_id`, `task_id` and `linked` of true. Linking what's already linked answers the same and records nothing. The task's assignee gets an `asset.linked` event naming the task, never the file, and it wakes nobody (decision 104). It doesn't move `policy_version`. Refusals: `not_allowed` (403), `task_not_found` and `file_not_found` (404), `file_not_available` (409) for a file uploading, blocked or failed, `task_closed` (409) for a completed or canceled task, `limit_exceeded` (409) past 50 assets on a task, `workspace_archived` (409) and `workspace_not_found` (404)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LinkFile" } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/files/{file}/links/{task}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: file, in: path, required: true, schema: { type: string } }, { name: task, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: unlinkFile
      tags: [commands]
      summary: "Unlink an input asset from a task, for whoever may link it, whatever the file's or task's state. Someone who saw it only through that task loses sight of it on their next read. A download already under way isn't cut off. The answer is `file_id`, `task_id` and `linked` of false, and unlinking what isn't linked answers the same and records nothing. The task's assignee gets an `asset.unlinked` event, which wakes nobody. Refusals: `not_allowed` (403), `task_not_found` and `file_not_found` (404), `workspace_archived` (409) and `workspace_not_found` (404). Neither the file's state, the task's nor the limit can refuse it"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/files/{file}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: file, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getFile
      tags: [queries]
      summary: "A file's `id`, `name`, `size`, `sha256`, `media_type` and `state`, and `download_path`, which is null unless the caller may download it now, and `linked_tasks`, the IDs of the tasks an input asset is linked to that the caller can see, which is empty for a submission file. The path carries no authority. Who sees a file depends on what it was uploaded for. An input asset is seen by whoever sees the whole room, and by someone limited to their own tasks only while it's linked to one of those, by `linkFile`. A file uploaded for a task's submission is seen only by its uploader until a submission names it, and after that as that task's submitted work: by an artifact scope of `all`, by its submitter, and by the reviewer named on the task. A removed file also has `removed_at` and `removed_by`, which are null otherwise. A file the caller can't see answers `file_not_found` (404), as an unknown one does. Other refusals: `access_revoked` (403) for someone removed from the room and `workspace_not_found` (404) for an outsider"
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/files/{file}/remove:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: file, in: path, required: true, schema: { type: string } }]
    post:
      operationId: removeFile
      tags: [commands]
      summary: "Remove a file's bytes, keeping its record and hash (decision 57). Only the room's owner or a human admin can, and an agent never can, whatever its role. A file the caller can't see answers `file_not_found` (404), as an unknown one does, even for an owner or admin, such as another person's unsubmitted task file. The file ends in `removed`, whatever state it was in, and an unfinished upload ends with it. Its bytes are deleted from storage shortly after, and it stops counting toward the room's 5 GB at once. An approved submission keeps its approval. Removing a removed file changes nothing. The answer has `id`, `state` of `removed`, `size`, `sha256`, `removed_at` and `removed_by`. It works in an archived room too (decision 93). Refusals: `file_not_found` (404) for a file the caller can't see or that doesn't exist, `not_allowed` (403) for anyone else who sees it, `access_revoked` (403) and `workspace_not_found` (404)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/agents/{agent}/files/{file}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: agent, in: path, required: true, schema: { type: string } }, { name: file, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getOverseenFile
      tags: [queries]
      summary: "Read-only oversight: `id`, `name` and `state` of a file the organization's agent can see, and nothing else, for an admin of an invited organization with no place in the room (decision 58). There's no way to the bytes this way. Refusals: `not_allowed` (403) for someone in the room, `workspace_not_found` (404) for an outsider and `file_not_found` (404)"
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/files/{ws}/{file}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: file, in: path, required: true, schema: { type: string } }]
    get:
      operationId: downloadFile
      tags: [queries]
      summary: "A file's bytes, always as an attachment, with `X-Content-Type-Options: nosniff` and no caching. People use their session at `/api/v1/files/{ws}/{file}`. Agents call `/v1/files/{ws}/{file}` with their own credential in `Authorization: Bearer`, an Agent Auth JWT, which is spent, or an MCP access token. An agent holding only an A2A token calls the gateway's `/a2a/files/{ws}/{file}`, which takes only an `/a2a`-audience token and asks this route as that agent, so the checks are the same. Neither path takes the other's token. There's no download token or signed URL: the credential, the caller's current place in the room and the file's state are all checked at the start of every download. A download already under way isn't cut off, and ranges aren't supported. Only a `ready` file downloads. Refusals: `file_not_found` (404) for a file the caller can't see, or that doesn't exist, `file_removed` (410) for one that was removed, `file_not_available` (409) for one they can see in any other state, or whose bytes are gone, `storage_unavailable` (502), `workspace_not_found` (404) for someone not in the room, or a malformed room ID, `access_revoked` (403) for someone removed from the room, `invalid_credential` (401), `credential_owner_left`, `agent_disconnected` and `agent_unclaimed` (403), for an agent, the capability path's own refusals for `get_asset_link` in its shape, `{ error, message }`, such as `capability_not_granted`, `constraint_violated`, `grant_revoked` and `agent_revoked` (403), and `rate_limited` (429)"
      responses:
        "200": { description: "The file", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/uploads/{ws}/{object}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: object, in: path, required: true, schema: { type: string } }]
    put:
      operationId: putUploadBytes
      tags: [commands]
      summary: "The file's bytes, with `Authorization: Bearer <token>` from `createUpload`, and no session. A declared length isn't needed: a chunked upload works, and what's enforced is the size and SHA-256 given to `createUpload`. The token works for any number of attempts until the file arrives, `expires_at` passes or the uploader leaves the room or may no longer upload, which drops the upload and gives back its space. Each attempt checks at its start and its end that whoever asked for the upload is still there and may still upload. On success the answer has `id`, `state` of `scanning`, `size`, `sha256` and `media_type`, which comes from the file's content. A file in `scanning` can't be downloaded. Refusals: `upload_not_found` (404) for an unknown or expired upload or a wrong token, `upload_mismatch` (422) when what arrived isn't what was announced, `file_too_large` (413) as an early answer to a declared length, 415 for a type that isn't allowed, `invalid_transition` (409) if it already arrived, or if a newer attempt replaced this one, `room_unavailable` (504) before any bytes are read, `upload_outcome_unknown` (504) if the room didn't answer at the end, when the file may or may not have landed, so a retry gets `upload_not_found` if it did, `upload_timed_out` (408) if the sender goes quiet for a minute or an attempt passes 30 minutes, `storage_unavailable` (502), which can be tried again, `room_quota_exceeded` (409) if a reservation lapsed during the upload and the room filled up, `participant_quota_exceeded` (409) if a public participant's 1 GB filled up meanwhile, `access_revoked` (403) if the uploader was removed, left the organization or may no longer upload, `agent_disconnected` (403), `workspace_archived` (409), `workspace_not_found` (404) and `rate_limited` (429)"
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/plan/start:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    put:
      operationId: setPlanStart
      tags: [commands]
      summary: "Set the room's one planning start date and timezone. The owner, a human admin or a member with the Coordinator preset can (decision 70, widened to coordinators by the architect's ruling on issue 507, 2026-11-21); anyone else in the room gets `not_allowed`. It moves `plan_revision` and `plan_changed_at` like any plan edit, unless it saves what's already there, and it wakes nobody. A date on a weekend is accepted and kept as entered, and the plan begins that Monday, which the forecast gives as `begins_on`. It can be changed but not cleared"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetPlanStart" } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/plan:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    put:
      operationId: setTaskPlan
      tags: [commands]
      summary: "Replace a task's duration and predecessors, for its requester, a human admin or a member with the Coordinator preset, who sees the whole room. A coordinator can change any visible task's plan, and nothing else on it (issue 507). A `duration_days` that's left out or null erases the estimate. Refused if the room is archived, and if the task is finished unless it only removes canceled predecessors. A loop gets `dependency_cycle`, and a `plan_revision` that isn't current gets `plan_conflict`. It leaves `task.version` alone, wakes nobody and is recorded as `task.plan_changed`, which only someone who sees the whole room can read. Over 50 predecessors gets `invalid_argument`. Over 5,000 edges across unfinished tasks, or predecessors with over 25,000 ancestor edges when any is being added, gets `limit_exceeded`"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetTaskPlan" } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/expected-output:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    put:
      operationId: setTaskOutput
      tags: [commands]
      summary: "Set which expected output a task works toward, or none with null. The task's requester or a human admin. Only while the task is open, offered or accepted, or 409 `invalid_transition` (decision 137), which it is again after changes are requested, except that asking for what it already names changes nothing. `version` is the task version you last read, and a stale one gets 409 `version_conflict`, as for `updateTask`. An output that doesn't exist or was removed gets 404 `output_not_found`. A change moves `task.version`, so an assignee acting on an older read gets `version_conflict`, and is recorded as `task.output_changed` to the task's parties (decision 139). Approving a submission of the task then makes it the output's current version, if the submission carries a link or a file (decision 135)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version, output_id], additionalProperties: false, properties: { version: { type: integer, description: "The task version you last read." }, output_id: { type: [string, "null"] } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/update:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: updateTask
      tags: [commands]
      summary: The updateTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateTask" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/set-reviewer:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: setReviewer
      tags: [commands]
      summary: The setReviewer command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetReviewer" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/set-requester:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: setRequester
      tags: [commands]
      summary: "Change a task's requester, on the record. An owner or admin can for any task. Someone with the `coordinate` scope can only take over, for itself, a task flagged because its requester left"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetRequester" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/assign:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: assignTask
      tags: [commands]
      summary: The assignTask command
      description: "Offers the task to an assignee, who must accept. An agent can't offer a task to itself, a coordinator included, and gets 403 `self_assignment` (decision 248): it offers the work to another agent. A person may offer it to any participant, the coordinator included. An agent offered a task by someone else accepts it with acceptTask."
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssignTask" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/accept:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: acceptTask
      tags: [commands]
      summary: The acceptTask command
      description: "If the agent's A2A endpoint already sent a finished response for this offer, which was held (decision 174), the accept is followed by submitting it as the agent, marked `a2a_remote`, but only while that endpoint is still the agent's active one at the same version. The answer is the accepted task, and reading the task afterwards shows the submission. It also needs that endpoint's setter to still be in the agent's organization. If the submit fails, the accept stands and the response stays held. Replaying the accept with the same idempotency key tries a held submit that didn't finish again."
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VersionedReason" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/decline:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: declineTask
      tags: [commands]
      summary: The declineTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequiredReason" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/release:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: releaseTask
      tags: [commands]
      summary: The releaseTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequiredReason" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/submit:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: submitTask
      tags: [commands]
      summary: The submitTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SubmitTask" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/request-changes:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: requestChanges
      tags: [commands]
      summary: The requestChanges command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequestChanges" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/verify:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: verifyTask
      tags: [commands]
      summary: The verifyTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VerifyTask" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/cancel:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: cancelTask
      tags: [commands]
      summary: The cancelTask command
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequiredReason" } } } }
      responses: { "200": { $ref: "#/components/responses/Task" }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/release-config:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: getReleaseConfig
      tags: [queries]
      summary: "The room's release configuration (M6, ADR 0010): whether release is switched on for the room, its one approval policy, its one environment, the app's default host and its custom hostname if one is claimed. For a person who is the room's owner or one of its admins, by the room's rows (decision 215); anyone else in the room, and every agent, gets `not_allowed`. A room that never set it reads as off at version 0, with `set_by` and `updated_at` null. `default_host` is null while no content domain is configured. A read: it grants nothing, and asks nobody's organization. **Built in M6 step 6, behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: the room answers it as an unknown route (`not_found`, or to that caller `workspace_not_found`, `access_revoked` or `invalid_argument`)"
      responses: { "200": { description: "The room's release configuration", content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseConfig" } } } }, default: { $ref: "#/components/responses/Error" } }
    put:
      operationId: setReleaseConfig
      tags: [commands]
      summary: "Switch release on or off for the room (M6, ADR 0010). Only the room's owner or one of its admins, as a person, whose place in their organization still holds, and never an agent (decision 215): anyone else gets `not_allowed`. `expected_version` is the configuration's version the caller read, 0 if it was never set, and any other is refused with `version_conflict` (409), an unchanged request included. **Switching on** needs everything release needs at all, each refused by its own code (409) in this order: the deployment's setting (`release_off_for_deployment`), the organization's release switch and its provisioning delegation (`release_not_delegated`), a public room (`release_needs_public_room`), an unarchived one (`workspace_archived`), its public surface and its app not suspended (`public_surface_suspended`, `app_suspended`), and a ready managed repository (`repo_not_ready`). Those outside the room are read from their own objects first, and one that can't be read is `standing_unknown` (503), which writes nothing. **Switching off** is always allowed to them, in an archived room too, and is ADR 0010's `release_off` trigger: the room's app is unpublished and its release epoch raised in the same transaction; it is audited as Podster's act and told to the room's managers as `app.unpublished`, and every release that hadn't gone live is ended. Switching on again restores nothing. Off is the default and publishes nothing; asking for what's already so writes nothing and answers the configuration as it is. A change raises `version`, is audited, and is told to the room's other managers as `release.config_set`. **Built in M6 step 6, behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: the room answers it as an unknown route (`not_found`, or to that caller `workspace_not_found`, `access_revoked` or `invalid_argument`)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetReleaseConfig" } } } }
      responses: { "200": { description: "The room's release configuration, as changed", content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseConfig" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/release-approvals:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: listReleaseApprovals
      tags: [queries]
      summary: "The room's releases awaiting a person's approval (M6, ADR 0010, decision 199), for Needs attention: each one's ID, its task if it has one, its commit, its state and who asked for it when, newest first, at most 50, with `more` true when there are others. Only releases that started under the room's current release epoch while release is on in the room are listed, so one the room's bookkeeping ends is never offered. For those who may approve or decline one: the room's owner or one of its admins, as a person, by the room's rows (decision 215). Anyone else in the room gets `not_allowed` (403), and so does every agent, whatever its role; nobody's `Principal` is asked, because a read grants nothing, and `approveRelease` checks the approver's standing again. A read: nothing is written. **Built in M6 step 10(b), behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: the room answers it as an unknown route (`not_found`, or to that caller `workspace_not_found`, `access_revoked` or `invalid_argument`)"
      responses: { "200": { description: "The room's releases awaiting approval", content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseApprovalList" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/releases:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: requestRelease
      tags: [commands]
      summary: "Ask for a release of a task's merged commit (M6, ADR 0010's `deploy_release`, decision 199). A person asks here, and an agent through the `deploy_release` capability (6g), which reaches nothing else of release. It records one release `awaiting_approval` and nothing else: nothing is read from the repository, uploaded or served, and nothing starts until a person who may approve approves it (`approveRelease`). **Refusals come in this order, the first that applies being the answer.** (1) **Until the release path is complete** (`RELEASE_PATH_COMPLETE`, false), a deployment with release switched on and a content provider configured answers `release_not_available` (409) before reading or writing anything. (2) Who is asking, and where, on the room's rows and on the deployment's setting, the organization's release switch and provisioning delegation, and the requester's and the grant giver's own records, each read from its own object first: someone outside the room or removed from it gets the room's own answer (`workspace_not_found`, `access_revoked`); an agent whose credential names no person who linked it gets `agent_not_connected` (403), before anything outside the room is read; then, each by its own code (409), the deployment's setting (`release_off_for_deployment`), the organization's release switch and its provisioning delegation (`release_not_delegated`), a public room (`release_needs_public_room`), an unarchived one (`workspace_archived`), its public surface and its app not suspended (`public_surface_suspended`, `app_suspended`), a ready managed repository (`repo_not_ready`) and release on in the room (`release_off`); then, 403, someone in the room only through a public claim (`public_participant`), a live `deploy` grant on the room's repository from someone who still holds release authority (`grant_required`, `grant_stale`), and the requester still in the organization their place here is held in (`not_allowed`). **An agent** asks as anyone does, by a grant of its own, and never through a public claim (decision 159, `public_participant` even holding a grant); the person who controls it is the one who linked the credential it asks with, read from that person's own record: one who left the agent's organization since the link began is `agent_not_connected` (403), as is, on a retry, a credential whose link isn't the one recorded with the release. The release records that person, the link and the agent's connection generation, and every later pass, the approval's recheck and each of the release job's, fails the release `requester_lost_authority` once the agent's connection isn't the recorded one or that person has left. The owner and admins ask as anyone does, by a grant of their own; a person who may approve may approve a release their own agent asked for. A fact that was read and fails refuses by its code even when another couldn't be read. (3) Only when nothing read fails, a fact that couldn't be read is `standing_unknown` (503), which writes nothing. (4) A retry with the same key answers as the first time, but only after (2) and (3) hold now, on facts read again for that retry: one from someone who has since lost their grant, or from a room where release no longer may happen, is refused by the code that holds now, and writes nothing; and one made while an outside fact can't be read, with nothing read failing, answers `standing_unknown` (503) rather than the stored answer, even though the release was recorded. (5) The body, `invalid_argument` (400) for a field it doesn't take or a missing one; then the task, which the caller must be able to see (`task_not_found`, 404). (6) What is asked for: `environment` may be left out, and any but `production` is `invalid_argument` (400); `commit_sha` must be exactly the commit Podster's own merge confirmed on the room's repository for that task, and the task completed (`commit_not_releasable`); the room's reviewer rule as it is now (`reviewer_rule_changed`); no hold because nobody who may release remains (`no_releaser`); no release of the same commit already awaiting approval, queued, uploading or uncertain (`release_pending`); each 409; and at most 20 asks in the room in a rolling day, declined and failed ones included (`release_limit`, 429). The release is recorded under the room's current configuration version, release epoch and app label; a room with no current label, before its first release or after an unpublish retired the last, gets a new random one. It is audited by the caller and told, as `release.requested`, to the room's owner and to its admins who are people; an agent holding the admin role isn't told. **Built in M6 step 6, behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: the room answers it as an unknown route (`not_found`, or to that caller `workspace_not_found`, `access_revoked` or `invalid_argument`)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequestRelease" } } } }
      responses: { "200": { description: "The release, awaiting approval", content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/releases/{release}/approve:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: release, in: path, required: true, schema: { type: string, pattern: "^rel_[0-9a-f]{32}$" } }]
    post:
      operationId: approveRelease
      tags: [commands]
      summary: "A person approves one release that is awaiting approval (M6, ADR 0010, decision 199). The approval policy has one value, `person`: every release needs this. Asking for a release is its own command, `requestRelease`. No body is taken. **In this order, the first that applies being the answer.** (1) Who is asking, on the room's rows: someone outside the room or removed from it gets the room's own answer (`workspace_not_found`, `access_revoked`); only the room's owner or one of its admins, as a person, may approve, and anyone else, every agent whatever its role is called, gets `not_allowed` (403, decision 215). The person who asked for a release may approve it themselves. A release ID of the wrong form is `not_found` (404). (2) **Until the release path is complete** (`RELEASE_PATH_COMPLETE`, false), a deployment with release switched on and a content provider configured answers `release_not_available` (409) before reading or writing anything. (3) The approver's own record, read for this attempt before anything else outside the room is read or written: one who left the organization their place here is held in gets `not_allowed` (403), and one whose record can't answer gets `standing_unknown` (503); neither writes anything. (4) Every outside fact is read again for this approval, none taken from the request: the content domain's stop, the deployment's setting, the organization's release switch and provisioning delegation, and the approver's, the requester's and the grant giver's own records; and the approver's record is checked again in the room's transaction, on every attempt, so a retry with the same key answers as the first time only to someone who may still approve, on what was read for that retry. (5) The release, which the room must have (`not_found`, 404) and which must be awaiting approval (`invalid_transition`, 409); one asked for before an unpublish is ended first, as at every release command. (6) The release job's whole recheck, on the room's rows now and the reads of (4), in its order, which includes that the release's configuration version and release epoch are still the room's current ones. **A fact that was read and fails ends the release `failed` with that fact's code** (`release_stopped`, `release_off_for_deployment`, `release_not_delegated`, `release_needs_public_room`, `workspace_archived`, `public_surface_suspended`, `app_suspended`, `repo_not_ready`, `release_off`, `release_config_changed`, `requester_lost_authority`, `no_releaser`, `reviewer_rule_changed`, `commit_not_releasable`, `release_epoch_moved`), as the job would, and the answer is that release, 200, told as `release.failed`; it does so even when another fact couldn't be read. Only when nothing read fails, a fact that couldn't be read is `standing_unknown` (503), which writes nothing. (7) The app's address, once every check holds: the label's row in the lookup table that routes questions about it to this room, and the default host's serve state, which names nothing to serve until a release goes live. While either can't be made yet, because the lookup row couldn't be written or read back, or the room's earlier address still serves something, the answer is `release_address_pending` (503), which writes nothing in the room; a label whose lookup row names another room is `release_label_taken` (409), which no retry changes, writes nothing in the room and is told to operators as `app_label_taken`; the earlier address is kept, never deleted, so a late write to it is still put right; and a deployment with no content domain, which can't name the address, answers `release_not_available` (409); a lookup row written before the refusal only routes questions to this room, which answers from its own state. (8) The release is queued, with its approver, for the release job, which reruns policy and rechecks the requester's and the approver's standing on every pass. It is audited by the approver and told, as `release.approved`, to the room's owner and its admins who are people and to whoever asked if they are a person still in the room, never the approver and never an agent. **Built in M6 step 6, behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: the room answers it as an unknown route (`not_found`, or to that caller `workspace_not_found`, `access_revoked` or `invalid_argument`)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { description: "The release: queued for the release job, or failed with the code of the fact that ended it", content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/releases/{release}/decline:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: release, in: path, required: true, schema: { type: string, pattern: "^rel_[0-9a-f]{32}$" } }]
    post:
      operationId: declineRelease
      tags: [commands]
      summary: "A person declines one release that is awaiting approval (M6, ADR 0010, decision 199). It ends `declined` and nothing is uploaded; the app goes on serving whatever it served. No body is taken. Declining only takes away, so it passes no gate on the release path and reads nothing but the decider's own record. **In this order, the first that applies being the answer.** (1) Who is asking, on the room's rows: someone outside the room or removed from it gets the room's own answer (`workspace_not_found`, `access_revoked`); only the room's owner or one of its admins, as a person, and anyone else, every agent whatever its role, gets `not_allowed` (403). A release ID of the wrong form is `not_found` (404). (2) The decider's own record, read for this attempt: one who left their organization gets `not_allowed` (403), one whose record can't answer `standing_unknown` (503), and neither writes anything; checked on every attempt, so a retry with the same key answers as the first time only to someone who may still decline. Wherever the room is still there it may be declined: private, archived, suspended, with release off, its repository not ready or the organization's release taken away. (3) The release, which the room must have (`not_found`, 404) and which must be awaiting approval (`invalid_transition`, 409). It is audited by the decider and told, as `release.declined`, to the room's owner and its admins who are people and to whoever asked if they are a person still in the room, never the decider and never an agent. **Built in M6 step 6, behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: the room answers it as an unknown route (`not_found`, or to that caller `workspace_not_found`, `access_revoked` or `invalid_argument`)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { description: "The release, declined", content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/releases/{release}/rollback:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: release, in: path, required: true, schema: { type: string, pattern: "^rel_[0-9a-f]{32}$" }, description: "The earlier release to roll back to." }]
    post:
      operationId: rollbackRelease
      tags: [commands]
      summary: "Ask to roll back the room's app to an earlier release (M6, ADR 0010's rollback, decision 203). A rollback is its own release record, `awaiting_approval`, naming the release it rolls back to (`rollback_to`) and releasing that release's commit; nothing is rewritten, and nothing starts until a person who may approve approves it (`approveRelease`), exactly as any release. No body is taken. **Refusals come in this order, the first that applies being the answer.** (1) Who is asking, on the room's rows: someone outside the room or removed from it gets the room's own answer (`workspace_not_found`, `access_revoked`); an agent gets `not_allowed` (403). Then a release ID of the wrong form is `not_found` (404). (2) **Until the release path is complete** (`RELEASE_PATH_COMPLETE`, false), a deployment with release switched on and a content provider configured answers `release_not_available` (409) before reading anything outside the room or writing anything. (3) Who is asking, and where, exactly as for `requestRelease`, on every attempt, a retry with the same key included, on facts read again for that attempt: a person in the room with their own live `deploy` grant on the room's repository from someone who still holds release authority, still in their organization, where release may happen at all, each refused by its own code. Only when nothing read fails, a fact that couldn't be read is `standing_unknown` (503), which writes nothing. (4) The release named, which the room must have (`not_found`, 404), and which it served once and has since left, `replaced` or `unpublished` (`rollback_target_invalid`, 409); its task, which the caller must be able to see (`task_not_found`, 404). (5) As for `requestRelease`: that release's commit must still be releasable (`commit_not_releasable`), the room's reviewer rule as it is now (`reviewer_rule_changed`), no hold because nobody who may release remains (`no_releaser`), no release of the same commit awaiting approval or on its way (`release_pending`), each 409; and it is one of the room's at most 20 asks in a rolling day (`release_limit`, 429). **Once approved,** the release job switches the room's hosts back to the kept script, with nothing read from the repository or uploaded, only when that release's script is the one the room keeps, under the room's current label, with nothing suspended, nothing queued to delete it and no takedown finding open against it, and Cloudflare's own read of it, made at the switch, says it exists; the release's epoch, its commit and the reviewer rule are rechecked there as for any release. Otherwise it is a new release of that commit, uploaded again, which takes an upload attempt and the deployment's read budget. A read at the switch that gives no answer decides nothing, and the switch is asked again. It is audited by the caller and told, as `release.requested`, to the room's owner and to its admins who are people. **Built in M6 step 6, behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: the room answers it as an unknown route (`not_found`, or to that caller `workspace_not_found`, `access_revoked` or `invalid_argument`)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { description: "The rollback's own release, awaiting approval", content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/app-hostname:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: getAppHostname
      tags: [queries]
      summary: "The room's request to map a custom hostname to its app (M6, ADR 0010, decision 207), or null. While `pending` it carries the TXT record the room's owner publishes: its name, `_podster-challenge.<hostname>`, and its value, made for this request alone. For the room's owner or one of its admins, as a person. **Built in M6 step 8's first PR, behind the switch.** It answers the room's open request, or else its latest, or null; a pending request past its 72 hours whose proof was never taken to the hostname's object reads as `expired`. A read: it grants nothing, and asks nobody's organization. Anyone else in the room, and every agent, gets `not_allowed`. While release is switched off, which is every deployment, this can't be told from a path nobody defined: the room answers it as an unknown route (`not_found`, or to that caller `workspace_not_found`, `access_revoked` or `invalid_argument`)"
      responses: { "200": { description: "The room's hostname request, or null", content: { application/json: { schema: { $ref: "#/components/schemas/AppHostname" } } } }, default: { $ref: "#/components/responses/Error" } }
    put:
      operationId: requestAppHostname
      tags: [commands]
      summary: "Ask to map a custom hostname to the room's app (M6, ADR 0010, decisions 201 and 207). The name is normalized first; Podster's own domains (`podster.dev`, `opster.dev` and `podster.site`), the content domain, a subdomain of any of them, an IP address, a single-label name, a wildcard name, a public suffix and a name an operator suspended are refused. The room gets a challenge and nothing else: a pending request reserves nothing, and is gone after 72 hours. The claim is given only once the room's own challenge is read from DNS, and one hostname has one room. One custom hostname a room. Only the room's owner or one of its admins, as a person. **Built in M6 step 8's first PR, behind the switch.** Asking is a change to the release configuration: it needs everything that does, release switched on in the room among them, so it is refused by the same codes (`release_off`, `release_needs_public_room` and the rest), and `standing_unknown` when a fact couldn't be read. A name that isn't a hostname gets `hostname_invalid` (400), and so does one that is a wildcard (`hostname_wildcard`), an IP address (`hostname_ip_address`) or a single label (`hostname_single_label`); a name that is Podster's own or on the content domain gets `hostname_reserved` (409), a public suffix `hostname_public_suffix` (409), a suspended name `hostname_suspended` (409), a second request while one is pending, claimed or ending `hostname_limit` (409), a sixth new request from the room within an hour, whatever became of the others, `hostname_rate_limited` (429, the figure **Proposed**), and any name while the deployment can't classify names, because it holds no content domain or no Public Suffix List rules, which is every deployment, `hostname_unavailable` (409). A body that isn't `{ hostname }` gets `invalid_argument`. The hostname's own object is read first, for the name's suspension, and an object that can't be read is `standing_unknown` (503), which writes nothing. Custom hostname claims are complete since 2026-11-18 (8b and 8d). **While the release path isn't complete,** a deployment with release on and a content provider configured refuses every ask as a route that isn't built, `release_not_available` (409), as it does every release command; with release on and no content provider a claim may be given, but nothing is created at Cloudflare and nothing routes until the release path is complete. Removing is never held back by either. The challenge is looked for in DNS by a job, while release is on and a resolver is configured, which no deployment has; only when the room's own value is there is the hostname's object asked for the claim. The custom hostname is then made at Cloudflare (M6 step 8b), only once the release path is complete, in every deployment; and the name serves the room's app only while the room holds its claim, Cloudflare reports it `active`, the room hasn't unpublished since and still may release, the release is served on the default host, and the hostname's object agrees, each asked again before every write of its serve entry (M6 step 8c). **The challenge must stay published while the name is mapped** (M6 step 8d): a job looks it up again daily, and the claim ends the long way, as a removal's does, on two definite noes at least 24 hours apart with no match between (`hostname_challenge_removed`), a definite no being `NXDOMAIN` or `NOERROR` with no TXT record of the value at the challenge's name or at the end of its CNAME chain, or after seven days with no match (`hostname_proof_lapsed`); a lookup that gives no answer (`SERVFAIL`, a timeout, a malformed or truncated answer) counts toward neither no. A custom hostname's answers carry `Strict-Transport-Security` without `includeSubDomains` or `preload` (**Proposed**). While release is switched off, which is every deployment, this can't be told from a path nobody defined: the room answers it as an unknown route (`not_found`, or to that caller `workspace_not_found`, `access_revoked` or `invalid_argument`)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetAppHostname" } } } }
      responses: { "200": { description: "The room's hostname request", content: { application/json: { schema: { $ref: "#/components/schemas/AppHostname" } } } }, default: { $ref: "#/components/responses/Error" } }
    delete:
      operationId: removeAppHostname
      tags: [commands]
      summary: "Remove the room's custom hostname or drop its pending request (M6, ADR 0010). The room stops serving on the name first; the custom hostname is then deleted at Cloudflare and read until gone before the claim is freed. A claim never transfers: any later claim, by anyone, needs a new challenge. Only the room's owner or one of its admins, as a person. **Built in M6 step 8's first PR, behind the switch.** It only takes down, so it needs nothing about the room, in an archived room too: only who is asking, by the room's rows and by the caller's own standing, read from their `Principal`, which is `standing_unknown` (503) and writes nothing when it can't be read. A pending request nobody was asked about is over at once, and the answer is null. A pending request whose proof was taken to the hostname's object goes `ending`, and is over once that object has recorded it withdrawn, which frees any claim it gave for it. A claim the room holds goes `ending`, and the room stops serving on the name in the same transaction; then a job tells the hostname's object the claim is ending, deletes the custom hostname at Cloudflare if one was ever asked for, reads until Cloudflare reports it gone, and only then frees the claim, when the request becomes `ended` (M6 step 8b). Until then the name stays held and the request stays `ending`; with no provider for custom hostnames, which is every deployment, a claim for which nothing was ever asked of Cloudflare is freed without asking. Asking again changes nothing. While release is switched off, which is every deployment, this can't be told from a path nobody defined: the room answers it as an unknown route (`not_found`, or to that caller `workspace_not_found`, `access_revoked` or `invalid_argument`)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { description: "The room's hostname request, ending or null", content: { application/json: { schema: { $ref: "#/components/schemas/AppHostname" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/apps/{label}/delete-data:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/appLabel" }]
    post:
      operationId: deleteAppData
      tags: [commands]
      summary: "The room's owner or one of its admins deletes the data of one of the room's apps, by its label, `{ confirm }`, the label again (M6 stage 1, ADR 0010's revision, S4 of the store plan; decision 220 (7)). **Only the room's owner or an admin, as a person,** while still in the organization their place here is held in: a member and every agent, an agent holding the admin role included, get `not_allowed` (403). **In this order, the first that applies being the answer.** (1) Who is asking, on the room's rows: someone outside the room or removed from it gets the room's own answer (`workspace_not_found`, `access_revoked`); anyone but the owner or an admin who is a person `not_allowed` (403). (2) The caller's own record, read for this attempt: one who left gets `not_allowed` (403), one whose record can't answer `standing_unknown` (503), and neither writes anything. (3) The body: anything but exactly `{ confirm }` naming the label of the path is `invalid_argument` (400). (4) The label, which must be one of the room's own, current or retired (`not_found`, 404). (5) The room's record of that app's store: none answers `data: none`, and one deleted `data: deleted`, writing nothing; with data left and no store provider configured, which is every deployment, `data_delete_unavailable` (409), since nothing would delete it; one already owed a deletion answers as it stands and writes nothing, so asking again changes nothing; otherwise, **while anything can still reach the store,** `app_still_served` (409): a host wanting one of the label's scripts, a host whose entry the applier last wrote with one of them or hasn't confirmed at its current version, the script kept for a rollback, a commit in flight to one, or a release of the label whose script was bound to the store still queued, uploading, uncertain, live or served. The caller switches release off, or waits for the app's unpublish and its entries' removal, first. Else the store is owed a deletion now, cause `owner_deleted`, in this transaction: from then nothing is bound to it, a release that asks for it fails `store_delete_owed`, and one already bound to it fails so at its stage or commit. It is audited by the caller and told, as `app_data.delete_owed`, to the room's owner and its admins who are people. Answers `{ label, data, cause, owed_at, deleted_at, notice }`: `data` is `none`, `deleting` or, once D1 has said gone, `deleted`; `notice` is null unless the data is deleted, or owed with nothing able to reach the store and a store provider configured, and then exactly: Your app’s data is deleted now, and nothing can read it. Cloudflare keeps a recoverable copy for up to 7 days; after that it’s gone for good. **Then the room's own job deletes the store at Cloudflare,** only while nothing can reach it, never trusting a delete's answer, and counts it gone only on D1's own not-found, read twice at least ten minutes apart; a store recorded by its name alone is found by a whole list of the account's databases first, and one that lands after it was counted gone is deleted too. Only a store the room's own record names is ever deleted. It only takes away, so it needs nothing of the room: archived, private, suspended or with release off in the room, they may still ask. Needs an idempotency key, and a retry with it answers with the stored answer to someone who may still ask. **Built in S4 of the store plan, behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: the room answers it as an unknown route (`not_found`, or to that caller `workspace_not_found`, `access_revoked` or `invalid_argument`)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [confirm], properties: { confirm: { type: string, pattern: "^[a-z0-9]{1,26}$", description: "The app's label, again." } } } } } }
      responses: { "200": { description: "The app's data: none, being deleted, or deleted", content: { application/json: { schema: { $ref: "#/components/schemas/AppDataDeletion" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/app-reports:
    post:
      operationId: createAppReport
      tags: [commands]
      summary: "Report a deployed app by its address (M6, ADR 0010, decision 205; built at M6 step 9). `address` is the app's host as the reporter saw it, a default host or a custom hostname, or an `http` or `https` URL on it; nothing but its host is kept, normalized as a custom hostname is. A URL with a user name or password, or anything that isn't a hostname, gets `invalid_argument` (400). Nothing asks whether anything is served at the host, so the answer is the same whether it exists, is served or is suspended. `address` is at most 2,048 characters, counted as the schema's `maxLength` counts them, not in bytes. `reason` and `note` are as `createReport`'s, so `note` is at most 1,024 bytes as UTF-8. Signed-in people only: an agent gets `not_allowed`. It counts against the same 10 a day per person as `createReport`, then `limit_exceeded` (409). Needs an idempotency key, and a retry with it answers with the same report; the same key with a different request, a room's report included, gets `idempotency_mismatch` (422). Answers `{ id, created_at }`. Reports go to Podster's operators, in `listReports`, who can suspend the app by its label or its host and read nothing private. While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [address, reason], properties: { address: { type: string, maxLength: 2048 }, reason: { type: string, enum: [spam, abuse, illegal, impersonation, privacy, other] }, note: { type: [string, "null"], maxLength: 1024 } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/moderation/apps/{label}/suspend:
    parameters: [{ $ref: "#/components/parameters/appLabel" }]
    post: { operationId: suspendApp, tags: [commands], summary: "An operator stops a room's app from serving, `{ reason }` (M6, ADR 0010, decision 205). Keyed by the app's host label, never by a room's public handle. The room records it, sets what each of its hosts should serve to nothing and raises its release epoch in one transaction, and its owner can't release while it holds. An operator reads nothing private. Operators only, or `not_allowed`. Answers `{ label, suspended, reason, at }`. Asking again changes nothing. The room's applier then removes its serve entries, and a job deletes its scripts, each counted gone only on the provider's own answer; while no provider is configured, which is every deployment, both wait, recorded as owed. A label no room has is `not_found`, as is one the lookup names for a room that says it isn't its own, or for no room at all. **Built in M6 step 4(a), behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/apps/{label}/lift:
    parameters: [{ $ref: "#/components/parameters/appLabel" }]
    post: { operationId: liftAppSuspension, tags: [commands], summary: "An operator lifts an app's suspension, `{ reason }` (M6, ADR 0010). Lifting restores nothing: the host goes on answering not-found until the room releases again, by a new request and a new approval. Operators only. Answers `{ label, suspended, reason, at }`, the last two null. Asking again changes nothing. A label no room has is `not_found`. **Built in M6 step 4(a), behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/apps/{label}/delete-data:
    parameters: [{ $ref: "#/components/parameters/appLabel" }]
    post: { operationId: deleteAppDataAsOperator, tags: [commands], summary: "An operator deletes an app's data, `{ reason }` (M6 stage 1, ADR 0010's revision, section 3.3, S4 of the store plan). Keyed by the app's host label, never by a room's public handle. With data left to delete and no store provider configured, which is every deployment, it is refused `data_delete_unavailable` (409) and nothing is done, since nothing would delete it. **For the room's current label the room suspends the app first,** exactly as `suspendApp` does, in a transaction of its own, so nothing serves or writes and that holds whatever follows; a retired label serves nothing, so the room's current app isn't suspended for it. Then, in a second transaction, it owes the app's store a deletion, cause `operator_takedown`, audited and told as Podster's act (`app_data.delete_owed`), never the operator's own ID. From then nothing is bound to the store, a release that asks for it fails `store_delete_owed`, and one already bound to it fails so at its stage or commit. An operator reads nothing private. Operators only, or `not_allowed`. Answers `{ label, data, cause, owed_at, deleted_at, notice }`: `data` is `none` when the room recorded no store for the app (a current label's app is still suspended), `deleting`, or, once D1 has said gone, `deleted`; `notice` is null unless the data is deleted, or owed with nothing able to reach the store (every host of the label confirmed down by what the applier last wrote, and no release bound to the store under way), and then exactly: Your app’s data is deleted now, and nothing can read it. Cloudflare keeps a recoverable copy for up to 7 days; after that it’s gone for good. So straight after the suspension it is usually null, and asking again later, which changes nothing, reads it again. Recorded in the operators' log as `delete_data`, intent first and its outcome after. **Then the room's own job deletes the store at Cloudflare,** only once nothing can reach it, never trusting a delete's answer, and counts it gone only on D1's own not-found, read twice at least ten minutes apart; a store recorded by its name alone is found by a whole list of the account's databases first, and one that lands after it was counted gone is deleted too. Only a store the room's own record names is ever deleted, never one the reconcile tells as `store_orphan`. A label no room has is `not_found`, as is one the lookup names for a room that says it isn't its own, or for no room at all. **Built in S4 of the store plan, behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { description: "The app's data: none, being deleted, or deleted", content: { application/json: { schema: { $ref: "#/components/schemas/AppDataDeletion" } } } }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/app-hosts/{host}/suspend:
    parameters: [{ $ref: "#/components/parameters/appHost" }]
    post: { operationId: suspendAppHost, tags: [commands], summary: "An operator suspends one host of an app, `{ reason }` (M6, ADR 0010, decision 205): a default host, which suspends that app, or a custom hostname. A custom hostname's suspension lives with the hostname and outlives any room's claim to it: while it holds, no room can claim the name or start a challenge for it, and if a room holds it now, serving on it ends and the claim ends. The room's app keeps its default host unless the app is suspended too. Operators only. Answers `{ host, suspended, reason, at }`. Asking again changes nothing. The host is read as Podster writes names, so two spellings are one host. A name on the content domain that isn't an app's host, or on Podster's own domain, is `not_found`; one that isn't a hostname is `invalid_argument`. **Built in M6 step 4(a), behind the switch.** An app's default host is the same act as suspending the app by its label. A custom hostname's suspension is recorded with the hostname, whether or not any room has asked for it; a room that holds it is told until it answers, and clears and closes that host. While no content domain is configured, which is every deployment, no host can be told from another, and it answers `release_not_available` (409). While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/app-hosts/{host}/lift:
    parameters: [{ $ref: "#/components/parameters/appHost" }]
    post: { operationId: liftAppHostSuspension, tags: [commands], summary: "An operator lifts a host's suspension, `{ reason }` (M6, ADR 0010). Nothing is restored: a custom hostname needs a new challenge and a new claim, and an app a new release. Operators only. Answers `{ host, suspended, reason, at }`, the last two null. Asking again changes nothing. **Built in M6 step 4(a), behind the switch,** for an app's default host, as lifting the app's suspension by its label, and for a custom hostname. A host that was closed in a room stays closed, and a claim that was ending goes on ending. While no content domain is configured, which is every deployment, it answers `release_not_available` (409). While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/content-domain/stop:
    post: { operationId: stopContentDomain, tags: [commands], summary: "An operator stops the whole content domain, `{ reason }` (M6, ADR 0010, decision 205): every app's host answers not-found until it is resumed. For a compromise of the namespace or of a publishing credential, or a block of the whole domain. No room's state changes. Operators only. Answers `{ stopped, reason, at, key_confirmed }`. Asking again changes nothing. From then no room writes a host's serve entry, and removals go on. One key at the provider is what refuses every host; it is written from the record of the stop, and while no provider is configured, which is every deployment, it waits, recorded as owed. `key_confirmed` says whether that key is known to be there now: it is false straight after the stop is set, and for as long as no provider is configured or the provider's answer can't be confirmed, and an operator who asks again reads it again. The stop itself holds either way. **Built in M6 step 4(a), behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/content-domain/resume:
    post: { operationId: resumeContentDomain, tags: [commands], summary: "An operator lifts the stop for the whole content domain, `{ reason }` (M6, ADR 0010). Each app serves again only what its room's own state says it should. Operators only. Answers `{ stopped, reason, at, key_confirmed }`, `reason` and `at` null. `key_confirmed` says whether the provider's key is known to be gone now; until it is, every host stays refused there. Asking again changes nothing and reads it again. **Built in M6 step 4(a), behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/takedown-findings:
    get: { operationId: listTakedownFindings, tags: [queries], summary: "What taking apps down has found that needs an operator (M6, ADR 0010): as `{ findings }`, at most 200, the most recently seen first, each `{ code, subject, detail, first_seen_at, last_seen_at, seen }`. `subject` is the host, the script's name, the key, the app's label or the organization it is about, as the provider, a room or an organization's object gave it, and is data only. No room's internal ID is shown, except as the subject of `repo_unpublish_held` and `repo_unpublish_stalled`, so an operator knows which room to recheck. The codes: `entry_without_room` and `script_without_room`, a serve entry or a script whose room can't be found, which is never removed on the lookup table's word; `entry_foreign_name` and `script_foreign_name`, a name Podster didn't make, which is left alone; `entry_unreadable`, an entry whose value isn't a script's name Podster made, which its room then writes again or takes out; `entry_reads_failing`, the provider gave no readable answer for some entries in a pass, told once for the pass with how many in `detail`, never once for each host; `script_delete_queued`, a script a pass had its room queue for deletion, with `queued` or `gone` in `detail`, which the room goes on telling for 7 days so the record never rests on one answer; `entry_keeps_failing` and `script_keeps_failing`, a key or a script a pass couldn't deal with three passes in a row, with the last code in `detail`; `host_refused`, a host a room's applier won't serve, with why in `detail` (for a custom hostname, M6 step 8c, the check that was read and failed: `hostname_claims_incomplete`, `hostname_not_claimed`, `hostname_unpublished`, `hostname_not_active`, `claim_not_live`, or the room's own fact that fails); `custom_entry_without_claim`, a serve entry for a custom hostname whose own object holds no claim, so no room can be asked about it, which is never removed on that word alone (M6 step 8c); `script_delete_failing`, a script whose delete has failed at least twelve times; `store_delete_failing`, a store a room owes a deletion whose tries have decided nothing twelve times in a row (Proposed), by the store's name, with `held` in `detail` while something can still reach the store or `unconfirmed` while it is tried and not yet read gone, which the room goes on telling until it is read gone (S4 of the M6 store plan); `hostname_notice_unanswered`, a suspended hostname whose room hasn't answered in over half an hour; `stop_key_differs` and `stop_key_without_stop`, the stop's key at the provider not as the stop says; `script_list_incomplete`, the provider's list of scripts said it held less than there is; `script_binding_foreign`, an app's script under any of its room's labels, current or retired, that holds a binding other than its own app's store, by the script's name, with why in `detail` (`write_counter`, `serve_entries`, `store_foreign`, `store_unrecorded`, `store_own_twice`, `durable_object`, `kv_namespace`, `store_twice`, `other_binding`, or `bindings_oversized` for a read whose answer was longer than any list Podster writes), for which the room's app is suspended as an operator's suspension does, recorded on the script's label and kept, until an operator lifts it, which the next hourly pass undoes while that script is still there (rule 3(b) of the store ruling, M6 stage 1); `script_binding_held`, such a script whose app the ceiling on these suspensions kept up (Proposed: as the repository unpublish's, 5 in a rolling hour, or 10% of the rooms with apps if fewer, never below one), with `ceiling_reached` or `ceiling_unread` in `detail`, whose app goes on serving with that binding until a later pass the ceiling allows suspends it or an operator does, so it is urgent; a slot of the ceiling is counted from when a room is asked to suspend a script read as foreign, and if that answer is lost it stays counted until the room next answers that none of its labels was suspended since, or for the hour; `script_bindings_unread`, scripts of the slice this pass reached whose bindings it couldn't read or judge, so nothing was decided for them, told once for the pass with how many in `detail`, by the subject `namespace`, never a count of the whole namespace; `script_bindings_keep_unread`, one script whose bindings couldn't be judged three passes in a row (Proposed), by its name, with how many in `detail`, until a pass judges it; `store_orphan`, a D1 database named as Podster names an app's store (`podster-store-…`) that no room records, by the database's name, told only at the end of a walk over every app's label that every room answered and only for one first listed in an earlier walk, and never deleted on that word (the store reconcile, S5 of the M6 store plan); `store_made_gone`, a room's record of a made store that D1 says is gone, read so by D1's own not-found twice at least ten minutes apart, by the store's name, taken away once it is listed or read there again; `store_id_settled`, a room's record of a store's name with no ID and its create outstanding that D1's list showed, which the room then recorded made with the listed ID, by the store's name, told only when that answer recorded it; `store_name_reappeared`, a room's record of a store's name whose create had been settled as having made nothing, that D1's list shows after all, by the store's name, with the record left alone; `store_walk_unwhole`, from the third walk in a row that some room didn't answer, each app's label whose room didn't answer in it, by the label, taken away by the next walk that every room answered, since no orphan can be told meanwhile; `store_list_unread`, a pass whose list of D1's databases wasn't whole, so it decided nothing about stores, one row by the subject `d1`, taken away by the next whole list; `release_setting_undecided`, the deployment's `RELEASES` is neither exactly `true` nor exactly `false`, told once by each pass and taken away once a pass reads it decided; `release_bookkeeping_failing`, a room's release bookkeeping that has failed three times in a row, by the app's label, with the last code in `detail`, which the room goes on telling while it keeps failing; `release_switch_notice_unanswered`, an organization whose notice of an operator's release switch a room it lists hasn't answered, from the twelfth unanswered try on, by the organization; `release_switch_notice_misdirected`, a room the organization's list names that answered that it is another organization's, told once for each notice, by the organization and never the room; `installation_unconfirmed`, a room read its repository as gone while the provisioning App's own installation couldn't be read healthy, so nothing was degraded or unpublished on it and the room reads again later, one row for the deployment with `installation_suspended`, `installation_removed` or `installation_unreadable` in `detail`, by the subject `provisioning_installation`; `repo_unpublish_held`, a room whose link went off ready after the ceiling was reached (Proposed: 5 in a rolling hour, or 10% of the rooms with apps if fewer), so its app stays up, held, by the room's ID, until an operator's repository recheck of that room confirms it, which unpublishes it at once if the link is still not ready, or the cause clears there; `repo_unpublish_stalled`, a room whose ask of that ceiling got no answer, was undecided, or whose granted unpublish failed, by the room's ID with `no_answer`, `undecided` or `unpublish_failed` in `detail`, which the room asks again within the hour and which goes at the ceiling's next answer to it; `app_label_taken`, an app's label whose row in the lookup table names another room, by the label, so its room can't release under it (M6 step 6, 6f); `failures_full`, more keys are failing than are counted; and `findings_full`, 1,000 are kept and a new one isn't until a row has gone 7 days unseen, with `seen` counting each one dropped. Deletions a pass started, scripts with a binding they may not hold, scripts the ceiling held, scripts whose bindings keep reading unknown, orphaned stores, made stores read gone, settled stores, reappeared store names, labels whose rooms keep missing the store walk, refused hosts, each of the two stop-key findings, failing release bookkeeping, held repository unpublishes and stalled ones have 1,000 rows of their own for each kind, so nothing else can keep one out; a `findings_full` row's `subject` is the kind that is full, or `other` for the rest. One not seen again for 7 days is forgotten. A read: nothing is recorded. Operators only; anyone else gets `not_allowed`. They are gathered by two scheduled passes, which no environment schedules, and with no provider configured, which is every deployment, those passes find nothing; the two release switch findings are sent by an organization's object as it notifies its rooms. **Built in M6 step 4(a), behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/orgs/{org}/release-delegation:
    parameters: [{ name: org, in: path, required: true, schema: { type: string } }]
    get: { operationId: getReleaseDelegation, tags: [queries], summary: "Whether an organization may release, by the operator's release switch (M6, ADR 0010, decision 218), for a Podster operator or a person who administers that organization; an agent never, `not_allowed`, and nobody else either. Held in the organization's own object in the API, never a read model. Answers `{ granted, generation, last_take, set_by, set_at }`: every set raises `generation`, and `last_take` is the generation of the most recent take, 0 if release was never taken. An organization nobody has set it for holds it: `{ granted: true, generation: 0, last_take: 0, set_by: null, set_at: null }`. It is separate from the provisioning delegation, which only refuses new releases; both answer `release_not_delegated` to a release they stop. **Built in decision 218's PR B, behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined, for everyone, operators included: it is answered where an unknown path is, `not_found` (404).", responses: { "200": { description: The switch, content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseSwitch" } } } }, default: { $ref: "#/components/responses/Error" } } }
    put: { operationId: setReleaseDelegation, tags: [commands], summary: "Take release away from an organization, or give it back, `{ granted }` (M6, ADR 0010, decision 218), by a Podster operator, as a person, only; an organization's own admin and every agent get `not_allowed`. Every set raises the generation, asking again included; a take is the new `last_take`, and a give-back keeps it. Taking release away refuses the organization's releases at every release command's recheck, `release_not_delegated`, and is ADR 0010's unpublish trigger for every room's app in the organization: the organization's object sends each room it lists a notice, again until the room answers, and tells operators by a `release_switch_notice_unanswered` finding from the twelfth unanswered try on; a room that answers that it is another organization's is told to operators once, by a `release_switch_notice_misdirected` finding naming the organization, never the room, and its notice is then dropped; a room it doesn't list reads the switch itself at its release commands and whenever the reconcile asks it anything. A room unpublishes, as Podster's act, on any take made since the switch it last applied, which for a room that existed before decision 218's PR C is unset; a release staged or in flight in it then never goes live. Giving it back restores nothing. Nothing about it acts at the same instant: a commit whose reads came just before a take can go live, and is unpublished when its room hears. The generation can't pass what storage holds, `9223372036854775807`; a set past it is `internal_error` and writes nothing. An organization the API has never seen a room of is `organization_not_found` (404). Kept in the organization's object with every change, and in the operators' record. Answers as the read does. **Built in decision 218's PR B, behind the switch; the notices, the rooms' own reads and the unpublish in PR C.** While release is switched off, which is every deployment, this can't be told from a path nobody defined, for everyone, operators included: it is answered where an unknown path is, `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [granted], properties: { granted: { type: boolean } } } } } }, responses: { "200": { description: The switch, content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseSwitch" } } } }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/repository:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: getRepository
      tags: [queries]
      summary: "The room's managed repository (M5, ADR 0009, proposed): `request`, the room's one request for a repository, and `repository`, the repository linked to the room, each null if there's none. A room that doesn't use Git has neither. Read from the room's own state, for a person who sees the whole room. An agent, and anyone who doesn't see the whole room, gets `not_allowed`. It's a read and grants nothing. For a person who is the room's owner or a room admin by current standing, and nobody else, it adds `delegated`: whether the room's organization holds the provisioning delegation now, which every organization does unless a Podster operator took it back, read from the organization's own record at each read by the same check the request command makes. When that record can't be read the field is absent, since unknown isn't false. Display only; the command decides. For everyone it answers, it carries `may_request`: whether the caller could ask for the repository or retry its setup as far as who they are goes, which is a person who is the room's owner or a room admin and whom this deployment lets ask (see the request command). Display only as well. While managed repositories are switched off (`MANAGED_REPOSITORIES` isn't exactly `true`) this route answers exactly as a route that doesn't exist does for that caller, `not_found` (404) to anyone in the room and the room's own refusal to anyone outside it, whether or not the room kept rows from an earlier on-period, so a screen learns the switch's state from the server."
      responses: { "200": { description: The request and the linked repository, content: { application/json: { schema: { $ref: "#/components/schemas/RoomRepository" } } } }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: requestRepository
      tags: [commands]
      summary: "Ask for the room's managed repository (M5 step 4, ADR 0009, proposed): `{ name, visibility }`, by a person who is the room's owner or a room admin, whose authority holds (the owner's decision of 2026-11-11, 'Owner and admins'). Never an agent, whatever role is stored for it, and nobody with another role: `not_allowed` (403). Managed repositories have a switch of their own, the Worker variable `MANAGED_REPOSITORIES`, off unless it is exactly `true` and on for staging only: while it's off this route answers `not_found` (404) to the owner as to anyone, and the job runs nothing. A deployment may name who it lets ask, in the Worker variable `REPOSITORY_REQUESTERS` (added 2026-11-11 after M5's security review): unset, the rules here apply to everyone; set, only those it names may ask or retry: listed person IDs, `test-people` for people made by the deployment's test sign-up, and `operators` for the people the deployment's own configuration names as Podster operators, who are never implied without that entry and never include an agent. A value that's empty, malformed, holds an unknown word or isn't a string lets nobody: only a variable that is absent is unset. An owner or admin it doesn't let gets `repository_requests_closed` (403), which says nothing of who is listed, before anything else about the request is looked at: nothing is recorded, no place in a count is taken and nothing reaches the provider. Anyone else gets the refusal they'd get without it. It bears on asking and retrying alone, never on a grant, a token, a merge or a read. A name that would read as Podster's own gets `name_reserved` (409). Every organization holds the provisioning delegation unless a Podster operator took it back (the owner's decision of 2026-11-11, 'No gate, with limits'); then it's refused with `not_delegated` (403) and nothing reaches the provider. At most 5 requests are accepted in any 24 hours for one organization, and the same for one person asking, across every room and organization (both proposed): the next gets `repository_request_limit` (429), and nothing is recorded. The cap is on rooms: each room holds at most one place in the organization's count and one in each asker's, stamped when it was last asked for, and a place is never given back. So a replay, a second request for a room that has one, and a retry of its setup cost nothing; a request the room refuses for itself is never counted; and one that fails after it was counted leaves its room counted for up to 24 hours, which can only make the count too high. A request is recorded only if that same call was told the room holds a place in both counts, for the caller as the room resolves them when it records: otherwise, as when someone is made an admin while their call is under way, or a count can't be read, it answers `delegation_unavailable` (503), records nothing, and may be sent again. `private` gets `private_unavailable` (409): on the organization's plan a private repository can't carry the rules, so it's never quietly made public. A room has one request: a second gets `repo_request_exists` (409). The organization, the App and its installation come from the server's configuration, and any other field is refused. Records the request as `pending` and answers as the read does. Switched off, it answers as a missing route does, to the owner as to anyone. A job then creates the repository, switches Actions off, adds the two rulesets, reads everything back, and only then links the repository by the ID in the provider's own answer and marks the request `ready`. Otherwise the request ends `failed` or `uncertain` with a reason code, which blocks coding tasks in the room and nothing else. Audited, and tells the room's managers."
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name, visibility], properties: { name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$", description: "Lower-case letters, digits and hyphens, starting with a letter or a digit, at most 64 bytes." }, visibility: { type: string, enum: [public, private], description: "Independent of the room's visibility. `private` is unavailable for now." } } } } } }
      responses: { "200": { description: The request and the linked repository, content: { application/json: { schema: { $ref: "#/components/schemas/RoomRepository" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/repository/retry:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: retryRepositorySetup
      tags: [commands]
      summary: "Retry a setup that ended `failed` or `uncertain` (M5 step 4), `{}`, by a person who is the room's owner or a room admin, with the same switch and delegation checks as the request, and the same check of who this deployment lets ask: an owner or admin it doesn't let gets `repository_requests_closed` (403) and the request stays as it was. The job checks that again for whoever first asked, before it calls the provider, and ends the request `failed` with that reason if they aren't let. It's the room's same request, so it isn't counted against the daily cap again. Setup runs at most five times for a room: after that `retry_limit_reached` (409), until an operator resets it, which isn't built. Between runs a retry waits a minute, doubling up to an hour, and after `provider_rate_limited` until the last reset time GitHub gave; before that it gets `retry_too_soon` (429). With a repository ID held from the provider's own answer, setup resumes on that repository and no second one is made. Without one, the next creation call goes out under a name the server makes from the chosen name and six hex digits, never a name an earlier call sent, so nothing is ever adopted by its name, and whatever an earlier call may have made stays where it is. Setup only adds what's missing: a rule that's present and wrong is never repaired, and fails again. `repo_request_not_found` (404), `setup_in_progress` (409), `already_ready` (409). Answers as the read does. Switched off, it answers as a missing route does"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { "200": { description: The request and the linked repository, content: { application/json: { schema: { $ref: "#/components/schemas/RoomRepository" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/orgs/{org}/provisioning-delegation:
    parameters: [{ name: org, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getProvisioningDelegation
      tags: [queries]
      summary: "Whether an organization holds the provisioning delegation for managed repositories (M5 step 4, AC-10), for a Podster operator or an admin of that organization. Held in the organization's own object in the API. Every organization holds it unless a Podster operator took it back (the owner's decision of 2026-11-11, 'No gate, with limits'): an organization nobody has set it for answers `granted: true` with `set_by` and `set_at` null. Once it's taken back, nobody in the organization can ask for a room's repository or retry its setup. Managed repositories' switch doesn't apply to a Podster operator: an operator's read and write answer the same whether it's on or off, so an operator can take the delegation back, or restore it, before the feature is switched on (ruled by the architect on 2026-11-11; for the owner to review). For anyone else, the organization's admins included, the switch does apply: while `MANAGED_REPOSITORIES` isn't exactly `true` this route answers exactly as a route that doesn't exist, `not_found` (404), before anything else is decided, so an ordinary person doesn't learn from it that the feature exists (narrowed on 2026-11-11 after M5's security review, A5)."
      responses: { "200": { description: The delegation, content: { application/json: { schema: { $ref: "#/components/schemas/ProvisioningDelegation" } } } }, default: { $ref: "#/components/responses/Error" } }
    put:
      operationId: setProvisioningDelegation
      tags: [commands]
      summary: "Take the provisioning delegation back from an organization, or restore it, `{ granted }`, by a Podster operator only. Every organization holds it until then, so this matters only to take it back and to undo that. For a managed repository Podster's platform is the resource owner, so an organization's own admins can't restore it for themselves. An organization the API has never seen a room of gets `organization_not_found` (404). Every change is kept with who made it, in the organization's object and in the operators' record. Taking it back stops new requests and any job that hasn't called the provider yet. It doesn't touch a repository already linked: its grants, tokens and merges go on as before. Setting the same value again changes nothing but the time. Managed repositories' switch doesn't apply to a Podster operator: an operator's read and write answer the same whether it's on or off, so an operator can take the delegation back, or restore it, before the feature is switched on (ruled by the architect on 2026-11-11; for the owner to review). For anyone else, the organization's admins included, the switch does apply: while `MANAGED_REPOSITORIES` isn't exactly `true` this route answers exactly as a route that doesn't exist, `not_found` (404), before anything else is decided, so an ordinary person doesn't learn from it that the feature exists (narrowed on 2026-11-11 after M5's security review, A5)."
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [granted], properties: { granted: { type: boolean } } } } } }
      responses: { "200": { description: The delegation, content: { application/json: { schema: { $ref: "#/components/schemas/ProvisioningDelegation" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/repository/grants:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: listRepositoryGrants
      tags: [queries]
      summary: "The grants on the room's repository that aren't revoked (M5 step 5b, ADR 0009, proposed), for a person: a human owner or admin sees every one, anyone else in the room their own. `state` is `live`, `expired`, or `stale` when its giver is no longer a person who is the room's owner or a room admin. It's display only and authorizes nothing: it can say `live` before the room learns its giver left, and a grant is checked again, from current authority, at every use. An agent gets `not_allowed`. While managed repositories are switched off (`MANAGED_REPOSITORIES` isn't exactly `true`) this route answers exactly as a route that doesn't exist does for that caller, `not_found` (404) to anyone in the room and the room's own refusal to anyone outside it, whether or not the room kept rows from an earlier on-period, so a screen learns the switch's state from the server."
      responses: { "200": { description: The grants, content: { application/json: { schema: { $ref: "#/components/schemas/RepoGrantList" } } } }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: grantRepositoryAction
      tags: [commands]
      summary: "Give a participant one action, `push` or `merge`, on the room's repository (M5 step 5b, ADR 0009, proposed). Only a person who is the room's owner or a room admin, whose authority holds (the owner's decision of 2026-11-11, 'Owner and admins'); anyone else in the room gets `not_allowed`. A grant counts only while it's live and its giver is still the room's owner or a room admin: one given by an admin who is demoted or removed ends in that same change, and making them an admin again restores nothing. Nobody merges work submitted by an agent the same person controls, whoever gave the grant: `self_merge` at the merge. The one exception is a self-reviewed merge in a private room, by the person who controls the submitting agent and approved its reviewed commit themselves, who still needs this grant (decision 186 as amended 2026-11-20). The participant must be in the room, `grantee_not_participant`, and not there through a public claim, `grantee_public`. A room with no linked repository answers `repo_not_linked`; a degraded or suspended one still takes a grant, which nothing uses until it's ready. `expires_at` is optional; when given, it must be after now and at most one year ahead, or the request is `invalid_argument`. Granting the same again changes nothing; a new expiry, or a grant over an expired row or another giver's, revokes that row and adds one. Audited, and tells the participant. A grant authorizes nothing by itself: it's checked again at every use. An agent gets `not_allowed`. Switched off, it answers as a missing route does"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, principal_id, action], additionalProperties: false, properties: { policy_version: { type: integer }, principal_id: { type: string }, action: { type: string, enum: [push, merge] }, expires_at: { type: [integer, "null"] } } } } } }
      responses: { "200": { description: The grant, content: { application/json: { schema: { $ref: "#/components/schemas/RepoGrant" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/repository/grants/{grant}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: grant, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: revokeRepositoryGrant
      tags: [commands]
      summary: "Take back a grant on the room's repository (M5 step 5b, ADR 0009, proposed): the room's owner or a room admin, as a person; a person who administers the room's organization, with or without a place in the room (AC-11); or the grant's holder for their own. Nobody else, `not_allowed`, and someone with no place in the room who doesn't administer its organization gets `workspace_not_found`, as for any route here. A grant the caller may not see answers `grant_not_found`, as a missing one does. Taking back a revoked grant changes nothing. Works in an archived room. Audited, and tells the holder. An agent gets `not_allowed`. Switched off, it answers as a missing route does: a grant left from an earlier on-period stays, and nothing uses it while the switch is off"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], additionalProperties: false, properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { description: The grant, content: { application/json: { schema: { $ref: "#/components/schemas/RepoGrant" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/repo-access:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: getRepoAccess
      tags: [commands]
      summary: "A short-lived token for the room's one repository, for the agent a task is assigned to (M5 step 6, ADR 0009, proposed). Exists only while managed repositories are switched on: otherwise it answers exactly as a task verb that doesn't exist does, `invalid_argument` (400) for a body that isn't JSON, `idempotency_key_required` (400) without an idempotency key, and `not_found` (404) with one. The body is empty or `{}`, and any field is `invalid_argument`: the repository is the room's link, and the organization, installation and permissions are configuration. Checked at every call, renewals included: the task must be visible, `task_not_found` (404); assigned to the caller, an agent, `not_allowed` (403); linked to the repository, `task_not_linked` (409); in a room whose repository is ready, `repo_not_ready` (409); and accepted, `task_not_active` (409). The caller must hold a live `push` grant from whoever holds the repository's delegation now, `grant_required`, `grant_expired` or `grant_stale` (403); not be in the room through a public claim, `public_participant` (403); and act for a person still in the organization they linked it from, `controller_departed` (403). If a standing can't be read, `standing_unknown` (503), and nothing is minted. Answers `{ token, expires_at, repository, clone_url, permissions, authority_ends_at }`: the token reaches only that repository with contents and pull requests `write` and metadata `read`, and lives at most an hour. `authority_ends_at` is null: a task has no server-side deadline yet. No idempotency key, and none is kept: one live token per agent and task, so asking again returns the same token until 5 minutes before `expires_at`, then a new one, and the old one is revoked. A call while another is minting gets `repo_access_busy` (409). Limits, proposed: 10 mints an hour per agent and 60 per room, `rate_limited` (429). `repo_access_unavailable` (503) when the App or the sealing key isn't configured, `provider_unavailable` (502) when GitHub didn't answer, and `provider_mismatch` (502) when what it minted isn't exactly what was asked for, which is revoked. The token is revoked early when the grant, the agent's place, the task or the link ends. It's never in an event, a log, D1, the outbox or an error"
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, maxProperties: 0 } } } }
      responses: { "200": { description: The token, content: { application/json: { schema: { $ref: "#/components/schemas/RepoAccess" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/merge:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: mergeTask
      tags: [commands]
      summary: "Asks for a task's reviewed commit to be merged into the room's repository's default branch (M5 step 7b, ADR 0009, proposed). Exists only while managed repositories are switched on: otherwise `not_found` (404). For a person or an agent. It only records the request, as `merge_state: requested`: a job then carries it out, and its outcome is `merge.succeeded` or `merge.failed` in the room's activity and `merge_state` on the task's `change`. Approval alone never merges (AC-17). The caller names the task, the approved submission and its commit, and nothing about the repository or the pull request, which are the room's own records: any other field is `invalid_argument` (400). Checked when asked and again by every pass of the job, before its mark and before its merge call, by the same decision, in this order: the task is visible, `task_not_found` (404); the caller isn't the submitter, the task's assignee, or controlled by the same person as the submitter, `self_merge` (403), which also refuses anyone whose controlling person isn't known, except a self-reviewed merge (decision 186 as amended by the owner on 2026-11-20): in a private room only, a person who controls the submitting agent may merge it if the approval of its reviewed commit is on record as their own. Never an agent, never another of that person's agents, never a person who didn't approve it, and never in a public room, where the second-person rule is unchanged; the grant, the approved submission and the reviewed commit are checked as for anyone. It is decided again by every pass of the job, so a room made public before the job runs ends the merge `merge.failed` with `self_merge`, and it answers `self_reviewed: true` and is recorded as one: `merge.requested` and `merge.succeeded` carry the reason `self_reviewed`, and the task's `change` says `merge_self_reviewed`; isn't in the room through a public claim, `public_participant` (403); holds a live `merge` grant from whoever holds the repository's delegation now, `grant_required`, `grant_expired` or `grant_stale` (403); and the review that approved the commit came from someone the submitter's person doesn't control, by the approver and controlling person the room recorded at approval, `self_review` (403, decision 195), checked only for a caller who passed the rest, so nobody else learns anything about the review. `self_review` has three messages, each a fixed sentence: \"This commit needs an approving review from someone other than the person who controls its submitter, or another agent that person controls, before it can be merged.\" when the reviewer is that person or one of their agents; \"This commit's approving review came from an agent whose controlling person isn't known, so it needs an approving review from someone else before it can be merged.\" when the reviewer is an agent whose credential named no linking person; and \"This commit was approved before Podster recorded who reviews a commit, so it needs to be reviewed again before it can be merged.\" for an approval recorded before the room kept its reviewer, which may well have been independent. The task's own review is unchanged. Then the body: the two fields and no other, `invalid_argument` (400). Then the task's, the change's and the requester's own, as below, which include `controller_departed` (403): the caller acts, as an agent, for a person still in the organization they linked it from, and as a person is still in their own. Then: the task has a linked repository, `task_not_linked` (409), that is ready, `repo_not_ready` (409); it is approved, `not_approved` (409), as the submission named, `submission_mismatch` (409), at the commit named, `commit_changed` (409); the approval recorded a reviewed commit from the server's own read of GitHub, `review_required` (409) for one made while managed repositories were off, which needs a fresh review; the head has never been seen off that commit since, `commit_changed` (409), even if the branch was put back; the pull request is still being read, `change_unwatched` (409); and no merge is under way, `merge_already_requested` (409), or done, `already_merged` (409). A merge that failed may be asked for again, except after `commit_changed`, when the way on is a follow-up task. Also `standing_unknown` (503) when the owner's standing can't be read, `rate_limited` (429) past 20 requests an hour for the room and `merge_request_limit` (429) past 10 requests for one task in its whole life, both proposed and both counting every request, a repeated one included, and `merge_unavailable` (503) when the merge App isn't configured, in which case nothing is recorded. The job gives up after 5 passes (proposed) with `merge_attempts_exhausted`, and a person asks again."
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MergeTask" } } } }
      responses: { "200": { description: The request as recorded, content: { application/json: { schema: { $ref: "#/components/schemas/MergeRequested" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/release-status:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    get:
      operationId: getTaskReleaseStatus
      tags: [queries]
      summary: "A task's checks, its merge and its release, each as Podster last observed it and with the time of that observation (M5 step 8, ADR 0009, proposed; the release from M6 step 7, ADR 0010). Exists only while managed repositories are switched on: otherwise `not_found` (404), as for any route that doesn't exist. Nothing is fetched on this read: checks are what the room's refresh job last read for the pull request's head, and a merge is what the merge job and the refresh job recorded. The two are reported apart, and neither is inferred from the other. `checks.state` is null until Podster has read the head commit's checks, which it does only where the App that reads has been given statuses and checks, and null says nothing about whether any pass. Only states and counts are kept: no check's name, context or text. It shows exactly what the caller's view of the task's `change` shows and no more. A person or an agent shown the change (people in the room other than guests, and the task's assignee and reviewer) gets all of it. Whoever asked for the merge and isn't shown the change gets the merge alone, with `pull_request` and `checks` null. Anyone else who can read the task gets `not_allowed` (403), the same whether or not the task has a pull request on record, and anyone who can't read it gets `task_not_found` (404). A task with no pull request on record answers with nulls and `merge.state: not_requested`. **The release** is the latest attempt to release the task's merged commit, `merge.sha`, in the room's own state, with the time the room recorded that state. While release is switched off for the deployment (`RELEASES` anything but exactly `true`) or for the room, or nothing was asked for that commit, it is `{ exists: false }`, as before M6. `served` is true only while the commit is what the room's default host serves: an attempt for it is `served`, which only its marker coming back through the host records, the host is still set to it, the room is public now, the app isn't held or suspended, and the content domain's stop was read and is clear. The room's `live` (switched, its marker not yet back) is said `awaiting_confirmation`: the status never says live, and whether the app is live is only `served` and `result_url`. `result_url` is the default host's address only while `served`. An earlier attempt that is still served stays served beside a later one that failed. Whoever is given the merge alone gets `release: null` while release is on, and `{ exists: false }` while it is off, as everyone does. A stored state the room doesn't recognise is refused, never read as served."
      responses: { "200": { description: The task's release status, content: { application/json: { schema: { $ref: "#/components/schemas/TaskReleaseStatus" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/pairing:
    post:
      operationId: startPairing
      tags: [commands]
      summary: "Start a Runner pairing session for a new agent (M7 step 5(a), decision 222; RUNNER.md, proposed one-agent pairing proof of concept). A person who administers `org_id` only; anyone else, an agent included, `not_allowed` (403). The gateway passes the Agent Auth plugin's one-time host enrollment token as `code` and that host's ID as `plugin_host_id`; the API keeps only the code's SHA-256 and never answers it. The new agent's ID is made here, and the session lives on that agent's Principal; the agent has no connection, capabilities or rooms until the session is activated, and `registerAgent` refuses it with `not_allowed` until then. The session expires 10 minutes after it starts, inside the plugin's hour. A person starts at most 5 sessions an hour across their organizations, counted before the session is made: the sixth answers `limit_exceeded` (409), and a count that can't be read refuses the start (500). Answers the session as `getPairing` does. Not idempotent: each call is a new session, which the limit bounds. Reached only through the gateway's own pairing routes (step 5(b)): the dashboard's `/api/v1/…` passthrough refuses every `/v1/pairing` path with `not_found` (404). (b) supplies `code` and `plugin_host_id` from its own server-side `createHost`, never from the client. The gateway's routes that reach the five pairing operations are in `pairing.yaml`"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [org_id, plugin_host_id, code], additionalProperties: true, properties: { org_id: { type: string }, plugin_host_id: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }, code: { type: string, pattern: "^[A-Za-z0-9_-]{32,128}$" }, name: { type: string, maxLength: 200, description: "The agent's name once activated. Default `agent`." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Pairing" }, default: { $ref: "#/components/responses/Error" } }
  /v1/pairing/{agent}:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    get: { operationId: getPairing, tags: [queries], summary: "A pairing session, for the person who started it alone, whatever their role now. Anyone else, and a session that doesn't exist, `not_found` (404). `status` is `pending`, `redeemed`, `activated`, `canceled`, `locked` or `expired` (read from the time, for one pending or redeemed past `expires_at`). `key_thumbprint` is the redeemed key's RFC 7638 thumbprint, or null. `attempts_left` counts wrong codes still allowed. `history`, oldest first, is `type` (`pairing.started`, `pairing.redeemed`, `pairing.activated`, `pairing.canceled`, `pairing.refused`), `actor_id` (a person's ID, or `key:` and the thumbprint), `reason` (a refusal's reason code, or null) and `at`, the last 200. Never the code or its verifier. Reached only through the gateway's own pairing routes (step 5(b)): the dashboard's `/api/v1/…` passthrough refuses every `/v1/pairing` path with `not_found` (404).", responses: { "200": { $ref: "#/components/responses/Pairing" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/pairing/{agent}/redeem:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    post:
      operationId: redeemPairing
      tags: [commands]
      security: [{ pairingRedeem: [] }]
      summary: "Runner's code for a pairing session (M7 step 5(a)). Not a call a person or an agent makes: the gateway sends it from its public redemption route (step 5(b)), after verifying a proof signed by the submitted key, and it's the only route that takes the gateway's `pairing_redeem` assertion. The assertion names the session's agent, and is refused for any other session. The proof's ID is checked on every redemption of a session and spent there; a replayed one is refused like any other. The right code binds the assertion's key thumbprint to the session, once; the same code with the same key on a fresh proof answers the same again, for a lost answer. Every refusal answers `not_allowed` (403), the same for a wrong, spent, expired, canceled, locked or unknown session, another key, a replayed proof and a proof for another session, so Runner learns nothing more. Wrong codes are counted, and the fifth locks the session for good; an expired session counts nothing. Nothing is connected until the person confirms with `activatePairing`. Answers `agent_id`, `status` (`redeemed`), `plugin_host_id`, `key_thumbprint` and `expires_at`"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: "^[A-Za-z0-9_-]{32,128}$" } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/pairing/{agent}/activate:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    post:
      operationId: activatePairing
      tags: [commands]
      summary: "The person who started a pairing session confirms the key thumbprint they were shown (M7 step 5(a)). Only them, while they administer the session's organization in a membership that began no later than the session: otherwise `not_allowed` (403), and anyone else `not_found` (404). A thumbprint other than the redeemed one answers `not_allowed` and changes nothing. A session not yet redeemed, expired, canceled or locked answers `invalid_transition` (409). The one effective outcome: the agent's connection, generation 1 and active, in the session's organization and name, written in the same transaction that closes the session. Confirming again with the same thumbprint answers the same, so it's safe to retry; nothing reopens or rekeys it. Answers the session with `connection` and `plugin_agent_id`. **The link (step 5(c)):** `plugin` holds what the gateway read of the Agent Auth plugin, and the confirmation links exactly one plugin agent, recorded in the same transaction: the only agent that isn't revoked, active, on the session's own plugin host, which the starter owns, which holds the session's thumbprint, and which is the only host holding it. No agent there yet answers `invalid_transition` (409) and changes nothing, so Runner can still register one; any other host, owner, key, shared key, a second agent or one not active answers `not_allowed` (403) and changes nothing. A repeat must name the same plugin agent. The gateway then writes the directory's `podster_agent` and `identity_link`, as the claim does after `registerAgent`; `registerAgent` refuses a paired agent to everyone, so no other admin can take its connection or link another credential to it. Pairing grants no room, role or provider access, and the plugin agent's capabilities are its host's defaults, Runner's allowlist. Reached only through the gateway's own pairing routes (step 5(b)): the dashboard's `/api/v1/…` passthrough refuses every `/v1/pairing` path with `not_found` (404)."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [key_thumbprint, plugin], properties: { key_thumbprint: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }, plugin: { type: object, description: "What the gateway read of the Agent Auth plugin for the session's own host, from its own database, never from the client (step 5(c)). Facts, which the API judges by the binding rule.", required: [host_id, host_owner, host_active, host_thumbprint, hosts_holding_key, agents], properties: { host_id: { type: string, description: "The session's `plugin_host_id`, as read" }, host_owner: { type: string, description: "The person who owns that host in the plugin, as a Podster person ID, or empty" }, host_active: { type: boolean }, host_thumbprint: { type: string, description: "The RFC 7638 thumbprint of the key the host holds, or empty" }, hosts_holding_key: { type: integer, minimum: 0, description: "Plugin hosts holding that key, in any state" }, agents: { type: array, maxItems: 6, description: "The host's plugin agents that aren't revoked", items: { type: object, required: [id, active], properties: { id: { type: string }, active: { type: boolean } } } } } } } } } } }
      responses: { "200": { $ref: "#/components/responses/Pairing" }, default: { $ref: "#/components/responses/Error" } }
  /v1/pairing/sweep:
    post:
      operationId: sweepPairings
      tags: [queries]
      security: [{ pairingSweep: [] }]
      summary: "A person's own pairing sessions past their expiry, at most 50, each as `agent_id`, `plugin_host_id`, `status` (as `getPairing` reads it, or `missing` for one listed at its start but never made, or not that person's), `key_thumbprint` and `plugin_agent_id` (M7 step 5(c)). Not the dashboard's: the gateway's cron calls it under its `pairingSweep` service assertion, which names only the person whose list it reads (ruling L1 on #453; a person's or an agent's assertion answers `invalid_assertion`, 401), and ends the plugin host of every session listed that wasn't activated, so a redeemed session nobody touches still loses its host. Every session is listed on its starter's own Principal in the write that counts its start, so none escapes the list. Changes nothing; `settlePairingSweep` does. Reached only by the gateway's cron: the dashboard's `/api/v1/…` passthrough refuses every `/v1/pairing` path with `not_found` (404)."
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/pairing/sweep/settled:
    post:
      operationId: settlePairingSweep
      tags: [commands]
      security: [{ pairingSweep: [] }]
      summary: "The gateway has ended the plugin hosts of these sessions, or found nothing to end, so the named person's list forgets them (M7 step 5(c)). `agent_ids`, at most 50 agent IDs, or `invalid_argument` (400). Only sessions past their expiry are forgotten, so a live one stays listed whatever is sent. Answers `settled`, how many were forgotten. Only under the `pairingSweep` service assertion. Reached only by the gateway's cron: the dashboard's `/api/v1/…` passthrough refuses every `/v1/pairing` path with `not_found` (404)."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [agent_ids], properties: { agent_ids: { type: array, maxItems: 50, items: { type: string } } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/pairing/{agent}/cancel:
    parameters: [{ name: agent, in: path, required: true, schema: { type: string } }]
    post:
      operationId: cancelPairing
      tags: [commands]
      summary: "The person who started a pairing session ends it, whatever their role now; anyone else `not_found` (404). A pending, redeemed, expired or locked session is canceled for good, and canceling again answers the same. An activated one answers `invalid_transition` (409): disconnecting the agent is `disconnectAgent`. Answers the session. Reached only through the gateway's own pairing routes (step 5(b)): the dashboard's `/api/v1/…` passthrough refuses every `/v1/pairing` path with `not_found` (404)."
      responses: { "200": { $ref: "#/components/responses/Pairing" }, default: { $ref: "#/components/responses/Error" } }
  /v1/provider/github/deliveries:
    post:
      operationId: receiveGithubDelivery
      tags: [commands]
      security: [{ providerDelivery: [] }]
      summary: "One GitHub webhook delivery, as a nudge (M5 step 5, ADR 0009, proposed). Not a call a person or an agent makes: the gateway sends it from its public `POST /webhooks/github`, after verifying GitHub's `X-Hub-Signature-256` over the raw body with its webhook secret, and it's the only route that takes the gateway's delivery assertion. The body is IDs and one commit SHA, never a title, body, branch name, URL or state. The API finds the room through `repo_room_index`, which authorizes nothing, and the room keeps the delivery only if the repository is the one it's linked to. A delivery that names a pull request or a commit of a task's change marks that change as due a read of GitHub, and records nothing else: no head, check, merge or pull request state is taken from it, no event is written and nobody is told. Such a delivery is taken once, by its ID and by the hash of its body, and remembered 7 days, up to 10,000 a room; past that it still marks the change and isn't remembered. One about anything else leaves nothing behind. Every delivery that passes the assertion gets the same `202`, whether a room took it or not. No idempotency key: the delivery ID is one."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderDelivery" } } } }
      responses:
        "202": { description: "Taken, or dropped. The answer doesn't say which.", content: { application/json: { schema: { type: object, additionalProperties: false, required: [accepted], properties: { accepted: { type: boolean, const: true } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/tasks/{t}/messages:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    get:
      operationId: listMessages
      tags: [queries]
      summary: "Messages on a task thread, oldest first, 50 at a time, each with `id`, `from`, `external`, `body`, `created_at` and `origin`: `a2a_remote` when the agent's A2A endpoint reported it, otherwise null. Either way it's the agent's content, never instructions"
      parameters: [{ name: after, in: query, description: "Opaque: the id of the last message the page before returned. Absent or empty is the start. One that isn't a message on this task answers 400 invalid_argument.", schema: { type: string } }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: sendMessage
      tags: [commands]
      summary: Post to a task thread
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      description: "A retried request with the same idempotency key, and the room's archived and access checks, come first, and none of them depends on the task. After them, a task the caller can't see answers `task_not_found` (404) before anything about the task or the message is checked. With `via: a2a`, which only the gateway's A2A path sends, a completed or canceled task answers `task_closed` (409), because A2A's terminal states take no more messages (ADR 0007). Any other `via` is `invalid_argument`. MCP messages send no `via` and aren't affected."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, description: "At most 16 KiB of UTF-8." }, via: { type: string, enum: [a2a], description: "Set by the gateway for a message that came over A2A. It only ever refuses more." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/inbox:
    get:
      operationId: readInbox
      tags: [queries]
      summary: Read this principal's inbox. Events carry IDs only
      parameters:
        - { name: after, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: ack, in: query, description: "Documented exception: also advances the cursor.", schema: { type: boolean } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/inbox/ack:
    post:
      operationId: ackInbox
      tags: [commands]
      summary: Advance the inbox cursor
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [up_to], properties: { up_to: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/inbox/wake:
    put:
      operationId: setWake
      tags: [commands]
      summary: Set the wake URL. The response has the secret, shown only here. Each wake is a JSON POST of agent_id, unread and at, with X-Podster-Signature t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<body>">, expected to answer 2xx within 10 seconds without redirecting
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri }, debounce: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    delete: { operationId: deleteWake, tags: [commands], summary: Remove the wake URL, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/inbox/a2a-endpoint:
    get: { operationId: getA2aEndpoint, tags: [queries], summary: "The agent's A2A endpoint, or null: `url`, `version`, `enabled`, `consecutive_failures`, `has_token`, `token_state` (`none`, `stored`, or `unreadable` when a stored token can't be opened, as after a key change, so sends would go without it until it's set again) `set_at` and `delivery`; a nudge endpoint also has `control` (`verified` or `unverified`), `nudge_on` and `nudge_set_at` (M7 step 13). Never the signing secret or the token", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    put:
      operationId: setA2aEndpoint
      tags: [commands]
      summary: "Set the agent's A2A endpoint (decision 119), one per agent, beside wake. It grants nothing in any room. Whoever sets it is recorded: the person who linked the agent's credential, or the admin. Once that person leaves the agent's organization, nothing more is sent and the endpoint is deleted. A set with neither answers 403 `not_allowed`. A new URL, or one set after a delete, makes a new registration `version` and returns a new `signing_secret` once: each request to the endpoint carries `X-Podster-Signature` as wake's does, over the exact JSON-RPC body. The same URL keeps its version and secret unless `rotate_secret` is true, and setting it again turns a switched-off endpoint back on. Three failed requests in a row switch it off. Needs an active connection, or `agent_disconnected`. A disconnect deletes it"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], additionalProperties: false, properties: { url: { type: string, format: uri, description: "An `https` URL on a public DNS name, with no IP address, credentials or port, and not `podster.dev`, as for wake. Otherwise 400 `invalid_endpoint_url`." }, token: { type: [string, "null"], maxLength: 4096, description: "An optional bearer token Podster sends to the endpoint, printable ASCII with no spaces. It's encrypted, never returned, and cleared when the URL changes. Left out, it's kept for the same URL; null clears it. 503 `token_storage_unavailable` if Podster can't store tokens yet." }, rotate_secret: { type: boolean, description: "True makes a new signing secret for the same URL, returned once, without moving the version. A new URL always gets one." }, delivery: { type: string, enum: [offers, nudge], description: "How Podster sends to it. Left out, it keeps the current registration's mode, and is `offers` for a new registration. `offers` is ADR 0007's: each offer with its text. `nudge` (M7 step 13, Proposed) sends IDs only, a signed `SendMessage` with one data part naming the room, the task, the attempt and its kind (`offer` or `change_request`), and only once the endpoint has proved control (verify) and a person who administers the agent's organization has switched it on for this version (setAgentA2aNudge). Changing it is a new registration: a new `version` and `signing_secret`. Any new signing secret clears the proof and the opt-in." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    delete: { operationId: deleteA2aEndpoint, tags: [commands], summary: "Delete the agent's A2A endpoint, with its signing secret and token. Deleting nothing is fine", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/inbox/a2a-endpoint/verify:
    post:
      operationId: verifyA2aEndpoint
      tags: [commands]
      summary: "Prove control of the agent's nudge endpoint (M7 step 13, Proposed). Podster sends the endpoint one JSON-RPC request, `podster.dev/verifyEndpoint`, signed with `X-Podster-Signature` as every request is, under the same egress rules, with a 10-second timeout and no redirects, whose `params` are `agent_id`, `version` and `challenge` (64 lowercase hex characters, 256 random bits). The endpoint answers `result.proof`: lowercase hex HMAC-SHA256, under the registration's signing secret, of `podster-endpoint-proof/1.<agent_id>.<version>.<challenge>`, in an answer of at most 4 KB. Answers the endpoint's status with `verified`, and, when it isn't, `reason`: `wrong_proof`, `no_answer` or `endpoint_changed` (it was set again meanwhile). A verified endpoint sends nothing more. Refused for an endpoint that isn't a nudge (`not_a_nudge_endpoint`), is missing (`no_endpoint`) or switched off (`endpoint_switched_off`), after 5 challenges for one signing secret (429 `verify_attempts_exhausted`) until a new one is made, and after 10 challenges for the agent in the last hour, whatever its endpoint or secret (429 `verify_rate_limited`), which no rotation, new URL or delete resets. Idempotent by design. Needs an active connection, or `agent_disconnected`"
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
components:
  securitySchemes:
    assertion: { type: apiKey, in: header, name: X-Podster-Assertion, description: "Ed25519-signed gateway assertion, valid for 60 seconds. For people, `org_since` says when they joined each organization, and a room role older than that has ended. When a person adds another person or changes their role, `target_member` holds that person's organizations and join times from the gateway's directory. Neither grants anything by itself. `departure` says someone left an organization, and only the gateway's own removal sends it. Agents carry their connection generation, and `linker`: who linked the credential the request came with, and when, which an A2A endpoint set records. People carry orgs and admin_orgs." }
    pairingSweep: { type: apiKey, in: header, name: X-Podster-Assertion, description: "The gateway cron's service assertion for the pairing expiry sweep (M7 step 5(c), ruling L1 on #453), valid for 60 seconds: `kind: pairing_sweep`, `person_id` (the person whose own list of started sessions is read or settled) and `body_sha256` (lowercase hex SHA-256 of the exact body sent), with `jti`, `iat`, `exp`, `aud` and `iss` and nothing else. No organization or role: it authorizes nothing but `sweepPairings` and `settlePairingSweep`, which take nothing else" }
    pairingRedeem: { type: apiKey, in: header, name: X-Podster-Assertion, description: "The gateway's assertion for one Runner pairing redemption (M7 step 5), valid for 60 seconds: `kind: pairing_redeem`, `agent_id` (the session the proof was made for, which must be the path's), `key_thumbprint` (the RFC 7638 thumbprint of the key whose signed proof the gateway verified), `proof_jti` and `proof_exp` (the proof's own ID, which the API spends, and its expiry in seconds, at most 300 seconds ahead), and `body_sha256` (lowercase hex SHA-256 of the exact body sent), with `jti`, `iat`, `exp`, `aud` and `iss` and nothing else. It names no one, and only `redeemPairing` takes it" }
    providerDelivery: { type: apiKey, in: header, name: X-Podster-Assertion, description: "The gateway's assertion for one provider webhook delivery whose signature it verified, valid for 60 seconds: `kind: provider_delivery`, `provider`, `delivery` (the provider's delivery ID) and `body_sha256` (lowercase hex SHA-256 of the exact body sent), with `jti`, `iat`, `exp`, `aud` and `iss` and nothing else. It names no person, agent or organization, so it authorizes nothing. Only `receiveGithubDelivery` takes it, and that route takes nothing else." }
  parameters:
    appLabel: { name: label, in: path, required: true, description: "An app's host label (M6, ADR 0010): at most 26 lower-case letters and digits, generated by the server and never used again.", schema: { type: string, pattern: "^[a-z0-9]{1,26}$" } }
    appHost: { name: host, in: path, required: true, description: "One host of an app (M6, ADR 0010): a default host on the content domain, or a custom hostname.", schema: { type: string, maxLength: 253 } }
    ws: { name: ws, in: path, required: true, schema: { type: string } }
    t: { name: t, in: path, required: true, schema: { type: string } }
    idempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
  responses:
    Json: { description: Success, content: { application/json: { schema: { type: object } } } }
    Pairing: { description: "A pairing session, as its starter sees it: `agent_id`, `org_id`, `name`, `plugin_host_id`, `status`, `key_thumbprint`, `attempts_left`, `created_at`, `expires_at` and `history`, with `connection` and `plugin_agent_id` (the Agent Auth plugin agent its confirmation linked) once activated", content: { application/json: { schema: { type: object, required: [agent_id, org_id, status, key_thumbprint, expires_at, history] } } } }
    TaskDetail:
      description: A task and what the caller may read about it
      content:
        application/json:
          schema:
            type: object
            required: [task, submissions, artifacts, messages, history, visible]
            properties:
              task: { $ref: "#/components/schemas/Task" }
              provenance: { $ref: "#/components/schemas/TaskProvenance" }
              expected_output: { type: [object, "null"], description: "The expected output this task works toward, as `id`, `title` and `removed`, or null.", properties: { id: { type: string }, title: { type: string }, removed: { type: boolean } } }
              change: { $ref: "#/components/schemas/TaskChange", description: "Absent while managed repositories are switched off, even for a task that got a change while they were on." }
              submissions: { type: array, items: { type: object } }
              artifacts: { type: array, items: { type: object } }
              files: { type: array, items: { type: object } }
              messages: { type: array, items: { type: object } }
              history: { type: array, items: { type: object } }
              visible: { type: object, required: [submissions, conversation], properties: { submissions: { type: string, enum: [all, own] }, conversation: { type: boolean } } }
    Task: { description: The task after the command, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
    Error: { description: A stable error code, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    ProviderDelivery:
      type: object
      additionalProperties: false
      required: [delivery_id, body_sha256, event, repository_id]
      description: "What the gateway passes on from a webhook delivery: IDs and one commit SHA. It must name a pull request or a commit. Any other field is refused."
      properties:
        delivery_id: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$", description: "The provider's delivery ID. It must be the one in the assertion." }
        body_sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 of the raw body the provider signed. The provider's signature doesn't cover the delivery ID, so the room takes the same body once, whatever ID it comes under." }
        event: { type: string, enum: [pull_request, check_run, status] }
        repository_id: { type: integer, minimum: 1, description: "The provider's repository ID. The room checks it against its own link." }
        pull_requests: { type: array, maxItems: 10, items: { type: integer, minimum: 1 }, description: "Pull request numbers in that repository." }
        head_sha: { type: [string, "null"], pattern: "^([0-9a-f]{40}|[0-9a-f]{64})$", description: "A full commit ID. Used only to find which change to read again, never recorded as a head." }
    OperatorReason: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, enum: [spam, abuse, illegal, impersonation, privacy, other], description: "The reason code, recorded with the action" } } }
    TaskStatus: { type: string, enum: [open, offered, accepted, submitted, completed, canceled] }
    TaskProvenance:
      type: object
      additionalProperties: false
      required: [room_visibility, requester, inputs]
      description: "M7 step 4 (decision 228): where a task's prompt came from, for Runner's run policy, which lets the least-trusted author of any input decide (RUNNER.md). The room records each author from the command that wrote the input, never from anything a client sends, keeps every author an input ever had, and shows this only to someone who may read the task, through oversight too. It is a read only: nothing on the server authorizes from it, and no request takes any of it. An author's `external` compares organizations only; an input's and the requester's `external` also count anyone unknown or no longer active, one fail-closed answer. Only `get_task` returns it."
      properties:
        room_visibility: { type: string, enum: [private, public], description: "The room's visibility as it stands." }
        requester:
          type: object
          additionalProperties: false
          required: [id, org, external, active]
          properties:
            id: { type: string }
            org: { type: [string, "null"], description: "The organization the room held the requester in when they became requester, by creating the task or by a change of requester. Null if none was recorded, as for a task made before this was." }
            external: { type: boolean, description: "True unless `org` is the reader's organization and the requester is `active`. Always true when `org` is null." }
            active: { type: boolean, description: "Whether the requester is, as the room stands now, a current participant held in `org`." }
        inputs:
          type: array
          maxItems: 4
          description: "One entry for each prompt input the task has, in this order: `title`, `instructions`, `acceptance_criteria` while the task has criteria, and `change_request` once a reviewer has asked for changes, naming the latest. The words themselves are the task's, and a change request's are its history entry's `reason`."
          items:
            type: object
            additionalProperties: false
            required: [input, external, authors]
            properties:
              input: { type: string, enum: [title, instructions, acceptance_criteria, change_request] }
              external: { type: boolean, description: "True if any author is external, unknown or not `active`: one fail-closed answer for the reader." }
              authors:
                type: array
                minItems: 1
                description: "Everyone who ever wrote this input, in the order they first did, once for each organization they wrote it under; none is removed while the task exists. When who wrote the present words isn't recorded (words changed by a path that records no author, a change request whose record isn't the latest, or a task made before this was recorded), an unknown author with a null `id` is listed. Once a write finds such words, the unknown author stays for good, even after later recorded edits."
                items:
                  type: object
                  additionalProperties: false
                  required: [id, org, external, active, written_at]
                  properties:
                    id: { type: [string, "null"], description: "Null for an unknown author: who wrote the present words isn't recorded." }
                    org: { type: [string, "null"], description: "The organization the room held them in when they wrote it. Null if none was recorded." }
                    external: { type: boolean, description: "Compares organizations only: true unless `org` is the reader's organization. Always true for an unknown author." }
                    active: { type: boolean, description: "Whether they are, as the room stands now, a current participant held in `org`. False once they leave, are revoked or are held in another organization, and for an unknown author. A false here makes the input `external`; the server authorizes nothing from it." }
                    written_at: { type: [integer, "null"], description: "When they last wrote it, in milliseconds. Null for an unknown author." }
              event_id: { type: [string, "null"], description: "For `change_request` only: the ID of the latest `task.changes_requested` history entry, whose `reason` is the request." }
    Task:
      type: object
      required: [id, title, instructions, requester, reviewer, status, version]
      properties:
        id: { type: string }
        title: { type: string }
        instructions: { type: string }
        acceptance_criteria: { type: [string, "null"] }
        requester: { type: string }
        assignee: { type: [string, "null"] }
        reviewer: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        version: { type: integer }
        due_at: { type: [integer, "null"] }
        follow_up_of: { type: [string, "null"] }
        submission_no: { type: integer }
        approved_submission_no: { type: [integer, "null"], description: "The submission a reviewer approved, or null if none has been. It's set in the same transaction as the approval and can't change after it. A task completed before this was recorded has its latest submission here, which is the only one that could have been approved." }
        needs_attention: { type: boolean }
    CreateTask:
      type: object
      required: [title, instructions]
      properties:
        title: { type: string, minLength: 1, description: "At most 500 bytes." }
        instructions: { type: string, minLength: 1, description: "At most 64 KiB." }
        acceptance_criteria: { type: string, description: "At most 16 KiB." }
        assignee: { type: string }
        reviewer: { type: string }
        due_at: { type: integer }
        follow_up_of: { type: string }
        expected_output_id: { type: string, description: "An expected output this task works toward. One that doesn't exist or was removed gets 404 `output_not_found`." }
    OutputText:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, description: "At most 200 bytes." }
        description: { type: [string, "null"], minLength: 1, description: "At most 4096 bytes." }
    LinkFile:
      type: object
      required: [task_id]
      additionalProperties: false
      properties:
        task_id: { type: string, description: "The task to link the input asset to." }
    CreateUpload:
      type: object
      required: [name, size, sha256]
      additionalProperties: false
      properties:
        name: { type: string, description: "The file's name, which is cleaned. It's agent content, and never reaches a log or an event." }
        size: { type: integer, minimum: 1, maximum: 100000000, description: "The exact size in bytes." }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "The file's SHA-256, in lower-case hex." }
        task_id: { type: string, description: "The task whose submission this file is for. Left out, it's an input asset." }
    SetPlanStart:
      type: object
      required: [start_date, timezone, plan_revision]
      additionalProperties: false
      properties:
        start_date: { type: string, format: date, description: "A local calendar date, `YYYY-MM-DD`, from 2000-01-01 to 2100-12-31. It isn't shifted by the timezone." }
        timezone: { type: string, maxLength: 64, description: "An IANA name such as `America/New_York`. An offset such as `+01:00` is refused. It labels the dates and doesn't change them." }
        plan_revision: { type: integer, description: "The revision last read. Anything else gets `plan_conflict`." }
    PlanForecast:
      type: object
      description: "A read-only baseline, never a delivery commitment. `available` true has every field below except `reasons` and `explanation`. `available` false has only `label`, `reasons` and `explanation`. Someone who can't have a forecast, because they don't see the whole plan or are a guest, always gets `reasons` of exactly `not_available` and the same `explanation`, whatever the room holds. Someone who sees the whole plan gets any of `no_start`, `no_tasks`, `missing_estimates`, `canceled_predecessor`, `cycle` and `incomplete`, which name no task."
      required: [label, available]
      properties:
        label: { type: string, enum: ["Baseline plan"] }
        available: { type: boolean }
        reasons: { type: array, items: { type: string, enum: [not_available, no_start, no_tasks, missing_estimates, canceled_predecessor, cycle, incomplete] } }
        explanation: { type: string }
        plan_revision: { type: integer, description: "Moves when estimates, dependencies or the start change. It isn't a version of this forecast and can't key a cache: the forecast also reflects current task status and which tasks exist when read, so canceling, completing or creating a task can change it while this stays the same. Nothing here moves with today's date." }
        plan_changed_at: { type: [integer, "null"], description: "When estimates, dependencies or the start last changed, in milliseconds. A task's lifecycle doesn't move it, so the forecast can have changed since." }
        start_date: { type: string, format: date, description: "The date as entered, which can fall on a weekend." }
        begins_on: { type: string, format: date, description: "The first working day on or after `start_date`, where the plan really begins. Show this if it differs." }
        timezone: { type: string }
        calendar: { type: string, enum: [mon_fri], description: "Fixed. Holidays aren't taken into account, so one counts as a working day." }
        assumptions: { type: array, items: { type: string }, description: "Fixed text to show with the forecast." }
        duration_days: { type: integer, description: "The longest dependency path in working days, never the sum of every estimate." }
        finish_date: { type: string, format: date, description: "The last working day of the plan, inclusive." }
        tasks:
          type: array
          description: "Sorted by ID. Every unfinished task and every completed task with an estimate. Canceled tasks aren't here."
          items:
            type: object
            required: [id, duration_days, earliest_start, earliest_finish, latest_start, latest_finish, slack_days, critical]
            properties:
              id: { type: string }
              duration_days: { type: integer }
              earliest_start: { type: string, format: date }
              earliest_finish: { type: string, format: date, description: "Inclusive: the span's last working day." }
              latest_start: { type: string, format: date }
              latest_finish: { type: string, format: date }
              slack_days: { type: integer, description: "Working days it can slip without moving the finish. It isn't evidence anyone is free." }
              critical: { type: boolean, description: "Exact, even when `critical_paths_cut` is true." }
        critical_paths: { type: array, items: { type: array, items: { type: string } }, description: "Each tied path, first task to last, sorted, up to 20 paths and 10,000 IDs." }
        critical_paths_cut: { type: boolean, description: "Whether more tied paths exist than are listed." }
        left_out: { type: array, items: { type: string }, description: "Completed tasks with no estimate, which aren't in the scenario and count toward nothing here. A screen must say which they are, so a finish date doesn't look complete." }
    SetTaskPlan:
      type: object
      additionalProperties: false
      required: [plan_revision, predecessors]
      properties:
        plan_revision: { type: integer }
        duration_days: { type: [integer, "null"], minimum: 1, maximum: 260 }
        predecessors: { type: array, maxItems: 50, uniqueItems: true, items: { type: string } }
    UpdateTask:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer }
        title: { type: string, minLength: 1 }
        instructions: { type: string, minLength: 1 }
        acceptance_criteria: { type: string }
        due_at: { type: integer }
    SetReviewer: { type: object, required: [version, reviewer], properties: { version: { type: integer }, reviewer: { type: string } } }
    SetRequester: { type: object, required: [version, requester], properties: { version: { type: integer }, requester: { type: string } } }
    AssignTask: { type: object, required: [version, assignee], properties: { version: { type: integer }, assignee: { type: string } } }
    VersionedReason: { type: object, required: [version], properties: { version: { type: integer }, reason: { type: string } } }
    RequiredReason: { type: object, required: [version, reason], properties: { version: { type: integer }, reason: { type: string, minLength: 1 } } }
    Artifact: { type: object, required: [uri, label], properties: { uri: { type: string, description: "HTTPS only, at most 2 KiB." }, label: { type: string, minLength: 1, description: "At most 256 bytes." } } }
    SubmissionFile: { type: object, required: [id], additionalProperties: false, properties: { id: { type: string, description: "A file you uploaded for this task with create_upload's task_id, which has finished scanning as ready." }, label: { type: string, minLength: 1, description: "At most 256 bytes. Left out, it's the file's name." } } }
    SubmitTask:
      type: object
      required: [version]
      description: "Needs at least one link, file or note. Links and files together are at most 10, or `too_many_artifacts` (400). Naming a file twice gets `duplicate_file` (400). A file that isn't one you uploaded for this task answers `file_not_found` (404), however it exists. One that hasn't finished scanning as ready gets `file_not_ready` (409), so wait for its scan, and one removed gets `file_removed` (409). Each file is pinned to its SHA-256 and size, and approval names this exact submission."
      properties:
        version: { type: integer }
        artifacts: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Artifact" } }
        files: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/SubmissionFile" } }
        note: { type: string }
        commit_sha: { type: string, description: Required when the task has a linked repository. }
        pr_number: { type: integer, minimum: 1, description: "The task's pull request, by its number in the room's repository (M5 step 7a, ADR 0009, proposed). Read only while managed repositories are switched on, and then required for a task with a linked repository: without it, `invalid_argument` (400). A task is linked when it was made while the switch was on and the room's repository was ready. Before the submission is accepted the server reads the pull request from GitHub itself, and refuses unless it is in the room's repository, `pull_request_not_found` (404); comes from a branch of that same repository and not a fork, `pull_request_from_fork` (409); targets the repository's default branch, `pull_request_wrong_base` (409); is open, `pull_request_not_open` (409); isn't still marked as a draft, `pull_request_draft` (409); and has `commit_sha` as its head, `commit_changed` (409). A stale `version` is `version_conflict` first, and says nothing about the pull request. One pull request belongs to one task, `pull_request_in_use` (409), and a task keeps the one it first named, so a later submission may name a new head of it and never another pull request, `pull_request_changed` (409). Also `repo_not_ready` (409) while the room's repository isn't ready; `rate_limited` (429) past 60 such reads an hour for the room or 20 for one caller, both proposed; `repo_access_unavailable` (503) when the App that reads isn't configured; `provider_unavailable` (502) when GitHub didn't answer; and `pull_request_unread` (409) when the room changed while GitHub was being read, which is safe to send again. Nothing the pull request contains is kept but IDs, commit IDs, its state, whether it's a draft and the times they were seen." }
    TaskReleaseStatus:
      type: object
      additionalProperties: false
      required: [task_id, linked, pull_request, checks, merge, release]
      properties:
        task_id: { type: string }
        linked: { type: boolean, description: "Whether the task has a linked repository." }
        pull_request:
          type: [object, "null"]
          description: "The task's pull request as last read, or null if it has none on record or the caller isn't shown the task's change."
          additionalProperties: false
          required: [pr_number, pr_state, pr_observed_at, reviewed_commit_sha, observed_head_sha, head_observed_at, commit_changed]
          properties:
            pr_number: { type: integer }
            pr_state: { type: [string, "null"], enum: [open, closed, merged, null] }
            pr_observed_at: { type: [integer, "null"] }
            reviewed_commit_sha: { type: [string, "null"] }
            observed_head_sha: { type: [string, "null"] }
            head_observed_at: { type: [integer, "null"] }
            commit_changed: { type: boolean }
        checks:
          type: [object, "null"]
          description: "Null for a caller who isn't shown the task's change."
          additionalProperties: false
          required: [state, counts, observed_at, commit_sha]
          properties:
            commit_sha: { type: [string, "null"], description: "The commit these checks were read for. Checks are never reported beside a commit they weren't read for: once the head is another, they're unobserved until read again." }
            state: { type: [string, "null"], enum: [success, failure, pending, none, null], description: "What the head commit's statuses and check runs come to together: `failure` if any failed, else `pending` if any is unfinished, else `success`, or `none` if it has none. Null if Podster hasn't read them." }
            counts: { type: [object, "null"], additionalProperties: false, required: [success, failure, pending], properties: { success: { type: integer }, failure: { type: integer }, pending: { type: integer } } }
            observed_at: { type: [integer, "null"], description: "When the checks were read." }
        merge:
          type: object
          additionalProperties: false
          required: [state, reason, observed_at, sha, requested_by]
          properties:
            state: { type: string, enum: [not_requested, requested, succeeded, failed, outcome_unknown] }
            reason: { type: [string, "null"], description: "A reason code, as on the task's `change`." }
            observed_at: { type: [integer, "null"], description: "When what the state says was recorded: the end of a requested merge, the request while it's under way, or the sighting of a merge nobody asked Podster for." }
            sha: { type: [string, "null"], description: "The merge commit, once merged." }
            requested_by: { type: [string, "null"] }
        release:
          description: "`{ exists: false }` for everyone while release is switched off for the deployment or the room, as before M6. While it is on: null for a caller who isn't shown the task's change, and otherwise `{ exists: false }` while nothing was asked for the task's merged commit, or the latest attempt."
          oneOf:
            - { type: "null" }
            - { type: object, additionalProperties: false, required: [exists], properties: { exists: { type: boolean, enum: [false] } } }
            - { $ref: "#/components/schemas/TaskRelease" }
    TaskRelease:
      type: object
      description: "The release part of a task's release status (M6 step 7, ADR 0010): the latest attempt to release the task's merged commit. It never says live: whether the app is live is only `served` and `result_url`."
      additionalProperties: false
      required: [exists, release_id, commit_sha, state, observed_at, failure_code, served, result_url]
      properties:
        exists: { type: boolean, enum: [true] }
        release_id: { type: string, pattern: "^rel_[0-9a-f]{32}$" }
        commit_sha: { type: string, pattern: "^[0-9a-f]{40}$", description: "The task's merged commit, which the attempt releases." }
        state: { type: string, enum: [awaiting_approval, queued, uploading, uncertain, awaiting_confirmation, served, replaced, unpublished, declined, failed], description: "The latest attempt's state, as the room holds it, except that the room's `live` (switched, its marker not yet back) is `awaiting_confirmation` (`podster_core::release_status::ReleaseStatusState`). Read `served` for whether the commit is live." }
        observed_at: { type: integer, description: "When the room recorded that state." }
        failure_code: { type: [string, "null"], description: "A reason code while `failed`, and null in every other state. Never a provider's message text." }
        served: { type: boolean, description: "Whether the commit is what the room's default host serves: an attempt for it was recorded `served` by its marker, the host is still set to it, the room is public now, nothing holds or suspends the app, and the content domain's stop was read and is clear. Never true for `awaiting_confirmation`." }
        result_url: { type: [string, "null"], description: "The default host's address, `https://<label>.<content domain>/`, only while `served` and a content domain is configured." }
    MergeTask:
      type: object
      additionalProperties: false
      required: [submission_no, commit_sha]
      properties:
        submission_no: { type: integer, description: "The approved submission." }
        commit_sha: { type: string, description: "The commit that submission named, which review pinned." }
    MergeRequested:
      type: object
      additionalProperties: false
      required: [task_id, merge_state, commit_sha, submission_no, requested_at, self_reviewed]
      properties:
        task_id: { type: string }
        merge_state: { type: string, enum: [requested] }
        commit_sha: { type: string }
        submission_no: { type: integer }
        requested_at: { type: integer }
        self_reviewed: { type: boolean, description: "A self-reviewed merge: the person who controls the submitting agent asked, in a private room, having approved the reviewed commit themselves. Nobody else reviewed it (decision 186 as amended 2026-11-20)." }
    TaskChange:
      type: [object, "null"]
      description: "A task's pull request and what Podster's own reads of GitHub showed (M5 step 7a, ADR 0009, proposed). Null for a task with none, and null for a caller who isn't shown it: it's shown to people in the room who see the task, other than guests, and to the task's own assignee and reviewer. Another agent, a guest and a public-claim participant aren't shown it, even where they may read the task, and it's on no public page. GitHub is the source of truth, and these are observations, each with its time. Only IDs, commit IDs, states and times: no title, description, branch name or author."
      additionalProperties: false
      required: [provider_repo_id, pr_number, submission_no, pr_state, pr_draft, pr_observed_at, commit_changed_at, watched, observed_head_sha, head_observed_at, head_in_repository, base_is_default, observed_base_sha, reviewed_commit_sha, reviewed_base_sha, commit_changed, merge_state, merge_reason, merge_sha, merge_observed_at, merge_requested_by, merge_requested_at, merge_finished_at, merge_self_reviewed, self_review_for_viewer]
      properties:
        provider_repo_id: { type: integer }
        pr_number: { type: integer }
        submission_no: { type: integer, description: "The submission the pull request was last read for." }
        pr_state: { type: [string, "null"], enum: [open, closed, merged, null] }
        pr_draft: { type: [boolean, "null"], description: "Whether its author marks it as a draft. A draft is refused at submission and at approval. One that goes back to draft after approval is shown here, and un-approves nothing." }
        pr_observed_at: { type: [integer, "null"] }
        observed_head_sha: { type: [string, "null"] }
        head_observed_at: { type: [integer, "null"] }
        head_in_repository: { type: [boolean, "null"], description: "False when the head branch is no longer in the room's repository." }
        base_is_default: { type: [boolean, "null"], description: "False when the pull request no longer targets the repository's default branch." }
        observed_base_sha: { type: [string, "null"] }
        reviewed_commit_sha: { type: [string, "null"], description: "Set by an approval, from a read made for that approval, and never moved afterwards." }
        reviewed_base_sha: { type: [string, "null"] }
        commit_changed: { type: boolean, description: "The head has been seen off the reviewed commit. It stays true even if the branch is later put back. The approval stands and nothing is re-pinned: the way on is a follow-up task." }
        commit_changed_at: { type: [integer, "null"], description: "When that was first seen. Never cleared." }
        watched: { type: boolean, description: "False once the pull request answered as not found five times in a row, when Podster stops reading it again." }
        merge_state: { type: string, enum: [not_requested, requested, succeeded, failed, outcome_unknown], description: "`outcome_unknown`: a merge call went out and GitHub couldn't be read to see what it did. Podster goes on reading until it knows, and then this is `succeeded` or `failed`. No new merge can be asked for meanwhile." }
        merge_reason: { type: [string, "null"], description: "Why a requested merge failed, as a code: `commit_changed`, `base_changed`, `head_repo_changed`, `pull_request_closed`, `pull_request_draft`, `merged_elsewhere`, `repo_not_ready`, `provider_refused`, `merge_attempts_exhausted`, `workspace_archived`, `room_suspended`, `default_branch_changed`, or the refusal that ended the requester's authority. Or `unrequested_merge` or `unreviewed_merge` for a merge Podster saw and didn't ask for, which is recorded and never counted as a success." }
        merge_sha: { type: [string, "null"] }
        merge_observed_at: { type: [integer, "null"], description: "When a merge Podster didn't ask for was first seen." }
        merge_requested_by: { type: [string, "null"], description: "Who last asked Podster for the merge, by ID." }
        merge_requested_at: { type: [integer, "null"] }
        merge_finished_at: { type: [integer, "null"], description: "When the last request ended, as `succeeded` or `failed` with `merge_reason`." }
        merge_self_reviewed: { type: boolean, description: "The last merge request was a self-reviewed one: asked for by the person who controls the submitting agent and approved its reviewed commit, which only a private room allows (decision 186 as amended 2026-11-20). Read from the room's record of who asked, submitted and approved." }
        self_review_for_viewer: { type: boolean, description: "Display only: a merge the viewer asked for now would be a self-reviewed one, since the viewer is a person who approved the reviewed commit and controls the agent that submitted it, in a private room. It never authorizes: `mergeTask` decides again from the room's rows." }
    RepoRequest:
      type: object
      description: "A room's request for a managed repository (M5, ADR 0009, proposed). One room has at most one. `pending` until the provisioning job finishes, then `ready`, or `failed` with a reason code. `uncertain` is a creation call whose answer was lost: it blocks coding tasks as a failed setup does, nothing is adopted by a matching name, and a retry uses a new name the server generates. Nothing is ever deleted, and nothing falls back to another organization."
      additionalProperties: false
      required: [id, state, name, visibility, reason, requested_by, requested_at, updated_at, attempts_left]
      properties:
        id: { type: string }
        state: { type: string, enum: [pending, ready, failed, uncertain] }
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$", description: "The name chosen at setup: lower-case letters, digits and hyphens, at most 64 characters. For display. It never identifies a repository." }
        visibility: { type: string, enum: [public, private], description: "Chosen at setup. It never follows the room's visibility." }
        reason: { type: [string, "null"], description: "A reason code while `failed` or `uncertain`. Never the provider's message text. Before any call: `managed_repositories_off`, `provisioning_not_configured`, `repository_requests_closed` (whoever asked isn't someone this deployment lets ask), `token_refused`, `not_delegated`, `delegation_unavailable`, `room_archived`, `requester_lost_authority` (whoever asked is no longer the room's owner or an admin; `requester_not_owner` in rows from before 2026-11-11). From the creation call: `name_taken`, `provider_refused`, `wrong_owner`, and `creation_outcome_unknown` for `uncertain`. From setup and the read-back: `read_back_failed`, `setup_call_failed`, `repository_gone`, `wrong_repository`, `visibility_differs`, `archived`, `no_initial_commit`, `actions_enabled`, `actions_unreadable`, `ruleset_missing`, `ruleset_inactive`, `ruleset_differs`, `bypass_differs`, `unexpected_ruleset`, `settings_differ` (issues, wiki, projects or discussions on, auto-merge on, or merged branches deleted), `workflow_permissions_differ` (workflows' default token can write or approve pull requests). `provider_rate_limited`: GitHub kept rate-limiting setup for 24 hours from its first limited attempt. Throughout, the request stayed `pending`, each limit waited the time GitHub gave (1 second to 1 hour) and spent no run. Then it ends `failed`, still without spending a run, so the owner or an admin can retry and it doesn't count against the five. A retry is accepted once the last reset time GitHub gave has passed, and answered `retry_too_soon` until then. A `403` that only says the limit is spent is read as a limit once; if the same call answers it again after that reset, it's a refusal (`provider_refused`, `token_refused`, `setup_call_failed` or `read_back_failed`). A repository this request just created that GitHub says isn't there by its ID is read again a minute later, up to ten times, never ending setup as `repository_gone`. Also `authority_lost` and `internal_error`." }
        requested_by: { type: string }
        requested_at: { type: integer, description: "Milliseconds, as every time here." }
        updated_at: { type: integer }
        attempts_left: { type: integer, minimum: 0, maximum: 5, description: "How many more times setup may run for this request: five less the runs so far, never below 0. It says nothing of when a retry may be taken. Display only; the command decides, and at the limit a retry gets `retry_limit_reached`." }
    RepoLink:
      type: object
      description: "The repository linked to a room (M5, ADR 0009, proposed). Its identity is `provider_repo_id`, recorded from the provider's answer to Podster's own creation call. Only `ready` will let a token be issued or a merge run, once those exist. `degraded` means a read-back found its rules or settings differ from what readiness needs, and `suspended` is an operator's takedown."
      additionalProperties: false
      required: [id, provider, provider_repo_id, full_name, visibility, default_branch, status, status_reason, created_at, verified_at, updated_at]
      properties:
        id: { type: string }
        provider: { type: string, enum: [github] }
