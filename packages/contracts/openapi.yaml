  /v1/workspaces/{ws}/release-config:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: getReleaseConfig
      tags: [queries]
      summary: "The room's release configuration (M6, ADR 0010): whether release is switched on for the room, its one approval policy, its one environment, the app's default host and its custom hostname if one is claimed. For a person who is the room's owner or one of its admins (decision 215). An agent gets `not_allowed`. A read: it grants nothing. **Not built (M6 step 2 adds the contract and the state only).** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404), or for a room's route whatever that room answers that caller for an unknown route (`workspace_not_found`, `access_revoked`, `invalid_argument`). Switched on, it answers `release_not_available` (409) until its step builds it"
      responses: { "200": { description: "The room's release configuration", content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseConfig" } } } }, default: { $ref: "#/components/responses/Error" } }
    put:
      operationId: setReleaseConfig
      tags: [commands]
      summary: "Switch release on or off for the room (M6, ADR 0010). Only the room's owner or one of its admins, as a person, and never an agent (decision 215); only in a public Engineering room with a ready managed repository, or `release_needs_public_room` for a private one once built; and only under a deployment delegation. Off is the default and publishes nothing. Switching it off unpublishes the room's app and raises the room's release epoch in the same transaction. `expected_version` is the configuration's version the caller read, and a stale one is refused. **Not built (M6 step 2 adds the contract and the state only).** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404), or for a room's route whatever that room answers that caller for an unknown route (`workspace_not_found`, `access_revoked`, `invalid_argument`). Switched on, it answers `release_not_available` (409) until its step builds it"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetReleaseConfig" } } } }
      responses: { "200": { description: "The room's release configuration, as changed", content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseConfig" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/releases/{release}/approve:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: release, in: path, required: true, schema: { type: string, pattern: "^rel_[0-9a-f]{32}$" } }]
    post:
      operationId: approveRelease
      tags: [commands]
      summary: "A person approves one release that is awaiting approval (M6, ADR 0010, decision 199). The approval policy has one value, `person`: every release needs this. Only the room's owner or one of its admins, as a person; an agent never approves, whatever its role is called (decision 215). The person who asked for a release may approve it themselves. Approval starts the release job, which reruns policy and rechecks the requester's and the approver's standing on every pass. Asking for a release is its own command, which arrives with the step that builds it. **Not built (M6 step 2 adds the contract and the state only).** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404), or for a room's route whatever that room answers that caller for an unknown route (`workspace_not_found`, `access_revoked`, `invalid_argument`). Switched on, it answers `release_not_available` (409) until its step builds it"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { description: "The release, approved", content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/releases/{release}/decline:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: release, in: path, required: true, schema: { type: string, pattern: "^rel_[0-9a-f]{32}$" } }]
    post:
      operationId: declineRelease
      tags: [commands]
      summary: "A person declines one release that is awaiting approval (M6, ADR 0010, decision 199). It ends `declined` and nothing is uploaded; the app goes on serving whatever it served. Only the room's owner or one of its admins, as a person; an agent never. A release that isn't awaiting approval is refused. **Not built (M6 step 2 adds the contract and the state only).** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404), or for a room's route whatever that room answers that caller for an unknown route (`workspace_not_found`, `access_revoked`, `invalid_argument`). Switched on, it answers `release_not_available` (409) until its step builds it"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { description: "The release, declined", content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/app-hostname:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: getAppHostname
      tags: [queries]
      summary: "The room's request to map a custom hostname to its app (M6, ADR 0010, decision 207), or null. While `pending` it carries the TXT record the room's owner publishes: its name, `_podster-challenge.<hostname>`, and its value, made for this request alone. For the room's owner or one of its admins, as a person. **Not built (M6 step 2 adds the contract and the state only).** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404), or for a room's route whatever that room answers that caller for an unknown route (`workspace_not_found`, `access_revoked`, `invalid_argument`). Switched on, it answers `release_not_available` (409) until its step builds it"
      responses: { "200": { description: "The room's hostname request, or null", content: { application/json: { schema: { $ref: "#/components/schemas/AppHostname" } } } }, default: { $ref: "#/components/responses/Error" } }
    put:
      operationId: requestAppHostname
      tags: [commands]
      summary: "Ask to map a custom hostname to the room's app (M6, ADR 0010, decisions 201 and 207). The name is normalized first; `podster.dev`, the content domain, a subdomain of either, an IP address, a single-label name, a wildcard name, a public suffix and a name an operator suspended are refused. The room gets a challenge and nothing else: a pending request reserves nothing, and is gone after 72 hours. The claim is given only once the room's own challenge is read from DNS, and one hostname has one room. One custom hostname a room. Only the room's owner or one of its admins, as a person. **Not built (M6 step 2 adds the contract and the state only).** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404), or for a room's route whatever that room answers that caller for an unknown route (`workspace_not_found`, `access_revoked`, `invalid_argument`). Switched on, it answers `release_not_available` (409) until its step builds it"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetAppHostname" } } } }
      responses: { "200": { description: "The room's hostname request", content: { application/json: { schema: { $ref: "#/components/schemas/AppHostname" } } } }, default: { $ref: "#/components/responses/Error" } }
    delete:
      operationId: removeAppHostname
      tags: [commands]
      summary: "Remove the room's custom hostname or drop its pending request (M6, ADR 0010). The room stops serving on the name first; the custom hostname is then deleted at Cloudflare and read until gone before the claim is freed. A claim never transfers: any later claim, by anyone, needs a new challenge. Only the room's owner or one of its admins, as a person. **Not built (M6 step 2 adds the contract and the state only).** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404), or for a room's route whatever that room answers that caller for an unknown route (`workspace_not_found`, `access_revoked`, `invalid_argument`). Switched on, it answers `release_not_available` (409) until its step builds it"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      responses: { "200": { description: "The room's hostname request, ending or null", content: { application/json: { schema: { $ref: "#/components/schemas/AppHostname" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/app-reports:
    post:
      operationId: createAppReport
      tags: [commands]
      summary: "Report a deployed app by its address (M6, ADR 0010, decision 205; built at M6 step 9). `address` is the app's host as the reporter saw it, a default host or a custom hostname, or an `http` or `https` URL on it; nothing but its host is kept, normalized as a custom hostname is. A URL with a user name or password, or anything that isn't a hostname, gets `invalid_argument` (400). Nothing asks whether anything is served at the host, so the answer is the same whether it exists, is served or is suspended. `reason` and `note` are as `createReport`'s. Signed-in people only: an agent gets `not_allowed`. It counts against the same 10 a day per person as `createReport`, then `limit_exceeded` (409). Needs an idempotency key, and a retry with it answers with the same report; the same key with a different request, a room's report included, gets `idempotency_mismatch` (422). Answers `{ id, created_at }`. Reports go to Podster's operators, in `listReports`, who can suspend the app by its label or its host and read nothing private. While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404)"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [address, reason], properties: { address: { type: string, maxLength: 2048 }, reason: { type: string, enum: [spam, abuse, illegal, impersonation, privacy, other] }, note: { type: [string, "null"], maxLength: 1024 } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/moderation/apps/{label}/suspend:
    parameters: [{ $ref: "#/components/parameters/appLabel" }]
    post: { operationId: suspendApp, tags: [commands], summary: "An operator stops a room's app from serving, `{ reason }` (M6, ADR 0010, decision 205). Keyed by the app's host label, never by a room's public handle. The room records it, sets what each of its hosts should serve to nothing and raises its release epoch in one transaction, and its owner can't release while it holds. An operator reads nothing private. Operators only, or `not_allowed`. Answers `{ label, suspended, reason, at }`. Asking again changes nothing. The room's applier then removes its serve entries, and a job deletes its scripts, each counted gone only on the provider's own answer; while no provider is configured, which is every deployment, both wait, recorded as owed. A label no room has is `not_found`, as is one the lookup names for a room that says it isn't its own, or for no room at all. **Built in M6 step 4(a), behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/apps/{label}/lift:
    parameters: [{ $ref: "#/components/parameters/appLabel" }]
    post: { operationId: liftAppSuspension, tags: [commands], summary: "An operator lifts an app's suspension, `{ reason }` (M6, ADR 0010). Lifting restores nothing: the host goes on answering not-found until the room releases again, by a new request and a new approval. Operators only. Answers `{ label, suspended, reason, at }`, the last two null. Asking again changes nothing. A label no room has is `not_found`. **Built in M6 step 4(a), behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/app-hosts/{host}/suspend:
    parameters: [{ $ref: "#/components/parameters/appHost" }]
    post: { operationId: suspendAppHost, tags: [commands], summary: "An operator suspends one host of an app, `{ reason }` (M6, ADR 0010, decision 205): a default host, which suspends that app, or a custom hostname. A custom hostname's suspension lives with the hostname and outlives any room's claim to it: while it holds, no room can claim the name or start a challenge for it, and if a room holds it now, serving on it ends and the claim ends. The room's app keeps its default host unless the app is suspended too. Operators only. Answers `{ host, suspended, reason, at }`. Asking again changes nothing. The host is read as Podster writes names, so two spellings are one host. A name on the content domain that isn't an app's host, or on Podster's own domain, is `not_found`; one that isn't a hostname is `invalid_argument`. **Built in M6 step 4(a), behind the switch.** An app's default host is the same act as suspending the app by its label. A custom hostname's suspension is recorded with the hostname, whether or not any room has asked for it; a room that holds it is told until it answers, and clears and closes that host. While no content domain is configured, which is every deployment, no host can be told from another, and it answers `release_not_available` (409). While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/app-hosts/{host}/lift:
    parameters: [{ $ref: "#/components/parameters/appHost" }]
    post: { operationId: liftAppHostSuspension, tags: [commands], summary: "An operator lifts a host's suspension, `{ reason }` (M6, ADR 0010). Nothing is restored: a custom hostname needs a new challenge and a new claim, and an app a new release. Operators only. Answers `{ host, suspended, reason, at }`, the last two null. Asking again changes nothing. **Built in M6 step 4(a), behind the switch,** for an app's default host, as lifting the app's suspension by its label, and for a custom hostname. A host that was closed in a room stays closed, and a claim that was ending goes on ending. While no content domain is configured, which is every deployment, it answers `release_not_available` (409). While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/content-domain/stop:
    post: { operationId: stopContentDomain, tags: [commands], summary: "An operator stops the whole content domain, `{ reason }` (M6, ADR 0010, decision 205): every app's host answers not-found until it is resumed. For a compromise of the namespace or of a publishing credential, or a block of the whole domain. No room's state changes. Operators only. Answers `{ stopped, reason, at, key_confirmed }`. Asking again changes nothing. From then no room writes a host's serve entry, and removals go on. One key at the provider is what refuses every host; it is written from the record of the stop, and while no provider is configured, which is every deployment, it waits, recorded as owed. `key_confirmed` says whether that key is known to be there now: it is false straight after the stop is set, and for as long as no provider is configured or the provider's answer can't be confirmed, and an operator who asks again reads it again. The stop itself holds either way. **Built in M6 step 4(a), behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/content-domain/resume:
    post: { operationId: resumeContentDomain, tags: [commands], summary: "An operator lifts the stop for the whole content domain, `{ reason }` (M6, ADR 0010). Each app serves again only what its room's own state says it should. Operators only. Answers `{ stopped, reason, at, key_confirmed }`, `reason` and `at` null. `key_confirmed` says whether the provider's key is known to be gone now; until it is, every host stays refused there. Asking again changes nothing and reads it again. **Built in M6 step 4(a), behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorReason" } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/moderation/takedown-findings:
    get: { operationId: listTakedownFindings, tags: [queries], summary: "What taking apps down has found that needs an operator (M6, ADR 0010): as `{ findings }`, at most 200, the most recently seen first, each `{ code, subject, detail, first_seen_at, last_seen_at, seen }`. `subject` is the host, the script's name or the key it is about, as the provider or a room gave it, and is data only. No room's internal ID is shown. The codes: `entry_without_room` and `script_without_room`, a serve entry or a script whose room can't be found, which is never removed on the lookup table's word; `entry_foreign_name` and `script_foreign_name`, a name Podster didn't make, which is left alone; `entry_unreadable`, an entry whose value isn't a script's name Podster made, which its room then writes again or takes out; `entry_reads_failing`, the provider gave no readable answer for some entries in a pass, told once for the pass with how many in `detail`, never once for each host; `script_delete_queued`, a script a pass had its room queue for deletion, with `queued` or `gone` in `detail`, which the room goes on telling for 7 days so the record never rests on one answer; `entry_keeps_failing` and `script_keeps_failing`, a key or a script a pass couldn't deal with three passes in a row, with the last code in `detail`; `host_refused`, a host a room's applier won't serve, with why in `detail`; `script_delete_failing`, a script whose delete has failed at least twelve times; `hostname_notice_unanswered`, a suspended hostname whose room hasn't answered in over half an hour; `stop_key_differs` and `stop_key_without_stop`, the stop's key at the provider not as the stop says; `script_list_incomplete`, the provider's list of scripts said it held less than there is; `failures_full`, more keys are failing than are counted; and `findings_full`, 1,000 are kept and a new one isn't until a row has gone 7 days unseen, with `seen` counting each one dropped. Deletions a pass started, refused hosts and each of the two stop-key findings have 1,000 rows of their own for each kind, so nothing else can keep one out; a `findings_full` row's `subject` is the kind that is full, or `other` for the rest. One not seen again for 7 days is forgotten. A read: nothing is recorded. Operators only; anyone else gets `not_allowed`. They are gathered by two scheduled passes, which no environment schedules, and with no provider configured, which is every deployment, the list stays empty. **Built in M6 step 4(a), behind the switch.** While release is switched off, which is every deployment, this can't be told from a path nobody defined: it is answered where an unknown path is, so `not_found` (404).", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/workspaces/{ws}/repository:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: getRepository
      tags: [queries]
      summary: "The room's managed repository (M5, ADR 0009, proposed): `request`, the room's one request for a repository, and `repository`, the repository linked to the room, each null if there's none. A room that doesn't use Git has neither. Read from the room's own state, for a person who sees the whole room. An agent, and anyone who doesn't see the whole room, gets `not_allowed`. It's a read and grants nothing. For a person who is the room's owner or a room admin by current standing, and nobody else, it adds `delegated`: whether the room's organization holds the provisioning delegation now, which every organization does unless a Podster operator took it back, read from the organization's own record at each read by the same check the request command makes. When that record can't be read the field is absent, since unknown isn't false. Display only; the command decides. For everyone it answers, it carries `may_request`: whether the caller could ask for the repository or retry its setup as far as who they are goes, which is a person who is the room's owner or a room admin and whom this deployment lets ask (see the request command). Display only as well. While managed repositories are switched off (`MANAGED_REPOSITORIES` isn't exactly `true`) this route answers exactly as a route that doesn't exist does for that caller, `not_found` (404) to anyone in the room and the room's own refusal to anyone outside it, whether or not the room kept rows from an earlier on-period, so a screen learns the switch's state from the server."
      responses: { "200": { description: The request and the linked repository, content: { application/json: { schema: { $ref: "#/components/schemas/RoomRepository" } } } }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: requestRepository
      tags: [commands]
      summary: "Ask for the room's managed repository (M5 step 4, ADR 0009, proposed): `{ name, visibility }`, by a person who is the room's owner or a room admin, whose authority holds (the owner's decision of 2026-11-11, 'Owner and admins'). Never an agent, whatever role is stored for it, and nobody with another role: `not_allowed` (403). Managed repositories have a switch of their own, the Worker variable `MANAGED_REPOSITORIES`, off unless it is exactly `true` and on for staging only: while it's off this route answers `not_found` (404) to the owner as to anyone, and the job runs nothing. A deployment may name who it lets ask, in the Worker variable `REPOSITORY_REQUESTERS` (added 2026-11-11 after M5's security review): unset, the rules here apply to everyone; set, only those it names may ask or retry: listed person IDs, `test-people` for people made by the deployment's test sign-up, and `operators` for the people the deployment's own configuration names as Podster operators, who are never implied without that entry and never include an agent. A value that's empty, malformed, holds an unknown word or isn't a string lets nobody: only a variable that is absent is unset. An owner or admin it doesn't let gets `repository_requests_closed` (403), which says nothing of who is listed, before anything else about the request is looked at: nothing is recorded, no place in a count is taken and nothing reaches the provider. Anyone else gets the refusal they'd get without it. It bears on asking and retrying alone, never on a grant, a token, a merge or a read. A name that would read as Podster's own gets `name_reserved` (409). Every organization holds the provisioning delegation unless a Podster operator took it back (the owner's decision of 2026-11-11, 'No gate, with limits'); then it's refused with `not_delegated` (403) and nothing reaches the provider. At most 5 requests are accepted in any 24 hours for one organization, and the same for one person asking, across every room and organization (both proposed): the next gets `repository_request_limit` (429), and nothing is recorded. The cap is on rooms: each room holds at most one place in the organization's count and one in each asker's, stamped when it was last asked for, and a place is never given back. So a replay, a second request for a room that has one, and a retry of its setup cost nothing; a request the room refuses for itself is never counted; and one that fails after it was counted leaves its room counted for up to 24 hours, which can only make the count too high. A request is recorded only if that same call was told the room holds a place in both counts, for the caller as the room resolves them when it records: otherwise, as when someone is made an admin while their call is under way, or a count can't be read, it answers `delegation_unavailable` (503), records nothing, and may be sent again. `private` gets `private_unavailable` (409): on the organization's plan a private repository can't carry the rules, so it's never quietly made public. A room has one request: a second gets `repo_request_exists` (409). The organization, the App and its installation come from the server's configuration, and any other field is refused. Records the request as `pending` and answers as the read does. Switched off, it answers as a missing route does, to the owner as to anyone. A job then creates the repository, switches Actions off, adds the two rulesets, reads everything back, and only then links the repository by the ID in the provider's own answer and marks the request `ready`. Otherwise the request ends `failed` or `uncertain` with a reason code, which blocks coding tasks in the room and nothing else. Audited, and tells the room's managers."
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name, visibility], properties: { name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$", description: "Lower-case letters, digits and hyphens, starting with a letter or a digit, at most 64 bytes." }, visibility: { type: string, enum: [public, private], description: "Independent of the room's visibility. `private` is unavailable for now." } } } } } }
      responses: { "200": { description: The request and the linked repository, content: { application/json: { schema: { $ref: "#/components/schemas/RoomRepository" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/repository/retry:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    post:
      operationId: retryRepositorySetup
      tags: [commands]
      summary: "Retry a setup that ended `failed` or `uncertain` (M5 step 4), `{}`, by a person who is the room's owner or a room admin, with the same switch and delegation checks as the request, and the same check of who this deployment lets ask: an owner or admin it doesn't let gets `repository_requests_closed` (403) and the request stays as it was. The job checks that again for whoever first asked, before it calls the provider, and ends the request `failed` with that reason if they aren't let. It's the room's same request, so it isn't counted against the daily cap again. Setup runs at most five times for a room: after that `retry_limit_reached` (409), until an operator resets it, which isn't built. Between runs a retry waits a minute, doubling up to an hour, and after `provider_rate_limited` until the last reset time GitHub gave; before that it gets `retry_too_soon` (429). With a repository ID held from the provider's own answer, setup resumes on that repository and no second one is made. Without one, the next creation call goes out under a name the server makes from the chosen name and six hex digits, never a name an earlier call sent, so nothing is ever adopted by its name, and whatever an earlier call may have made stays where it is. Setup only adds what's missing: a rule that's present and wrong is never repaired, and fails again. `repo_request_not_found` (404), `setup_in_progress` (409), `already_ready` (409). Answers as the read does. Switched off, it answers as a missing route does"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { "200": { description: The request and the linked repository, content: { application/json: { schema: { $ref: "#/components/schemas/RoomRepository" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/orgs/{org}/provisioning-delegation:
    parameters: [{ name: org, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getProvisioningDelegation
      tags: [queries]
      summary: "Whether an organization holds the provisioning delegation for managed repositories (M5 step 4, AC-10), for a Podster operator or an admin of that organization. Held in the organization's own object in the API. Every organization holds it unless a Podster operator took it back (the owner's decision of 2026-11-11, 'No gate, with limits'): an organization nobody has set it for answers `granted: true` with `set_by` and `set_at` null. Once it's taken back, nobody in the organization can ask for a room's repository or retry its setup. Managed repositories' switch doesn't apply to a Podster operator: an operator's read and write answer the same whether it's on or off, so an operator can take the delegation back, or restore it, before the feature is switched on (ruled by the architect on 2026-11-11; for the owner to review). For anyone else, the organization's admins included, the switch does apply: while `MANAGED_REPOSITORIES` isn't exactly `true` this route answers exactly as a route that doesn't exist, `not_found` (404), before anything else is decided, so an ordinary person doesn't learn from it that the feature exists (narrowed on 2026-11-11 after M5's security review, A5)."
      responses: { "200": { description: The delegation, content: { application/json: { schema: { $ref: "#/components/schemas/ProvisioningDelegation" } } } }, default: { $ref: "#/components/responses/Error" } }
    put:
      operationId: setProvisioningDelegation
      tags: [commands]
      summary: "Take the provisioning delegation back from an organization, or restore it, `{ granted }`, by a Podster operator only. Every organization holds it until then, so this matters only to take it back and to undo that. For a managed repository Podster's platform is the resource owner, so an organization's own admins can't restore it for themselves. An organization the API has never seen a room of gets `organization_not_found` (404). Every change is kept with who made it, in the organization's object and in the operators' record. Taking it back stops new requests and any job that hasn't called the provider yet. It doesn't touch a repository already linked: its grants, tokens and merges go on as before. Setting the same value again changes nothing but the time. Managed repositories' switch doesn't apply to a Podster operator: an operator's read and write answer the same whether it's on or off, so an operator can take the delegation back, or restore it, before the feature is switched on (ruled by the architect on 2026-11-11; for the owner to review). For anyone else, the organization's admins included, the switch does apply: while `MANAGED_REPOSITORIES` isn't exactly `true` this route answers exactly as a route that doesn't exist, `not_found` (404), before anything else is decided, so an ordinary person doesn't learn from it that the feature exists (narrowed on 2026-11-11 after M5's security review, A5)."
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [granted], properties: { granted: { type: boolean } } } } } }
      responses: { "200": { description: The delegation, content: { application/json: { schema: { $ref: "#/components/schemas/ProvisioningDelegation" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/repository/grants:
    parameters: [{ $ref: "#/components/parameters/ws" }]
    get:
      operationId: listRepositoryGrants
      tags: [queries]
      summary: "The grants on the room's repository that aren't revoked (M5 step 5b, ADR 0009, proposed), for a person: a human owner or admin sees every one, anyone else in the room their own. `state` is `live`, `expired`, or `stale` when its giver is no longer a person who is the room's owner or a room admin. It's display only and authorizes nothing: it can say `live` before the room learns its giver left, and a grant is checked again, from current authority, at every use. An agent gets `not_allowed`. While managed repositories are switched off (`MANAGED_REPOSITORIES` isn't exactly `true`) this route answers exactly as a route that doesn't exist does for that caller, `not_found` (404) to anyone in the room and the room's own refusal to anyone outside it, whether or not the room kept rows from an earlier on-period, so a screen learns the switch's state from the server."
      responses: { "200": { description: The grants, content: { application/json: { schema: { $ref: "#/components/schemas/RepoGrantList" } } } }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: grantRepositoryAction
      tags: [commands]
      summary: "Give a participant one action, `push` or `merge`, on the room's repository (M5 step 5b, ADR 0009, proposed). Only a person who is the room's owner or a room admin, whose authority holds (the owner's decision of 2026-11-11, 'Owner and admins'); anyone else in the room gets `not_allowed`. A grant counts only while it's live and its giver is still the room's owner or a room admin: one given by an admin who is demoted or removed ends in that same change, and making them an admin again restores nothing. Nobody merges work submitted by an agent the same person controls, whoever gave the grant: `self_merge` at the merge. The participant must be in the room, `grantee_not_participant`, and not there through a public claim, `grantee_public`. A room with no linked repository answers `repo_not_linked`; a degraded or suspended one still takes a grant, which nothing uses until it's ready. `expires_at` is optional; when given, it must be after now and at most one year ahead, or the request is `invalid_argument`. Granting the same again changes nothing; a new expiry, or a grant over an expired row or another giver's, revokes that row and adds one. Audited, and tells the participant. A grant authorizes nothing by itself: it's checked again at every use. An agent gets `not_allowed`. Switched off, it answers as a missing route does"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version, principal_id, action], additionalProperties: false, properties: { policy_version: { type: integer }, principal_id: { type: string }, action: { type: string, enum: [push, merge] }, expires_at: { type: [integer, "null"] } } } } } }
      responses: { "200": { description: The grant, content: { application/json: { schema: { $ref: "#/components/schemas/RepoGrant" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/repository/grants/{grant}:
    parameters: [{ $ref: "#/components/parameters/ws" }, { name: grant, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: revokeRepositoryGrant
      tags: [commands]
      summary: "Take back a grant on the room's repository (M5 step 5b, ADR 0009, proposed): the room's owner or a room admin, as a person; a person who administers the room's organization, with or without a place in the room (AC-11); or the grant's holder for their own. Nobody else, `not_allowed`, and someone with no place in the room who doesn't administer its organization gets `workspace_not_found`, as for any route here. A grant the caller may not see answers `grant_not_found`, as a missing one does. Taking back a revoked grant changes nothing. Works in an archived room. Audited, and tells the holder. An agent gets `not_allowed`. Switched off, it answers as a missing route does: a grant left from an earlier on-period stays, and nothing uses it while the switch is off"
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_version], additionalProperties: false, properties: { policy_version: { type: integer } } } } } }
      responses: { "200": { description: The grant, content: { application/json: { schema: { $ref: "#/components/schemas/RepoGrant" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/repo-access:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: getRepoAccess
      tags: [commands]
      summary: "A short-lived token for the room's one repository, for the agent a task is assigned to (M5 step 6, ADR 0009, proposed). Exists only while managed repositories are switched on: otherwise it answers exactly as a task verb that doesn't exist does, `invalid_argument` (400) for a body that isn't JSON, `idempotency_key_required` (400) without an idempotency key, and `not_found` (404) with one. The body is empty or `{}`, and any field is `invalid_argument`: the repository is the room's link, and the organization, installation and permissions are configuration. Checked at every call, renewals included: the task must be visible, `task_not_found` (404); assigned to the caller, an agent, `not_allowed` (403); linked to the repository, `task_not_linked` (409); in a room whose repository is ready, `repo_not_ready` (409); and accepted, `task_not_active` (409). The caller must hold a live `push` grant from whoever holds the repository's delegation now, `grant_required`, `grant_expired` or `grant_stale` (403); not be in the room through a public claim, `public_participant` (403); and act for a person still in the organization they linked it from, `controller_departed` (403). If a standing can't be read, `standing_unknown` (503), and nothing is minted. Answers `{ token, expires_at, repository, clone_url, permissions, authority_ends_at }`: the token reaches only that repository with contents and pull requests `write` and metadata `read`, and lives at most an hour. `authority_ends_at` is null: a task has no server-side deadline yet. No idempotency key, and none is kept: one live token per agent and task, so asking again returns the same token until 5 minutes before `expires_at`, then a new one, and the old one is revoked. A call while another is minting gets `repo_access_busy` (409). Limits, proposed: 10 mints an hour per agent and 60 per room, `rate_limited` (429). `repo_access_unavailable` (503) when the App or the sealing key isn't configured, `provider_unavailable` (502) when GitHub didn't answer, and `provider_mismatch` (502) when what it minted isn't exactly what was asked for, which is revoked. The token is revoked early when the grant, the agent's place, the task or the link ends. It's never in an event, a log, D1, the outbox or an error"
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, maxProperties: 0 } } } }
      responses: { "200": { description: The token, content: { application/json: { schema: { $ref: "#/components/schemas/RepoAccess" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/merge:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    post:
      operationId: mergeTask
      tags: [commands]
      summary: "Asks for a task's reviewed commit to be merged into the room's repository's default branch (M5 step 7b, ADR 0009, proposed). Exists only while managed repositories are switched on: otherwise `not_found` (404). For a person or an agent. It only records the request, as `merge_state: requested`: a job then carries it out, and its outcome is `merge.succeeded` or `merge.failed` in the room's activity and `merge_state` on the task's `change`. Approval alone never merges (AC-17). The caller names the task, the approved submission and its commit, and nothing about the repository or the pull request, which are the room's own records: any other field is `invalid_argument` (400). Checked when asked and again by every pass of the job, before its mark and before its merge call, by the same decision, in this order: the task is visible, `task_not_found` (404); the caller isn't the submitter, the task's assignee, or controlled by the same person as the submitter, `self_merge` (403), which also refuses anyone whose controlling person isn't known; isn't in the room through a public claim, `public_participant` (403); holds a live `merge` grant from whoever holds the repository's delegation now, `grant_required`, `grant_expired` or `grant_stale` (403); and the review that approved the commit came from someone the submitter's person doesn't control, by the approver and controlling person the room recorded at approval, `self_review` (403, decision 195), checked only for a caller who passed the rest, so nobody else learns anything about the review. `self_review` has three messages, each a fixed sentence: \"This commit needs an approving review from someone other than the person who controls its submitter, or another agent that person controls, before it can be merged.\" when the reviewer is that person or one of their agents; \"This commit's approving review came from an agent whose controlling person isn't known, so it needs an approving review from someone else before it can be merged.\" when the reviewer is an agent whose credential named no linking person; and \"This commit was approved before Podster recorded who reviews a commit, so it needs to be reviewed again before it can be merged.\" for an approval recorded before the room kept its reviewer, which may well have been independent. The task's own review is unchanged. Then the body: the two fields and no other, `invalid_argument` (400). Then the task's, the change's and the requester's own, as below, which include `controller_departed` (403): the caller acts, as an agent, for a person still in the organization they linked it from, and as a person is still in their own. Then: the task has a linked repository, `task_not_linked` (409), that is ready, `repo_not_ready` (409); it is approved, `not_approved` (409), as the submission named, `submission_mismatch` (409), at the commit named, `commit_changed` (409); the approval recorded a reviewed commit from the server's own read of GitHub, `review_required` (409) for one made while managed repositories were off, which needs a fresh review; the head has never been seen off that commit since, `commit_changed` (409), even if the branch was put back; the pull request is still being read, `change_unwatched` (409); and no merge is under way, `merge_already_requested` (409), or done, `already_merged` (409). A merge that failed may be asked for again, except after `commit_changed`, when the way on is a follow-up task. Also `standing_unknown` (503) when the owner's standing can't be read, `rate_limited` (429) past 20 requests an hour for the room and `merge_request_limit` (429) past 10 requests for one task in its whole life, both proposed and both counting every request, a repeated one included, and `merge_unavailable` (503) when the merge App isn't configured, in which case nothing is recorded. The job gives up after 5 passes (proposed) with `merge_attempts_exhausted`, and a person asks again."
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MergeTask" } } } }
      responses: { "200": { description: The request as recorded, content: { application/json: { schema: { $ref: "#/components/schemas/MergeRequested" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/workspaces/{ws}/tasks/{t}/release-status:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    get:
      operationId: getTaskReleaseStatus
      tags: [queries]
      summary: "A task's checks and its merge, each as Podster last observed it on GitHub and with the time of that observation, and that no release exists (M5 step 8, ADR 0009, proposed). Exists only while managed repositories are switched on: otherwise `not_found` (404), as for any route that doesn't exist. Nothing is fetched on this read: checks are what the room's refresh job last read for the pull request's head, and a merge is what the merge job and the refresh job recorded. The two are reported apart, and neither is inferred from the other. `checks.state` is null until Podster has read the head commit's checks, which it does only where the App that reads has been given statuses and checks, and null says nothing about whether any pass. Only states and counts are kept: no check's name, context or text. It shows exactly what the caller's view of the task's `change` shows and no more. A person or an agent shown the change (people in the room other than guests, and the task's assignee and reviewer) gets all of it. Whoever asked for the merge and isn't shown the change gets the merge alone, with `pull_request` and `checks` null. Anyone else who can read the task gets `not_allowed` (403), the same whether or not the task has a pull request on record, and anyone who can't read it gets `task_not_found` (404). A task with no pull request on record answers with nulls and `merge.state: not_requested`"
      responses: { "200": { description: The task's release status, content: { application/json: { schema: { $ref: "#/components/schemas/TaskReleaseStatus" } } } }, default: { $ref: "#/components/responses/Error" } }
  /v1/provider/github/deliveries:
    post:
      operationId: receiveGithubDelivery
      tags: [commands]
      security: [{ providerDelivery: [] }]
      summary: "One GitHub webhook delivery, as a nudge (M5 step 5, ADR 0009, proposed). Not a call a person or an agent makes: the gateway sends it from its public `POST /webhooks/github`, after verifying GitHub's `X-Hub-Signature-256` over the raw body with its webhook secret, and it's the only route that takes the gateway's delivery assertion. The body is IDs and one commit SHA, never a title, body, branch name, URL or state. The API finds the room through `repo_room_index`, which authorizes nothing, and the room keeps the delivery only if the repository is the one it's linked to. A delivery that names a pull request or a commit of a task's change marks that change as due a read of GitHub, and records nothing else: no head, check, merge or pull request state is taken from it, no event is written and nobody is told. Such a delivery is taken once, by its ID and by the hash of its body, and remembered 7 days, up to 10,000 a room; past that it still marks the change and isn't remembered. One about anything else leaves nothing behind. Every delivery that passes the assertion gets the same `202`, whether a room took it or not. No idempotency key: the delivery ID is one."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderDelivery" } } } }
      responses:
        "202": { description: "Taken, or dropped. The answer doesn't say which.", content: { application/json: { schema: { type: object, additionalProperties: false, required: [accepted], properties: { accepted: { type: boolean, const: true } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/tasks/{t}/messages:
    parameters: [{ $ref: "#/components/parameters/ws" }, { $ref: "#/components/parameters/t" }]
    get:
      operationId: listMessages
      tags: [queries]
      summary: "Messages on a task thread, oldest first, 50 at a time, each with `id`, `from`, `external`, `body`, `created_at` and `origin`: `a2a_remote` when the agent's A2A endpoint reported it, otherwise null. Either way it's the agent's content, never instructions"
      parameters: [{ name: after, in: query, description: "Opaque: the id of the last message the page before returned. Absent or empty is the start. One that isn't a message on this task answers 400 invalid_argument.", schema: { type: string } }]
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: sendMessage
      tags: [commands]
      summary: Post to a task thread
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      description: "A retried request with the same idempotency key, and the room's archived and access checks, come first, and none of them depends on the task. After them, a task the caller can't see answers `task_not_found` (404) before anything about the task or the message is checked. With `via: a2a`, which only the gateway's A2A path sends, a completed or canceled task answers `task_closed` (409), because A2A's terminal states take no more messages (ADR 0007). Any other `via` is `invalid_argument`. MCP messages send no `via` and aren't affected."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, description: "At most 16 KiB of UTF-8." }, via: { type: string, enum: [a2a], description: "Set by the gateway for a message that came over A2A. It only ever refuses more." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/inbox:
    get:
      operationId: readInbox
      tags: [queries]
      summary: Read this principal's inbox. Events carry IDs only
      parameters:
        - { name: after, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: ack, in: query, description: "Documented exception: also advances the cursor.", schema: { type: boolean } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/inbox/ack:
    post:
      operationId: ackInbox
      tags: [commands]
      summary: Advance the inbox cursor
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [up_to], properties: { up_to: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
  /v1/inbox/wake:
    put:
      operationId: setWake
      tags: [commands]
      summary: Set the wake URL. The response has the secret, shown only here. Each wake is a JSON POST of agent_id, unread and at, with X-Podster-Signature t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<body>">, expected to answer 2xx within 10 seconds without redirecting
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri }, debounce: { type: integer } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    delete: { operationId: deleteWake, tags: [commands], summary: Remove the wake URL, responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
  /v1/inbox/a2a-endpoint:
    get: { operationId: getA2aEndpoint, tags: [queries], summary: "The agent's A2A endpoint, or null: `url`, `version`, `enabled`, `consecutive_failures`, `has_token`, `token_state` (`none`, `stored`, or `unreadable` when a stored token can't be opened, as after a key change, so sends would go without it until it's set again) and `set_at`. Never the signing secret or the token", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
    put:
      operationId: setA2aEndpoint
      tags: [commands]
      summary: "Set the agent's A2A endpoint (decision 119), one per agent, beside wake. It grants nothing in any room. Whoever sets it is recorded: the person who linked the agent's credential, or the admin. Once that person leaves the agent's organization, nothing more is sent and the endpoint is deleted. A set with neither answers 403 `not_allowed`. A new URL, or one set after a delete, makes a new registration `version` and returns a new `signing_secret` once: each request to the endpoint carries `X-Podster-Signature` as wake's does, over the exact JSON-RPC body. The same URL keeps its version and secret unless `rotate_secret` is true, and setting it again turns a switched-off endpoint back on. Three failed requests in a row switch it off. Needs an active connection, or `agent_disconnected`. A disconnect deletes it"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], additionalProperties: false, properties: { url: { type: string, format: uri, description: "An `https` URL on a public DNS name, with no IP address, credentials or port, and not `podster.dev`, as for wake. Otherwise 400 `invalid_endpoint_url`." }, token: { type: [string, "null"], maxLength: 4096, description: "An optional bearer token Podster sends to the endpoint, printable ASCII with no spaces. It's encrypted, never returned, and cleared when the URL changes. Left out, it's kept for the same URL; null clears it. 503 `token_storage_unavailable` if Podster can't store tokens yet." }, rotate_secret: { type: boolean, description: "True makes a new signing secret for the same URL, returned once, without moving the version. A new URL always gets one." } } } } } }
      responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } }
    delete: { operationId: deleteA2aEndpoint, tags: [commands], summary: "Delete the agent's A2A endpoint, with its signing secret and token. Deleting nothing is fine", responses: { "200": { $ref: "#/components/responses/Json" }, default: { $ref: "#/components/responses/Error" } } }
components:
  securitySchemes:
    assertion: { type: apiKey, in: header, name: X-Podster-Assertion, description: "Ed25519-signed gateway assertion, valid for 60 seconds. For people, `org_since` says when they joined each organization, and a room role older than that has ended. When a person adds another person or changes their role, `target_member` holds that person's organizations and join times from the gateway's directory. Neither grants anything by itself. `departure` says someone left an organization, and only the gateway's own removal sends it. Agents carry their connection generation, and `linker`: who linked the credential the request came with, and when, which an A2A endpoint set records. People carry orgs and admin_orgs." }
    providerDelivery: { type: apiKey, in: header, name: X-Podster-Assertion, description: "The gateway's assertion for one provider webhook delivery whose signature it verified, valid for 60 seconds: `kind: provider_delivery`, `provider`, `delivery` (the provider's delivery ID) and `body_sha256` (lowercase hex SHA-256 of the exact body sent), with `jti`, `iat`, `exp`, `aud` and `iss` and nothing else. It names no person, agent or organization, so it authorizes nothing. Only `receiveGithubDelivery` takes it, and that route takes nothing else." }
  parameters:
    appLabel: { name: label, in: path, required: true, description: "An app's host label (M6, ADR 0010): at most 26 lower-case letters and digits, generated by the server and never used again.", schema: { type: string, pattern: "^[a-z0-9]{1,26}$" } }
    appHost: { name: host, in: path, required: true, description: "One host of an app (M6, ADR 0010): a default host on the content domain, or a custom hostname.", schema: { type: string, maxLength: 253 } }
    ws: { name: ws, in: path, required: true, schema: { type: string } }
    t: { name: t, in: path, required: true, schema: { type: string } }
    idempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
  responses:
    Json: { description: Success, content: { application/json: { schema: { type: object } } } }
    TaskDetail:
      description: A task and what the caller may read about it
      content:
        application/json:
          schema:
            type: object
            required: [task, submissions, artifacts, messages, history, visible]
            properties:
              task: { $ref: "#/components/schemas/Task" }
              expected_output: { type: [object, "null"], description: "The expected output this task works toward, as `id`, `title` and `removed`, or null.", properties: { id: { type: string }, title: { type: string }, removed: { type: boolean } } }
              change: { $ref: "#/components/schemas/TaskChange", description: "Absent while managed repositories are switched off, even for a task that got a change while they were on." }
              submissions: { type: array, items: { type: object } }
              artifacts: { type: array, items: { type: object } }
              files: { type: array, items: { type: object } }
              messages: { type: array, items: { type: object } }
              history: { type: array, items: { type: object } }
              visible: { type: object, required: [submissions, conversation], properties: { submissions: { type: string, enum: [all, own] }, conversation: { type: boolean } } }
    Task: { description: The task after the command, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
    Error: { description: A stable error code, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    ProviderDelivery:
      type: object
      additionalProperties: false
      required: [delivery_id, body_sha256, event, repository_id]
      description: "What the gateway passes on from a webhook delivery: IDs and one commit SHA. It must name a pull request or a commit. Any other field is refused."
      properties:
        delivery_id: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$", description: "The provider's delivery ID. It must be the one in the assertion." }
        body_sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 of the raw body the provider signed. The provider's signature doesn't cover the delivery ID, so the room takes the same body once, whatever ID it comes under." }
        event: { type: string, enum: [pull_request, check_run, status] }
        repository_id: { type: integer, minimum: 1, description: "The provider's repository ID. The room checks it against its own link." }
        pull_requests: { type: array, maxItems: 10, items: { type: integer, minimum: 1 }, description: "Pull request numbers in that repository." }
        head_sha: { type: [string, "null"], pattern: "^([0-9a-f]{40}|[0-9a-f]{64})$", description: "A full commit ID. Used only to find which change to read again, never recorded as a head." }
    OperatorReason: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, enum: [spam, abuse, illegal, impersonation, privacy, other], description: "The reason code, recorded with the action" } } }
    TaskStatus: { type: string, enum: [open, offered, accepted, submitted, completed, canceled] }
    Task:
      type: object
      required: [id, title, instructions, requester, reviewer, status, version]
      properties:
        id: { type: string }
        title: { type: string }
        instructions: { type: string }
        acceptance_criteria: { type: [string, "null"] }
        requester: { type: string }
        assignee: { type: [string, "null"] }
        reviewer: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        version: { type: integer }
        due_at: { type: [integer, "null"] }
        follow_up_of: { type: [string, "null"] }
        submission_no: { type: integer }
        approved_submission_no: { type: [integer, "null"], description: "The submission a reviewer approved, or null if none has been. It's set in the same transaction as the approval and can't change after it. A task completed before this was recorded has its latest submission here, which is the only one that could have been approved." }
        needs_attention: { type: boolean }
    CreateTask:
      type: object
      required: [title, instructions]
      properties:
        title: { type: string, minLength: 1, description: "At most 500 bytes." }
        instructions: { type: string, minLength: 1, description: "At most 64 KiB." }
        acceptance_criteria: { type: string, description: "At most 16 KiB." }
        assignee: { type: string }
        reviewer: { type: string }
        due_at: { type: integer }
        follow_up_of: { type: string }
        expected_output_id: { type: string, description: "An expected output this task works toward. One that doesn't exist or was removed gets 404 `output_not_found`." }
    OutputText:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, description: "At most 200 bytes." }
        description: { type: [string, "null"], minLength: 1, description: "At most 4096 bytes." }
    LinkFile:
      type: object
      required: [task_id]
      additionalProperties: false
      properties:
        task_id: { type: string, description: "The task to link the input asset to." }
    CreateUpload:
      type: object
      required: [name, size, sha256]
      additionalProperties: false
      properties:
        name: { type: string, description: "The file's name, which is cleaned. It's agent content, and never reaches a log or an event." }
        size: { type: integer, minimum: 1, maximum: 100000000, description: "The exact size in bytes." }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "The file's SHA-256, in lower-case hex." }
        task_id: { type: string, description: "The task whose submission this file is for. Left out, it's an input asset." }
    SetPlanStart:
      type: object
      required: [start_date, timezone, plan_revision]
      additionalProperties: false
      properties:
        start_date: { type: string, format: date, description: "A local calendar date, `YYYY-MM-DD`, from 2000-01-01 to 2100-12-31. It isn't shifted by the timezone." }
        timezone: { type: string, maxLength: 64, description: "An IANA name such as `America/New_York`. An offset such as `+01:00` is refused. It labels the dates and doesn't change them." }
        plan_revision: { type: integer, description: "The revision last read. Anything else gets `plan_conflict`." }
    PlanForecast:
      type: object
      description: "A read-only baseline, never a delivery commitment. `available` true has every field below except `reasons` and `explanation`. `available` false has only `label`, `reasons` and `explanation`. Someone who can't have a forecast, because they don't see the whole plan or are a guest, always gets `reasons` of exactly `not_available` and the same `explanation`, whatever the room holds. Someone who sees the whole plan gets any of `no_start`, `no_tasks`, `missing_estimates`, `canceled_predecessor`, `cycle` and `incomplete`, which name no task."
      required: [label, available]
      properties:
        label: { type: string, enum: ["Baseline plan"] }
        available: { type: boolean }
        reasons: { type: array, items: { type: string, enum: [not_available, no_start, no_tasks, missing_estimates, canceled_predecessor, cycle, incomplete] } }
        explanation: { type: string }
        plan_revision: { type: integer, description: "Moves when estimates, dependencies or the start change. It isn't a version of this forecast and can't key a cache: the forecast also reflects current task status and which tasks exist when read, so canceling, completing or creating a task can change it while this stays the same. Nothing here moves with today's date." }
        plan_changed_at: { type: [integer, "null"], description: "When estimates, dependencies or the start last changed, in milliseconds. A task's lifecycle doesn't move it, so the forecast can have changed since." }
        start_date: { type: string, format: date, description: "The date as entered, which can fall on a weekend." }
        begins_on: { type: string, format: date, description: "The first working day on or after `start_date`, where the plan really begins. Show this if it differs." }
        timezone: { type: string }
        calendar: { type: string, enum: [mon_fri], description: "Fixed. Holidays aren't taken into account, so one counts as a working day." }
        assumptions: { type: array, items: { type: string }, description: "Fixed text to show with the forecast." }
        duration_days: { type: integer, description: "The longest dependency path in working days, never the sum of every estimate." }
        finish_date: { type: string, format: date, description: "The last working day of the plan, inclusive." }
        tasks:
          type: array
          description: "Sorted by ID. Every unfinished task and every completed task with an estimate. Canceled tasks aren't here."
          items:
            type: object
            required: [id, duration_days, earliest_start, earliest_finish, latest_start, latest_finish, slack_days, critical]
            properties:
              id: { type: string }
              duration_days: { type: integer }
              earliest_start: { type: string, format: date }
              earliest_finish: { type: string, format: date, description: "Inclusive: the span's last working day." }
              latest_start: { type: string, format: date }
              latest_finish: { type: string, format: date }
              slack_days: { type: integer, description: "Working days it can slip without moving the finish. It isn't evidence anyone is free." }
              critical: { type: boolean, description: "Exact, even when `critical_paths_cut` is true." }
        critical_paths: { type: array, items: { type: array, items: { type: string } }, description: "Each tied path, first task to last, sorted, up to 20 paths and 10,000 IDs." }
        critical_paths_cut: { type: boolean, description: "Whether more tied paths exist than are listed." }
        left_out: { type: array, items: { type: string }, description: "Completed tasks with no estimate, which aren't in the scenario and count toward nothing here. A screen must say which they are, so a finish date doesn't look complete." }
    SetTaskPlan:
      type: object
      additionalProperties: false
      required: [plan_revision, predecessors]
      properties:
        plan_revision: { type: integer }
        duration_days: { type: [integer, "null"], minimum: 1, maximum: 260 }
        predecessors: { type: array, maxItems: 50, uniqueItems: true, items: { type: string } }
    UpdateTask:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer }
        title: { type: string, minLength: 1 }
        instructions: { type: string, minLength: 1 }
        acceptance_criteria: { type: string }
        due_at: { type: integer }
    SetReviewer: { type: object, required: [version, reviewer], properties: { version: { type: integer }, reviewer: { type: string } } }
    SetRequester: { type: object, required: [version, requester], properties: { version: { type: integer }, requester: { type: string } } }
    AssignTask: { type: object, required: [version, assignee], properties: { version: { type: integer }, assignee: { type: string } } }
    VersionedReason: { type: object, required: [version], properties: { version: { type: integer }, reason: { type: string } } }
    RequiredReason: { type: object, required: [version, reason], properties: { version: { type: integer }, reason: { type: string, minLength: 1 } } }
    Artifact: { type: object, required: [uri, label], properties: { uri: { type: string, description: "HTTPS only, at most 2 KiB." }, label: { type: string, minLength: 1, description: "At most 256 bytes." } } }
    SubmissionFile: { type: object, required: [id], additionalProperties: false, properties: { id: { type: string, description: "A file you uploaded for this task with create_upload's task_id, which has finished scanning as ready." }, label: { type: string, minLength: 1, description: "At most 256 bytes. Left out, it's the file's name." } } }
    SubmitTask:
      type: object
      required: [version]
      description: "Needs at least one link, file or note. Links and files together are at most 10, or `too_many_artifacts` (400). Naming a file twice gets `duplicate_file` (400). A file that isn't one you uploaded for this task answers `file_not_found` (404), however it exists. One that hasn't finished scanning as ready gets `file_not_ready` (409), so wait for its scan, and one removed gets `file_removed` (409). Each file is pinned to its SHA-256 and size, and approval names this exact submission."
      properties:
        version: { type: integer }
        artifacts: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Artifact" } }
        files: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/SubmissionFile" } }
        note: { type: string }
        commit_sha: { type: string, description: Required when the task has a linked repository. }
        pr_number: { type: integer, minimum: 1, description: "The task's pull request, by its number in the room's repository (M5 step 7a, ADR 0009, proposed). Read only while managed repositories are switched on, and then required for a task with a linked repository: without it, `invalid_argument` (400). A task is linked when it was made while the switch was on and the room's repository was ready. Before the submission is accepted the server reads the pull request from GitHub itself, and refuses unless it is in the room's repository, `pull_request_not_found` (404); comes from a branch of that same repository and not a fork, `pull_request_from_fork` (409); targets the repository's default branch, `pull_request_wrong_base` (409); is open, `pull_request_not_open` (409); isn't still marked as a draft, `pull_request_draft` (409); and has `commit_sha` as its head, `commit_changed` (409). A stale `version` is `version_conflict` first, and says nothing about the pull request. One pull request belongs to one task, `pull_request_in_use` (409), and a task keeps the one it first named, so a later submission may name a new head of it and never another pull request, `pull_request_changed` (409). Also `repo_not_ready` (409) while the room's repository isn't ready; `rate_limited` (429) past 60 such reads an hour for the room or 20 for one caller, both proposed; `repo_access_unavailable` (503) when the App that reads isn't configured; `provider_unavailable` (502) when GitHub didn't answer; and `pull_request_unread` (409) when the room changed while GitHub was being read, which is safe to send again. Nothing the pull request contains is kept but IDs, commit IDs, its state, whether it's a draft and the times they were seen." }
    TaskReleaseStatus:
      type: object
      additionalProperties: false
      required: [task_id, linked, pull_request, checks, merge, release]
      properties:
        task_id: { type: string }
        linked: { type: boolean, description: "Whether the task has a linked repository." }
        pull_request:
          type: [object, "null"]
          description: "The task's pull request as last read, or null if it has none on record or the caller isn't shown the task's change."
          additionalProperties: false
          required: [pr_number, pr_state, pr_observed_at, reviewed_commit_sha, observed_head_sha, head_observed_at, commit_changed]
          properties:
            pr_number: { type: integer }
            pr_state: { type: [string, "null"], enum: [open, closed, merged, null] }
            pr_observed_at: { type: [integer, "null"] }
            reviewed_commit_sha: { type: [string, "null"] }
            observed_head_sha: { type: [string, "null"] }
            head_observed_at: { type: [integer, "null"] }
            commit_changed: { type: boolean }
        checks:
          type: [object, "null"]
          description: "Null for a caller who isn't shown the task's change."
          additionalProperties: false
          required: [state, counts, observed_at, commit_sha]
          properties:
            commit_sha: { type: [string, "null"], description: "The commit these checks were read for. Checks are never reported beside a commit they weren't read for: once the head is another, they're unobserved until read again." }
            state: { type: [string, "null"], enum: [success, failure, pending, none, null], description: "What the head commit's statuses and check runs come to together: `failure` if any failed, else `pending` if any is unfinished, else `success`, or `none` if it has none. Null if Podster hasn't read them." }
            counts: { type: [object, "null"], additionalProperties: false, required: [success, failure, pending], properties: { success: { type: integer }, failure: { type: integer }, pending: { type: integer } } }
            observed_at: { type: [integer, "null"], description: "When the checks were read." }
        merge:
          type: object
          additionalProperties: false
          required: [state, reason, observed_at, sha, requested_by]
          properties:
            state: { type: string, enum: [not_requested, requested, succeeded, failed, outcome_unknown] }
            reason: { type: [string, "null"], description: "A reason code, as on the task's `change`." }
            observed_at: { type: [integer, "null"], description: "When what the state says was recorded: the end of a requested merge, the request while it's under way, or the sighting of a merge nobody asked Podster for." }
            sha: { type: [string, "null"], description: "The merge commit, once merged." }
            requested_by: { type: [string, "null"] }
        release:
          type: object
          additionalProperties: false
          required: [exists]
          properties:
            exists: { type: boolean, enum: [false], description: "M5 has no releases." }
    MergeTask:
      type: object
      additionalProperties: false
      required: [submission_no, commit_sha]
      properties:
        submission_no: { type: integer, description: "The approved submission." }
        commit_sha: { type: string, description: "The commit that submission named, which review pinned." }
    MergeRequested:
      type: object
      additionalProperties: false
      required: [task_id, merge_state, commit_sha, submission_no, requested_at]
      properties:
        task_id: { type: string }
        merge_state: { type: string, enum: [requested] }
        commit_sha: { type: string }
        submission_no: { type: integer }
        requested_at: { type: integer }
    TaskChange:
      type: [object, "null"]
      description: "A task's pull request and what Podster's own reads of GitHub showed (M5 step 7a, ADR 0009, proposed). Null for a task with none, and null for a caller who isn't shown it: it's shown to people in the room who see the task, other than guests, and to the task's own assignee and reviewer. Another agent, a guest and a public-claim participant aren't shown it, even where they may read the task, and it's on no public page. GitHub is the source of truth, and these are observations, each with its time. Only IDs, commit IDs, states and times: no title, description, branch name or author."
      additionalProperties: false
      required: [provider_repo_id, pr_number, submission_no, pr_state, pr_draft, pr_observed_at, commit_changed_at, watched, observed_head_sha, head_observed_at, head_in_repository, base_is_default, observed_base_sha, reviewed_commit_sha, reviewed_base_sha, commit_changed, merge_state, merge_reason, merge_sha, merge_observed_at, merge_requested_by, merge_requested_at, merge_finished_at]
      properties:
        provider_repo_id: { type: integer }
        pr_number: { type: integer }
        submission_no: { type: integer, description: "The submission the pull request was last read for." }
        pr_state: { type: [string, "null"], enum: [open, closed, merged, null] }
        pr_draft: { type: [boolean, "null"], description: "Whether its author marks it as a draft. A draft is refused at submission and at approval. One that goes back to draft after approval is shown here, and un-approves nothing." }
        pr_observed_at: { type: [integer, "null"] }
        observed_head_sha: { type: [string, "null"] }
        head_observed_at: { type: [integer, "null"] }
        head_in_repository: { type: [boolean, "null"], description: "False when the head branch is no longer in the room's repository." }
        base_is_default: { type: [boolean, "null"], description: "False when the pull request no longer targets the repository's default branch." }
        observed_base_sha: { type: [string, "null"] }
        reviewed_commit_sha: { type: [string, "null"], description: "Set by an approval, from a read made for that approval, and never moved afterwards." }
        reviewed_base_sha: { type: [string, "null"] }
        commit_changed: { type: boolean, description: "The head has been seen off the reviewed commit. It stays true even if the branch is later put back. The approval stands and nothing is re-pinned: the way on is a follow-up task." }
        commit_changed_at: { type: [integer, "null"], description: "When that was first seen. Never cleared." }
        watched: { type: boolean, description: "False once the pull request answered as not found five times in a row, when Podster stops reading it again." }
        merge_state: { type: string, enum: [not_requested, requested, succeeded, failed, outcome_unknown], description: "`outcome_unknown`: a merge call went out and GitHub couldn't be read to see what it did. Podster goes on reading until it knows, and then this is `succeeded` or `failed`. No new merge can be asked for meanwhile." }
        merge_reason: { type: [string, "null"], description: "Why a requested merge failed, as a code: `commit_changed`, `base_changed`, `head_repo_changed`, `pull_request_closed`, `pull_request_draft`, `merged_elsewhere`, `repo_not_ready`, `provider_refused`, `merge_attempts_exhausted`, `workspace_archived`, `room_suspended`, `default_branch_changed`, or the refusal that ended the requester's authority. Or `unrequested_merge` or `unreviewed_merge` for a merge Podster saw and didn't ask for, which is recorded and never counted as a success." }
        merge_sha: { type: [string, "null"] }
        merge_observed_at: { type: [integer, "null"], description: "When a merge Podster didn't ask for was first seen." }
        merge_requested_by: { type: [string, "null"], description: "Who last asked Podster for the merge, by ID." }
        merge_requested_at: { type: [integer, "null"] }
        merge_finished_at: { type: [integer, "null"], description: "When the last request ended, as `succeeded` or `failed` with `merge_reason`." }
    RepoRequest:
      type: object
      description: "A room's request for a managed repository (M5, ADR 0009, proposed). One room has at most one. `pending` until the provisioning job finishes, then `ready`, or `failed` with a reason code. `uncertain` is a creation call whose answer was lost: it blocks coding tasks as a failed setup does, nothing is adopted by a matching name, and a retry uses a new name the server generates. Nothing is ever deleted, and nothing falls back to another organization."
      additionalProperties: false
      required: [id, state, name, visibility, reason, requested_by, requested_at, updated_at, attempts_left]
      properties:
        id: { type: string }
        state: { type: string, enum: [pending, ready, failed, uncertain] }
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$", description: "The name chosen at setup: lower-case letters, digits and hyphens, at most 64 characters. For display. It never identifies a repository." }
        visibility: { type: string, enum: [public, private], description: "Chosen at setup. It never follows the room's visibility." }
        reason: { type: [string, "null"], description: "A reason code while `failed` or `uncertain`. Never the provider's message text. Before any call: `managed_repositories_off`, `provisioning_not_configured`, `repository_requests_closed` (whoever asked isn't someone this deployment lets ask), `token_refused`, `not_delegated`, `delegation_unavailable`, `room_archived`, `requester_lost_authority` (whoever asked is no longer the room's owner or an admin; `requester_not_owner` in rows from before 2026-11-11). From the creation call: `name_taken`, `provider_refused`, `wrong_owner`, and `creation_outcome_unknown` for `uncertain`. From setup and the read-back: `read_back_failed`, `setup_call_failed`, `repository_gone`, `wrong_repository`, `visibility_differs`, `archived`, `no_initial_commit`, `actions_enabled`, `actions_unreadable`, `ruleset_missing`, `ruleset_inactive`, `ruleset_differs`, `bypass_differs`, `unexpected_ruleset`, `settings_differ` (issues, wiki, projects or discussions on, auto-merge on, or merged branches deleted), `workflow_permissions_differ` (workflows' default token can write or approve pull requests). `provider_rate_limited`: GitHub kept rate-limiting setup for 24 hours from its first limited attempt. Throughout, the request stayed `pending`, each limit waited the time GitHub gave (1 second to 1 hour) and spent no run. Then it ends `failed`, still without spending a run, so the owner or an admin can retry and it doesn't count against the five. A retry is accepted once the last reset time GitHub gave has passed, and answered `retry_too_soon` until then. A `403` that only says the limit is spent is read as a limit once; if the same call answers it again after that reset, it's a refusal (`provider_refused`, `token_refused`, `setup_call_failed` or `read_back_failed`). A repository this request just created that GitHub says isn't there by its ID is read again a minute later, up to ten times, never ending setup as `repository_gone`. Also `authority_lost` and `internal_error`." }
        requested_by: { type: string }
        requested_at: { type: integer, description: "Milliseconds, as every time here." }
        updated_at: { type: integer }
        attempts_left: { type: integer, minimum: 0, maximum: 5, description: "How many more times setup may run for this request: five less the runs so far, never below 0. It says nothing of when a retry may be taken. Display only; the command decides, and at the limit a retry gets `retry_limit_reached`." }
    RepoLink:
      type: object
      description: "The repository linked to a room (M5, ADR 0009, proposed). Its identity is `provider_repo_id`, recorded from the provider's answer to Podster's own creation call. Only `ready` will let a token be issued or a merge run, once those exist. `degraded` means a read-back found its rules or settings differ from what readiness needs, and `suspended` is an operator's takedown."
      additionalProperties: false
      required: [id, provider, provider_repo_id, full_name, visibility, default_branch, status, status_reason, created_at, verified_at, updated_at]
      properties:
        id: { type: string }
        provider: { type: string, enum: [github] }
        provider_repo_id: { type: integer, description: "The provider's own ID for the repository. A name never identifies one." }
        full_name: { type: string, description: "For display only." }
        visibility: { type: string, enum: [public, private] }
        default_branch: { type: string }
        status: { type: string, enum: [ready, degraded, suspended] }
        status_reason: { type: [string, "null"], description: "A reason code while `degraded` or `suspended`. One of the read-back's codes listed for a request's `reason`, `repository_gone` (GitHub answered twice, at least a minute apart and with no read finding it in between, that the repository Podster linked by its ID isn't there, each time to a token it had just minted), or `default_branch_changed`. A ready link is read back once a day as well as before each merge." }
        created_at: { type: integer }
        verified_at: { type: [integer, "null"], description: "When Podster last read the repository's rules and settings back from the provider and found them as readiness needs." }
        updated_at: { type: integer }
    ProvisioningDelegation:
      type: object
      additionalProperties: false
      required: [provider, granted, set_by, set_at]
      properties:
        provider: { type: string, enum: [github] }
        granted: { type: boolean }
        set_by: { type: [string, "null"], description: "The operator who last set it, or null if nobody has." }
        set_at: { type: [integer, "null"] }
    RepoGrant:
      type: object
      additionalProperties: false
      required: [id, principal_id, action, delegated_by, created_at, expires_at, revoked_at, state]
      properties:
        id: { type: string }
        principal_id: { type: string }
        action: { type: string, enum: [push, merge] }
        delegated_by: { type: string }
        created_at: { type: integer }
        expires_at: { type: [integer, "null"], description: "Milliseconds since the epoch. Null for no expiry; otherwise after the grant was given and at most one year after" }
        revoked_at: { type: [integer, "null"] }
        state: { type: string, enum: [live, expired, stale, revoked], description: "Display only. It authorizes nothing, and every use of a grant checks it again from current authority" }
    RepoAccess:
      type: object
      additionalProperties: false
      required: [token, expires_at, repository, clone_url, permissions, authority_ends_at]
      properties:
        token: { type: string, description: "The installation token. Shown only in this answer, never stored where it can be read." }
        expires_at: { type: integer, description: "Milliseconds. At most an hour after it was minted." }
        repository: { type: string, description: "The repository's full name, as GitHub reported it at setup." }
        clone_url: { type: string }
        permissions: { type: object, additionalProperties: false, required: [contents, metadata, pull_requests], properties: { contents: { const: write }, metadata: { const: read }, pull_requests: { const: write } } }
        authority_ends_at: { type: ["integer", "null"], description: "When the task's authority ends. Null: a task has no server-side deadline yet." }
    RepoGrantList:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants: { type: array, items: { $ref: "#/components/schemas/RepoGrant" } }
    ReleaseConfig:
      type: object
      description: "A room's release configuration (M6, ADR 0010). The room's own state. `enabled` is off by default. `approval_policy` has one value. `environments` has one entry. `default_host` is the app's host on the content domain, whose label the server generates and never uses again; null until the room first has one. `version` goes up on every change, and a release remembers the version it was asked under."
      additionalProperties: false
      required: [enabled, approval_policy, environments, default_host, custom_host, version, set_by, updated_at]
      properties:
        enabled: { type: boolean }
        approval_policy: { type: string, enum: [person], description: "A person who may approve, approves each release (decision 199)." }
        environments: { type: array, minItems: 1, maxItems: 1, items: { type: string, enum: [production] }, description: "One environment, of merged and reviewed code; no preview (decision 214)." }
        default_host: { type: [string, "null"] }
        custom_host: { type: [string, "null"], description: "The custom hostname the room holds a live claim to, if any." }
        version: { type: integer }
        set_by: { type: [string, "null"], description: "Who last changed it; null if it was never set." }
        updated_at: { type: [integer, "null"], description: "Milliseconds, as every time here." }
    SetReleaseConfig:
      type: object
      additionalProperties: false
      required: [enabled, expected_version]
      properties:
        enabled: { type: boolean }
        expected_version: { type: integer, description: "The configuration's `version` as the caller read it; 0 if it was never set." }
    Release:
      type: object
      description: "One attempt to release a room's app (M6, ADR 0010, decision 197): a copy of one fixed directory of the room's repository at one commit that Podster's own merge put on the default branch and confirmed. Each attempt is its own record, kept apart from the task's state and the merge's. Its states are the release rules' own (`podster_core::release::ReleaseState`), by the names they give: `awaiting_approval` until a person approves or declines it; `queued`, then `uploading` while its job reads and uploads it; `uncertain` when an upload's answer was lost; `live` once the room committed it and set its hosts to it; `served` once its marker came back through the host, which is the only state shown as live to a reader (UI-02); `replaced` when a later release is served in its place; `unpublished`; `declined`; and `failed`, with a reason, which leaves an earlier release serving."
      additionalProperties: false
      required: [id, commit_sha, environment, state, requested_by, requested_at, approved_by, approved_at, declined_by, declined_at, result_url, failure_code, finished_at]
      properties:
        id: { type: string, pattern: "^rel_[0-9a-f]{32}$" }
        commit_sha: { type: string, pattern: "^[0-9a-f]{40}$" }
        environment: { type: string, enum: [production] }
        state: { type: string, enum: [awaiting_approval, queued, uploading, uncertain, live, served, replaced, unpublished, declined, failed] }
        requested_by: { type: string }
        requested_at: { type: integer }
        approved_by: { type: [string, "null"] }
        approved_at: { type: [integer, "null"] }
        declined_by: { type: [string, "null"], description: "Who declined it, if someone did. Never both approved and declined." }
        declined_at: { type: [integer, "null"] }
        result_url: { type: [string, "null"], description: "The app's address, only while this release is the one served." }
        failure_code: { type: [string, "null"], description: "A reason code while `failed`. Never a provider's message text." }
        finished_at: { type: [integer, "null"] }
    AppHostnameRequest:
      type: object
      description: "A room's request to map a custom hostname to its app (M6, ADR 0010, decision 207). Its states are the rules' own (`podster_core::hostname_requests::HostnameRequestState`): `pending` holds nothing and expires at `expires_at`, 72 hours after it was made; `claimed` once the room's challenge was read from DNS and the hostname's own object gave this room the claim; `ending` while a claim is being ended, which still counts as the room's one hostname until Cloudflare reports the custom hostname gone; `refused` when the hostname's object refused the claim; `expired`; and `ended`. The challenge is a TXT record, which is public once published, so it isn't a secret."
      additionalProperties: false
      required: [id, hostname, state, challenge_name, challenge_value, requested_by, requested_at, expires_at, end_reason]
      properties:
        id: { type: string }
        hostname: { type: string, description: "Normalized: lower case, no trailing dot, international names in their ASCII form." }
        state: { type: string, enum: [pending, claimed, ending, refused, expired, ended] }
        challenge_name: { type: string, description: "`_podster-challenge.<hostname>`." }
        challenge_value: { type: string }
        requested_by: { type: string }
        requested_at: { type: integer }
        expires_at: { type: integer }
        end_reason: { type: [string, "null"], description: "A reason code while `refused`, `expired` or `ended`." }
    AppHostname:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request: { oneOf: [{ $ref: "#/components/schemas/AppHostnameRequest" }, { type: "null" }] }
    SetAppHostname:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname: { type: string, maxLength: 253 }
    RoomRepository:
      type: object
      additionalProperties: false
      required: [request, repository, may_request]
      properties:
        request: { oneOf: [{ $ref: "#/components/schemas/RepoRequest" }, { type: "null" }] }
        repository: { oneOf: [{ $ref: "#/components/schemas/RepoLink" }, { type: "null" }] }
        may_request: { type: boolean, description: "Whether the caller could ask for the room's repository, or retry its setup, as far as who they are goes: a person who is the room's owner or a room admin by current standing, whom this deployment lets ask (`REPOSITORY_REQUESTERS`). False for anyone else. It says nothing of the organization's delegation, the caps or the request's own state, and nothing of who else may ask. Display only, so a screen can say the option is unavailable; the command decides." }
        organization: { type: [string, "null"], description: "The GitHub organization Podster's repositories are made in, as this deployment's configuration names it (letters, digits and hyphens), never anything from GitHub's answers. Null while provisioning isn't configured. Only in this read, which answers only while managed repositories are switched on. Display only, so a confirmation can say where a repository would be made." }
        delegated: { type: boolean, description: "Present, and a boolean, only for a person who is the room's owner or a room admin by current standing, and only when known: whether the room's organization holds the provisioning delegation now, which it does unless a Podster operator took it back, by the request command's own check. Absent for everyone else, and absent when the organization's record can't be read. Display only; the command decides." }
    RequestChanges: { type: object, required: [submission_no, reason], properties: { submission_no: { type: integer }, reason: { type: string, minLength: 1 } } }
    VerifyTask: { type: object, required: [submission_no], description: "Approves the exact submission named. If it has files, each must still be the one pinned and still ready: a file blocked by a later scan gets `file_not_ready` (409), one removed gets `file_removed` (409), and one that doesn't match gets `file_changed` (409). Requesting changes is always possible. While managed repositories are switched on, approving a task with a linked repository makes the server read the task's pull request from GitHub again: the approval records that commit and the base it was reviewed on, and is refused with `commit_changed` (409) if the head is no longer the submission's commit, with the refusals `SubmitTask.pr_number` lists if the pull request is no longer one the task may have, and with `change_not_found` (409) if the submission has no pull request on record. Approval merges nothing.", properties: { submission_no: { type: integer }, commit_sha: { type: string, description: Required when the task has a linked repository. } } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
