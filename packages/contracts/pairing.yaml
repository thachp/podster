openapi: 3.1.0
info:
  title: Podster Runner pairing, on the gateway
  version: 0.0.0
  description: >-
    The gateway's own pairing routes (M7 step 5(b), decision 222). They authenticate and translate; each reaches one
    pairing operation of the private API, named by `x-api-operation`, and the API decides. The person's routes use their
    session, and anything that isn't a GET must come from our own origin. The dashboard's `/api/v1/…` passthrough refuses
    every `/v1/pairing` path, so these handlers are the only way to the API's pairing operations. Nothing here takes a
    code, a host or an organization from the client except Runner's code on redeem, and no code travels in a URL. The
    Agent Auth plugin's own `/host/*` routes stay private. Errors look like the API's, with one `code`.
tags:
  - name: commands
  - name: queries
paths:
  /api/pairing:
    post:
      operationId: gatewayStartPairing
      x-api-operation: startPairing
      tags: [commands]
      security: [{ session: [] }]
      summary: "A person starts a pairing for a new agent in the organization they act in (`X-Podster-Org`, among their own). The gateway calls the Agent Auth plugin's `createHost` with no key and Runner's fixed capability allowlist (never `merge_task` or `deploy_release`), then `startPairing` with that organization, the host's ID and its one-time enrollment token as the code, all from the server. The body may hold `name` and nothing else; any other member answers `invalid_argument` (400) and makes no host. A refusal from the API is passed on as it came, and the host made for it is retired, so its token can never be used. Answers the session as `getPairing` does, plus `code`, in the body only, with `Cache-Control: no-store`; the code is never in a URL or a log, and the session's later reads never answer it"
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { name: { type: string, description: "1 to 200 bytes after trimming. The plugin host and the agent are named after it; `Runner` and `agent` without it." } } } } } }
      responses: { "200": { description: "The session, with `code`" }, default: { description: "An error with one `code`" } }
  /api/pairing/{agent}:
    parameters: [{ $ref: "#/components/parameters/agent" }]
    get:
      operationId: gatewayGetPairing
      x-api-operation: getPairing
      tags: [queries]
      security: [{ session: [] }]
      summary: "The starter's read of their session, passed on as the API answers it, never with the code"
      responses: { "200": { description: "The session" }, default: { description: "An error with one `code`" } }
  /api/pairing/{agent}/cancel:
    parameters: [{ $ref: "#/components/parameters/agent" }]
    post:
      operationId: gatewayCancelPairing
      x-api-operation: cancelPairing
      tags: [commands]
      security: [{ session: [] }]
      summary: "The starter ends their session. Once the API answers it canceled, the plugin host still waiting for it is retired; one already enrolled is left as it is"
      responses: { "200": { description: "The session" }, default: { description: "An error with one `code`" } }
  /api/pairing/{agent}/activate:
    parameters: [{ $ref: "#/components/parameters/agent" }]
    post:
      operationId: gatewayActivatePairing
      x-api-operation: activatePairing
      tags: [commands]
      security: [{ session: [] }]
      summary: "The starter confirms the key thumbprint they were shown. The body is exactly `key_thumbprint`, 43 characters of base64url, or `invalid_argument` (400) before the API is asked. The API decides the rest"
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [key_thumbprint], properties: { key_thumbprint: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } } } } } }
      responses: { "200": { description: "The session, with `connection`" }, default: { description: "An error with one `code`" } }
  /pairing/{agent}/redeem:
    parameters: [{ $ref: "#/components/parameters/agent" }]
    post:
      operationId: gatewayRedeemPairing
      x-api-operation: redeemPairing
      tags: [commands]
      security: [{ hostProof: [] }]
      summary: "Runner's code for a session, on the gateway's own host and never the application's, with no session. In order: a per-network limit of 10 a minute and 100 a day, counted exactly, which refuses with `temporarily_unavailable` (503) when it can't count, and `rate_limited` (429) past it; the proof, `invalid_jwt` (401) unless it is as `hostProof` says, and `invalid_public_key` (400) for a key that isn't a bare Ed25519 public key; the body, exactly `code`, or `invalid_argument` (400); a key any plugin host already holds is refused `not_allowed` (403) while this session's own host still waits. Then the API's `redeemPairing`, under the `pairingRedeem` assertion, with the key's RFC 7638 thumbprint, the proof's `jti` and `exp`, and the SHA-256 of the exact body sent; its refusal is passed on as it came (every one is `not_allowed`, 403). Only after its 200 does the gateway call the plugin's `enrollHost`, binding the key to that session's host; if that fails it answers `upstream_unavailable` (502) and a retry with a fresh proof finishes it. A retry after a lost answer, with the same code and key on a fresh proof, finds the session's host holding the key and answers the same, enrolling nothing twice. Answers `agent_id`, `status` (`redeemed`), `plugin_host_id`, `key_thumbprint` and `expires_at`, with `Cache-Control: no-store`. Nothing is connected until the person activates"
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, pattern: "^[A-Za-z0-9_-]{32,128}$" } } } } } }
      responses: { "200": { description: "The redeemed session" }, default: { description: "An error with one `code`" } }
components:
  parameters:
    agent: { name: agent, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" } }
  securitySchemes:
    session: { type: apiKey, in: cookie, name: better-auth.session_token, description: "The person's Better Auth session" }
    hostProof: { type: http, scheme: bearer, bearerFormat: "host+jwt", description: "A host JWT, compact, at most 4096 bytes: header `typ: host+jwt`, `alg: EdDSA`, no `crit`, and a `kid`, if any, equal to the key's thumbprint; claims `host_public_key`, a bare Ed25519 public JWK (`kty`, `crv`, `x`, and optionally `kid`, `alg`, `use`; never `d`) whose private half signed it, `sub` the path's agent, `aud` the gateway's origin, `jti` (1 to 128 bytes), `iat`, and `exp` at most 300 seconds ahead and at most 300 after `iat`. No `agent_public_key`, `agent_jwks_url` or `host_jwks_url`, so a proof can't double as a registration. The pinned client makes one with `signHostJWT({ hostKeypair, audience, issuer: agentId })`" }
