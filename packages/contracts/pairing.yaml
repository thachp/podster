openapi: 3.1.0
info:
  title: Podster Runner pairing, on the gateway
  version: 0.0.0
  description: >-
    The gateway's own pairing routes (M7 step 5(b), decision 222). They authenticate and translate; each reaches one
    pairing operation of the private API, named by `x-api-operation`, and the API decides. The person's routes use their
    session, and anything that isn't a GET must come from our own origin. The dashboard's `/api/v1/…` passthrough refuses
    every `/v1/pairing` path, so these handlers are the only way to the API's pairing operations. Nothing here takes a
    code, a host or an organization from the client except Runner's code on redeem, and no code travels in a URL. The
    Agent Auth plugin's own `/host/*` routes stay private. Errors look like the API's, with one `code`.
tags:
  - name: commands
  - name: queries
paths:
  /api/pairing:
    post:
      operationId: gatewayStartPairing
      x-api-operation: startPairing
      tags: [commands]
      security: [{ session: [] }]
      summary: "A person starts a pairing for a new agent in the organization they act in (`X-Podster-Org`, among their own). The gateway calls the Agent Auth plugin's `createHost` with no key and Runner's fixed capability allowlist (never `merge_task`, `deploy_release` or, until step 10, `get_repo_access`; a budget, not a ceiling), then `startPairing` with that organization, the host's ID and its one-time enrollment token as the code, all from the server. The body may hold `name` and nothing else; any other member answers `invalid_argument` (400) and makes no host. Each person's starts are then counted exactly, 5 a minute and 30 a day, before any host is made: past that `rate_limited` (429), and `temporarily_unavailable` (503) when the count can't be read. A refusal from the API is passed on as it came, and the host made for it is retired, so its token can never be used. Answers the session as `getPairing` does, plus `code`, in the body only, with `Cache-Control: no-store`; the code is never in a URL or a log, and the session's later reads never answer it"
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { name: { type: string, description: "1 to 200 bytes after trimming. The plugin host and the agent are named after it; `Runner` and `agent` without it." } } } } } }
      responses: { "200": { description: "The session, with `code`" }, default: { description: "An error with one `code`" } }
  /api/pairing/{agent}:
    parameters: [{ $ref: "#/components/parameters/agent" }]
    get:
      operationId: gatewayGetPairing
      x-api-operation: getPairing
      tags: [queries]
      security: [{ session: [] }]
      summary: "The starter's read of their session, passed on as the API answers it, never with the code. A session it shows canceled, expired or locked has its plugin host ended: retired if waiting, revoked with its agents if it holds the session's thumbprint. A redeemed or activated session also carries `runner_ready`, whether the session's plugin host holds exactly one agent that isn't revoked, and it active: for the confirm screen only (step 5(c)), since the API's binding rule decides at confirmation. The starter's read of an activated session also finishes its link if the directory write after activation was lost (ruling M2 on #453): `connected` says whether the directory's rows now exist, and `link_problem: already_linked` that Runner's plugin agent is linked to another agent, which leaves the session as it is"
      responses: { "200": { description: "The session" }, default: { description: "An error with one `code`" } }
  /api/pairing/{agent}/cancel:
    parameters: [{ $ref: "#/components/parameters/agent" }]
    post:
      operationId: gatewayCancelPairing
      x-api-operation: cancelPairing
      tags: [commands]
      security: [{ session: [] }]
      summary: "The starter ends their session. Once the API answers it canceled, the session's plugin host is ended: retired if it still waits, and revoked with its agents, the key taken off both, if it holds the session's thumbprint, so the key can pair again"
      responses: { "200": { description: "The session" }, default: { description: "An error with one `code`" } }
  /api/pairing/{agent}/activate:
    parameters: [{ $ref: "#/components/parameters/agent" }]
    post:
      operationId: gatewayActivatePairing
      x-api-operation: activatePairing
      tags: [commands]
      security: [{ session: [] }]
      summary: "The starter confirms the key thumbprint they were shown, and links Runner's agent (step 5(c)). The body is exactly `key_thumbprint`, 43 characters of base64url, or `invalid_argument` (400) before the API is asked. The gateway reads the session as the person (anyone else's read answers as the API does), then reads from the Agent Auth plugin's own tables, never the client, what holds for the session's plugin host: its owner, whether it's active, the thumbprint of the key it holds (computed from the key), how many hosts hold that key, and its agents that aren't revoked; and sends those as `plugin` with the thumbprint. The API decides by the binding rule, activating and linking in one transaction. If it answers `invalid_transition` (409), such as before Runner has registered its agent, the session is read again and its plugin host ended as the read does. On its 200 the gateway writes the directory's `podster_agent` and `identity_link` (provider `agent_auth`, the plugin agent, linked by the starter), as the claim does, and a repeat finds them and answers the same; a plugin agent already linked elsewhere answers `already_linked` (409), with its IDs logged and the session left as it is. A directory write that fails answers 200 with `connected: false`, and the starter's next read finishes it (ruling M2 on #453). Answers the session with `connection`, `plugin_agent_id`, `runner_ready` and `connected`. A pairing's plugin host is never claimed: `/claim` refuses any agent on it with `not_allowed` (403), so an agent Runner registers asking for more than its allowlist stays pending (ruling L3 on #453)"
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [key_thumbprint], properties: { key_thumbprint: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } } } } } }
      responses: { "200": { description: "The session, with `connection`" }, default: { description: "An error with one `code`" } }
  /pairing/{agent}/redeem:
    parameters: [{ $ref: "#/components/parameters/agent" }]
    post:
      operationId: gatewayRedeemPairing
      x-api-operation: redeemPairing
      tags: [commands]
      security: [{ hostProof: [] }]
      summary: "Runner's code for a session, on the gateway's own host and never the application's, with no session. In order: a per-network limit of 10 a minute and 100 a day, counted exactly, which refuses with `temporarily_unavailable` (503) when it can't count, and `rate_limited` (429) past it; the proof, `invalid_jwt` (401) unless it is as `hostProof` says, and `invalid_public_key` (400) for a key that isn't a bare Ed25519 public key; the body, exactly `code`, or `invalid_argument` (400); a key any plugin host already holds is refused `not_allowed` (403) while this session's own host still waits. Then the API's `redeemPairing`, under the `pairingRedeem` assertion, with the key's RFC 7638 thumbprint, the proof's `jti` and `exp`, and the SHA-256 of the exact body sent; its refusal is passed on as it came (every one is `not_allowed`, 403). Only after its 200 does the gateway call the plugin's `enrollHost`, binding the key to that session's host; if that fails it answers `upstream_unavailable` (502) and a retry with a fresh proof finishes it. Afterwards exactly one plugin host must hold the key, the session's own; otherwise every host holding it is revoked with its agents, the session is canceled through the API as its starter, and the answer is `not_allowed` (403). A redeemed session whose host can't take the key is canceled the same way. A retry after a lost answer, with the same code and key on a fresh proof, finds the session's host holding the key and answers the same, enrolling nothing twice. Answers `agent_id`, `status` (`redeemed`), `plugin_host_id`, `key_thumbprint` and `expires_at`, with `Cache-Control: no-store`. Nothing is connected until the person activates"
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, pattern: "^[A-Za-z0-9_-]{32,128}$" } } } } } }
      responses: { "200": { description: "The redeemed session" }, default: { description: "An error with one `code`" } }
components:
  parameters:
    agent: { name: agent, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" } }
  securitySchemes:
    session: { type: apiKey, in: cookie, name: better-auth.session_token, description: "The person's Better Auth session" }
    hostProof: { type: http, scheme: bearer, bearerFormat: "host+jwt", description: "A host JWT, compact, at most 4096 bytes: header `typ: host+jwt`, `alg: EdDSA`, no `crit`, and a `kid`, if any, equal to the key's thumbprint; claims `host_public_key`, a bare Ed25519 public JWK (`kty`, `crv`, `x`, and optionally `kid`, `alg`, `use`; never `d`) whose private half signed it, `sub` the path's agent, `aud` the gateway's origin as one string (not a list), `jti` (1 to 128 bytes), `iat`, and `exp` at most 300 seconds ahead and at most 300 after `iat`. No `agent_public_key`, `agent_jwks_url` or `host_jwks_url`, so a proof can't double as a registration. The pinned client makes one with `signHostJWT({ hostKeypair, audience, issuer: agentId })`" }
