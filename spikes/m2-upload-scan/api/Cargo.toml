[package]
name = "podster-spike-upload-api"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# Its own workspace, so nothing here joins the repo's builds.
[workspace]

[dependencies]
futures-util = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
worker = { version = "=0.8.7", features = ["queue"] }

[profile.release]
opt-level = "s"
lto = true
