# ClamAV's daemon. These limits are what a zip bomb runs into, and going over one is an alert, not a pass.
Foreground yes
LocalSocket /tmp/clamd.sock
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav
MaxThreads 2
# Accepts a 100 MB file with room to spare.
StreamMaxLength 105M
MaxScanSize 400M
MaxFileSize 150M
MaxRecursion 10
MaxFiles 10000
MaxScanTime 120000
AlertExceedsMax yes
# What it can't open, it can't vouch for.
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
HeuristicAlerts yes
ExitOnOOM yes
ConcurrentDatabaseReload no
SelfCheck 0
